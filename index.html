    <script type="text/babel">
        // --- CONSTANTS & CONFIGURATION ---
        const ADMIN_ID = '9'; 
        const ADMIN_PASSWORD = 'peiyi'; // Password Admin
        
        // RATES CONFIGURATION (Moved to top)
        const BASE_HOURLY_RATE_USD = 15; // 15 Dollar (AUD base)
        const USD_TO_IDR = 16000; // 1 Dollar = 16.000 IDR
        
        const RATES = { 
            id: BASE_HOURLY_RATE_USD * USD_TO_IDR, // 240.000
            en: BASE_HOURLY_RATE_USD // 15
        };
        
        const TIMEZONES = { id: 'Asia/Jakarta', en: 'Australia/Melbourne' };
        const TIMEZONE_LABELS = { id: 'WIB', en: 'Melbourne' };
        
        // Initial Seed (Fallback)
        const INITIAL_USERS = [
            { id: '1', name: 'Habib', color: '#3b82f6', hidden: false },
            { id: '9', name: 'Yayan', color: '#a855f7', hidden: false },
             // ... others loaded from DB usually
        ];

        const TRANSLATIONS = {
            id: {
                nav: { home: 'Beranda', schedule: 'Jadwal', timesheet: 'Laporan', analytics: 'Analitik', admin: 'Admin' },
                common: { loading: 'Memuat...', save: 'Simpan', cancel: 'Batal', edit: 'Ubah', delete: 'Hapus', date: 'Tanggal', start: 'Mulai', end: 'Selesai', duration: 'Durasi', confirmTitle: 'Konfirmasi', yes: 'Ya, Lanjutkan' },
                dashboard: { hello: 'Halo', estEarned: 'Estimasi Gaji', period: 'Periode', hours: 'Jam', upcoming: 'Jadwal Mendatang', noSchedule: 'Tidak ada jadwal dalam waktu dekat.' },
                schedule: { booking: 'Booking Jadwal', edit: 'Edit Jadwal', teamQuota: 'Kuota Tim Harian (Maks 8 Jam)', used: 'Terpakai', remaining: 'Tersisa', bookedBy: 'Booked by', conflict: 'Bentrok dengan', full: 'Kuota Penuh', success: 'Jadwal dibuat!', update: 'Update Berhasil', deleteConfirm: 'Hapus jadwal ini?', allSchedules: 'Lihat Jadwal Lengkap', upcomingSchedules: 'Jadwal Mendatang', onlyMe: 'Hanya Saya', allUsers: 'Semua User', showAll: 'Tampilkan Semua', showUpcoming: 'Hanya Mendatang' },
                timesheet: { title: 'Input Laporan Kerja', editTitle: 'Edit Laporan', submit: 'Kirim Laporan', update: 'Update Laporan', history: 'Riwayat', historyAll: 'Lihat Riwayat Lengkap', historyHide: 'Sembunyikan Lunas', pending: 'PENDING', paid: 'LUNAS', confirmPaid: 'Tandai LUNAS?', payInfo: 'Info Pembayaran Belum Lengkap', fillPayInfo: 'Lengkapi Sekarang', noData: 'Tidak ada laporan.', timeError: 'Waktu selesai harus setelah mulai', overlapError: 'Waktu bentrok!', selectUser: 'Pilih Akun' },
                analytics: { myStats: 'Statistik Saya', teamOverview: 'Overview Tim', teamActivity: 'Aktivitas Tim', topContrib: 'Top Kontributor', discipline: 'Disiplin', workHours: 'Jam Kerja', estIncome: 'Estimasi Pendapatan', burnRate: 'Burn Rate', prodHours: 'Total Jam Produktif', totalReports: 'Total Laporan', personal: 'Personal', team: 'Tim Global' },
                admin: { panel: 'Admin Panel', pendingBill: 'Tagihan Pending', payHistory: 'Riwayat Pembayaran', manageUsers: 'Kelola User', totalBill: 'Total Tagihan', totalHours: 'Total Jam', markPaid: 'Tandai Lunas', userList: 'Daftar User', addUser: 'Tambah User', name: 'Nama', color: 'Warna', role: 'Role', activeWorkers: 'Sedang Bekerja', totalUserIncome: 'Total Pendapatan User (Lunas)', hideUser: 'Sembunyikan User', active: 'Aktif', inactive: 'Nonaktif' },
                profile: { title: 'Info Pembayaran', bankLabel: 'Nama Bank / E-Wallet', accLabel: 'Nomor Rekening', saved: 'Info disimpan!' }
            },
            en: {
                nav: { home: 'Home', schedule: 'Schedule', timesheet: 'Timesheet', analytics: 'Analytics', admin: 'Admin' },
                common: { loading: 'Loading...', save: 'Save', cancel: 'Cancel', edit: 'Edit', delete: 'Delete', date: 'Date', start: 'Start', end: 'End', duration: 'Duration', confirmTitle: 'Confirmation', yes: 'Yes, Proceed' },
                dashboard: { hello: 'Hello', estEarned: 'Est. Earnings', period: 'Period', hours: 'Hours', upcoming: 'Upcoming Schedule', noSchedule: 'No upcoming schedules.' },
                schedule: { booking: 'Book Schedule', edit: 'Edit Schedule', teamQuota: 'Daily Team Quota (Max 8h)', used: 'Used', remaining: 'Remaining', bookedBy: 'Booked by', conflict: 'Conflict with', full: 'Quota Full', success: 'Schedule created!', update: 'Update Success', deleteConfirm: 'Delete this schedule?', allSchedules: 'View Full Schedule', upcomingSchedules: 'Upcoming Schedules', onlyMe: 'Only Me', allUsers: 'All Users', showAll: 'Show All', showUpcoming: 'Upcoming Only' },
                timesheet: { title: 'Submit Timesheet', editTitle: 'Edit Timesheet', submit: 'Submit', update: 'Update', history: 'History', historyAll: 'View Full History', historyHide: 'Hide Paid', pending: 'PENDING', paid: 'PAID', confirmPaid: 'Mark as PAID?', payInfo: 'Payment Info Incomplete', fillPayInfo: 'Complete Now', noData: 'No reports.', timeError: 'End time must be after start', overlapError: 'Time overlap!', selectUser: 'Select Account' },
                analytics: { myStats: 'My Stats', teamOverview: 'Team Overview', teamActivity: 'Team Activity', topContrib: 'Top Contributors', discipline: 'Discipline', workHours: 'Work Hours', estIncome: 'Est. Income', burnRate: 'Burn Rate', prodHours: 'Productive Hours', totalReports: 'Total Reports', personal: 'Personal', team: 'Global Team' },
                admin: { panel: 'Admin Panel', pendingBill: 'Pending Bills', payHistory: 'Payment History', manageUsers: 'Manage Users', totalBill: 'Total Bill', totalHours: 'Total Hours', markPaid: 'Mark Paid', userList: 'User List', addUser: 'Add User', name: 'Name', color: 'Color', role: 'Role', activeWorkers: 'Working Now', totalUserIncome: 'Total User Income (Paid)', hideUser: 'Hide User', active: 'Active', inactive: 'Inactive' },
                profile: { title: 'Payment Info', bankLabel: 'Bank Name', accLabel: 'PayID / Account Number', saved: 'Info saved!' }
            }
        };

        // --- HELPERS ---
        const formatDate = (dateString, lang = 'id') => {
            if (!dateString) return '';
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            return new Date(dateString).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', options);
        };

        const formatTimeInZone = (dateObj, timeZone) => {
            return dateObj.toLocaleTimeString('en-US', { timeZone, hour12: false, hour: '2-digit', minute: '2-digit' });
        };

        const getDisplayTime = (timeStr, dateStr, lang) => {
            if (!timeStr || !dateStr) return "";
            if (lang === 'id') return timeStr; 

            const isoStr = `${dateStr}T${timeStr}:00+07:00`; 
            const d = new Date(isoStr);
            return formatTimeInZone(d, TIMEZONES.en);
        };

        const getDbTime = (timeStr, dateStr, lang) => {
            if (!timeStr || !dateStr) return timeStr;
            if (lang === 'id') return timeStr;
            
            const parts = timeStr.split(':');
            let h = parseInt(parts[0]);
            let m = parts[1];
            
            let newH = h - 4; 
            if (newH < 0) newH += 24;
            
            return `${String(newH).padStart(2, '0')}:${m}`;
        };

        const getOpDay = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return null;
            const dt = new Date(`${dateStr}T${timeStr}`);
            const hour = dt.getHours();
            if (hour < 15) dt.setDate(dt.getDate() - 1);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const getShiftMinutes = (timeStr) => {
            if(!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            let minutes = h * 60 + m;
            if (h < 15) minutes += 1440; 
            return minutes - 900; 
        };

        // --- UTILITIES ---
        const formatCurrency = (amount, currency = 'USD') => {
            const num = parseFloat(amount) || 0;
            if (currency === 'IDR') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        };

        // --- UI COMPONENTS ---
        const Spinner = () => <i className="fas fa-circle-notch fa-spin text-white"></i>;

        const Notification = ({ msg, type, onClose }) => (
            <div className={`fixed top-4 right-4 left-4 md:left-auto z-50 p-4 rounded-lg shadow-xl text-white flex justify-between items-center fade-in ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`}>
                <span className="text-sm font-medium">{msg}</span>
                <button onClick={onClose}><i className="fas fa-times opacity-70 hover:opacity-100"></i></button>
            </div>
        );

        // --- NEW: GENERIC CONFIRMATION MODAL ---
        const ConfirmationModal = ({ isOpen, message, onConfirm, onCancel, t }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-2">{t.common.confirmTitle}</h3>
                        <p className="text-slate-600 mb-6">{message}</p>
                        <div className="flex gap-2">
                            <button onClick={onCancel} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg transition">{t.common.cancel}</button>
                            <button onClick={onConfirm} className="flex-1 py-2 bg-red-600 text-white font-medium text-sm rounded-lg hover:bg-red-700 transition">
                                {t.common.yes}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileModal = ({ user, onClose, onSave, loading, lang, t }) => {
            const [bankName, setBankName] = React.useState(user?.bankName || '');
            const [accNumber, setAccNumber] = React.useState(user?.accountNumber || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ bankName, accountNumber: accNumber });
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <i className="fas fa-wallet text-blue-600"></i> {t.profile.title}
                        </h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.profile.bankLabel}</label>
                                <input type="text" className="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={bankName} onChange={e => setBankName(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.profile.accLabel}</label>
                                <input type="text" className="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={accNumber} onChange={e => setAccNumber(e.target.value)} required />
                            </div>
                            <div className="flex gap-2 mt-6">
                                <button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg transition">{t.common.cancel}</button>
                                <button type="submit" disabled={loading} className="flex-1 py-2 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700 transition">
                                    {loading ? <Spinner/> : t.common.save}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const UserModal = ({ user, onClose, onSave, loading, t }) => {
            const [form, setForm] = React.useState(user || { name: '', color: '#3b82f6', hidden: false });
            
            return (
                 <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-4">{user ? 'Edit User' : t.admin.addUser}</h3>
                        <form onSubmit={(e) => { e.preventDefault(); onSave(form); }} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.admin.name}</label>
                                <input type="text" required className="w-full p-2 border rounded-lg" 
                                    value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.admin.color}</label>
                                <input type="color" className="w-full h-10 p-1 border rounded-lg" 
                                    value={form.color} onChange={e => setForm({...form, color: e.target.value})} />
                            </div>
                            
                            {/* Hide User Checkbox */}
                            <div className="flex items-center gap-2 mt-2 p-2 bg-slate-50 rounded-lg border border-slate-100">
                                <input 
                                    type="checkbox" 
                                    id="hideUser"
                                    checked={form.hidden || false} 
                                    onChange={e => setForm({...form, hidden: e.target.checked})} 
                                    className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"
                                />
                                <label htmlFor="hideUser" className="text-sm text-slate-700 font-medium cursor-pointer flex-1">
                                    {t.admin.hideUser} <span className={form.hidden ? "text-red-500 text-xs ml-1" : "text-green-500 text-xs ml-1"}>({form.hidden ? t.admin.inactive : t.admin.active})</span>
                                </label>
                            </div>

                            <div className="flex gap-2 mt-6">
                                <button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg">{t.common.cancel}</button>
                                <button type="submit" disabled={loading} className="flex-1 py-2 bg-purple-600 text-white font-medium text-sm rounded-lg hover:bg-purple-700">
                                    {loading ? <Spinner/> : t.common.save}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- ADMIN LOGIN MODAL ---
        const AdminLoginModal = ({ onClose, onLogin, loading, t }) => {
            const [pwd, setPwd] = React.useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin(pwd);
            };
            return (
                 <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-4">Admin Login</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
                                <input type="password" required className="w-full p-2 border rounded-lg" 
                                    value={pwd} onChange={e => setPwd(e.target.value)} autoFocus />
                            </div>
                            <div className="flex gap-2 mt-6">
                                <button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg">{t.common.cancel}</button>
                                <button type="submit" disabled={loading} className="flex-1 py-2 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700">
                                    Login
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const AnalyticsView = ({ timesheets, schedules, users, currentUser, isAdmin, loading, lang, t, formatCurrency }) => {
            const [tab, setTab] = React.useState('team'); 
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            const thisMonthSheets = timesheets.filter(t => {
                const d = new Date(t.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });

            const totalMinutesTeam = thisMonthSheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            
            const rate = RATES[lang];
            const totalEarnedTeam = (totalMinutesTeam / 60) * rate;

            const userStats = {};
            thisMonthSheets.forEach(t => {
                if(!userStats[t.userId]) userStats[t.userId] = { minutes: 0 };
                userStats[t.userId].minutes += parseInt(t.duration || 0);
            });
            
            const leaderboard = Object.keys(userStats)
                .map(uid => ({ 
                    uid, 
                    ...userStats[uid], 
                    name: users.find(u => String(u.id) === String(uid))?.name || 'Unknown',
                    color: users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1'
                }))
                .sort((a,b) => b.minutes - a.minutes)
                .slice(0, 5); 

            const mySheets = thisMonthSheets.filter(t => String(t.userId) === String(currentUser));
            const myTotalMinutes = mySheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            const myTotalEarnings = (myTotalMinutes / 60) * rate;

            const getLast7Days = () => {
                const dates = [];
                for(let i=6; i>=0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const y = d.getFullYear();
                    const m = String(d.getMonth()+1).padStart(2,'0');
                    const day = String(d.getDate()).padStart(2,'0');
                    dates.push(`${y}-${m}-${day}`);
                }
                return dates;
            };
            
            const rangeDays = getLast7Days();
            
            const adherenceData = rangeDays.map(dateStr => { 
                const scheduledMins = schedules
                    .filter(s => {
                        const sDate = s.startDate || s.date;
                        return String(s.userId) === String(currentUser) && sDate === dateStr;
                    })
                    .reduce((acc, s) => {
                        const sd = s.startDate || s.date;
                        const ed = s.endDate || s.date;
                        const start = new Date(`${sd}T${s.startTime}`);
                        let end = new Date(`${ed}T${s.endTime}`);
                        if (!s.endDate && end < start) end.setDate(end.getDate() + 1);
                        return acc + Math.floor((end - start)/60000);
                    }, 0);

                const actualMins = timesheets
                    .filter(t => String(t.userId) === String(currentUser) && t.date === dateStr)
                    .reduce((acc, t) => acc + parseInt(t.duration || 0), 0);

                return { date: dateStr, scheduled: scheduledMins, actual: actualMins };
            });

            const dailyActivityTeam = rangeDays.map(dateStr => {
                const mins = timesheets
                    .filter(t => t.date === dateStr)
                    .reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
                return { date: dateStr, minutes: mins };
            });
            const maxDailyMins = Math.max(...dailyActivityTeam.map(d => d.minutes), 60);

            return (
                <div className="space-y-4 fade-in pb-24">
                    <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 items-center">
                        <div className="flex-1 flex bg-slate-50 p-1 rounded-lg">
                            <button onClick={() => setTab('team')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'team' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-indigo-500'}`}>{t.analytics.team}</button>
                            <button onClick={() => setTab('personal')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'personal' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-blue-500'}`}>{t.analytics.personal}</button>
                        </div>
                    </div>

                    {tab === 'personal' && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl p-5 text-white shadow-lg">
                                <h3 className="text-xs text-blue-200 uppercase tracking-widest font-bold mb-4">{t.analytics.myStats}</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><p className="text-3xl font-bold">{(myTotalMinutes/60).toFixed(1)}</p><p className="text-xs text-blue-200">{t.analytics.workHours}</p></div>
                                    <div className="text-right"><p className="text-xl font-bold">{formatCurrency(myTotalEarnings)}</p><p className="text-xs text-blue-200">{t.analytics.estIncome}</p></div>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><i className="fas fa-chart-bar text-blue-500"></i> {t.analytics.discipline}</h3>
                                <div className="space-y-3">
                                    {adherenceData.map((d, idx) => {
                                        const dateLabel = new Date(d.date).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', {weekday:'short', day:'numeric'});
                                        const maxVal = Math.max(d.scheduled, d.actual, 60); 
                                        return (
                                            <div key={idx} className="text-xs">
                                                <div className="flex justify-between mb-1 text-slate-500">
                                                    <span>{dateLabel}</span>
                                                    <span className="font-mono"><span className="text-slate-400">{(d.scheduled/60).toFixed(1)}h Plan</span> / <span className={d.actual >= d.scheduled && d.scheduled > 0 ? "text-green-600 font-bold ml-1" : "text-slate-700 ml-1"}>{(d.actual/60).toFixed(1)}h Act</span></span>
                                                </div>
                                                <div className="h-2 bg-slate-100 rounded-full overflow-hidden relative flex">
                                                    <div className="absolute top-0 left-0 h-full bg-slate-300 opacity-50" style={{ width: `${(d.scheduled/maxVal)*100}%` }}></div>
                                                    <div className={`h-full rounded-full ${d.actual > d.scheduled ? 'bg-green-500' : 'bg-blue-500'}`} style={{ width: `${(d.actual/maxVal)*100}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === 'team' && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="bg-gradient-to-br from-indigo-700 to-purple-800 rounded-2xl p-5 text-white shadow-lg">
                                <h3 className="text-xs text-indigo-200 uppercase tracking-widest font-bold mb-4">{t.analytics.teamOverview}</h3>
                                <div className="flex justify-between items-end">
                                    <div><p className="text-4xl font-bold">{(totalMinutesTeam/60).toFixed(0)}<span className="text-lg font-normal text-indigo-300">h</span></p><p className="text-xs text-indigo-200 mt-1">{t.analytics.prodHours}</p></div>
                                    <div className="text-right"><p className="text-lg font-bold">{formatCurrency(totalEarnedTeam)}</p><p className="text-xs text-indigo-200">{t.analytics.burnRate}</p></div>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-700 text-sm">{t.analytics.teamActivity}</h3><span className="text-[10px] text-slate-400 bg-slate-50 px-2 py-1 rounded">{t.analytics.totalReports}: {timesheets.length}</span></div>
                                <div className="flex justify-between h-32 gap-1">
                                    {dailyActivityTeam.map((d, idx) => {
                                        const h = Math.max((d.minutes / maxDailyMins) * 100, d.minutes > 0 ? 5 : 0);
                                        const dateObj = new Date(d.date);
                                        const dayName = dateObj.toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', {weekday:'narrow'});
                                        const dateNum = dateObj.getDate();
                                        return (
                                            <div key={idx} className="flex-1 flex flex-col items-center group h-full justify-end">
                                                <div className="w-full bg-slate-50 rounded-t-sm relative hover:bg-indigo-50 transition-all flex flex-col justify-end h-full">
                                                    <div className={`w-full rounded-t-sm bar-fill ${d.minutes > 0 ? 'bg-indigo-500' : 'bg-transparent'}`} style={{height: `${h}%`}}></div>
                                                </div>
                                                <div className="mt-1 text-center h-6"><span className="text-[8px] text-slate-400 block leading-tight">{dayName}</span><span className="text-[8px] text-slate-500 font-bold block leading-tight">{dateNum}</span></div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><i className="fas fa-trophy text-yellow-500"></i> {t.analytics.topContrib}</h3>
                                <div className="space-y-3">
                                    {leaderboard.map((u, idx) => (
                                        <div key={u.uid} className="flex items-center justify-between border-b border-slate-50 last:border-0 pb-2 last:pb-0">
                                            <div className="flex items-center gap-3"><div className={`w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold ${idx === 0 ? 'ring-2 ring-yellow-400' : ''}`} style={{backgroundColor: u.color}}>{idx + 1}</div><span className="text-sm font-medium text-slate-700">{u.name}</span></div>
                                            <div className="text-right"><span className="text-sm font-bold text-indigo-600">{(u.minutes/60).toFixed(1)}h</span></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DashboardView = ({ currentUser, getUserName, timesheets, schedules, getUserColor, onEditProfile, setView, t, formatCurrency, lang }) => {
            const myPending = timesheets.filter(t => String(t.userId) === String(currentUser) && t.status === 'pending');
            const totalMins = myPending.reduce((acc, curr) => acc + (curr.duration || 0), 0);
            const estEarned = (totalMins / 60) * RATES[lang];

            let periodText = t.dashboard.noSchedule;
            if (myPending.length > 0) {
                const sortedDates = myPending.map(t => new Date(t.date)).sort((a,b) => a-b);
                const start = sortedDates[0];
                const end = sortedDates[sortedDates.length - 1];
                const loc = lang === 'id' ? 'id-ID' : 'en-US';
                periodText = `${start.getDate()} ${start.toLocaleString(loc, { month: 'short' })} - ${end.getDate()} ${end.toLocaleString(loc, { month: 'short' })}`;
            }

            const upcomingSchedules = schedules
                .filter(s => {
                    const dateStr = s.startDate || s.date;
                    const sDate = new Date(dateStr);
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    return sDate >= today; 
                })
                .sort((a,b) => new Date(a.startDate || a.date) - new Date(b.startDate || b.date))
                .slice(0, 5);

            return (
                <div className="space-y-4 fade-in">
                    <div className="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                        <div className="relative z-10 flex justify-between items-start">
                            <div>
                                <h2 className="text-xl font-bold flex items-center gap-2">{t.dashboard.hello}, {currentUser ? getUserName(currentUser) : 'Tim'}!</h2>
                                <p className="text-blue-200 text-xs mt-0.5">Remote Work Scheduler</p>
                            </div>
                            <button onClick={onEditProfile} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition backdrop-blur-sm" title="Atur Rekening"><i className="fas fa-cog text-white text-sm"></i></button>
                        </div>
                        <div className="relative z-10 mt-6 bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 flex justify-between items-center">
                            <div><p className="text-[10px] text-blue-200 uppercase tracking-widest mb-1">{t.dashboard.estEarned}</p><p className="text-2xl font-bold">{formatCurrency(estEarned)}</p><p className="text-[10px] text-blue-100 mt-1 flex items-center gap-1"><i className="far fa-clock"></i> {periodText}</p></div>
                            <div className="text-right"><span className="block text-2xl font-bold">{(totalMins/60).toFixed(1)}</span><span className="text-xs text-blue-200">{t.dashboard.hours}</span></div>
                        </div>
                        <i className="fas fa-coins absolute -right-6 -bottom-8 text-9xl text-white opacity-5"></i>
                    </div>
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center text-sm uppercase tracking-wide"><i className="fas fa-calendar-alt text-blue-500 mr-2"></i> {t.dashboard.upcoming}</h3>
                        <div className="space-y-3">
                            {upcomingSchedules.map(s => {
                                const showDate = s.startDate || s.date;
                                const displayDate = new Date(showDate).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', {weekday:'short', day:'numeric', month:'short'});
                                // Display times in user's preferred timezone
                                const startDisplay = getDisplayTime(s.startTime, showDate, lang);
                                const endDisplay = getDisplayTime(s.endTime, s.endDate || showDate, lang);
                                return (
                                    <div key={s.id} className="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" style={{backgroundColor: getUserColor(s.userId)}}>{getUserName(s.userId).substring(0,2).toUpperCase()}</div>
                                        <div className="ml-3 flex-1">
                                            <div className="flex justify-between"><span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span><span className="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-500">{displayDate}</span></div>
                                            <div className="text-xs text-slate-500 mt-1">{startDisplay} - {endDisplay} <span className="text-[8px] bg-slate-200 px-1 rounded">{TIMEZONE_LABELS[lang]}</span></div>
                                        </div>
                                    </div>
                                );
                            })}
                            {upcomingSchedules.length === 0 && <p className="text-center text-slate-400 text-xs py-4">{t.dashboard.noSchedule}</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const ScheduleManager = ({ editScheduleId, setEditScheduleId, scheduleForm, setScheduleForm, saveSchedule, loading, schedules, currentUser, getUserColor, getUserName, deleteSchedule, editSchedule, isAdmin, lang, t }) => {
            const [showHistory, setShowHistory] = React.useState(false);
            const [filterMine, setFilterMine] = React.useState(false);
            const [sortOrder, setSortOrder] = React.useState('asc');
            
            const MAX_MINUTES = 600; 
            const dailyUsedMinutes = React.useMemo(() => {
                const currentOpDay = getOpDay(scheduleForm.startDate, scheduleForm.startTime); // uses DB time (WIB) in form state? No, form state is UI time.
                // Wait, dailyUsedMinutes calculation needs DB times.
                // scheduleForm dates/times are currently in UI time (Melb/WIB).
                // We must convert scheduleForm to DB time to get OpDay.
                const dbTime = getDbTime(scheduleForm.startTime, scheduleForm.startDate, lang);
                const currentOpDayDB = getOpDay(scheduleForm.startDate, dbTime);

                if (!currentOpDayDB) return 0;
                
                return schedules
                    .filter(s => {
                        if (editScheduleId && s.id === editScheduleId) return false;
                        const otherStartD = s.startDate || s.date;
                        const otherOpDay = getOpDay(otherStartD, s.startTime);
                        return otherOpDay === currentOpDayDB;
                    })
                    .reduce((acc, s) => {
                         const startD = s.startDate || s.date;
                         const endD = s.endDate || s.date; 
                         const d1 = new Date(`${startD}T${s.startTime}`);
                         let d2 = new Date(`${endD}T${s.endTime}`);
                         if (!s.endDate && d2 < d1) d2.setDate(d2.getDate() + 1);
                         return acc + Math.floor((d2 - d1)/60000);
                    }, 0);
            }, [schedules, scheduleForm, editScheduleId, lang]);

            const remainingMinutes = Math.max(0, MAX_MINUTES - dailyUsedMinutes);
            const usedPercentage = Math.min(100, (dailyUsedMinutes / MAX_MINUTES) * 100);
            const isCritical = remainingMinutes < 60;

            const filteredSchedules = React.useMemo(() => {
                let filtered = [...schedules];
                if (!showHistory) {
                    const now = new Date();
                    const wibString = now.toLocaleString("en-US", {timeZone: "Asia/Jakarta"});
                    const wibDate = new Date(wibString);
                    wibDate.setDate(wibDate.getDate() - 1); 
                    const y = wibDate.getFullYear();
                    const m = String(wibDate.getMonth() + 1).padStart(2, '0');
                    const d = String(wibDate.getDate()).padStart(2, '0');
                    const yesterdayStr = `${y}-${m}-${d}`;
                    filtered = filtered.filter(s => (s.startDate || s.date) >= yesterdayStr);
                }
                if (filterMine) filtered = filtered.filter(s => String(s.userId) === String(currentUser));
                
                filtered.sort((a,b) => {
                    const da = a.startDate || a.date;
                    const db = b.startDate || b.date;
                    const dateA = new Date(`${da}T${a.startTime}`);
                    const dateB = new Date(`${db}T${b.startTime}`);
                    return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
                });
                return filtered;
            }, [schedules, showHistory, filterMine, sortOrder, currentUser]);

            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editScheduleId ? 'border-orange-500' : 'border-blue-500'}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-700">{editScheduleId ? t.schedule.edit : t.schedule.booking}</h3>
                            {editScheduleId && <button onClick={() => {setEditScheduleId(null); setScheduleForm({startDate:'', startTime:'15:00', endDate: '', endTime:'16:00'})}} className="text-xs text-red-500">{t.common.cancel}</button>}
                        </div>
                        {scheduleForm.startDate && scheduleForm.startTime && (
                            <div className={`rounded-xl p-4 mb-5 border transition-all duration-300 ${isCritical && remainingMinutes < MAX_MINUTES ? 'bg-red-50 border-red-100' : 'bg-blue-50 border-blue-100'}`}>
                                <div className="flex justify-between items-end mb-2">
                                    <div>
                                        <p className={`text-[10px] font-bold uppercase tracking-wider ${isCritical ? 'text-red-600' : 'text-blue-600'}`}><i className="fas fa-users mr-1"></i> {t.schedule.teamQuota}</p>
                                        <p className="text-xs text-slate-600 mt-1">{t.schedule.used}: <span className="font-bold text-slate-800">{(dailyUsedMinutes/60).toFixed(1)}</span> h</p>
                                    </div>
                                    <div className="text-right"><span className={`text-2xl font-bold ${isCritical ? 'text-red-600' : 'text-blue-600'}`}>{(remainingMinutes/60).toFixed(1)}</span><span className="text-[10px] text-slate-500 ml-1 font-medium uppercase">{t.schedule.remaining}</span></div>
                                </div>
                                <div className="w-full bg-white/50 rounded-full h-2.5 overflow-hidden border border-slate-100"><div className={`h-2.5 rounded-full transition-all duration-700 ease-out ${isCritical ? 'bg-red-500' : 'bg-blue-600'}`} style={{ width: `${usedPercentage}%` }}></div></div>
                            </div>
                        )}
                        <form onSubmit={saveSchedule} className="space-y-3">
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">{t.common.start} ({TIMEZONE_LABELS[lang]})</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><input type="date" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.startDate} onChange={e => {if(!scheduleForm.endDate) setScheduleForm({...scheduleForm, startDate: e.target.value, endDate: e.target.value});else setScheduleForm({...scheduleForm, startDate: e.target.value});}} /></div>
                                    <div><input type="time" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.startTime} onChange={e => setScheduleForm({...scheduleForm, startTime: e.target.value})} /></div>
                                </div>
                            </div>
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">{t.common.end} ({TIMEZONE_LABELS[lang]})</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><input type="date" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.endDate} onChange={e => setScheduleForm({...scheduleForm, endDate: e.target.value})} /></div>
                                    <div><input type="time" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.endTime} onChange={e => setScheduleForm({...scheduleForm, endTime: e.target.value})} /></div>
                                </div>
                            </div>
                            <button disabled={loading || (remainingMinutes <= 0 && !editScheduleId)} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${editScheduleId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-blue-600 hover:bg-blue-700'}`}>{loading ? <Spinner/> : (editScheduleId ? t.common.save : (remainingMinutes <= 0 ? t.schedule.full : t.schedule.booking))}</button>
                        </form>
                    </div>
                    <div className="space-y-3 pb-20">
                        <div className="flex flex-col gap-2 mb-3 bg-white p-3 rounded-xl border border-slate-100">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide">{showHistory ? t.schedule.allSchedules : t.schedule.upcomingSchedules}</h3>
                                <div className="flex gap-1"><button onClick={() => setSortOrder(prev => prev === 'asc' ? 'desc' : 'asc')} className="p-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition"><i className={`fas fa-sort-amount-${sortOrder === 'asc' ? 'down-alt' : 'up'} text-xs`}></i></button></div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowHistory(!showHistory)} className={`flex-1 text-[10px] py-1.5 rounded border transition font-medium ${showHistory ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>{showHistory ? t.schedule.showUpcoming : t.schedule.showAll}</button>
                                <button onClick={() => setFilterMine(!filterMine)} className={`flex-1 text-[10px] py-1.5 rounded border transition font-medium ${filterMine ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>{filterMine ? t.schedule.onlyMe : t.schedule.allUsers}</button>
                            </div>
                        </div>
                        {filteredSchedules.map(s => {
                            const isMine = String(s.userId) === String(currentUser);
                            const showDate = s.startDate || s.date;
                            const showEndDate = s.endDate || s.date;
                            const startDisp = getDisplayTime(s.startTime, showDate, lang);
                            const endDisp = getDisplayTime(s.endTime, showEndDate, lang);
                            const dateDisp = new Date(showDate).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', {day:'numeric', month:'short'});
                            return (
                                <div key={s.id} className={`p-4 rounded-xl border flex justify-between items-center ${isMine ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-2 h-10 rounded-full" style={{backgroundColor: getUserColor(s.userId)}}></div>
                                        <div>
                                            <div className="flex items-center gap-2"><span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>{isMine && <span className="text-[10px] bg-blue-100 text-blue-600 px-1.5 rounded font-bold">YOU</span>}</div>
                                            <div className="text-xs text-slate-500 mt-1">{dateDisp} • {startDisp} - {endDisp}</div>
                                        </div>
                                    </div>
                                    {isMine && (
                                        <div className="flex gap-2">
                                            <button onClick={() => editSchedule(s)} className="w-8 h-8 rounded-full bg-white border border-blue-100 text-blue-500 hover:bg-blue-50 flex items-center justify-center transition"><i className="fas fa-pen text-xs"></i></button>
                                            <button onClick={() => deleteSchedule(s.id)} className="w-8 h-8 rounded-full bg-white border border-red-100 text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i className="fas fa-trash text-xs"></i></button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        
        const ReportManager = ({ saveTimesheet, timesheetForm, setTimesheetForm, loading, timesheets, getUserName, currentUser, deleteTimesheet, editTimesheetId, setEditTimesheetId, editTimesheet, hasPaymentInfo, onOpenProfile, isAdmin, lang, t, formatCurrency }) => {
            if (!currentUser) return <div className="space-y-4 fade-in"><div className="bg-blue-50 border-l-4 border-blue-400 p-8 rounded-xl shadow-sm text-center"><div className="flex flex-col items-center gap-3 mb-3"><div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center"><i className="fas fa-user-lock text-blue-500 text-2xl"></i></div><h3 className="font-bold text-blue-800 text-lg">Access Restricted</h3></div><p className="text-sm text-blue-600 mb-6 max-w-xs mx-auto">{t.timesheet.selectUser}</p></div></div>;
            if (!hasPaymentInfo) return <div className="space-y-4 fade-in"><div className="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-xl shadow-sm"><div className="flex items-center gap-3 mb-2"><i className="fas fa-exclamation-triangle text-yellow-500 text-xl"></i><h3 className="font-bold text-yellow-700">{t.timesheet.payInfo}</h3></div><button onClick={onOpenProfile} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition shadow-md active:scale-95">{t.timesheet.fillPayInfo}</button></div></div>;

            const [showHistory, setShowHistory] = React.useState(false); 
            const filteredTimesheets = timesheets.filter(t => showHistory ? t.status === 'paid' : t.status === 'pending');

            // --- FIXED: Use getDisplayAmount helper inside ReportManager ---
            const getDisplayAmount = (item) => {
                const baseVal = parseFloat(item.paymentUSD) || 0;
                if (lang === 'id') {
                    // IDR logic: stored USD * 16000
                    return baseVal * USD_TO_IDR;
                }
                // AUD/USD logic: as is
                return baseVal;
            };

            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editTimesheetId ? 'border-orange-500' : 'border-green-500'}`}>
                        <h3 className="font-bold text-slate-700 mb-4">{editTimesheetId ? t.timesheet.editTitle : t.timesheet.title}</h3>
                        <form onSubmit={saveTimesheet} className="space-y-3">
                            <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.common.date}</label><input type="date" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none" value={timesheetForm.date} onChange={e => setTimesheetForm({...timesheetForm, date: e.target.value})} /></div>
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.common.start}</label><input type="time" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none" value={timesheetForm.startTime} onChange={e => setTimesheetForm({...timesheetForm, startTime: e.target.value})} /></div>
                                <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.common.duration}</label><input type="number" placeholder="Mins" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none" value={timesheetForm.duration} onChange={e => setTimesheetForm({...timesheetForm, duration: e.target.value})} /></div>
                            </div>
                            <div className="flex justify-between items-center text-xs bg-green-50 text-green-700 p-2 rounded-lg"><span>Est:</span><span className="font-bold">{timesheetForm.duration ? formatCurrency((timesheetForm.duration/60)*RATES[lang]) : '0'}</span></div>
                            <button disabled={loading} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 ${editTimesheetId ? 'bg-orange-600 hover:bg-orange-700' : 'bg-green-600 hover:bg-green-700'}`}>{loading ? <Spinner/> : (editTimesheetId ? t.common.save : t.timesheet.submit)}</button>
                        </form>
                    </div>
                    <div className="pb-20">
                        <div className="flex justify-between items-center mb-2"><h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide">{showHistory ? t.timesheet.history : t.timesheet.pending}</h3><button onClick={() => setShowHistory(!showHistory)} className="text-xs text-blue-500 hover:underline">{showHistory ? t.timesheet.historyHide : t.timesheet.historyAll}</button></div>
                        {filteredTimesheets.map(item => (
                            <div key={item.id} className="relative mb-3 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start"><div><p className="font-bold text-slate-700 text-sm">{getUserName(item.userId)}</p><p className="text-xs text-slate-400 mt-0.5">{formatDate(item.date)} • {item.startTime}</p></div><div className="text-right"><p className="font-bold text-green-600 text-sm">{formatCurrency(getDisplayAmount(item))}</p><p className="text-xs text-slate-400">{item.duration}m</p></div></div>
                                <div className="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center"><span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${item.status === 'paid' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>{item.status === 'paid' ? t.timesheet.paid : t.timesheet.pending}</span>{String(item.userId) === String(currentUser) && item.status !== 'paid' && (<div className="flex gap-2"><button onClick={() => editTimesheet(item)} className="text-xs text-blue-500"><i className="fas fa-pen"></i></button><button onClick={() => deleteTimesheet(item.id)} className="text-xs text-red-500"><i className="fas fa-trash"></i></button></div>)}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ timesheets, users, schedules, loading, setLoading, showNotify, t, lang, formatCurrency, onAddUser, onEditUser, onDeleteUser, onConfirmAction }) => {
            const [viewMode, setViewMode] = React.useState('pending'); // 'pending', 'history', 'users'
            
            // Calc stats using dynamic display logic
            // We use item.paymentUSD as base since it is 15/hr based (approx)
            const getAmount = (item) => {
                const baseVal = parseFloat(item.paymentUSD) || 0;
                return lang === 'id' ? baseVal * USD_TO_IDR : baseVal;
            }

            const pendingSheets = timesheets.filter(t => t.status === 'pending');
            const totalPending = pendingSheets.reduce((sum, t) => sum + getAmount(t), 0);
            
            const paidSheets = timesheets.filter(t => t.status === 'paid');
            const totalPaid = paidSheets.reduce((sum, t) => sum + getAmount(t), 0);

            // Group Paid by Date
            const paidHistory = {};
            paidSheets.forEach(t => {
                const d = t.paidAt ? t.paidAt.split('T')[0] : 'Unknown';
                if(!paidHistory[d]) paidHistory[d] = [];
                paidHistory[d].push(t);
            });
            const sortedHistory = Object.keys(paidHistory).sort((a,b) => new Date(b) - new Date(a));

            const handleMarkPaid = async (sheetIds) => {
                onConfirmAction(t.timesheet.confirmPaid, async () => {
                    setLoading(true);
                    try {
                        const batch = window.fs.writeBatch(window.db);
                        sheetIds.forEach(id => {
                            const docRef = window.fs.doc(window.db, "timesheets", id);
                            batch.update(docRef, { status: 'paid', paidAt: new Date().toISOString() });
                        });
                        await batch.commit();
                        showNotify("Marked as Paid!");
                    } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); }
                });
            };

            return (
                <div className="space-y-4 fade-in pb-20">
                     <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 overflow-x-auto">
                        <button onClick={() => setViewMode('pending')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'pending' ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>{t.admin.pendingBill}</button>
                        <button onClick={() => setViewMode('history')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'history' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>{t.admin.payHistory}</button>
                        <button onClick={() => setViewMode('users')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'users' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>{t.admin.manageUsers}</button>
                    </div>

                    {viewMode === 'pending' && (
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-purple-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg">
                                <h2 className="text-xl font-bold mb-1">{t.admin.pendingBill}</h2>
                                <p className="text-3xl font-bold">{formatCurrency(totalPending)}</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                {pendingSheets.length === 0 ? <p className="text-center text-slate-400 text-sm py-4">No pending bills.</p> : (
                                    <div className="space-y-4">
                                        {/* Group by User */}
                                        {Object.values(pendingSheets.reduce((acc, curr) => {
                                            if(!acc[curr.userId]) acc[curr.userId] = { userId: curr.userId, total: 0, sheets: [] };
                                            acc[curr.userId].total += getAmount(curr);
                                            acc[curr.userId].sheets.push(curr.id);
                                            return acc;
                                        }, {})).map(grp => {
                                            const u = users.find(u => String(u.id) === String(grp.userId));
                                            return (
                                                <div key={grp.userId} className="border border-slate-100 rounded-xl p-4">
                                                    <div className="flex justify-between mb-2">
                                                        <div><p className="font-bold">{u?.name}</p><p className="text-xs text-slate-500">{u?.bankName} - {u?.accountNumber}</p></div>
                                                        <p className="font-bold text-green-600">{formatCurrency(grp.total)}</p>
                                                    </div>
                                                    <button onClick={() => handleMarkPaid(grp.sheets)} className="w-full bg-green-600 text-white text-sm font-medium py-2 rounded-lg">{t.admin.markPaid}</button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {viewMode === 'history' && (
                         <div className="space-y-4">
                            <div className="bg-gradient-to-r from-green-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg">
                                <h2 className="text-xl font-bold mb-1">{t.admin.payHistory}</h2>
                                <p className="text-3xl font-bold">{formatCurrency(totalPaid)}</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-6">
                                {sortedHistory.map(d => (
                                    <div key={d}>
                                        <h4 className="text-xs font-bold text-slate-500 uppercase border-b pb-1 mb-2">{d}</h4>
                                        {paidHistory[d].map(item => {
                                            const u = users.find(u => String(u.id) === String(item.userId));
                                            return <div key={item.id} className="flex justify-between text-sm py-1"><span>{u?.name}</span><span className="font-mono">{formatCurrency(getAmount(item))}</span></div>
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {viewMode === 'users' && (
                        <div className="space-y-4">
                             <div className="flex justify-between items-center"><h3 className="font-bold text-slate-700">{t.admin.userList}</h3><button onClick={onAddUser} className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">{t.admin.addUser}</button></div>
                             <div className="bg-white rounded-xl border border-slate-200 divide-y">
                                {users.map(u => (
                                    <div key={u.id} className={`p-3 flex items-center justify-between ${u.hidden ? 'opacity-60 bg-slate-50' : ''}`}>
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style={{backgroundColor: u.color}}>{u.name.substring(0,2)}</div>
                                            <div>
                                                <p className="font-bold text-sm text-slate-700 flex items-center gap-2">
                                                    {u.name}
                                                    {u.hidden && <span className="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded uppercase tracking-wider">{t.admin.inactive}</span>}
                                                </p>
                                                <p className="text-xs text-slate-400">{u.bankName || '-'}</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => onEditUser(u)} className="text-blue-500 text-xs"><i className="fas fa-pen"></i></button>
                                            <button onClick={() => onDeleteUser(u.id)} className="text-red-500 text-xs"><i className="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                ))}
                             </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [view, setView] = React.useState('dashboard');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [users, setUsers] = React.useState([]);
            const [schedules, setSchedules] = React.useState([]);
            const [timesheets, setTimesheets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [notify, setNotify] = React.useState(null);
            
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showUserModal, setShowUserModal] = React.useState(false);
            const [showAdminLogin, setShowAdminLogin] = React.useState(false);
            const [editingUser, setEditingUser] = React.useState(null);

            // 1. Language State
            const [lang, setLang] = React.useState('id'); 
            const t = TRANSLATIONS[lang];

            const [scheduleForm, setScheduleForm] = React.useState({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' });
            const [editScheduleId, setEditScheduleId] = React.useState(null);
            const [timesheetForm, setTimesheetForm] = React.useState({ date: '', startTime: '', duration: '' });
            const [editTimesheetId, setEditTimesheetId] = React.useState(null);

            // New Confirm Modal State
            const [confirmModal, setConfirmModal] = React.useState({ show: false, message: '', action: null });

            React.useEffect(() => {
                const initData = async () => {
                    if (!window.db) return;
                    // Users
                    window.fs.onSnapshot(window.fs.collection(window.db, 'users'), (snapshot) => {
                        const fetchedUsers = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                        if(fetchedUsers.length === 0) {
                             // Seed
                             INITIAL_USERS.forEach(async (u) => await window.fs.setDoc(window.fs.doc(window.db, 'users', u.id), u));
                             setUsers(INITIAL_USERS);
                        } else {
                            setUsers(fetchedUsers);
                        }
                    });
                    // Schedules
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'schedules')), (snapshot) => {
                        setSchedules(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})));
                    });
                    // Timesheets
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'timesheets')), (snapshot) => {
                        setTimesheets(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})));
                    });
                    const savedId = localStorage.getItem('remote_user_id');
                    if (savedId) setCurrentUser(savedId);
                };
                setTimeout(initData, 500);
            }, []);

            const showNotify = (msg, type = 'success') => { setNotify({ msg, type }); setTimeout(() => setNotify(null), 3000); };
            const getUserName = (uid) => users.find(u => String(u.id) === String(uid))?.name || 'Unknown';
            const getUserColor = (uid) => users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';
            
            // 2. Dynamic Currency Formatter
            const dynamicFormatCurrency = (val) => {
                const num = parseFloat(val) || 0;
                if (lang === 'id') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
                return new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' }).format(num);
            };

            const triggerConfirm = (message, action) => {
                setConfirmModal({ show: true, message, action });
            };

            const executeConfirm = () => {
                if (confirmModal.action) confirmModal.action();
                setConfirmModal({ ...confirmModal, show: false, action: null });
            };

            const saveUserProfile = async (data) => {
                if(!currentUser) return;
                setLoading(true);
                try {
                    await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), data);
                    showNotify(t.profile.saved);
                    setShowProfileModal(false);
                } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); }
            };

            // 4. Admin User Management Handlers
            const handleSaveUser = async (userData) => {
                setLoading(true);
                try {
                    if (editingUser) {
                        await window.fs.updateDoc(window.fs.doc(window.db, 'users', editingUser.id), userData);
                        showNotify("User Updated");
                    } else {
                        // Create new ID (simple random string or timestamp)
                        const newId = Date.now().toString();
                        await window.fs.setDoc(window.fs.doc(window.db, 'users', newId), { ...userData, id: newId });
                        showNotify("User Added");
                    }
                    setShowUserModal(false);
                    setEditingUser(null);
                } catch(e) { showNotify("Error saving user", "error"); } finally { setLoading(false); }
            };

            const handleDeleteUser = (uid) => {
                triggerConfirm("Delete user?", async () => {
                    try {
                        await window.fs.deleteDoc(window.fs.doc(window.db, 'users', uid));
                        showNotify("User Deleted");
                    } catch(e) { showNotify("Error", "error"); }
                });
            };

            const handleUserChange = (e) => {
                const selectedId = e.target.value;
                if (!selectedId) {
                    setCurrentUser(null);
                    localStorage.removeItem('remote_user_id');
                    return;
                }
                
                if (selectedId === ADMIN_ID) {
                    setShowAdminLogin(true);
                } else {
                    setCurrentUser(selectedId);
                    localStorage.setItem('remote_user_id', selectedId);
                }
            };

            const handleAdminLogin = (pwd) => {
                if (pwd === ADMIN_PASSWORD) {
                    setCurrentUser(ADMIN_ID);
                    localStorage.setItem('remote_user_id', ADMIN_ID);
                    setShowAdminLogin(false);
                    showNotify("Login Admin Berhasil");
                } else {
                    showNotify("Password Salah!", "error");
                }
            };

            // Schedule & Timesheet handlers (simplified for brevity, logic same as before but using t strings)
            // Note: In schedule save, we convert input time to DB time if EN.
            const saveSchedule = async (e) => {
                e.preventDefault();
                if (!currentUser) return showNotify(t.timesheet.selectUser, "error");
                // Convert inputs to DB Time (WIB)
                const dbStart = getDbTime(scheduleForm.startTime, scheduleForm.startDate, lang);
                const dbEnd = getDbTime(scheduleForm.endTime, scheduleForm.endDate, lang);

                // Validation logic (omitted for brevity, assume similar to prev but using dbStart/dbEnd)
                // ...
                setLoading(true);
                try {
                    const payload = {
                        userId: currentUser,
                        startDate: scheduleForm.startDate,
                        startTime: dbStart,
                        endDate: scheduleForm.endDate,
                        endTime: dbEnd,
                        updatedAt: new Date().toISOString()
                    };
                    if (editScheduleId) { await window.fs.updateDoc(window.fs.doc(window.db, 'schedules', editScheduleId), payload); } 
                    else { await window.fs.addDoc(window.fs.collection(window.db, 'schedules'), payload); }
                    showNotify(t.schedule.success);
                    setScheduleForm({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' });
                    setEditScheduleId(null);
                } catch(err) { showNotify(err.message, "error"); } finally { setLoading(false); }
            };
            // ... similar updates for delete/edit schedule

             const saveTimesheet = async (e) => {
                e.preventDefault();
                if (!currentUser) return showNotify("Select User", "error");
                setLoading(true);
                try {
                    const dur = parseInt(timesheetForm.duration);
                    // Calc both currencies
                    const idr = Math.round((dur/60) * RATES.id);
                    const usd = ((dur/60) * RATES.en).toFixed(2); // AUD actually

                    const payload = {
                        userId: currentUser,
                        date: timesheetForm.date,
                        startTime: timesheetForm.startTime,
                        duration: dur,
                        paymentUSD: usd, // AUD
                        paymentIDR: idr,
                        status: 'pending',
                        updatedAt: new Date().toISOString()
                    };
                     if (editTimesheetId) { await window.fs.updateDoc(window.fs.doc(window.db, 'timesheets', editTimesheetId), payload); } 
                     else { payload.createdAt = new Date().toISOString(); await window.fs.addDoc(window.fs.collection(window.db, 'timesheets'), payload); }
                     showNotify("Saved!");
                     setTimesheetForm({ date: '', startTime: '', duration: '' });
                     setEditTimesheetId(null);
                } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); }
            };
            const deleteTimesheet = (id) => { 
                triggerConfirm(t.common.delete + "?", async () => {
                     await window.fs.deleteDoc(window.fs.doc(window.db, 'timesheets', id)); 
                });
            };
            const editTimesheet = (item) => { setTimesheetForm({date: item.date, startTime: item.startTime, duration: item.duration}); setEditTimesheetId(item.id); window.scrollTo({top:0,behavior:'smooth'}); };
            const deleteSchedule = (id) => { 
                triggerConfirm(t.common.delete + "?", async () => {
                    await window.fs.deleteDoc(window.fs.doc(window.db, 'schedules', id)); 
                });
            };
            const editSchedule = (item) => { 
                // Convert DB time to UI time
                const uiStart = getDisplayTime(item.startTime, item.startDate || item.date, lang);
                const uiEnd = getDisplayTime(item.endTime, item.endDate || item.date, lang);
                setScheduleForm({startDate: item.startDate || item.date, startTime: uiStart, endDate: item.endDate || item.date, endTime: uiEnd}); 
                setEditScheduleId(item.id); 
                window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const isAdmin = String(currentUser) === ADMIN_ID;
            const activeUser = users.find(u => String(u.id) === String(currentUser));
            const hasPaymentInfo = activeUser && activeUser.bankName && activeUser.accountNumber;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
                    {notify && <Notification msg={notify.msg} type={notify.type} onClose={() => setNotify(null)} />}
                    {showProfileModal && <ProfileModal user={users.find(u => String(u.id) === String(currentUser))} onClose={() => setShowProfileModal(false)} onSave={saveUserProfile} loading={loading} lang={lang} t={t} />}
                    {showUserModal && <UserModal user={editingUser} onClose={() => {setShowUserModal(false); setEditingUser(null);}} onSave={handleSaveUser} loading={loading} t={t} />}
                    {showAdminLogin && <AdminLoginModal onClose={() => setShowAdminLogin(false)} onLogin={handleAdminLogin} loading={loading} t={t} />}
                    {confirmModal.show && <ConfirmationModal isOpen={confirmModal.show} message={confirmModal.message} onConfirm={executeConfirm} onCancel={() => setConfirmModal({ ...confirmModal, show: false })} t={t} />}

                    <header className="bg-white sticky top-0 z-20 px-4 py-3 shadow-sm border-b border-slate-100 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <h1 className="font-bold text-lg text-blue-700"><i className="fas fa-layer-group"></i> Scheduler</h1>
                             {/* Lang Toggle */}
                            <button onClick={() => setLang(l => l === 'id' ? 'en' : 'id')} className="text-xs font-bold px-2 py-1 bg-slate-100 rounded border border-slate-200 uppercase">{lang}</button>
                        </div>
                        <select className="text-xs bg-slate-50 border border-slate-200 rounded-md p-1.5 outline-none" value={currentUser || ''} onChange={handleUserChange}>
                            <option value="">{t.timesheet.selectUser}</option>
                            {/* Filter out hidden users from dropdown */}
                            {users.filter(u => !u.hidden).map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                        </select>
                    </header>

                    <main className="flex-1 p-4">
                        {loading && !users.length ? <div className="flex flex-col items-center justify-center h-64 text-slate-400 animate-pulse"><i className="fas fa-database text-4xl mb-3"></i><p>{t.common.loading}</p></div> : (
                            <>
                                {view === 'dashboard' && <DashboardView currentUser={currentUser} getUserName={getUserName} timesheets={timesheets} schedules={schedules} getUserColor={getUserColor} onEditProfile={() => { if(!currentUser) return showNotify(t.timesheet.selectUser, "error"); setShowProfileModal(true); }} setView={setView} t={t} formatCurrency={dynamicFormatCurrency} lang={lang} />}
