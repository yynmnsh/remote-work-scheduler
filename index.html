<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteWork Scheduler</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, setDoc, where, writeBatch } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC-5NB0IjJff_-yXSBqSqZLJihx6kHvj2g",
            authDomain: "remotework-db.firebaseapp.com",
            projectId: "remotework-db",
            storageBucket: "remotework-db.firebasestorage.app",
            messagingSenderId: "890725023216",
            appId: "1:890725023216:web:30b10e5e4180825eb47135",
            measurementId: "G-QYCS4M4KJ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.fs = { collection, addDoc, getDocs, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, setDoc, where, writeBatch };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#475569', success: '#22c55e', danger: '#ef4444', warning: '#f59e0b' },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        /* Bar Chart Animations */
        .bar-fill { transition: height 1s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONSTANTS ---
        const HOURLY_RATE_USD = 17;
        const EXCHANGE_RATE = 16770;
        const ADMIN_ID = '9'; // ID Yayan sebagai Admin
        
        // Initial Seed Data (10 Users)
        const INITIAL_USERS = [
            { id: '1', name: 'Habib', color: '#3b82f6' },
            { id: '2', name: 'Yusuf', color: '#ef4444' },
            { id: '3', name: 'Fathim', color: '#10b981' },
            { id: '4', name: 'Azmi', color: '#8b5cf6' },
            { id: '5', name: 'Nurul', color: '#f59e0b' },
            { id: '6', name: 'Ika', color: '#ec4899' },
            { id: '7', name: 'Yuni', color: '#22c55e' },
            { id: '8', name: 'Nida', color: '#0ea5e9' },
            { id: '9', name: 'Yayan', color: '#a855f7' },
            { id: '10', name: 'Halim', color: '#64748b' }
        ];

        // --- UTILITIES ---
        const formatCurrency = (amount, currency = 'USD') => {
            const num = parseFloat(amount) || 0;
            if (currency === 'IDR') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        };

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        };

        const getPTDisplay = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return "-";
            try {
                const wibDate = new Date(`${dateStr}T${timeStr}`);
                const ptDate = new Date(wibDate.getTime() - (15 * 60 * 60 * 1000));
                const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
                return ptDate.toLocaleDateString('en-US', options) + " PT";
            } catch (e) { return "-"; }
        };

        const getOpDay = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return null;
            const dt = new Date(`${dateStr}T${timeStr}`);
            const hour = dt.getHours();
            if (hour < 15) dt.setDate(dt.getDate() - 1);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const getShiftMinutes = (timeStr) => {
            if(!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            let minutes = h * 60 + m;
            if (h < 15) minutes += 1440; 
            return minutes - 900; 
        };

        // --- UI COMPONENTS ---
        const Spinner = () => <i className="fas fa-circle-notch fa-spin text-white"></i>;

        const Notification = ({ msg, type, onClose }) => (
            <div className={`fixed top-4 right-4 left-4 md:left-auto z-50 p-4 rounded-lg shadow-xl text-white flex justify-between items-center fade-in ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`}>
                <span className="text-sm font-medium">{msg}</span>
                <button onClick={onClose}><i className="fas fa-times opacity-70 hover:opacity-100"></i></button>
            </div>
        );

        const ProfileModal = ({ user, onClose, onSave, loading }) => {
            const [bankName, setBankName] = React.useState(user?.bankName || '');
            const [accNumber, setAccNumber] = React.useState(user?.accountNumber || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ bankName, accountNumber: accNumber });
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <i className="fas fa-wallet text-blue-600"></i> Info Pembayaran
                        </h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Nama Bank / E-Wallet</label>
                                <input type="text" placeholder="Contoh: BCA, GoPay, Dana" className="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={bankName} onChange={e => setBankName(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Nomor Rekening</label>
                                <input type="text" placeholder="1234xxxxxx" className="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={accNumber} onChange={e => setAccNumber(e.target.value)} required />
                            </div>
                            <div className="flex gap-2 mt-6">
                                <button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg transition">Batal</button>
                                <button type="submit" disabled={loading} className="flex-1 py-2 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700 transition">
                                    {loading ? <Spinner/> : 'Simpan'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- NEW: ANALYTICS VIEW COMPONENT ---
        const AnalyticsView = ({ timesheets, schedules, users, currentUser, onGenerateDummy, isAdmin, loading }) => {
            const [tab, setTab] = React.useState('team'); 

            // --- Calculation Logic ---
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            // Filter Timesheets for Current Month (Summary Cards)
            const thisMonthSheets = timesheets.filter(t => {
                const d = new Date(t.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });

            // 1. Total Hours This Month (Team)
            const totalMinutesTeam = thisMonthSheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            
            // 2. Total Earnings This Month (Team)
            const totalEarnedTeam = thisMonthSheets.reduce((acc, t) => acc + parseFloat(t.paymentIDR || 0), 0);

            // 3. Leaderboard Logic
            const userStats = {};
            thisMonthSheets.forEach(t => {
                if(!userStats[t.userId]) userStats[t.userId] = { minutes: 0, earnings: 0 };
                userStats[t.userId].minutes += parseInt(t.duration || 0);
                userStats[t.userId].earnings += parseFloat(t.paymentIDR || 0);
            });
            
            const leaderboard = Object.keys(userStats)
                .map(uid => ({ 
                    uid, 
                    ...userStats[uid], 
                    name: users.find(u => String(u.id) === String(uid))?.name || 'Unknown',
                    color: users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1'
                }))
                .sort((a,b) => b.minutes - a.minutes)
                .slice(0, 5); // Top 5

            // 4. Personal Stats
            const mySheets = thisMonthSheets.filter(t => String(t.userId) === String(currentUser));
            const myTotalMinutes = mySheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            const myTotalEarnings = mySheets.reduce((acc, t) => acc + parseFloat(t.paymentIDR || 0), 0);

            // 5. Adherence & Daily Activity - Last 14 Days (Extended range)
            const getLast14Days = () => {
                const dates = [];
                for(let i=13; i>=0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const y = d.getFullYear();
                    const m = String(d.getMonth()+1).padStart(2,'0');
                    const day = String(d.getDate()).padStart(2,'0');
                    dates.push(`${y}-${m}-${day}`);
                }
                return dates;
            };
            
            const rangeDays = getLast14Days();
            
            const adherenceData = rangeDays.slice(7).map(dateStr => { 
                const scheduledMins = schedules
                    .filter(s => String(s.userId) === String(currentUser) && (s.startDate === dateStr || s.date === dateStr))
                    .reduce((acc, s) => {
                        const start = new Date(`${s.startDate || s.date}T${s.startTime}`);
                        let end = new Date(`${s.endDate || s.date}T${s.endTime}`);
                        if (end < start) end.setDate(end.getDate() + 1);
                        return acc + Math.floor((end - start)/60000);
                    }, 0);

                const actualMins = timesheets
                    .filter(t => String(t.userId) === String(currentUser) && t.date === dateStr)
                    .reduce((acc, t) => acc + parseInt(t.duration || 0), 0);

                return { date: dateStr, scheduled: scheduledMins, actual: actualMins };
            });

            // 6. Daily Activity (Team) - Last 14 Days - Uses GLOBAL timesheets (Paid & Pending)
            const dailyActivityTeam = rangeDays.map(dateStr => {
                const mins = timesheets
                    .filter(t => t.date === dateStr) // Matches exact YYYY-MM-DD string
                    .reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
                return { date: dateStr, minutes: mins };
            });
            const maxDailyMins = Math.max(...dailyActivityTeam.map(d => d.minutes), 60);
            const isActivityEmpty = dailyActivityTeam.every(d => d.minutes === 0);

            return (
                <div className="space-y-4 fade-in pb-24">
                    {/* Header Tabs */}
                    <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 items-center">
                        <div className="flex-1 flex bg-slate-50 p-1 rounded-lg">
                            <button 
                                onClick={() => setTab('team')}
                                className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'team' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-indigo-500'}`}
                            >
                                Tim Global
                            </button>
                            <button 
                                onClick={() => setTab('personal')}
                                className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'personal' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-blue-500'}`}
                            >
                                Personal
                            </button>
                        </div>
                        {isAdmin && (
                            <button 
                                onClick={onGenerateDummy}
                                disabled={loading}
                                className="bg-indigo-100 hover:bg-indigo-200 text-indigo-600 p-2 rounded-lg transition"
                                title="Buat data dummy untuk tes grafik"
                            >
                                <i className="fas fa-magic text-xs"></i>
                            </button>
                        )}
                    </div>

                    {tab === 'personal' && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl p-5 text-white shadow-lg">
                                <h3 className="text-xs text-blue-200 uppercase tracking-widest font-bold mb-4">Statistik Saya (Bulan Ini)</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <p className="text-3xl font-bold">{(myTotalMinutes/60).toFixed(1)}</p>
                                        <p className="text-xs text-blue-200">Jam Kerja</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xl font-bold">{formatCurrency(myTotalEarnings, 'IDR')}</p>
                                        <p className="text-xs text-blue-200">Estimasi Pendapatan</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <i className="fas fa-chart-bar text-blue-500"></i> Disiplin (7 Hari Terakhir)
                                </h3>
                                <div className="space-y-3">
                                    {adherenceData.map((d, idx) => {
                                        const dateLabel = new Date(d.date).toLocaleDateString('id-ID', {weekday:'short', day:'numeric'});
                                        const maxVal = Math.max(d.scheduled, d.actual, 60); 
                                        return (
                                            <div key={idx} className="text-xs">
                                                <div className="flex justify-between mb-1 text-slate-500">
                                                    <span>{dateLabel}</span>
                                                    <span className="font-mono">
                                                        <span className="text-slate-400">{Math.round(d.scheduled/60)}h Plan</span> / 
                                                        <span className={d.actual >= d.scheduled && d.scheduled > 0 ? "text-green-600 font-bold ml-1" : "text-slate-700 ml-1"}>
                                                            {Math.round(d.actual/60)}h Act
                                                        </span>
                                                    </span>
                                                </div>
                                                <div className="h-2 bg-slate-100 rounded-full overflow-hidden relative flex">
                                                    <div className="absolute top-0 left-0 h-full bg-slate-300 opacity-50" style={{ width: `${(d.scheduled/maxVal)*100}%` }}></div>
                                                    <div className={`h-full rounded-full ${d.actual > d.scheduled ? 'bg-green-500' : 'bg-blue-500'}`} style={{ width: `${(d.actual/maxVal)*100}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === 'team' && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="bg-gradient-to-br from-indigo-700 to-purple-800 rounded-2xl p-5 text-white shadow-lg">
                                <h3 className="text-xs text-indigo-200 uppercase tracking-widest font-bold mb-4">Overview Tim (Bulan Ini)</h3>
                                <div className="flex justify-between items-end">
                                    <div>
                                        <p className="text-4xl font-bold">{(totalMinutesTeam/60).toFixed(0)}<span className="text-lg font-normal text-indigo-300">h</span></p>
                                        <p className="text-xs text-indigo-200 mt-1">Total Jam Produktif</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-lg font-bold">{formatCurrency(totalEarnedTeam, 'USD')}</p>
                                        <p className="text-xs text-indigo-200">Burn Rate (USD)</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-700 text-sm">Aktivitas Tim (14 Hari)</h3>
                                    <span className="text-[10px] text-slate-400 bg-slate-50 px-2 py-1 rounded">
                                        Total Laporan: {timesheets.length}
                                    </span>
                                </div>
                                
                                {isActivityEmpty && !loading && (
                                    <div className="absolute inset-0 top-12 bg-white/80 z-10 flex flex-col items-center justify-center text-center p-4">
                                        <p className="text-slate-400 text-xs mb-2">
                                            Belum ada data aktivitas di 14 hari terakhir.
                                        </p>
                                        {isAdmin && (
                                            <button onClick={onGenerateDummy} className="text-indigo-600 bg-indigo-50 px-3 py-1 rounded text-xs font-bold hover:bg-indigo-100 transition">
                                                Generate Dummy Data
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* FIXED CSS: Removed items-end from parent, used h-full on child */}
                                <div className="flex justify-between h-32 gap-1">
                                    {dailyActivityTeam.map((d, idx) => {
                                        const h = Math.max((d.minutes / maxDailyMins) * 100, d.minutes > 0 ? 5 : 0);
                                        const dateObj = new Date(d.date);
                                        const dayName = dateObj.toLocaleDateString('id-ID', {weekday:'narrow'});
                                        const dateNum = dateObj.getDate();
                                        
                                        return (
                                            <div key={idx} className="flex-1 flex flex-col items-center group h-full justify-end">
                                                <div className="w-full bg-slate-50 rounded-t-sm relative hover:bg-indigo-50 transition-all flex flex-col justify-end h-full">
                                                    <div className={`w-full rounded-t-sm bar-fill ${d.minutes > 0 ? 'bg-indigo-500' : 'bg-transparent'}`} style={{height: `${h}%`}}></div>
                                                    {d.minutes > 0 && (
                                                        <div className="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-20 pointer-events-none shadow-lg">
                                                            {d.date}<br/>
                                                            <b>{(d.minutes/60).toFixed(1)} Jam</b>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="mt-1 text-center h-6">
                                                    <span className="text-[8px] text-slate-400 block leading-tight">{dayName}</span>
                                                    <span className="text-[8px] text-slate-500 font-bold block leading-tight">{dateNum}</span>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <i className="fas fa-trophy text-yellow-500"></i> Top Kontributor
                                </h3>
                                <div className="space-y-3">
                                    {leaderboard.map((u, idx) => (
                                        <div key={u.uid} className="flex items-center justify-between border-b border-slate-50 last:border-0 pb-2 last:pb-0">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold ${idx === 0 ? 'ring-2 ring-yellow-400' : ''}`} style={{backgroundColor: u.color}}>
                                                    {idx + 1}
                                                </div>
                                                <span className="text-sm font-medium text-slate-700">{u.name}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-sm font-bold text-indigo-600">{(u.minutes/60).toFixed(1)}h</span>
                                            </div>
                                        </div>
                                    ))}
                                    {leaderboard.length === 0 && <p className="text-xs text-slate-400 text-center italic">Belum ada data kontributor bulan ini.</p>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- ADMIN PANEL ---
        const AdminPanel = ({ timesheets, users, schedules, loading, setLoading, showNotify, onGenerateDummy }) => {
            const pendingSheets = timesheets.filter(t => t.status === 'pending');
            
            // Stats
            const totalMinsGlobal = pendingSheets.reduce((sum, t) => sum + (parseInt(t.duration) || 0), 0);
            const totalUSDGlobal = pendingSheets.reduce((sum, t) => sum + (parseFloat(t.paymentUSD) || 0), 0);
            const totalIDRGlobal = pendingSheets.reduce((sum, t) => sum + (parseFloat(t.paymentIDR) || 0), 0);

            // ACTIVE WORKERS LOGIC (WIB BASED)
            const nowUTC = new Date();
            const wibString = nowUTC.toLocaleString("en-US", {timeZone: "Asia/Jakarta", hour12: false}); 
            const currentWIB = new Date(wibString); 
            
            const activeWorkers = schedules.filter(s => {
                const startDateStr = s.startDate || s.date;
                const endDateStr = s.endDate || s.date;
                const sStart = new Date(`${startDateStr}T${s.startTime}`);
                const sEnd = new Date(`${endDateStr}T${s.endTime}`);
                if (!s.endDate && sEnd < sStart) {
                    sEnd.setDate(sEnd.getDate() + 1);
                }
                return currentWIB >= sStart && currentWIB <= sEnd;
            }).map(s => {
                const u = users.find(u => String(u.id) === String(s.userId));
                return { name: u?.name || 'Unknown', endTime: s.endTime, color: u?.color };
            });

            // Period Text
            let periodText = "Tidak ada tagihan";
            if (pendingSheets.length > 0) {
                const sortedDates = pendingSheets.map(t => new Date(t.date)).sort((a,b) => a-b);
                const start = sortedDates[0];
                const end = sortedDates[sortedDates.length - 1];
                const startStr = `${start.getDate()} ${start.toLocaleString('id-ID', { month: 'short' })}`;
                const endStr = `${end.getDate()} ${end.toLocaleString('id-ID', { month: 'short' })}`;
                periodText = startStr === endStr ? startStr : `${startStr} - ${endStr}`;
            }

            const recap = {};
            pendingSheets.forEach(t => {
                if (!recap[t.userId]) {
                    const uObj = users.find(u => String(u.id) === String(t.userId));
                    recap[t.userId] = { 
                        name: uObj?.name || 'Unknown',
                        bankName: uObj?.bankName || '-',
                        accountNumber: uObj?.accountNumber || '-',
                        totalMins: 0,
                        totalIDR: 0,
                        sheetIds: []
                    };
                }
                recap[t.userId].totalMins += (t.duration || 0);
                recap[t.userId].totalIDR += (t.paymentIDR || 0);
                recap[t.userId].sheetIds.push(t.id);
            });

            const recapList = Object.keys(recap).map(uid => ({ userId: uid, ...recap[uid] }));

            const handleMarkPaid = async (userId, sheetIds, userName) => {
                if(!confirm(`Tandai ${sheetIds.length} laporan milik ${userName} sebagai LUNAS?`)) return;
                setLoading(true);
                try {
                    const batch = window.fs.writeBatch(window.db);
                    sheetIds.forEach(id => {
                        const docRef = window.fs.doc(window.db, "timesheets", id);
                        batch.update(docRef, { status: 'paid', paidAt: new Date().toISOString() });
                    });
                    await batch.commit();
                    showNotify(`Sukses! Pembayaran ke ${userName} dicatat.`);
                } catch (e) {
                    showNotify("Gagal update data.", "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-4 fade-in pb-20">
                    {/* Live Status Card */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-green-100">
                        <div className="flex justify-between items-start mb-3">
                            <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide flex items-center gap-2">
                                <span className="relative flex h-3 w-3">
                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                  <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                                </span>
                                Sedang Bekerja Sekarang (WIB)
                            </h3>
                            <span className="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">
                                {wibString.split(',')[1].trim().substring(0,5)} WIB
                            </span>
                        </div>
                        
                        {activeWorkers.length > 0 ? (
                            <div className="flex flex-wrap gap-2">
                                {activeWorkers.map((w, idx) => (
                                    <div key={idx} className="bg-slate-50 border border-slate-200 rounded-full px-3 py-1 flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full" style={{backgroundColor: w.color}}></div>
                                        <span className="text-sm font-bold text-slate-700">{w.name}</span>
                                        <span className="text-xs text-slate-400">sampai {w.endTime}</span>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <p className="text-sm text-slate-400 italic">Tidak ada yang bekerja saat ini.</p>
                        )}
                    </div>

                    <div className="bg-gradient-to-r from-purple-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <h2 className="text-xl font-bold mb-1"><i className="fas fa-user-shield mr-2"></i>Admin Panel</h2>
                                <p className="text-purple-200 text-xs mt-1 bg-white/10 px-2 py-1 rounded inline-block">
                                    <i className="far fa-calendar-alt mr-1"></i> Periode: {periodText}
                                </p>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white/10 backdrop-blur rounded-xl p-3 border border-white/20 col-span-2">
                                <p className="text-[10px] text-purple-200 uppercase tracking-widest">Total Tagihan (IDR)</p>
                                <p className="text-2xl font-bold">{formatCurrency(totalIDRGlobal, 'IDR')}</p>
                            </div>
                            <div className="bg-white/10 backdrop-blur rounded-xl p-3 border border-white/20">
                                <p className="text-[10px] text-purple-200 uppercase tracking-widest">Total Jam</p>
                                <p className="text-lg font-bold">{(totalMinsGlobal/60).toFixed(1)} Jam</p>
                            </div>
                            <div className="bg-white/10 backdrop-blur rounded-xl p-3 border border-white/20">
                                <p className="text-[10px] text-purple-200 uppercase tracking-widest">Total USD</p>
                                <p className="text-lg font-bold">${totalUSDGlobal.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        {recapList.length === 0 ? (
                            <div className="text-center py-8 text-slate-400">
                                <i className="fas fa-check-circle text-4xl mb-2 text-green-100"></i>
                                <p>Semua lunas! Tidak ada tagihan pending.</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide mb-2">Rincian Transfer</h3>
                                {recapList.map(item => (
                                    <div key={item.userId} className="border border-slate-100 rounded-xl p-4 bg-slate-50 hover:bg-white hover:shadow-md transition">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <p className="font-bold text-slate-800 text-lg">{item.name}</p>
                                                <div className="flex items-center gap-1 text-xs text-slate-500 mt-1 mb-2">
                                                    <i className="fas fa-university text-slate-400"></i>
                                                    <span className="font-mono bg-slate-100 px-1 rounded select-all">
                                                        {item.bankName} - {item.accountNumber}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-400">{(item.totalMins/60).toFixed(2)} Jam • {item.sheetIds.length} Laporan</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-bold text-green-600 text-lg">{formatCurrency(item.totalIDR, 'IDR')}</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => handleMarkPaid(item.userId, item.sheetIds, item.name)}
                                            disabled={loading}
                                            className="w-full mt-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2 rounded-lg flex items-center justify-center gap-2 transition active:scale-95"
                                        >
                                            {loading ? <Spinner/> : <><i className="fas fa-check-double"></i> Tandai Lunas (Reset)</>}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- SUB-VIEWS ---

        const DashboardView = ({ currentUser, getUserName, timesheets, schedules, getUserColor, onEditProfile }) => {
            const myPending = timesheets.filter(t => String(t.userId) === String(currentUser) && t.status === 'pending');
            const estEarned = myPending.reduce((acc, curr) => acc + (curr.paymentIDR || 0), 0);
            const totalMins = myPending.reduce((acc, curr) => acc + (curr.duration || 0), 0);

            let periodText = "Belum ada kerjaan";
            if (myPending.length > 0) {
                const sortedDates = myPending.map(t => new Date(t.date)).sort((a,b) => a-b);
                const start = sortedDates[0];
                const end = sortedDates[sortedDates.length - 1];
                
                const startStr = `${start.getDate()} ${start.toLocaleString('id-ID', { month: 'short' })}`;
                const endStr = `${end.getDate()} ${end.toLocaleString('id-ID', { month: 'short' })}`;
                
                periodText = startStr === endStr ? startStr : `${startStr} - ${endStr}`;
            }

            const upcomingSchedules = schedules
                .filter(s => {
                    const dateStr = s.startDate || s.date; // Support legacy
                    const sDate = new Date(dateStr);
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    return sDate >= today; 
                })
                .sort((a,b) => {
                    const da = a.startDate || a.date;
                    const db = b.startDate || b.date;
                    const dateA = new Date(`${da}T${a.startTime}`);
                    const dateB = new Date(`${db}T${b.startTime}`);
                    return dateA - dateB;
                })
                .slice(0, 5);

            return (
                <div className="space-y-4 fade-in">
                    <div className="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                        <div className="relative z-10 flex justify-between items-start">
                            <div>
                                <h2 className="text-xl font-bold flex items-center gap-2">
                                    Halo, {currentUser ? getUserName(currentUser) : 'Tim'}!
                                </h2>
                                <p className="text-blue-200 text-xs mt-0.5">Remote Work Scheduler</p>
                            </div>
                            <button onClick={onEditProfile} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition backdrop-blur-sm" title="Atur Rekening">
                                <i className="fas fa-cog text-white text-sm"></i>
                            </button>
                        </div>

                        <div className="relative z-10 mt-6 bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 flex justify-between items-center">
                            <div>
                                <p className="text-[10px] text-blue-200 uppercase tracking-widest mb-1">Estimasi Gaji (Pending)</p>
                                <p className="text-2xl font-bold">{formatCurrency(estEarned, 'IDR')}</p>
                                <p className="text-[10px] text-blue-100 mt-1 flex items-center gap-1">
                                    <i className="far fa-clock"></i> Periode: {periodText}
                                </p>
                            </div>
                            <div className="text-right">
                                <span className="block text-2xl font-bold">{(totalMins/60).toFixed(1)}</span>
                                <span className="text-xs text-blue-200">Jam</span>
                            </div>
                        </div>
                        
                        <i className="fas fa-coins absolute -right-6 -bottom-8 text-9xl text-white opacity-5"></i>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center text-sm uppercase tracking-wide">
                            <i className="fas fa-calendar-alt text-blue-500 mr-2"></i> Jadwal Mendatang
                        </h3>
                        <div className="space-y-3">
                            {upcomingSchedules.map(s => {
                                const showDate = s.startDate || s.date;
                                return (
                                    <div key={s.id} className="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" style={{backgroundColor: getUserColor(s.userId)}}>
                                            {getUserName(s.userId).substring(0,2).toUpperCase()}
                                        </div>
                                        <div className="ml-3 flex-1">
                                            <div className="flex justify-between">
                                                <span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>
                                                <span className="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-500">{formatDate(showDate)}</span>
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1">
                                                {s.startTime} - {s.endTime}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                            {upcomingSchedules.length === 0 && <p className="text-center text-slate-400 text-xs py-4">Tidak ada jadwal dalam waktu dekat.</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const ScheduleManager = ({ editScheduleId, setEditScheduleId, scheduleForm, setScheduleForm, saveSchedule, loading, schedules, currentUser, getUserColor, getUserName, deleteSchedule, editSchedule, isAdmin }) => {
            
            const [showHistory, setShowHistory] = React.useState(false);
            
            // --- LOGIKA HITUNG SISA WAKTU (GLOBAL / SEMUA USER) ---
            const MAX_MINUTES = 480; // 8 Jam Total Tim per Hari
            
            // Hitung total jam yang SUDAH dibooking OLEH SEMUA USER pada Operational Day yang sedang dipilih
            const dailyUsedMinutes = React.useMemo(() => {
                const currentOpDay = getOpDay(scheduleForm.startDate, scheduleForm.startTime);
                if (!currentOpDay) return 0;
                
                return schedules
                    .filter(s => {
                        // Jangan hitung diri sendiri saat edit
                        if (editScheduleId && s.id === editScheduleId) return false;
                        
                        // Cek apakah jadwal lain ini jatuh pada OpDay yang sama dengan yang sedang diinput
                        // Support legacy data (s.date) vs new data (s.startDate)
                        const otherStartD = s.startDate || s.date;
                        const otherStartT = s.startTime;
                        const otherOpDay = getOpDay(otherStartD, otherStartT);
                        
                        return otherOpDay === currentOpDay;
                    })
                    .reduce((acc, s) => {
                         // Hitung durasi real menggunakan Date diff
                         const startD = s.startDate || s.date;
                         const endD = s.endDate || s.date; // legacy fallback
                         
                         const d1 = new Date(`${startD}T${s.startTime}`);
                         let d2 = new Date(`${endD}T${s.endTime}`);
                         
                         // Fix legacy crossing midnight issue (if endTime < startTime and no endDate)
                         if (!s.endDate && d2 < d1) d2.setDate(d2.getDate() + 1);

                         const diffMs = d2 - d1;
                         const diffMins = Math.floor(diffMs / 60000);
                         
                         return acc + diffMins;
                    }, 0);
            }, [schedules, scheduleForm.startDate, scheduleForm.startTime, editScheduleId]);

            const remainingMinutes = Math.max(0, MAX_MINUTES - dailyUsedMinutes);
            const usedPercentage = Math.min(100, (dailyUsedMinutes / MAX_MINUTES) * 100);
            const isCritical = remainingMinutes < 60; // Kurang dari 1 jam warnanya merah

            // --- FILTER JADWAL (UPDATED: H-1 s/d Future, WIB) ---
            const filteredSchedules = React.useMemo(() => {
                if (showHistory) return schedules; // Tampilkan semua jika mode history

                const now = new Date();
                const wibString = now.toLocaleString("en-US", {timeZone: "Asia/Jakarta"});
                const wibDate = new Date(wibString);
                wibDate.setDate(wibDate.getDate() - 1); // Mundur 1 hari
                
                const y = wibDate.getFullYear();
                const m = String(wibDate.getMonth() + 1).padStart(2, '0');
                const d = String(wibDate.getDate()).padStart(2, '0');
                const yesterdayStr = `${y}-${m}-${d}`;

                return schedules.filter(s => {
                    const checkDate = s.startDate || s.date;
                    return checkDate >= yesterdayStr;
                });
            }, [schedules, showHistory]);

            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editScheduleId ? 'border-orange-500' : 'border-blue-500'}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-700">
                                {editScheduleId ? 'Edit Jadwal' : 'Booking Jadwal'}
                            </h3>
                            {editScheduleId && <button onClick={() => {setEditScheduleId(null); setScheduleForm({startDate:'', startTime:'15:00', endDate: '', endTime:'16:00'})}} className="text-xs text-red-500">Batal</button>}
                        </div>

                        {/* --- INDIKATOR SISA WAKTU GLOBAL --- */}
                        {scheduleForm.startDate && scheduleForm.startTime && (
                            <div className={`rounded-xl p-4 mb-5 border transition-all duration-300 ${isCritical && remainingMinutes < MAX_MINUTES ? 'bg-red-50 border-red-100' : 'bg-blue-50 border-blue-100'}`}>
                                <div className="flex justify-between items-end mb-2">
                                    <div>
                                        <p className={`text-[10px] font-bold uppercase tracking-wider ${isCritical ? 'text-red-600' : 'text-blue-600'}`}>
                                            <i className="fas fa-users mr-1"></i> Kuota Tim (Op Day: {getOpDay(scheduleForm.startDate, scheduleForm.startTime)})
                                        </p>
                                        <p className="text-xs text-slate-600 mt-1">
                                            Total Terbooking: <span className="font-bold text-slate-800">{(dailyUsedMinutes/60).toFixed(1)}</span> jam
                                        </p>
                                    </div>
                                    <div className="text-right">
                                        <span className={`text-2xl font-bold ${isCritical ? 'text-red-600' : 'text-blue-600'}`}>
                                            {(remainingMinutes/60).toFixed(1)}
                                        </span>
                                        <span className="text-[10px] text-slate-500 ml-1 font-medium uppercase">Jam Tersisa</span>
                                    </div>
                                </div>
                                {/* Progress Bar */}
                                <div className="w-full bg-white/50 rounded-full h-2.5 overflow-hidden border border-slate-100">
                                    <div 
                                        className={`h-2.5 rounded-full transition-all duration-700 ease-out ${isCritical ? 'bg-red-500' : 'bg-blue-600'}`} 
                                        style={{ width: `${usedPercentage}%` }}
                                    ></div>
                                </div>
                                {remainingMinutes === 0 && (
                                    <p className="text-[10px] text-red-500 mt-2 text-center font-bold animate-pulse">
                                        Kuota tim penuh untuk operational day ini!
                                    </p>
                                )}
                            </div>
                        )}

                        <form onSubmit={saveSchedule} className="space-y-3">
                            {/* START SECTION */}
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">Waktu Mulai (WIB)</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <input type="date" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500"
                                            value={scheduleForm.startDate} onChange={e => {
                                                // Auto set end date same as start date for convenience
                                                if(!scheduleForm.endDate) setScheduleForm({...scheduleForm, startDate: e.target.value, endDate: e.target.value});
                                                else setScheduleForm({...scheduleForm, startDate: e.target.value});
                                            }} />
                                    </div>
                                    <div>
                                        <input type="time" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500"
                                            value={scheduleForm.startTime} onChange={e => setScheduleForm({...scheduleForm, startTime: e.target.value})} />
                                    </div>
                                </div>
                                <div className="mt-1 text-right">
                                    <span className="text-[10px] text-blue-500 bg-blue-50 px-2 py-0.5 rounded">
                                        {getPTDisplay(scheduleForm.startDate, scheduleForm.startTime)}
                                    </span>
                                </div>
                            </div>

                            {/* END SECTION */}
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">Waktu Selesai (WIB)</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <input type="date" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500"
                                            value={scheduleForm.endDate} onChange={e => setScheduleForm({...scheduleForm, endDate: e.target.value})} />
                                    </div>
                                    <div>
                                        <input type="time" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500"
                                            value={scheduleForm.endTime} onChange={e => setScheduleForm({...scheduleForm, endTime: e.target.value})} />
                                    </div>
                                </div>
                                <div className="mt-1 text-right">
                                    <span className="text-[10px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                                        {getPTDisplay(scheduleForm.endDate, scheduleForm.endTime)}
                                    </span>
                                </div>
                            </div>

                            <button 
                                disabled={loading || (remainingMinutes <= 0 && !editScheduleId)} 
                                className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${
                                    editScheduleId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-blue-600 hover:bg-blue-700'
                                }`}
                            >
                                {loading ? <Spinner/> : (editScheduleId ? 'Update Perubahan' : (remainingMinutes <= 0 ? 'Kuota Penuh' : 'Booking Slot'))}
                            </button>
                        </form>
                    </div>

                    <div className="space-y-3 pb-20">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide ml-1">
                                {showHistory ? "Semua Jadwal (Arsip)" : "Jadwal"}
                            </h3>
                            {isAdmin && (
                                <button onClick={() => setShowHistory(!showHistory)} className="text-xs text-blue-500 hover:underline">
                                    {showHistory ? "Sembunyikan Arsip" : "Lihat Arsip Lama"}
                                </button>
                            )}
                        </div>
                        
                        {filteredSchedules.length === 0 && <p className="text-center text-slate-400 text-sm py-4">Tidak ada jadwal.</p>}

                        {filteredSchedules.map(s => {
                            const isMine = String(s.userId) === String(currentUser);
                            // Handling Legacy Data Display
                            const showStartDate = s.startDate || s.date;
                            const showEndDate = s.endDate || s.date; // If legacy, assume same day unless implied crossing

                            return (
                                <div key={s.id} className={`p-4 rounded-xl border flex justify-between items-center ${isMine ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-2 h-10 rounded-full" style={{backgroundColor: getUserColor(s.userId)}}></div>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>
                                                {isMine && <span className="text-[10px] bg-blue-100 text-blue-600 px-1.5 rounded font-bold">YOU</span>}
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1">
                                                {formatDate(showStartDate)} {s.startTime} - {showStartDate !== showEndDate ? formatDate(showEndDate) : ''} {s.endTime}
                                            </div>
                                            <div className="text-[10px] text-slate-400 mt-0.5 italic">
                                                OpDay: {getOpDay(showStartDate, s.startTime)}
                                            </div>
                                        </div>
                                    </div>
                                    {isMine && (
                                        <div className="flex gap-2">
                                            <button onClick={() => editSchedule(s)} className="w-8 h-8 rounded-full bg-white border border-blue-100 text-blue-500 hover:bg-blue-50 flex items-center justify-center transition"><i className="fas fa-pen text-xs"></i></button>
                                            <button onClick={() => deleteSchedule(s.id)} className="w-8 h-8 rounded-full bg-white border border-red-100 text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i className="fas fa-trash text-xs"></i></button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        
        const ReportManager = ({ saveTimesheet, timesheetForm, setTimesheetForm, loading, timesheets, getUserName, currentUser, deleteTimesheet, editTimesheetId, setEditTimesheetId, editTimesheet, hasPaymentInfo, onOpenProfile, isAdmin }) => {
            
            if (!hasPaymentInfo) {
                return (
                    <div className="space-y-4 fade-in">
                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-xl shadow-sm">
                            <div className="flex items-center gap-3 mb-2">
                                <i className="fas fa-exclamation-triangle text-yellow-500 text-xl"></i>
                                <h3 className="font-bold text-yellow-700">Info Pembayaran Belum Lengkap</h3>
                            </div>
                            <p className="text-sm text-yellow-600 mb-4">
                                Mohon lengkapi data bank/e-wallet Anda agar gaji bisa ditransfer. Anda tidak bisa input laporan sebelum data ini lengkap.
                            </p>
                            <button 
                                onClick={onOpenProfile}
                                className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition shadow-md active:scale-95"
                            >
                                <i className="fas fa-wallet mr-2"></i> Lengkapi Sekarang
                            </button>
                        </div>
                    </div>
                );
            }

            const [showHistory, setShowHistory] = React.useState(false);
            
            const filteredTimesheets = timesheets.filter(t => {
                if (showHistory) return true;
                return t.status === 'pending'; // Default: Only show Pending
            });

            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editTimesheetId ? 'border-orange-500' : 'border-green-500'}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-700">
                                {editTimesheetId ? 'Edit Laporan' : 'Input Laporan Kerja'}
                            </h3>
                            {editTimesheetId && <button onClick={() => {setEditTimesheetId(null); setTimesheetForm({date:'', startTime:'', duration:''})}} className="text-xs text-red-500">Batal</button>}
                        </div>
                        <form onSubmit={saveTimesheet} className="space-y-3">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Tanggal Kerja</label>
                                <input 
                                    type="date" 
                                    required 
                                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none text-slate-600"
                                    value={timesheetForm.date} 
                                    onChange={e => setTimesheetForm({...timesheetForm, date: e.target.value})} 
                                />
                                <p className="text-[10px] text-slate-400 mt-1 italic">Masukkan tanggal Anda telah bekerja</p>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Waktu Mulai</label>
                                    <input 
                                        type="time" 
                                        required 
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none text-slate-600"
                                        value={timesheetForm.startTime} 
                                        onChange={e => setTimesheetForm({...timesheetForm, startTime: e.target.value})} 
                                    />
                                    <p className="text-[10px] text-slate-400 mt-1 italic">Masukkan waktu mulai</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Durasi</label>
                                    <input 
                                        type="number" 
                                        placeholder="Durasi (Menit)" 
                                        required 
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none"
                                        value={timesheetForm.duration} 
                                        onChange={e => setTimesheetForm({...timesheetForm, duration: e.target.value})} 
                                    />
                                </div>
                            </div>

                            <div className="flex justify-between items-center text-xs bg-green-50 text-green-700 p-2 rounded-lg">
                                <span>Estimasi:</span>
                                <span className="font-bold">{timesheetForm.duration ? formatCurrency((timesheetForm.duration/60)*HOURLY_RATE_USD*EXCHANGE_RATE, 'IDR') : 'Rp 0'}</span>
                            </div>
                            <button disabled={loading} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 ${editTimesheetId ? 'bg-orange-600 hover:bg-orange-700' : 'bg-green-600 hover:bg-green-700'}`}>
                                {loading ? <Spinner/> : (editTimesheetId ? 'Update Laporan' : 'Kirim Laporan')}
                            </button>
                        </form>
                    </div>

                    <div className="pb-20">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide ml-1">
                                {showHistory ? "Semua Riwayat (Lunas & Pending)" : "Riwayat (Pending/Aktif)"}
                            </h3>
                            {isAdmin && (
                                <button onClick={() => setShowHistory(!showHistory)} className="text-xs text-blue-500 hover:underline">
                                    {showHistory ? "Sembunyikan Lunas" : "Lihat Semua"}
                                </button>
                            )}
                        </div>

                        {filteredTimesheets.length === 0 && <p className="text-center text-slate-400 text-sm py-4">Tidak ada laporan aktif.</p>}

                        {filteredTimesheets.map(t => (
                            <div key={t.id} className="relative mb-3 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="font-bold text-slate-700 text-sm">{getUserName(t.userId)}</p>
                                        <p className="text-xs text-slate-400 mt-0.5">{formatDate(t.date)} • {t.startTime}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="font-bold text-green-600 text-sm">{formatCurrency(t.paymentIDR, 'IDR')}</p>
                                        <p className="text-xs text-slate-400">{t.duration} Menit</p>
                                    </div>
                                </div>
                                <div className="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center">
                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${t.status === 'paid' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>
                                        {t.status === 'paid' ? 'LUNAS' : 'PENDING'}
                                    </span>
                                    {String(t.userId) === String(currentUser) && t.status !== 'paid' && (
                                        <div className="flex gap-2">
                                            <button onClick={() => editTimesheet(t)} className="text-xs text-blue-500 hover:text-blue-700 flex items-center gap-1">
                                                <i className="fas fa-pen"></i> Edit
                                            </button>
                                            <button onClick={() => deleteTimesheet(t.id)} className="text-xs text-red-500 hover:text-red-700 flex items-center gap-1">
                                                <i className="fas fa-trash"></i> Hapus
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            // STATES
            const [view, setView] = React.useState('dashboard');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [users, setUsers] = React.useState([]);
            const [schedules, setSchedules] = React.useState([]);
            const [timesheets, setTimesheets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [notify, setNotify] = React.useState(null);
            
            const [showProfileModal, setShowProfileModal] = React.useState(false);

            // FORM STATES (UPDATED with start/end date)
            const [scheduleForm, setScheduleForm] = React.useState({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' });
            const [editScheduleId, setEditScheduleId] = React.useState(null);
            const [timesheetForm, setTimesheetForm] = React.useState({ date: '', startTime: '', duration: '' });
            const [editTimesheetId, setEditTimesheetId] = React.useState(null);

            // FIREBASE INIT
            React.useEffect(() => {
                const initData = async () => {
                    if (!window.db) return;
                    
                    // Users Sync
                    const userCol = window.fs.collection(window.db, 'users');
                    const userSnap = await window.fs.getDocs(userCol);
                    if (userSnap.empty) {
                        INITIAL_USERS.forEach(async (u) => await window.fs.setDoc(window.fs.doc(window.db, 'users', u.id), u));
                        setUsers(INITIAL_USERS);
                    } else {
                         window.fs.onSnapshot(userCol, (snapshot) => {
                            setUsers(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})));
                        });
                    }

                    // Schedules Sync
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'schedules')), (snapshot) => {
                        setSchedules(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})).sort((a,b) => {
                            const da = a.startDate || a.date;
                            const db = b.startDate || b.date;
                            const dateA = new Date(`${da}T${a.startTime}`);
                            const dateB = new Date(`${db}T${b.startTime}`);
                            return dateA - dateB;
                        }));
                    });

                    // Timesheets Sync
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'timesheets')), (snapshot) => {
                        setTimesheets(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})).sort((a,b) => {
                            const dateA = new Date(a.date);
                            const dateB = new Date(b.date);
                            if (dateA.getTime() !== dateB.getTime()) {
                                return dateB - dateA;
                            }
                            return getShiftMinutes(b.startTime) - getShiftMinutes(a.startTime);
                        }));
                    });

                    // Load User
                    const savedId = localStorage.getItem('remote_user_id');
                    if (savedId) setCurrentUser(savedId);
                };
                setTimeout(initData, 500);
            }, []);

            // COMMON HANDLERS
            const showNotify = (msg, type = 'success') => {
                setNotify({ msg, type });
                setTimeout(() => setNotify(null), 3000);
            };

            const getUserName = (uid) => users.find(u => String(u.id) === String(uid))?.name || 'Unknown';
            const getUserColor = (uid) => users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';

            // PROFILE HANDLER
            const saveUserProfile = async (data) => {
                if(!currentUser) return;
                setLoading(true);
                try {
                    await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), data);
                    showNotify("Info rekening disimpan!");
                    setShowProfileModal(false);
                } catch(e) {
                    showNotify("Gagal menyimpan.", "error");
                } finally {
                    setLoading(false);
                }
            };

            // GENERATE DUMMY DATA HANDLER (MOVED FROM ADMIN PANEL)
            const handleGenerateDummyData = async () => {
                if(!confirm("Buat data dummy acak untuk 7 hari terakhir agar grafik terlihat?")) return;
                setLoading(true);
                try {
                    const batch = window.fs.writeBatch(window.db);
                    const today = new Date();
                    
                    // Generate for last 7 days
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(today);
                        d.setDate(d.getDate() - i);
                        // Format YYYY-MM-DD manually to avoid timezone issues
                        const y = d.getFullYear();
                        const m = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        const dateStr = `${y}-${m}-${day}`;
                        
                        // Create 2-3 entries per day randomly
                        const numEntries = Math.floor(Math.random() * 3) + 1; 
                        
                        for (let j = 0; j < numEntries; j++) {
                            const randomUser = users[Math.floor(Math.random() * users.length)];
                            if (!randomUser) continue;
                            
                            const duration = Math.floor(Math.random() * 180) + 60; // 60-240 mins
                            const usd = (duration / 60) * HOURLY_RATE_USD;
                            const idr = Math.round(usd * EXCHANGE_RATE);
                            const status = Math.random() > 0.5 ? 'paid' : 'pending'; // Mix statuses
                            
                            const ref = window.fs.doc(window.fs.collection(window.db, 'timesheets'));
                            batch.set(ref, {
                                userId: randomUser.id,
                                date: dateStr,
                                startTime: "09:00", // Generic start time
                                duration: duration,
                                paymentUSD: usd.toFixed(2),
                                paymentIDR: idr,
                                status: status,
                                createdAt: new Date().toISOString()
                            });
                        }
                    }
                    await batch.commit();
                    showNotify("Data dummy (Pending & Paid) berhasil dibuat! Cek Analitik.");
                } catch (e) {
                    console.error(e);
                    showNotify("Gagal membuat data dummy", "error");
                } finally {
                    setLoading(false);
                }
            };

            // SCHEDULE HANDLERS (UPDATED for Multi-day logic)
            const saveSchedule = async (e) => {
                e.preventDefault();
                if (!currentUser) return showNotify("Pilih akun Anda!", "error");
                
                // Construct Date Objects
                const startD = new Date(`${scheduleForm.startDate}T${scheduleForm.startTime}`);
                const endD = new Date(`${scheduleForm.endDate}T${scheduleForm.endTime}`);
                
                if (isNaN(startD.getTime()) || isNaN(endD.getTime())) return showNotify("Waktu tidak valid", "error");
                
                // Validation 1: End > Start
                if (endD <= startD) return showNotify("Waktu Selesai harus setelah Waktu Mulai!", "error");
                
                // Validation 2: Max 8 Hours for this specific booking
                const durationMs = endD - startD;
                const durationMins = Math.floor(durationMs / 60000);
                if (durationMins > 480) return showNotify("Satu sesi booking maksimal 8 jam!", "error");

                setLoading(true);
                try {
                    // --- CUMULATIVE DURATION CHECK (GLOBAL per OpDay) ---
                    const currentOpDay = getOpDay(scheduleForm.startDate, scheduleForm.startTime);
                    
                    // Hitung total booking orang lain di OpDay yang sama
                    const existingTotalMinutes = schedules
                        .filter(s => {
                            if (editScheduleId && s.id === editScheduleId) return false;
                            
                            // Compatibility with legacy data
                            const sDate = s.startDate || s.date;
                            return getOpDay(sDate, s.startTime) === currentOpDay;
                        })
                        .reduce((acc, s) => {
                             const sd = s.startDate || s.date;
                             const ed = s.endDate || s.date;
                             const d1 = new Date(`${sd}T${s.startTime}`);
                             let d2 = new Date(`${ed}T${s.endTime}`);
                             if (!s.endDate && d2 < d1) d2.setDate(d2.getDate() + 1); // legacy fix
                             
                             return acc + Math.floor((d2 - d1)/60000);
                        }, 0);

                    if (existingTotalMinutes + durationMins > 480) {
                        const remaining = 480 - existingTotalMinutes;
                        throw new Error(`Kuota Harian Tim Penuh! Sisa waktu tersedia: ${(remaining/60).toFixed(1)} jam.`);
                    }

                    // --- CONFLICT CHECK ---
                    // Cek overlap waktu yang sebenarnya (absolute time overlap)
                    const hasConflict = schedules.find(s => {
                        if (editScheduleId && s.id === editScheduleId) return false;
                        
                        const sStartD = new Date(`${s.startDate || s.date}T${s.startTime}`);
                        let sEndD = new Date(`${s.endDate || s.date}T${s.endTime}`);
                        if (!s.endDate && sEndD < sStartD) sEndD.setDate(sEndD.getDate() + 1);
