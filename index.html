        // --- 2. STATE MANAGER ---
        window.appState = {
            view: 'dashboard', currentUser: null, users: [], schedules: [], timesheets: [],
            loading: true, lang: 'id', timezone: 'AEDT', sysSettings: { dailyQuotaHours: 10, baseHourlyRateUSD: 15, usdToIdr: 16000, offsetWIB: 7, offsetAEDT: 11, offsetPST: -8 },
            scheduleForm: { startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' }, editScheduleId: null,
            timesheetForm: { scheduleId: '', date: '', startTime: '', endDate: '', endTime: '' }, editTimesheetId: null,
            adminView: 'pending', analyticsTab: 'team', schedHistory: false, schedFilterMine: false, schedSort: 'asc',
            tsHistory: false, tsFilterMine: false,
            modals: { profile: false, user: false, password: { show: false, mode: '', userId: null }, confirm: { show: false, msg: '', action: null } },
            editingUser: null, tempForms: { profile: {}, user: {}, password: '', adminSettings: {} }
        };

        window.updateState = function(updates) {
            if (typeof updates === 'function') updates = updates(window.appState);
            Object.assign(window.appState, updates);
            window.renderApp();
        };

        // --- 3. HELPER FUNCTIONS ---
        window.hashPassword = async (text) => {
            if (!text) return text;
            const msgUint8 = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };
        window.formatDate = (dateString, lang) => {
            if (!dateString) return '';
            let dateObj = dateString.includes('T') ? new Date(dateString) : new Date(dateString.split('-')[0], dateString.split('-')[1]-1, dateString.split('-')[2]);
            return dateObj.toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', { weekday: 'short', day: 'numeric', month: 'short' });
        };
        window.formatFullDate = (dateString, lang) => {
            if (!dateString) return '';
            let dateObj = dateString.includes('T') ? new Date(dateString) : new Date(dateString.split('-')[0], dateString.split('-')[1]-1, dateString.split('-')[2]);
            return dateObj.toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' });
        };
        window.getEpochFromWIB = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return 0;
            const [y, m, d] = dateStr.split('-').map(Number);
            const [hr, min] = timeStr.split(':').map(Number);
            return Date.UTC(y, m - 1, d, hr - appState.sysSettings.offsetWIB, min, 0); 
        };
        window.getDbTime = (timeStr, dateStr, tzCode) => {
            if (!timeStr || !dateStr) return { date: dateStr, time: timeStr };
            if (tzCode === 'WIB') return { date: dateStr, time: timeStr };
            const diffHours = appState.sysSettings.offsetWIB - appState.sysSettings[`offset${tzCode}`];
            const d = new Date(`${dateStr}T${timeStr}:00Z`);
            d.setUTCHours(d.getUTCHours() + diffHours); 
            const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), dy = String(d.getUTCDate()).padStart(2,'0');
            const h = String(d.getUTCHours()).padStart(2,'0'), mn = String(d.getUTCMinutes()).padStart(2,'0');
            return { date: `${y}-${m}-${dy}`, time: `${h}:${mn}` };
        };
        window.getDisplayTime = (timeStr, dateStr, tzCode) => {
            if (!timeStr || !dateStr) return { date: dateStr, time: timeStr, originalObj: new Date() };
            const epoch = getEpochFromWIB(dateStr, timeStr);
            const d = new Date(epoch + appState.sysSettings[`offset${tzCode}`] * 3600000);
            const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), dy = String(d.getUTCDate()).padStart(2,'0');
            const h = String(d.getUTCHours()).padStart(2,'0'), mn = String(d.getUTCMinutes()).padStart(2,'0');
            return { date: `${y}-${m}-${dy}`, time: `${h}:${mn}`, originalObj: new Date(epoch) };
        };
        window.getPSTDayFromEpoch = (epoch) => {
            const d = new Date(epoch + appState.sysSettings.offsetPST * 3600000); 
            const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), dy = String(d.getUTCDate()).padStart(2,'0');
            return `${y}-${m}-${dy}`;
        };
        window.getPSTDay = (dbDateStr, dbTimeStr) => {
            if (!dbDateStr || !dbTimeStr) return null;
            return getPSTDayFromEpoch(getEpochFromWIB(dbDateStr, dbTimeStr));
        };
        window.formatCurrency = (amount, lang) => {
            const num = parseFloat(amount) || 0;
            if (lang === 'id') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        };
        window.getUserName = (uid) => appState.users.find(u => String(u.id) === String(uid))?.name || TRANSLATIONS[appState.lang].common.unknown;
        window.getUserColor = (uid) => appState.users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';
        
        window.showToast = (msg, type = 'success', dur = 3000) => {
            const cont = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `fixed top-4 right-4 left-4 md:left-auto z-[100] p-4 rounded-xl shadow-2xl text-white flex justify-between items-center animate-slide-up border-2 ${type === 'error' ? 'bg-red-600 border-red-700' : 'bg-green-600 border-green-700'}`;
            t.innerHTML = `<div class="flex items-center gap-3"><i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg"></i><span class="text-sm font-bold tracking-wide drop-shadow-md">${msg}</span></div><button onclick="this.parentElement.remove()" class="p-1 hover:bg-white/20 rounded transition-colors ml-4"><i class="fas fa-times opacity-90 hover:opacity-100"></i></button>`;
            cont.appendChild(t);
            if(dur) setTimeout(() => { if(t.parentElement) t.remove() }, dur);
        };

        // --- 4. ACTION CONTROLLERS ---
        window.actions = {
            confirm: (msg, actionFn) => updateState({ modals: { ...appState.modals, confirm: { show: true, msg, action: actionFn } } }),
            executeConfirm: () => { if(appState.modals.confirm.action) appState.modals.confirm.action(); updateState({ modals: { ...appState.modals, confirm: { show: false, msg: '', action: null } }}); },
            cancelConfirm: () => updateState({ modals: { ...appState.modals, confirm: { show: false, msg: '', action: null } } }),
            logout: () => { updateState({ currentUser: null }); showToast(TRANSLATIONS[appState.lang].auth.logoutSuccess); },
            handleUserChange: (val) => {
                if(!val) return updateState({ currentUser: null });
                const u = appState.users.find(x => String(x.id) === String(val));
                if(!u) return;
                updateState({ modals: { ...appState.modals, password: { show: true, mode: u.password ? 'login' : 'create', userId: val } }, tempForms: { ...appState.tempForms, password: '' } });
            },
            submitPassword: async () => {
                const pass = appState.tempForms.password;
                const t = TRANSLATIONS[appState.lang];
                if(!pass) return showToast(t.common.requiredField, "error");
                const { mode, userId } = appState.modals.password;
                const targetId = userId || appState.currentUser;
                const user = appState.users.find(u => String(u.id) === String(targetId));
                updateState({ loading: true });
                try {
                    const hashed = await hashPassword(pass);
                    if (mode === 'create') {
                        await window.fs.updateDoc(window.fs.doc(window.db, 'users', targetId), { password: hashed });
                        updateState({ currentUser: targetId, loading: false, modals: { ...appState.modals, password: { show: false, mode: '', userId: null } } });
                        showToast(t.auth.successCreate);
                    } else if (mode === 'login') {
                        if (user && (user.password === pass || user.password === hashed)) {
                            if(user.password === pass) await window.fs.updateDoc(window.fs.doc(window.db, 'users', targetId), { password: hashed });
                            updateState({ currentUser: targetId, loading: false, modals: { ...appState.modals, password: { show: false, mode: '', userId: null } } });
                            showToast(t.auth.successLogin);
                        } else {
                            updateState({ loading: false }); showToast(t.auth.errorPass, "error");
                        }
                    } else if (mode === 'change') {
                        if (user && (user.password === pass || user.password === hashed)) { updateState({ loading: false }); return showToast(t.auth.errorSame, "error"); }
                        updateState({ loading: false, modals: { ...appState.modals, password: { show: false } } });
                        actions.confirm(t.auth.confirmChange, async () => {
                            updateState({ loading: true });
                            try { await window.fs.updateDoc(window.fs.doc(window.db, 'users', appState.currentUser), { password: hashed }); showToast(t.auth.successChange); } 
                            catch(e) { showToast(t.common.error, "error"); } finally { updateState({ loading: false }); }
                        });
                    }
                } catch(e) { updateState({ loading: false }); showToast(t.common.error, "error"); }
            },
            openProfile: () => {
                if(!appState.currentUser) return;
                const u = appState.users.find(x => String(x.id) === String(appState.currentUser));

                    let exEndE = getEpochFromWIB(s.endDate || s.date, s.endTime);
                    if (!s.endDate && exEndE <= exStartE) exEndE += 86400000;

                    return false;

                            <div><label class="block text-xs font-semibold text-slate-500 uppercase mb-1">${t.admin.color}</label><input type="color" class="w-full h-10 p-1 border rounded-lg cursor-pointer" value="${uf.color}" oninput="appState.tempForms.user.color = this.value" /></div>
                            <div class="flex items-center gap-2 mt-2 p-2 bg-slate-50 rounded-lg border border-slate-100"><input type="checkbox" id="hideUser" ${uf.hidden ? 'checked' : ''} onchange="appState.tempForms.user.hidden = this.checked" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer" /><label for="hideUser" class="text-sm text-slate-700 font-medium cursor-pointer flex-1">${t.admin.hideUser} <span class="${uf.hidden ? "text-red-500 text-xs ml-1" : "text-green-500 text-xs ml-1"}">(${uf.hidden ? t.admin.inactive : t.admin.active})</span></label></div>
                            <div class="flex gap-2 mt-6"><button type="button" onclick="updateState({ modals: {...appState.modals, user: false} })" class="flex-1 py-2.5 text-slate-500 font-bold text-sm hover:bg-slate-100 rounded-xl transition-colors">${t.common.cancel}</button><button type="submit" ${appState.loading ? 'disabled' : ''} class="flex-1 py-2.5 bg-purple-600 text-white font-bold text-sm rounded-xl hover:bg-purple-700 shadow-md transition-colors active:scale-95 disabled:opacity-50">${appState.loading ? '<i class="fas fa-circle-notch fa-spin text-white"></i>' : t.common.save}</button></div>
                        </form>
                    </div>
                </div>`;
            }

            // Header HTML
            const headerHtml = `
                <header class="bg-white sticky top-0 z-20 shadow-sm border-b border-slate-100">
                    <div class="px-4 pt-3 pb-2 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md"><i class="fas fa-layer-group text-sm"></i></div>
                            <div><h1 class="font-bold text-lg text-slate-800 leading-tight tracking-tight">Scheduler</h1><p class="text-[10px] text-slate-400 font-medium tracking-wide flex items-center">REMOTE WORK</p></div>
                        </div>
                        <div class="relative group flex items-center gap-2">
                            ${appState.currentUser ? `<button onclick="actions.logout()" title="${t.common.logout}" class="text-slate-400 hover:text-red-500 transition p-1.5 rounded-full hover:bg-red-50"><i class="fas fa-sign-out-alt"></i></button>` : ''}
                            <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-full pl-1 pr-3 py-1 shadow-sm group-hover:border-blue-300 transition-all cursor-pointer">
                                <div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold shadow-sm" style="background-color: ${activeUser ? activeUser.color : '#94a3b8'}">${activeUser ? activeUser.name.substring(0,1) : '<i class="fas fa-user"></i>'}</div>
                                <span class="text-xs font-semibold text-slate-600 max-w-[80px] truncate">${activeUser ? activeUser.name : t.timesheet.selectUser}</span>
                                <i class="fas fa-chevron-down text-[10px] text-slate-400"></i>
                                <select class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="actions.handleUserChange(this.value)">
                                    <option value="" disabled ${!appState.currentUser ? 'selected' : ''}>${t.timesheet.selectUser}</option>
                                    ${appState.users.filter(u => !u.hidden).map(u => `<option value="${u.id}" ${appState.currentUser === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="px-4 pb-3 flex flex-col gap-2">
                         <div class="flex gap-2 mt-1">
                             <button onclick="actions.setLang()" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition-all active:scale-95"><div class="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center text-[8px] font-bold text-slate-600">${appState.lang === 'id' ? 'ID' : 'EN'}</div><span class="text-[10px] font-semibold text-slate-600">${appState.lang === 'id' ? 'Bahasa Indonesia' : 'English'}</span></button>
                             <div class="relative flex-1">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none"><i class="far fa-clock text-slate-400 text-xs"></i></div>
                                <select class="appearance-none w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg pl-8 pr-8 py-1.5 text-[10px] font-semibold text-slate-600 outline-none focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer" onchange="updateState({timezone: this.value})">
                                    ${Object.keys(TZ_CONFIG).map(k => `<option value="${k}" ${appState.timezone === k ? 'selected' : ''}>${TZ_CONFIG[k].label}</option>`).join('')}
                                </select>
                                <div class="absolute inset-y-0 right-0 flex items-center px-2.5 pointer-events-none"><i class="fas fa-chevron-down text-[10px] text-slate-400"></i></div>
                             </div>
                             <div class="flex items-center justify-center bg-slate-50 border border-slate-200 px-2 rounded-lg cursor-help relative group">
                                <i class="fas fa-info-circle text-slate-300 group-hover:text-blue-500 transition-colors text-[12px] drop-shadow-sm"></i>
                                <span class="absolute bottom-full right-0 mb-2 w-48 p-2.5 bg-slate-800/95 backdrop-blur-sm text-white text-[10px] rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all shadow-xl text-center pointer-events-none border border-slate-700 leading-snug z-50">${t.tooltips.tzInfo}<span class="absolute top-full right-1.5 border-4 border-transparent border-t-slate-800/95"></span></span>
                             </div>
                         </div>
                    </div>
                    <div class="bg-amber-50 border-y border-amber-100 px-4 py-2 flex items-center gap-2"><i class="fas fa-exclamation-circle text-amber-500 text-xs flex-shrink-0"></i><p class="text-[10px] text-amber-700 font-medium leading-tight">${t.common.reminder}</p></div>
                </header>`;

            // Render Views Logics
            let contentHtml = '';
            if (appState.loading && !appState.users.length) {
                contentHtml = `<div class="flex flex-col items-center justify-center h-64 text-slate-400"><i class="fas fa-circle-notch fa-spin text-4xl mb-3"></i><p>${t.common.loading}</p></div>`;
            } else {
                if (appState.view === 'dashboard') contentHtml = renderDashboard(t);
                else if (appState.view === 'schedule') contentHtml = renderSchedule(t);
                else if (appState.view === 'timesheet') contentHtml = renderTimesheet(t);
                else if (appState.view === 'analytics') contentHtml = renderAnalytics(t);
                else if (appState.view === 'admin' && isAdmin) contentHtml = renderAdmin(t);
            }

            // Nav HTML
            const navHtml = `
            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 z-30 max-w-md mx-auto">
                <div class="grid ${isAdmin ? 'grid-cols-5' : 'grid-cols-4'} gap-1 px-2">
                    <button onclick="updateState({view: 'dashboard'})" class="flex flex-col items-center p-2 rounded-xl transition ${appState.view === 'dashboard' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}"><i class="fas fa-home text-lg mb-1"></i><span class="text-[10px] font-medium">${t.nav.home}</span></button>
                    <button onclick="updateState({view: 'schedule'})" class="flex flex-col items-center p-2 rounded-xl transition ${appState.view === 'schedule' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}"><i class="fas fa-calendar-alt text-lg mb-1"></i><span class="text-[10px] font-medium">${t.nav.schedule}</span></button>
                    <button onclick="updateState({view: 'timesheet'})" class="flex flex-col items-center p-2 rounded-xl transition ${appState.view === 'timesheet' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}"><i class="fas fa-file-invoice-dollar text-lg mb-1"></i><span class="text-[10px] font-medium">${t.nav.timesheet}</span></button>
                    <button onclick="updateState({view: 'analytics'})" class="flex flex-col items-center p-2 rounded-xl transition ${appState.view === 'analytics' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}"><i class="fas fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-medium">${t.nav.analytics}</span></button>
                    ${isAdmin ? `<button onclick="updateState({view: 'admin'})" class="flex flex-col items-center p-2 rounded-xl transition ${appState.view === 'admin' ? 'text-purple-600 bg-purple-50' : 'text-slate-400 hover:bg-slate-50'}"><i class="fas fa-user-shield text-lg mb-1"></i><span class="text-[10px] font-medium">${t.nav.admin}</span></button>` : ''}
                </div>
            </nav>
            <div id="toast-container"></div>`;

            root.innerHTML = `
                <div class="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
                    ${modalsHtml}
                    ${headerHtml}
                    <main class="flex-1 p-4 pb-24">${contentHtml}</main>
                    ${navHtml}
                </div>
            `;
        };

        // --- SUB RENDERERS ---
        function renderDashboard(t) {
            const myPending = appState.timesheets.filter(ts => String(ts.userId) === String(appState.currentUser) && ts.status === 'pending');
            const estEarned = (myPending.reduce((acc, ts) => acc + (parseInt(ts.duration) || 0), 0) / 60) * RATES[appState.lang];
            let periodText = t.dashboard.noSchedule;
            if (myPending.length > 0) {
                const sortedDates = myPending.map(ts => new Date(ts.date)).sort((a,b) => a-b);
                const startM = sortedDates[0].toLocaleString(appState.lang === 'id' ? 'id-ID' : 'en-US', { month: 'short' });
                const endM = sortedDates[sortedDates.length - 1].toLocaleString(appState.lang === 'id' ? 'id-ID' : 'en-US', { month: 'short' });
                periodText = `${sortedDates[0].getDate()} ${startM} - ${sortedDates[sortedDates.length - 1].getDate()} ${endM}`;
            }
            const currentEpoch = Date.now();
            const upcomingSchedules = appState.schedules.filter(s => {
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= getEpochFromWIB(s.startDate || s.date, s.startTime)) endEpoch += 86400000; 
                return endEpoch > currentEpoch;
            }).sort((a,b) => getEpochFromWIB(a.startDate || a.date, a.startTime) - getEpochFromWIB(b.startDate || b.date, b.startTime)).slice(0, 5);
            const currentTzDate = new Date(currentEpoch + TZ_CONFIG[appState.timezone].offsetUTC * 3600000);
            const hourStrDash = String(currentTzDate.getUTCHours()).padStart(2, '0');
            const minStrDash = String(currentTzDate.getUTCMinutes()).padStart(2, '0');
            const currentTimeDisplay = `${hourStrDash}:${minStrDash}`;
            const activeWorkers = appState.schedules.filter(s => {
                const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                return currentEpoch >= startEpoch && currentEpoch <= endEpoch;
            }).map(s => {
                const u = appState.users.find(x => String(x.id) === String(s.userId));
                return { name: u?.name || t.common.unknown, endTime: s.endTime, endDate: s.endDate || s.date, color: u?.color, hidden: u?.hidden };
            }).filter(u => !u.hidden);

            return `
            <div class="space-y-4 animate-slide-up">
                <div class="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden hover:shadow-xl transition-all">
                    <div class="relative z-10 flex justify-between items-start">
                        <div><h2 class="text-xl font-bold flex items-center gap-2">${t.dashboard.hello}, ${appState.currentUser ? getUserName(appState.currentUser) : t.dashboard.team}!</h2><p class="text-blue-200 text-xs mt-0.5">Remote Work Scheduler</p></div>
                        <button onclick="actions.openProfile()" title="${t.tooltips.settings}" class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition backdrop-blur-sm"><i class="fas fa-cog text-white text-sm"></i></button>
                    </div>
                    <div class="relative z-10 mt-6 bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-1.5 mb-1"><p class="text-[10px] text-blue-200 uppercase tracking-widest">${t.dashboard.estEarned}</p></div>
                            <p class="text-2xl font-bold">${formatCurrency(estEarned, appState.lang)}</p>
                            <p class="text-[10px] text-blue-100 mt-1 flex items-center gap-1"><i class="far fa-clock"></i> ${periodText}</p>
                        </div>
                        <div class="text-right">
                            <span class="block text-2xl font-bold">${(myPending.reduce((acc, ts) => acc + (parseInt(ts.duration) || 0), 0)/60).toFixed(1)}</span><span class="text-xs text-blue-200">${t.dashboard.hours}</span>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-green-100 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3"><h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide flex items-center gap-2"><span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>${t.dashboard.workingNow}</h3><span class="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">${currentTimeDisplay} ${TZ_CONFIG[appState.timezone].label}</span></div>
                    ${activeWorkers.length > 0 ? `
                        <div class="flex flex-wrap gap-2">
                            ${activeWorkers.map((w) => `
                                <div class="bg-slate-50 border border-slate-200 rounded-full px-3 py-1 flex items-center gap-2 animate-fade-in"><div class="w-2 h-2 rounded-full" style="background-color: ${w.color}"></div><span class="text-sm font-bold text-slate-700">${w.name}</span><span class="text-xs text-slate-400">${t.dashboard.until} ${getDisplayTime(w.endTime, w.endDate, appState.timezone).time}</span></div>
                            `).join('')}
                        </div>
                    ` : `<p class="text-sm text-slate-400 italic">${t.dashboard.noActive}</p>`}
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                    <h3 class="font-bold text-slate-700 mb-4 flex items-center text-sm uppercase tracking-wide"><i class="fas fa-calendar-alt text-blue-500 mr-2"></i> ${t.dashboard.upcoming}</h3>
                    <div class="space-y-3">
                        ${upcomingSchedules.length > 0 ? upcomingSchedules.map((s, idx) => {
                            const startObj = getDisplayTime(s.startTime, s.startDate || s.date, appState.timezone); 
                            const endObj = getDisplayTime(s.endTime, s.endDate || s.startDate || s.date, appState.timezone);
                            return `
                                <div class="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100 hover:bg-slate-100 transition-colors animate-slide-up" style="animation-delay: ${idx * 0.1}s">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" style="background-color: ${getUserColor(s.userId)}">${getUserName(s.userId).substring(0,2).toUpperCase()}</div>
                                    <div class="ml-3 flex-1">
                                        <div class="flex justify-between"><span class="font-bold text-slate-700 text-sm">${getUserName(s.userId)}</span><span class="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-500">${formatDate(startObj.date, appState.lang)}</span></div>
                                        <div class="text-xs text-slate-500 mt-1">${startObj.time} - ${endObj.time} <span class="text-[8px] bg-slate-200 px-1 rounded">${TZ_CONFIG[appState.timezone].label}</span></div>
                                    </div>
                                </div>
                            `;
                        }).join('') : `<p class="text-center text-slate-400 text-xs py-4">${t.dashboard.noSchedule}</p>`}
                    </div>
                </div>
            </div>`;
        }

        function renderSchedule(t) {
            const currentObj = new Date(Date.now() + TZ_CONFIG[appState.timezone].offsetUTC * 3600000);
            const sf = appState.scheduleForm;
            const displayDate = sf.startDate || `${currentObj.getUTCFullYear()}-${String(currentObj.getUTCMonth() + 1).padStart(2, '0')}-${String(currentObj.getUTCDate()).padStart(2, '0')}`;

            let targetPstDate = getPSTDayFromEpoch(Date.now());
            if (sf.startDate && sf.startTime) {
                const dbT = getDbTime(sf.startTime, sf.startDate, appState.timezone);
                targetPstDate = getPSTDay(dbT.date, dbT.time);
            }
            const [y, m, d] = targetPstDate.split('-').map(Number);
            const pstStartEpoch = Date.UTC(y, m - 1, d, Math.abs(TZ_CONFIG['PST'].offsetUTC), 0, 0); 
            const pstEndEpoch = pstStartEpoch + 86400000;
            const MAX_MINUTES = (appState.sysSettings.dailyQuotaHours || 10) * 60; 
            
            const dailyUsedMinutes = appState.schedules.filter(s => appState.editScheduleId !== s.id && getPSTDay(s.startDate || s.date, s.startTime) === targetPstDate).reduce((acc, s) => {
                const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                return acc + Math.floor((endEpoch - startEpoch)/60000);
            }, 0);

            const remainingMinutes = Math.max(0, MAX_MINUTES - dailyUsedMinutes);
            const usedPercentage = Math.min(100, (dailyUsedMinutes / MAX_MINUTES) * 100);
            const isCritical = remainingMinutes < 60;
            const isFormDirty = sf.startDate !== '' || sf.startTime !== '15:00' || sf.endDate !== '' || sf.endTime !== '16:00';

            let filteredSchedules = [...appState.schedules];
            if (!appState.schedHistory) {
                const currentEpoch = Date.now();
                filteredSchedules = filteredSchedules.filter(s => {
                    const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                    let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                    if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000; 
                    return endEpoch > currentEpoch;
                });
            }
            if (appState.schedFilterMine) filteredSchedules = filteredSchedules.filter(s => String(s.userId) === String(appState.currentUser));
            filteredSchedules.sort((a,b) => appState.schedSort === 'asc' 
                ? getEpochFromWIB(a.startDate || a.date, a.startTime) - getEpochFromWIB(b.startDate || b.date, b.startTime) 
                : getEpochFromWIB(b.startDate || b.date, b.startTime) - getEpochFromWIB(a.startDate || a.date, a.startTime));

            const daySchedules = appState.schedules.filter(s => {
                if (appState.editScheduleId && s.id === appState.editScheduleId) return false;
                const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                return (endEpoch > pstStartEpoch && startEpoch < pstEndEpoch);
            });

            let timelineBlocksHtml = '';
            daySchedules.forEach(s => {
                const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                const overlapStart = Math.max(startEpoch, pstStartEpoch);
                const overlapEnd = Math.min(endEpoch, pstEndEpoch);
                const startPct = ((overlapStart - pstStartEpoch) / 86400000) * 100;
                const widthPct = ((overlapEnd - overlapStart) / 86400000) * 100;
                const uiStart = getDisplayTime(s.startTime, s.startDate || s.date, appState.timezone);
                const uiEnd = getDisplayTime(s.endTime, s.endDate || s.date, appState.timezone);
                const color = getUserColor(s.userId);
                timelineBlocksHtml += `
                <div class="absolute h-full top-0 group cursor-pointer border-l-2 hover:z-30 transition-all duration-200 hover:-translate-y-1" style="left: ${startPct}%; width: ${widthPct}%; border-color: ${color}; background-color: ${color}15">
                    <div class="w-full h-1" style="background-color: ${color}"></div>
                    <div class="hidden group-hover:flex absolute ${startPct > 50 ? 'right-0' : 'left-0'} bottom-full mb-1 bg-slate-800 text-white text-[10px] p-2 rounded-lg whitespace-nowrap shadow-xl flex-col gap-1 z-50 border border-slate-700 animate-fade-in">
                        <div class="flex items-center gap-1.5 border-b border-slate-600 pb-1 mb-0.5"><div class="w-2 h-2 rounded-full" style="background-color: ${color}"></div><span class="font-bold">${getUserName(s.userId)}</span></div>
                        <span class="text-slate-300 font-mono"><i class="far fa-clock"></i> ${uiStart.time} - ${uiEnd.time} <span class="text-[7px] text-slate-400">(${TZ_CONFIG[appState.timezone].label})</span></span>
                    </div>
                </div>`;
            });

            let previewBlockHtml = '';
            if (sf.startDate && sf.startTime && sf.endTime) {
                 const dbStart = getDbTime(sf.startTime, sf.startDate, appState.timezone);
                 const dbEnd = getDbTime(sf.endTime, sf.endDate || sf.startDate, appState.timezone);
                 const fStartEpoch = getEpochFromWIB(dbStart.date, dbStart.time);
                 let fEndEpoch = getEpochFromWIB(dbEnd.date, dbEnd.time);
                 if (fEndEpoch <= fStartEpoch) fEndEpoch += 86400000;
                 if (fEndEpoch > pstStartEpoch && fStartEpoch < pstEndEpoch) {
                     const overlapStart = Math.max(fStartEpoch, pstStartEpoch);
                     const overlapEnd = Math.min(fEndEpoch, pstEndEpoch);
                     const startPct = ((overlapStart - pstStartEpoch) / 86400000) * 100;
                     const widthPct = ((overlapEnd - overlapStart) / 86400000) * 100;
                     previewBlockHtml = `<div class="absolute h-full top-0 border-x-2 border-indigo-600 border-dashed z-20 pointer-events-none transition-all duration-300 flex items-center justify-center overflow-hidden" style="left: ${startPct}%; width: ${widthPct}%; background-color: rgba(79, 70, 229, 0.05)"><div class="bg-indigo-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow-sm opacity-80">${t.common.new}</div></div>`;
                 }
            }

            return `
            <div class="space-y-4 animate-slide-up">
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 ${appState.editScheduleId ? 'border-orange-500' : 'border-blue-500'}">
                    <div class="flex flex-col gap-3 mb-5 border-b border-slate-100 pb-4">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800 text-lg flex items-center">${appState.editScheduleId ? t.schedule.edit : t.schedule.booking}</h3>
                            <div class="flex items-center gap-2">
                                ${appState.editScheduleId ? `<button type="button" title="${t.common.cancel}" onclick="updateState({editScheduleId: null, scheduleForm: {startDate:'', startTime:'15:00', endDate:'', endTime:'16:00'}})" class="text-[10px] font-bold text-red-500 bg-red-50 border border-red-100 px-2.5 py-1 rounded-lg hover:bg-red-100 transition shadow-sm uppercase flex items-center gap-1.5"><i class="fas fa-times"></i> ${t.common.cancel}</button>`

                        <div class="rounded-xl p-3 border transition-all duration-300 ${isCritical ? 'bg-red-50 border-red-100' : 'bg-slate-50 border-slate-200'}">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-1.5">
                                    <i class="fas fa-bolt text-xs ${isCritical ? 'text-red-500' : 'text-amber-500'}"></i><span class="text-[10px] font-bold uppercase tracking-wide flex items-center gap-1.5 ${isCritical ? 'text-red-600' : 'text-slate-600'}">${t.schedule.teamQuota}<span class="bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded font-mono text-[8px] normal-case tracking-normal border border-slate-300/50 shadow-sm">${formatDate(targetPstDate, appState.lang)} PST</span></span>
                                </div>
                                <div class="text-[10px] font-medium text-slate-500">${t.schedule.used}: <span class="font-bold text-slate-700">${(dailyUsedMinutes/60).toFixed(1)}${t.common.unitShort}</span> / <span class="font-bold text-slate-700">${appState.sysSettings.dailyQuotaHours || 10}${t.common.unitShort}</span></div>
                            </div>
                            <div class="w-full bg-slate-200/60 rounded-full h-1.5 overflow-hidden"><div class="h-1.5 rounded-full transition-all duration-700 ease-out ${isCritical ? 'bg-red-500' : 'bg-blue-500'}" style="width: ${usedPercentage}%"></div></div>
                            <div class="mt-1.5 text-right"><span class="text-[9px] font-bold uppercase ${isCritical ? 'text-red-500' : 'text-blue-600'}">${t.schedule.remaining}: ${(remainingMinutes/60).toFixed(1)}${t.common.unitShort}</span></div>
                        </div>
                    </div>

                    <div class="mt-4 mb-6">
                        <div class="flex justify-between items-center mb-3"><h4 class="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1.5"><i class="fas fa-chart-gantt text-indigo-500 text-sm"></i> ${t.schedule.visualTitle} (${formatDate(targetPstDate, appState.lang)} PST)</h4></div>
                        <div class="relative w-full h-20 bg-white border border-slate-200 rounded-lg overflow-visible shadow-sm mt-2">
                            <div class="absolute top-0 left-0 right-0 h-4 border-b border-slate-100 flex justify-between bg-slate-50 rounded-t-lg z-0">
                                ${[0, 4, 8, 12, 16, 20, 24].map(h => `<div class="h-full flex flex-col justify-center relative opacity-60 w-0"><span class="text-[7px] text-slate-500 font-bold absolute ${h === 0 ? 'left-1' : h === 24 ? 'right-1' : 'left-1/2 transform -translate-x-1/2'}">${String(h).padStart(2, '0')}:00</span></div>`).join('')}
                            </div>
                            <div class="absolute inset-y-4 left-0 right-0 flex justify-between pointer-events-none z-0">
                                ${[0, 4, 8, 12, 16, 20, 24].map(h => `<div class="h-full border-l border-slate-200 border-dashed w-0"></div>`).join('')}

                                ${timelineBlocksHtml}
                                ${previewBlockHtml}
                            </div>
                        </div>
                    </div>

                    <form onsubmit="event.preventDefault(); actions.saveSchedule()" class="space-y-3" novalidate>
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-1.5"><i class="fas fa-play-circle text-blue-500 text-sm"></i> ${t.common.start} <span class="font-medium text-slate-400 normal-case ml-1">(${TZ_CONFIG[appState.timezone].label})</span></label>
                            <div class="grid grid-cols-2 gap-3">
                                <div><input type="date" required title="${t.common.selectDate}" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value="${sf.startDate}" onchange="appState.scheduleForm.startDate = this.value; if(!appState.scheduleForm.endDate) appState.scheduleForm.endDate = this.value; renderApp()" /></div>
                                <div><input type="time" required title="${t.common.selectTime}" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value="${sf.startTime}" onchange="appState.scheduleForm.startTime = this.value; renderApp()" /></div>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-1.5"><i class="fas fa-stop-circle text-red-500 text-sm"></i> ${t.common.end} <span class="font-medium text-slate-400 normal-case ml-1">(${TZ_CONFIG[appState.timezone].label})</span></label>
                            <div class="grid grid-cols-2 gap-3">
                                <div><input type="date" required title="${t.common.selectDate}" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value="${sf.endDate}" onchange="appState.scheduleForm.endDate = this.value; renderApp()" /></div>
                                <div><input type="time" required title="${t.common.selectTime}" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value="${sf.endTime}" onchange="appState.scheduleForm.endTime = this.value; renderApp()" /></div>
                            </div>
                        </div>
                        <button type="submit" ${appState.loading || (remainingMinutes <= 0 && !appState.editScheduleId) ? 'disabled' : ''} class="w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${appState.editScheduleId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-blue-600 hover:bg-blue-700'}">${appState.loading ? '<i class="fas fa-circle-notch fa-spin text-white"></i>' : (appState.editScheduleId ? t.common.save : (remainingMinutes <= 0 ? t.schedule.full : t.schedule.booking))}</button>
                    </form>
                </div>
                
                <div class="space-y-3 pb-20">
                    <div class="flex flex-col gap-2 mb-3 bg-white p-3 rounded-xl border border-slate-100">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-700 text-xs uppercase tracking-wide">${appState.schedHistory ? t.schedule.allSchedules : t.schedule.upcomingSchedules}</h3>
                            <div class="flex gap-1"><button onclick="updateState({schedSort: appState.schedSort === 'asc' ? 'desc' : 'asc'})" title="${t.tooltips.sortToggle}" class="p-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition"><i class="fas fa-sort-amount-${appState.schedSort === 'asc' ? 'down-alt' : 'up'} text-xs"></i></button></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="updateState({schedHistory: !appState.schedHistory, schedSort: !appState.schedHistory ? 'desc' : 'asc'})" class="flex-1 text-[10px] py-1.5 rounded border transition font-medium ${appState.schedHistory ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}">${appState.schedHistory ? t.schedule.showUpcoming : t.schedule.showAll}</button>
                            <button onclick="updateState({schedFilterMine: !appState.schedFilterMine})" class="flex-1 text-[10px] py-1.5 rounded border transition font-medium ${appState.schedFilterMine ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}">${appState.schedFilterMine ? t.schedule.onlyMe : t.schedule.allUsers}</button>
                        </div>
                    </div>
                    ${filteredSchedules.map(s => {
                        const isMine = String(s.userId) === String(appState.currentUser);
                        const startObj = getDisplayTime(s.startTime, s.startDate || s.date, appState.timezone);
                        const endObj = getDisplayTime(s.endTime, s.endDate || s.date, appState.timezone);
                        return `
                            <div class="p-4 rounded-xl border flex justify-between items-center ${isMine ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'} hover:shadow-md transition-shadow">
                                <div class="flex items-center gap-3">
                                    <div class="w-2 h-10 rounded-full" style="background-color: ${getUserColor(s.userId)}"></div>
                                    <div>
                                        <div class="flex items-center gap-2"><span class="font-bold text-slate-700 text-sm">${getUserName(s.userId)}</span>${isMine ? `<span class="text-[10px] bg-blue-100 text-blue-600 px-1.5 rounded font-bold">${t.common.you}</span>` : ''}</div>
                                        <div class="text-xs text-slate-500 mt-1">${formatDate(startObj.date, appState.lang)} • ${startObj.time} - ${endObj.time} <span class="text-[8px] bg-slate-200 px-1 rounded">${TZ_CONFIG[appState.timezone].label}</span></div>
                                    </div>
                                </div>
                                ${isMine ? `
                                    <div class="flex gap-2">
                                        <button onclick="actions.editSchedule(${JSON.stringify(s).replace(/"/g, '&quot;')})" title="${t.common.edit}" class="w-8 h-8 rounded-full bg-white border border-blue-100 text-blue-500 hover:bg-blue-50 flex items-center justify-center transition"><i class="fas fa-pen text-xs"></i></button>
                                        <button onclick="actions.deleteSchedule('${s.id}')" title="${t.common.delete}" class="w-8 h-8 rounded-full bg-white border border-red-100 text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i class="fas fa-trash text-xs"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderTimesheet(t) {
            const hasPaymentInfo = window.appState.users.find(u => String(u.id) === String(appState.currentUser))?.bankName;
            if (!appState.currentUser) return `
                <div class="space-y-4 fade-in">
                    <div class="bg-blue-50 border-l-4 border-blue-400 p-8 rounded-xl shadow-sm text-center">
                        <div class="flex flex-col items-center gap-3 mb-3"><div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center"><i class="fas fa-user-lock text-blue-500 text-2xl"></i></div><h3 class="font-bold text-blue-800 text-lg">${t.timesheet.accessRestricted}</h3></div>
                        <p class="text-sm text-blue-600 mb-6 max-w-xs mx-auto">${t.timesheet.selectUser}</p>
                    </div>
                </div>`;
            if (!hasPaymentInfo) return `
                <div class="space-y-4 fade-in">
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-xl shadow-sm">
                        <div class="flex items-center gap-3 mb-2"><i class="fas fa-exclamation-triangle text-yellow-500 text-xl"></i><h3 class="font-bold text-yellow-700">${t.timesheet.payInfo}</h3></div>
                        <button onclick="actions.openProfile()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition shadow-md active:scale-95">${t.timesheet.fillPayInfo}</button>
                    </div>
                </div>`;

            const tf = appState.timesheetForm;
            let targetPstDate = getPSTDayFromEpoch(Date.now());
            if (tf.date && tf.startTime) {
                const dbT = getDbTime(tf.startTime, tf.date, appState.timezone);
                targetPstDate = getPSTDay(dbT.date, dbT.time);
            }
            const [y, m, d] = targetPstDate.split('-').map(Number);
            const pstStartEpoch = Date.UTC(y, m - 1, d, Math.abs(TZ_CONFIG['PST'].offsetUTC), 0, 0); 
            const pstEndEpoch = pstStartEpoch + 86400000;
            const MAX_MINUTES = (appState.sysSettings.dailyQuotaHours || 10) * 60; 

            let dailyActualMinutes = 0;
            let timelineBlocksHtml = '';

            const dayTimesheets = appState.timesheets.filter(ts => {
                if (appState.editTimesheetId && ts.id === appState.editTimesheetId) return false;
                const tsStartEpoch = getEpochFromWIB(ts.date, ts.startTime);
                let tsEndEpoch = tsStartEpoch;
                if (ts.endTime) { tsEndEpoch = getEpochFromWIB(ts.endDate || ts.date, ts.endTime); if (tsEndEpoch <= tsStartEpoch) tsEndEpoch += 86400000; } 
                else if (ts.duration) { tsEndEpoch = tsStartEpoch + (ts.duration * 60000); }
                return (tsEndEpoch > pstStartEpoch && tsStartEpoch < pstEndEpoch);
            });

            dayTimesheets.forEach(ts => {
                const tsStartEpoch = getEpochFromWIB(ts.date, ts.startTime);
                let tsEndEpoch = tsStartEpoch;
                if (ts.endTime) { tsEndEpoch = getEpochFromWIB(ts.endDate || ts.date, ts.endTime); if (tsEndEpoch <= tsStartEpoch) tsEndEpoch += 86400000; } 
                else if (ts.duration) { tsEndEpoch = tsStartEpoch + (ts.duration * 60000); }
                const overlapStart = Math.max(tsStartEpoch, pstStartEpoch);
                const overlapEnd = Math.min(tsEndEpoch, pstEndEpoch);
                dailyActualMinutes += (overlapEnd - overlapStart) / 60000;
                const startPct = ((overlapStart - pstStartEpoch) / 86400000) * 100;
                const widthPct = ((overlapEnd - overlapStart) / 86400000) * 100;
                const uiStart = getDisplayTime(ts.startTime, ts.date, appState.timezone);
                let uiEnd;
                if (ts.endTime) uiEnd = getDisplayTime(ts.endTime, ts.endDate || ts.date, appState.timezone);
                else { const dObj = new Date(tsEndEpoch + TZ_CONFIG[appState.timezone].offsetUTC * 3600000); uiEnd = { time: `${String(dObj.getUTCHours()).padStart(2, '0')}:${String(dObj.getUTCMinutes()).padStart(2, '0')}` }; }
                const color = getUserColor(ts.userId);
                timelineBlocksHtml += `
                <div class="absolute h-full top-0 group cursor-pointer border-l-2 hover:z-30 transition-all duration-200 hover:-translate-y-1" style="left: ${startPct}%; width: ${widthPct}%; border-color: ${color}; background-color: ${color}15">
                    <div class="w-full h-1" style="background-color: ${color}"></div>
                    <div class="hidden group-hover:flex absolute ${startPct > 50 ? 'right-0' : 'left-0'} bottom-full mb-1 bg-slate-800 text-white text-[10px] p-2 rounded-lg whitespace-nowrap shadow-xl flex-col gap-1 z-50 border border-slate-700 animate-fade-in">
                        <div class="flex items-center gap-1.5 border-b border-slate-600 pb-1 mb-0.5"><div class="w-2 h-2 rounded-full" style="background-color: ${color}"></div><span class="font-bold">${getUserName(ts.userId)}</span></div>
                        <span class="text-slate-300 font-mono"><i class="far fa-clock"></i> ${uiStart.time} - ${uiEnd.time} <span class="text-[7px] text-slate-400">(${TZ_CONFIG[appState.timezone].label})</span></span>
                    </div>
                </div>`;
            });

            const remainingMinutes = Math.max(0, MAX_MINUTES - dailyActualMinutes);
            const usedPercentage = Math.min(100, (dailyActualMinutes / MAX_MINUTES) * 100);
            const isCritical = remainingMinutes < 60;
            let previewBlockHtml = '';
            let currentDur = 0;
            
            if (tf.date && tf.startTime && tf.endTime) {
                const dbStart = getDbTime(tf.startTime, tf.date, appState.timezone);
                const dbEnd = getDbTime(tf.endTime, tf.endDate || tf.date, appState.timezone);
                const fStartEpoch = getEpochFromWIB(dbStart.date, dbStart.time);
                let fEndEpoch = getEpochFromWIB(dbEnd.date, dbEnd.time);
                if (fEndEpoch <= fStartEpoch) fEndEpoch += 86400000;
                currentDur = Math.max(0, Math.round((fEndEpoch - fStartEpoch) / 60000));
                if (fEndEpoch > pstStartEpoch && fStartEpoch < pstEndEpoch) {
                    const overlapStart = Math.max(fStartEpoch, pstStartEpoch);
                    const overlapEnd = Math.min(fEndEpoch, pstEndEpoch);
                    const startPct = ((overlapStart - pstStartEpoch) / 86400000) * 100;
                    const widthPct = ((overlapEnd - overlapStart) / 86400000) * 100;
                    previewBlockHtml = `<div class="absolute h-full top-0 border-x-2 border-emerald-600 border-dashed z-20 pointer-events-none transition-all duration-300 flex items-center justify-center overflow-hidden" style="left: ${startPct}%; width: ${widthPct}%; background-color: rgba(16, 185, 129, 0.05)"><div class="bg-emerald-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow-sm opacity-80">${t.common.new}</div></div>`;
                }
            } else if (tf.date && tf.startTime) {
                const dbStart = getDbTime(tf.startTime, tf.date, appState.timezone);
                const fStartEpoch = getEpochFromWIB(dbStart.date, dbStart.time);
                const fEndEpoch = Date.now();
                if (fEndEpoch > fStartEpoch) currentDur = Math.max(0, Math.round((fEndEpoch - fStartEpoch) / 60000));
            }

            const isFormDirty = tf.scheduleId !== '' || tf.date !== '' || tf.startTime !== '' || tf.endDate !== '' || tf.endTime !== '';
            let filteredTimesheetsList = appState.timesheets.filter(ts => appState.tsHistory ? ts.status === 'paid' : ts.status === 'pending').sort((a,b) => { const timeA = `${a.date}T${a.startTime}`; const timeB = `${b.date}T${b.startTime}`; return timeB.localeCompare(timeA); });

            const schedOptions = appState.schedules.filter(s => {
                if (String(s.userId) !== String(appState.currentUser)) return false;
                const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                let usedTs = appState.timesheets.find(ts => String(ts.userId) === String(appState.currentUser) && ts.scheduleId && String(ts.scheduleId) === String(s.id));
                if (!usedTs) {
                    const sPstDay = getPSTDay(s.startDate || s.date, s.startTime);
                    const isDayPaid = appState.timesheets.some(ts => String(ts.userId) === String(appState.currentUser) && ts.status === 'paid' && getPSTDay(ts.date, ts.startTime) === sPstDay);
                    if (isDayPaid) return false;
                    usedTs = appState.timesheets.find(ts => {
                        if (String(ts.userId) !== String(appState.currentUser) || (ts.scheduleId && String(ts.scheduleId) !== String(s.id))) return false; 
                        const tsStartEpoch = getEpochFromWIB(ts.date, ts.startTime);
                        let tsEndEpoch = tsStartEpoch;
                        if (ts.endTime) { tsEndEpoch = getEpochFromWIB(ts.endDate || ts.date, ts.endTime); if (tsEndEpoch <= tsStartEpoch) tsEndEpoch += 86400000; } else if (ts.duration) { tsEndEpoch = tsStartEpoch + (ts.duration * 60000); }
                        return (tsStartEpoch <= endEpoch && tsEndEpoch >= startEpoch) || Math.abs(tsStartEpoch - startEpoch) <= 10800000;
                    });
                }
                if (usedTs) return appState.editTimesheetId === usedTs.id;
                if (endEpoch < Date.now() - (30 * 86400000)) return false;
                return true;
            }).sort((a,b) => getEpochFromWIB(b.startDate || b.date, b.startTime) - getEpochFromWIB(a.startDate || a.date, a.startTime)).slice(0, 15).map(s => {
                const sTime = getDisplayTime(s.startTime, s.startDate || s.date, appState.timezone);
                const eTime = getDisplayTime(s.endTime, s.endDate || s.date, appState.timezone);
                return `<option value="${s.id}" ${tf.scheduleId === s.id ? 'selected' : ''}>${formatDate(sTime.date, appState.lang)} • ${sTime.time} - ${eTime.time}</option>`;
            }).join('');

            return `
            <div class="space-y-4 fade-in">
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 ${appState.editTimesheetId ? 'border-orange-500' : 'border-green-500'}">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="font-bold text-slate-700 flex items-center">${appState.editTimesheetId ? t.timesheet.editTitle : t.timesheet.title}</h3>
                        <div class="flex items-center gap-2">
                            ${appState.editTimesheetId ? `<button type="button" title="${t.common.cancel}" onclick="updateState({editTimesheetId: null, timesheetForm: {scheduleId:'', date:'', startTime:'', endDate:'', endTime:''}})" class="text-[10px] font-bold text-red-500 bg-red-50 border border-red-100 px-2.5 py-1 rounded-lg hover:bg-red-100 transition shadow-sm uppercase flex items-center gap-1.5"><i class="fas fa-times"></i> ${t.common.cancel}</button>` 
                            : isFormDirty ? `<button type="button" title="${t.common.clear}" onclick="updateState({timesheetForm: {scheduleId:'', date:'', startTime:'', endDate:'', endTime:''}})" class="text-[10px] font-bold text-slate-500 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg hover:bg-slate-100 transition shadow-sm uppercase flex items-center gap-1.5"><i class="fas fa-undo"></i> ${t.common.clear}</button>` : ''}
                        </div>
                    </div>
                    <div class="rounded-xl p-3 border transition-all duration-300 mb-6 ${isCritical ? 'bg-red-50 border-red-100' : 'bg-slate-50 border-slate-200'}">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-1.5">
                                <i class="fas fa-bolt text-xs ${isCritical ? 'text-red-500' : 'text-emerald-500'}"></i>
                                <span class="text-[10px] font-bold uppercase tracking-wide flex items-center gap-1.5 ${isCritical ? 'text-red-600' : 'text-slate-600'}">${t.timesheet.actualQuota}<span class="bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded font-mono text-[8px] normal-case tracking-normal border border-slate-300/50 shadow-sm">${formatDate(targetPstDate, appState.lang)} PST</span></span>
                            </div>
                            <div class="text-[10px] font-medium text-slate-500">${t.schedule.used}: <span class="font-bold text-slate-700">${(dailyActualMinutes/60).toFixed(1)}${t.common.unitShort}</span> / <span class="font-bold text-slate-700">${appState.sysSettings.dailyQuotaHours || 10}${t.common.unitShort}</span></div>
                        </div>
                        <div class="w-full bg-slate-200/60 rounded-full h-1.5 overflow-hidden"><div class="h-1.5 rounded-full transition-all duration-700 ease-out ${isCritical ? 'bg-red-500' : 'bg-emerald-500'}" style="width: ${usedPercentage}%"></div></div>
                        <div class="mt-1.5 text-right"><span class="text-[9px] font-bold uppercase ${isCritical ? 'text-red-500' : 'text-emerald-600'}">${t.schedule.remaining}: ${(remainingMinutes/60).toFixed(1)}${t.common.unitShort}</span></div>
                    </div>
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3"><h4 class="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1.5"><i class="fas fa-layer-group text-emerald-500 text-sm"></i> ${t.timesheet.visualTitleAct} (${formatDate(targetPstDate, appState.lang)} PST)</h4></div>
                        <div class="relative w-full h-20 bg-white border border-slate-200 rounded-lg overflow-visible shadow-sm mt-2">
                            <div class="absolute top-0 left-0 right-0 h-4 border-b border-slate-100 flex justify-between bg-slate-50 rounded-t-lg z-0">
                                ${[0, 4, 8, 12, 16, 20, 24].map(h => `<div class="h-full flex flex-col justify-center relative opacity-60 w-0"><span class="text-[7px] text-slate-500 font-bold absolute ${h === 0 ? 'left-1' : h === 24 ? 'right-1' : 'left-1/2 transform -translate-x-1/2'}">${String(h).padStart(2, '0')}:00</span></div>`).join('')}
                            </div>

                                    <input type="time" required title="${t.common.selectTime}" class="w-2/5 p-2.5 bg-white border border-slate-200 rounded-lg text-xs font-medium outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-all text-slate-700" value="${tf.startTime}" onchange="appState.timesheetForm.startTime = this.value; renderApp()" />

        function renderAnalytics(t) {
            if (!appState.currentUser) return `<div class="space-y-4 fade-in"><div class="bg-blue-50 border-l-4 border-blue-400 p-8 rounded-xl shadow-sm text-center"><div class="flex flex-col items-center gap-3 mb-3"><div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center"><i class="fas fa-user-lock text-blue-500 text-2xl"></i></div><h3 class="font-bold text-blue-800 text-lg">${t.timesheet.accessRestricted}</h3></div><p class="text-sm text-blue-600 mb-6 max-w-xs mx-auto">${t.timesheet.selectUser}</p></div></div>`;
            
            const rate = RATES[appState.lang];
            const totalMinutesTeam = appState.timesheets.reduce((acc, ts) => acc + parseInt(ts.duration || 0), 0);
            const totalEarnedTeam = (totalMinutesTeam / 60) * rate;
            const userStats = {};
            appState.timesheets.forEach(ts => { if(!userStats[ts.userId]) userStats[ts.userId] = { minutes: 0 }; userStats[ts.userId].minutes += parseInt(ts.duration || 0); });
            const leaderboard = Object.keys(userStats).map(uid => ({ uid, ...userStats[uid], name: getUserName(uid), color: getUserColor(uid) })).sort((a,b) => b.minutes - a.minutes).slice(0, 5); 

            const dates = [];
            const currentPSTDayStr = getPSTDayFromEpoch(Date.now());
            const [y, m, d] = currentPSTDayStr.split('-').map(Number);
            for(let i=0; i<7; i++) {
                const tempD = new Date(Date.UTC(y, m - 1, d - i));
                const yy = tempD.getUTCFullYear(); const mm = String(tempD.getUTCMonth()+1).padStart(2,'0'); const dd = String(tempD.getUTCDate()).padStart(2,'0');
                dates.push(`${yy}-${mm}-${dd}`);
            }
            const rangeDays = dates;
            
            const my7DaysSheets = appState.timesheets.filter(ts => String(ts.userId) === String(appState.currentUser) && rangeDays.includes(getPSTDay(ts.date, ts.startTime)));
            const my7DaysMinutes = my7DaysSheets.reduce((acc, ts) => acc + parseInt(ts.duration || 0), 0);
            const my7DaysEarnings = (my7DaysMinutes / 60) * rate;
            const myPendingSheets = appState.timesheets.filter(ts => String(ts.userId) === String(appState.currentUser) && ts.status === 'pending');
            const myPendingMinutes = myPendingSheets.reduce((acc, ts) => acc + parseInt(ts.duration || 0), 0);
            const myPendingEarnings = (myPendingMinutes / 60) * RATES[appState.lang];
            const myPaidSheets = appState.timesheets.filter(ts => String(ts.userId) === String(appState.currentUser) && ts.status === 'paid');
            const grandTotalPaid = myPaidSheets.reduce((acc, ts) => acc + (parseInt(ts.duration || 0)/60) * RATES[appState.lang], 0);
            const grandTotalMins = myPaidSheets.reduce((acc, ts) => acc + parseInt(ts.duration || 0), 0);

            const paidGroups = {};
            myPaidSheets.forEach(ts => {
                const dateKey = ts.paidAt ? ts.paidAt.split('T')[0] : 'Unknown';
                if(!paidGroups[dateKey]) paidGroups[dateKey] = { totalMinutes: 0, dates: [] };
                paidGroups[dateKey].totalMinutes += parseInt(ts.duration || 0);
                paidGroups[dateKey].dates.push(getPSTDay(ts.date, ts.startTime) || ts.date);
            });
            const sortedPaidHistory = Object.keys(paidGroups).sort((a,b) => new Date(b) - new Date(a));

            const disciplineData = rangeDays.map(pstDateStr => {
                const dailySchedules = appState.schedules.filter(s => String(s.userId) === String(appState.currentUser) && getPSTDay(s.startDate || s.date, s.startTime) === pstDateStr).map(s => {
                    const startConv = getDisplayTime(s.startTime, s.startDate || s.date, appState.timezone);
                    const endConv = getDisplayTime(s.endTime, s.endDate || s.date, appState.timezone);
                    const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                    let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                    if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                    return { id: s.id, start: startConv.time, end: endConv.time, origStart: startConv.originalObj, planMins: (endEpoch - startEpoch) / 60000, actualMins: 0, matched: [] };
                });
                
                const dailySheets = appState.timesheets.filter(ts => String(ts.userId) === String(appState.currentUser) && getPSTDay(ts.date, ts.startTime) === pstDateStr);
                const unplanned = [];
                
                dailySheets.forEach(ts => {
                    const tConv = getDisplayTime(ts.startTime, ts.date, appState.timezone);
                    let bestMatch = ts.scheduleId ? dailySchedules.find(s => s.id === ts.scheduleId) : null;
                    if (!bestMatch) {
                        let minDiff = Infinity;
                        dailySchedules.forEach(s => { let diff = Math.abs((s.origStart - tConv.originalObj) / 60000); if (diff < 180 && diff < minDiff) { minDiff = diff; bestMatch = s; } });
                    }
                    if (bestMatch) { bestMatch.actualMins += parseInt(ts.duration || 0); bestMatch.matched.push(ts); } else { unplanned.push({ ...ts, displayTime: tConv.time }); }
                });
                return { date: pstDateStr, schedules: dailySchedules, unplanned };
            });

            const dailyActivityTeam = rangeDays.map(dateStr => ({ 
                date: dateStr, minutes: appState.timesheets.reduce((acc, ts) => getPSTDay(ts.date, ts.startTime) === dateStr ? acc + parseInt(ts.duration || 0) : acc, 0) 
            }));
            const maxDailyMins = Math.max(...dailyActivityTeam.map(d => d.minutes), 60);
            const totalActivityHours = dailyActivityTeam.reduce((acc, d) => acc + d.minutes, 0) / 60;

            return `
            <div class="space-y-4 animate-slide-up pb-24">
                <div class="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 items-center">

                    </div>
                </div>

                ${appState.analyticsTab === 'personal' ? `
                    <div class="space-y-4 animate-fadeIn">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white p-4 rounded-xl border-l-4 border-blue-500 shadow-sm hover:scale-[1.02] transition-transform"><h3 class="text-[10px] text-slate-400 uppercase font-bold mb-1">${t.analytics.myStats}</h3><p class="text-2xl font-bold text-slate-700">${(my7DaysMinutes/60).toFixed(1)} <span class="text-sm font-normal text-slate-400">${t.common.unitShort}</span></p><p class="text-xs text-blue-600 font-medium mt-1">${formatCurrency(my7DaysEarnings, appState.lang)}</p></div>
                            <div class="bg-white p-4 rounded-xl border-l-4 border-orange-400 shadow-sm hover:scale-[1.02] transition-transform"><h3 class="text-[10px] text-slate-400 uppercase font-bold mb-1">${t.analytics.pendingStats}</h3><p class="text-xl font-bold text-orange-600 mt-1">${formatCurrency(myPendingEarnings, appState.lang)}</p><p class="text-[10px] text-slate-400 mt-1">${(myPendingMinutes/60).toFixed(1)} ${t.common.unitHour} ${t.analytics.totalUnpaid}</p></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                            <div class="mb-4"><div class="flex justify-between items-center mb-1"><div class="flex items-center gap-1.5"><h3 class="font-bold text-slate-700"><i class="fas fa-chart-bar text-blue-500 mr-1.5"></i>${t.analytics.discipline}</h3></div></div><p class="text-[9px] text-slate-400 italic">${t.analytics.legendTip}</p></div>
                            <div class="space-y-6">
                                ${disciplineData.map((d, idx) => {
                                    if (d.schedules.length === 0 && d.unplanned.length === 0) return ''; 
                                    return `
                                        <div class="border-l-2 border-slate-200 pl-3 animate-slide-up" style="animation-delay: ${idx * 0.1}s">
                                            <p class="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">${formatDate(d.date, appState.lang)} (${t.common.pst})</p>
                                            <div class="space-y-3">
                                                ${d.schedules.map(s => {
                                                    const diff = s.actualMins - s.planMins;
                                                    let status = diff < -15 ? t.analytics.statusUnder : diff > 30 ? t.analytics.statusOver : s.actualMins === 0 ? t.analytics.statusMissed : t.analytics.statusOnTrack;
                                                    let statusColor = diff < -15 ? "bg-yellow-100 text-yellow-700" : diff > 30 ? "bg-red-100 text-red-700" : s.actualMins === 0 ? "bg-slate-100 text-slate-500" : "bg-green-100 text-green-700";
                                                    let barColor = diff < -15 ? "bg-yellow-500" : diff > 30 ? "bg-red-500" : s.actualMins === 0 ? "bg-slate-300" : "bg-green-500";
                                                    const barWidth = `${Math.min(100, (s.actualMins / s.planMins) * 100 || 0)}%`;
                                                    return `<div class="relative group"><div class="flex justify-between items-center text-xs mb-1"><span class="font-medium text-slate-700">${s.start} - ${s.end} <span class="text-[10px] text-slate-400">(${(s.planMins/60).toFixed(1)}${t.common.unitShort})</span></span><span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${statusColor} transition-transform group-hover:scale-110">${status}</span></div><div class="h-1.5 bg-slate-100 rounded-full overflow-hidden w-full relative"><div class="h-full rounded-full ${barColor}" style="width: ${barWidth}"></div></div>${s.actualMins > 0 ? `<p class="text-[9px] text-right text-slate-400 mt-0.5">${t.analytics.labelAct}: ${(s.actualMins/60).toFixed(1)}${t.common.unitShort}</p>` : ''}</div>`;
                                                }).join('')}
                                                ${d.unplanned.length > 0 ? `<div class="mt-2"><div class="flex justify-between items-center text-xs mb-1"><span class="font-medium text-indigo-600 italic">${t.analytics.statusUnplanned}</span><span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-indigo-100 text-indigo-700">${t.analytics.tagAdhoc}</span></div>${d.unplanned.map(u => `<div class="flex justify-between text-[10px] text-slate-500 pl-2 border-l-2 border-indigo-200 mb-1"><span>${u.displayTime}</span><span>${u.duration}${t.common.unitMin}</span></div>`).join('')}</div>` : ''}
                                            </div>
                                        </div>`;
                                }).join('')}
                            </div>
                        </div>
                        <div class="bg-white p-0 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden hover:shadow-lg transition-shadow">
                            <div class="relative bg-gradient-to-br from-emerald-500 to-teal-700 p-6 text-white text-center shadow-inner">
                                <p class="text-[10px] font-bold uppercase tracking-widest text-emerald-200 mb-1 relative z-10">${t.analytics.totalPaid}</p>
                                <div class="flex items-center justify-center gap-3 relative z-10"><p class="text-4xl font-black tracking-tighter drop-shadow-md">${formatCurrency(grandTotalPaid, appState.lang)}</p></div>
                                <div class="mt-2 flex items-center justify-center gap-2 relative z-10"><div class="inline-flex items-center justify-center gap-1 bg-black/15 backdrop-blur-md px-2 py-0.5 rounded text-emerald-100 border border-white/10"><i class="far fa-clock text-[9px]"></i><span class="text-[10px] font-bold">${(grandTotalMins / 60).toFixed(1)}${t.common.unitShort}</span></div><span class="text-[10px] text-emerald-100/80 font-medium tracking-wide">&bull; ${t.analytics.lifetime}</span></div>
