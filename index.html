        const DashboardView = ({ currentUser, getUserName, timesheets, schedules, users, getUserColor, onEditProfile, setView, t, formatCurrency, lang, timezone }) => {
            const myPending = timesheets.filter(ts => String(ts.userId) === String(currentUser) && ts.status === 'pending');
            const estEarned = (myPending.reduce((acc, ts) => acc + (parseInt(ts.duration) || 0), 0) / 60) * RATES[lang];
            
            let periodText = t.dashboard.noSchedule;
            if (myPending.length > 0) {
                const sortedDates = myPending.map(ts => new Date(ts.date)).sort((a,b) => a-b);
                periodText = `${sortedDates[0].getDate()} ${sortedDates[0].toLocaleString(lang === 'id' ? 'id-ID' : 'en-US', { month: 'short' })} - ${sortedDates[sortedDates.length - 1].getDate()} ${sortedDates[sortedDates.length - 1].toLocaleString(lang === 'id' ? 'id-ID' : 'en-US', { month: 'short' })}`;
            }
            
            const currentEpoch = Date.now();
            const upcomingSchedules = schedules.filter(s => {
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= getEpochFromWIB(s.startDate || s.date, s.startTime)) endEpoch += 86400000; 
                return endEpoch > currentEpoch;
            }).sort((a,b) => getEpochFromWIB(a.startDate || a.date, a.startTime) - getEpochFromWIB(b.startDate || b.date, b.startTime)).slice(0, 5);
            
            const currentTzDate = new Date(currentEpoch + TZ_CONFIG[timezone].offsetUTC * 3600000);
            
            const hourStrDash = String(currentTzDate.getUTCHours()).padStart(2, '0');
            const minStrDash = String(currentTzDate.getUTCMinutes()).padStart(2, '0');
            const currentTimeDisplay = `${hourStrDash}:${minStrDash}`;
            
            const activeWorkers = schedules.filter(s => {
                const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                return currentEpoch >= startEpoch && currentEpoch <= endEpoch;
            }).map(s => {
                const u = users.find(x => String(x.id) === String(s.userId));
                return { name: u?.name || t.common.unknown, endTime: s.endTime, endDate: s.endDate || s.date, color: u?.color, hidden: u?.hidden };
            }).filter(u => !u.hidden);

            return (
                <div className="space-y-4 animate-slide-up tab-content">

                            <button onClick={onEditProfile} title={t.tooltips.settings} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition backdrop-blur-sm">
                                <i className="fas fa-cog text-white text-sm"></i>
                            </button>
                        </div>
                        <div className="relative z-10 mt-6 bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 flex justify-between items-center">
                            <div>
                                <div className="flex items-center gap-1.5 mb-1">

                                </div>
                                <p className="text-2xl font-bold count-up">{formatCurrency(estEarned, lang)}</p>
                                <p className="text-[10px] text-blue-100 mt-1 flex items-center gap-1"><i className="far fa-clock"></i> {periodText}</p>
                            </div>
                            <div className="text-right">
                                <span className="block text-2xl font-bold count-up">{(myPending.reduce((acc, ts) => acc + (parseInt(ts.duration) || 0), 0)/60).toFixed(1)}</span>
                                <span className="text-xs text-blue-200">{t.dashboard.hours}</span>
                            </div>
                        </div>
                        <i className="fas fa-coins absolute -right-6 -bottom-8 text-9xl text-white opacity-5 animate-pulse-slow"></i>
                    </div>
                    
                    <div className="card p-4 border border-green-100 hover:shadow-md transition-shadow">
                        <div className="flex justify-between items-start mb-3">
                            <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide flex items-center gap-2">
                                <span className="relative flex h-3 w-3">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                                </span>
                                {t.dashboard.workingNow}
                            </h3>
                            <span className="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">{currentTimeDisplay} {TZ_CONFIG[timezone].label}</span>
                        </div>
                        {activeWorkers.length > 0 ? (
                            <div className="flex flex-wrap gap-2">
                                {activeWorkers.map((w, idx) => (
                                    <div key={idx} className="bg-slate-50 border border-slate-200 rounded-full px-3 py-1 flex items-center gap-2 animate-fade-in" style={{animationDelay:`${idx*0.06}s`}}>
                                        <div className="w-2 h-2 rounded-full" style={{backgroundColor: w.color}}></div>
                                        <span className="text-sm font-bold text-slate-700">{w.name}</span>
                                        <span className="text-xs text-slate-400">{t.dashboard.until} {getDisplayTime(w.endTime, w.endDate, timezone).time}</span>
                                    </div>
                                ))}

                        ) : ( 
                            <p className="text-sm text-slate-400 italic">{t.dashboard.noActive}</p> 
                        )}
                    </div>
                    
                     <div className="card p-5 border border-slate-100 hover:shadow-md transition-shadow">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center text-sm uppercase tracking-wide">
                            <i className="fas fa-calendar-alt text-blue-500 mr-2"></i> {t.dashboard.upcoming}
                        </h3>
                        <div className="space-y-3">
                            {upcomingSchedules.map((s, idx) => {
                                const startObj = getDisplayTime(s.startTime, s.startDate || s.date, timezone); 
                                const endObj = getDisplayTime(s.endTime, s.endDate || s.startDate || s.date, timezone);
                                return (
                                    <div key={s.id} className="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100 hover:bg-slate-100 transition-colors animate-slide-up" style={{animationDelay: `${idx * 0.1}s`}}>
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" style={{backgroundColor: getUserColor(s.userId)}}>
                                            {getUserName(s.userId).substring(0,2).toUpperCase()}
                                        </div>
                                        <div className="ml-3 flex-1">
                                            <div className="flex justify-between">
                                                <span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>
                                                <span className="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-500">{formatDate(startObj.date, lang)}</span>
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1">
                                                {startObj.time} - {endObj.time} <span className="text-[8px] bg-slate-200 px-1 rounded">{TZ_CONFIG[timezone].label}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                            {upcomingSchedules.length === 0 && <p className="text-center text-slate-400 text-xs py-4">{t.dashboard.noSchedule}</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const ScheduleManager = ({ editScheduleId, setEditScheduleId, scheduleForm, setScheduleForm, saveSchedule, loading, schedules, currentUser, getUserColor, getUserName, deleteSchedule, editSchedule, isAdmin, lang, t, timezone, sysSettings, showNotify }) => {
            const [showHistory, setShowHistory] = React.useState(false);
            const [filterMine, setFilterMine] = React.useState(false);
            const [sortOrder, setSortOrder] = React.useState('asc'); 
            
            const currentObj = new Date(Date.now() + TZ_CONFIG[timezone].offsetUTC * 3600000);
            const cy = currentObj.getUTCFullYear();
            const cm = String(currentObj.getUTCMonth() + 1).padStart(2, '0');
            const cd = String(currentObj.getUTCDate()).padStart(2, '0');
            const displayDate = scheduleForm.startDate || `${cy}-${cm}-${cd}`;

            const targetPstDate = React.useMemo(() => {
                if (scheduleForm.startDate && scheduleForm.startTime) {
                    return getPSTDayFromEpoch(getEpochFromWIB(getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone).date, getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone).time));
                }
                return getPSTDayFromEpoch(Date.now());
            }, [scheduleForm.startDate, scheduleForm.startTime, timezone]);

            const MAX_MINUTES = (sysSettings?.dailyQuotaHours || 10) * 60; 
            
            const dailyUsedMinutes = React.useMemo(() => {
                if (!targetPstDate) return 0;
                return schedules.filter(s => editScheduleId !== s.id && getPSTDay(s.startDate || s.date, s.startTime) === targetPstDate).reduce((acc, s) => {
                         const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                         let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                         if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                         return acc + Math.floor((endEpoch - startEpoch)/60000);
                    }, 0);
            }, [schedules, targetPstDate, editScheduleId]);

            const remainingMinutes = MAX_MINUTES - dailyUsedMinutes; // intentionally can be negative
            const remainingClamped = Math.max(0, remainingMinutes);
            const isOverQuota = dailyUsedMinutes > MAX_MINUTES;
            const overByMins = isOverQuota ? dailyUsedMinutes - MAX_MINUTES : 0;
            const usedPercentage = Math.min(100, (dailyUsedMinutes / MAX_MINUTES) * 100);
            const newScheduleDurationMins = React.useMemo(() => {
                if (!scheduleForm.startDate || !scheduleForm.startTime || !scheduleForm.endDate || !scheduleForm.endTime) return 0;
                const dbS = getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone);
                const dbE = getDbTime(scheduleForm.endTime, scheduleForm.endDate, timezone);
                return Math.max(0, Math.floor((getEpochFromWIB(dbE.date, dbE.time) - getEpochFromWIB(dbS.date, dbS.time)) / 60000));
            }, [scheduleForm, timezone]);
            const wouldExceedQuota = newScheduleDurationMins > 0 && (dailyUsedMinutes + newScheduleDurationMins > MAX_MINUTES);
            const isCritical = remainingMinutes < 60; // includes over-quota (negative)
            const isFormDirty = scheduleForm.startDate !== '' || scheduleForm.startTime !== '14:00' || scheduleForm.endDate !== '' || scheduleForm.endTime !== '15:00';

            const filteredSchedules = React.useMemo(() => {
                let filtered = [...schedules];
                if (!showHistory) {
                    const currentEpoch = Date.now();
                    filtered = filtered.filter(s => {
                        const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                        let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                        if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000; 
                        return endEpoch > currentEpoch;
                    });
                }
                if (filterMine) filtered = filtered.filter(s => String(s.userId) === String(currentUser));
                
                filtered.sort((a,b) => sortOrder === 'asc' 
                    ? getEpochFromWIB(a.startDate || a.date, a.startTime) - getEpochFromWIB(b.startDate || b.date, b.startTime) 
                    : getEpochFromWIB(b.startDate || b.date, b.startTime) - getEpochFromWIB(a.startDate || a.date, a.startTime));
                return filtered;
            }, [schedules, showHistory, filterMine, sortOrder, currentUser]);

            const timelineBlocks = [];
            schedules.forEach(s => {
                if (editScheduleId && s.id === editScheduleId) return; 
                
                const uiStart = getDisplayTime(s.startTime, s.startDate || s.date, timezone);
                const uiEnd = getDisplayTime(s.endTime, s.endDate || s.date, timezone);
                const startMins = parseInt(uiStart.time.split(':')[0]) * 60 + parseInt(uiStart.time.split(':')[1]);
                const endMins = parseInt(uiEnd.time.split(':')[0]) * 60 + parseInt(uiEnd.time.split(':')[1]);
                
                if (uiStart.date === displayDate && uiEnd.date === displayDate) { 
                    if(endMins - startMins > 0) timelineBlocks.push({...s, startPct: startMins/1440*100, widthPct: (endMins - startMins)/1440*100, uiStart, uiEnd}); 
                } else if (uiStart.date === displayDate && uiEnd.date > displayDate) { 
                    timelineBlocks.push({...s, startPct: startMins/1440*100, widthPct: (1440 - startMins)/1440*100, uiStart, uiEnd}); 
                } else if (uiEnd.date === displayDate && uiStart.date < displayDate) { 
                    timelineBlocks.push({...s, startPct: 0, widthPct: endMins/1440*100, uiStart, uiEnd}); 
                } else if (uiStart.date < displayDate && uiEnd.date > displayDate) { 
                    timelineBlocks.push({...s, startPct: 0, widthPct: 100, uiStart, uiEnd}); 
                }
            });

            let previewBlock = null;
            if (scheduleForm.startDate === displayDate && scheduleForm.startTime && scheduleForm.endTime) {
                 const sMins = parseInt(scheduleForm.startTime.split(':')[0]) * 60 + parseInt(scheduleForm.startTime.split(':')[1]);
                 let eMins = parseInt(scheduleForm.endTime.split(':')[0]) * 60 + parseInt(scheduleForm.endTime.split(':')[1]);
                 let pStart = sMins, pEnd = eMins;
                 if (scheduleForm.endDate > scheduleForm.startDate) pEnd = 1440; 
                 else if (eMins < sMins && !scheduleForm.endDate) pEnd = 1440; 
                 
                 const pWidth = (pEnd-pStart)/1440*100;
                 if (pEnd > pStart) previewBlock = { startPct: pStart/1440*100, widthPct: pWidth };
            }

            return (
                <div className="space-y-4 animate-slide-up tab-content">
                    <div className={`bg-white rounded-2xl shadow-sm overflow-hidden border-t-4 ${editScheduleId ? 'border-orange-400' : 'border-blue-500'}`}>
                        <div className="px-5 pt-4 pb-3 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                                <span className={`w-7 h-7 rounded-lg flex items-center justify-center ${editScheduleId ? 'bg-orange-100' : 'bg-blue-100'}`}>
                                    <i className={`fas ${editScheduleId ? 'fa-pen' : 'fa-calendar-plus'} text-xs ${editScheduleId ? 'text-orange-600' : 'text-blue-600'}`}></i>
                                </span>
                                {editScheduleId ? t.schedule.edit : t.schedule.booking}
                                <InfoTooltip text={t.tooltips.quotaInfo} />
                            </h3>
                            <div className="flex items-center gap-2">
                                {editScheduleId ? (
                                    <button type="button" title={t.common.cancel} onClick={() => {setEditScheduleId(null); setScheduleForm({startDate:'', startTime:'14:00', endDate: '', endTime:'15:00'})}} className="text-[10px] font-bold text-red-500 bg-red-50 border border-red-100 px-2.5 py-1 rounded-lg hover:bg-red-100 transition-all uppercase flex items-center gap-1.5">
                                        <i className="fas fa-times text-[9px]"></i> {t.common.cancel}
                                    </button>
                                ) : isFormDirty ? (
                                    <button type="button" title={t.common.clear} onClick={() => {setScheduleForm({startDate:'', startTime:'14:00', endDate: '', endTime:'15:00'})}} className="text-[10px] font-bold text-slate-500 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg hover:bg-slate-100 transition-all uppercase flex items-center gap-1.5">
                                        <i className="fas fa-undo text-[9px]"></i> {t.common.clear}
                                    </button>
                                ) : null}
                            </div>
                        </div>
                        <div className="p-5 space-y-4">
                            {/* ── DAILY TEAM QUOTA BAR ── */}
                            <div className={`rounded-xl overflow-hidden border transition-all duration-300 ${isOverQuota ? 'border-red-200' : isCritical ? 'border-orange-100' : 'border-slate-200'}`}>
                                {/* Over-quota alert banner — only shows when already exceeded */}
                                {isOverQuota && (
                                    <div className="bg-red-500 px-3 py-1.5 flex items-center gap-2">
                                        <i className="fas fa-exclamation-triangle text-white text-[10px] flex-shrink-0"></i>
                                        <span className="text-white text-[10px] font-bold flex-1">
                                            {lang==='id'
                                                ? `Kuota harian terlampaui +${(overByMins/60).toFixed(1)}${t.common.unitShort} — booking baru diblokir`
                                                : `Daily quota exceeded by +${(overByMins/60).toFixed(1)}${t.common.unitShort} — new bookings blocked`}
                                        </span>

        const ActualScheduleMap = ({ schedules, timesheets, users, getUserName, getUserColor, lang, t, timezone }) => {
            const [mapPstDate, setMapPstDate] = React.useState(() => getPSTDayFromEpoch(Date.now()));

            const shiftDay = (delta) => {
                const [y, m, d] = mapPstDate.split('-').map(Number);
                const dt = new Date(y, m - 1, d);
                dt.setDate(dt.getDate() + delta);
                setMapPstDate(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`);
            };

            const toMins = (timeStr) => {
                const [h, m] = (timeStr || '00:00').split(':').map(Number);
                return h * 60 + m;
            };

            // Previous PT day (for detecting cross-midnight overflow blocks)
            const prevPstDate = (() => {
                const [y,mo,d] = mapPstDate.split('-').map(Number);
                const dt = new Date(y,mo-1,d);
                dt.setDate(dt.getDate()-1);
                return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
            })();

            // Build plan blocks: (a) start on mapPstDate + (b) started prev day but overflow into mapPstDate
            const buildPlanB = (s) => ({
                ...s,
                uiS: getDisplayTime(s.startTime, s.startDate || s.date, 'PST'),
                uiE: getDisplayTime(s.endTime, s.endDate || s.date, 'PST'),
                isPlan: true
            });
            const planBlocksMain     = schedules.filter(s => getPSTDay(s.startDate || s.date, s.startTime) === mapPstDate).map(buildPlanB);
            const planBlocksOverflow = schedules.filter(s => getPSTDay(s.startDate || s.date, s.startTime) === prevPstDate)
                .map(buildPlanB).filter(b => b.uiE.date > b.uiS.date).map(b => ({...b, isOverflow: true}));
            const planBlocks = [...planBlocksMain, ...planBlocksOverflow];

            // Build actual blocks: same logic
            const buildActualB = (ts) => {
                const uiS = getDisplayTime(ts.startTime, ts.date, 'PST');
                let uiE;
                if (ts.endTime) {
                    uiE = getDisplayTime(ts.endTime, ts.endDate || ts.date, 'PST');
                } else if (ts.duration) {
                    const eEpoch = getEpochFromWIB(ts.date, ts.startTime) + ts.duration * 60000;
                    const eD = new Date(eEpoch + TZ_CONFIG['PST'].offsetUTC * 3600000);
                    uiE = { time: `${String(eD.getUTCHours()).padStart(2,'0')}:${String(eD.getUTCMinutes()).padStart(2,'0')}`, date: getPSTDayFromEpoch(eEpoch) };
                } else {
                    uiE = { time: '23:59', date: mapPstDate };
                }
                return { ...ts, uiS, uiE, isPlan: false };
            };
            const actualBlocksMain     = timesheets.filter(ts => getPSTDay(ts.date, ts.startTime) === mapPstDate).map(buildActualB);
            const actualBlocksOverflow = timesheets.filter(ts => getPSTDay(ts.date, ts.startTime) === prevPstDate)
                .map(buildActualB).filter(b => b.uiE.date > b.uiS.date).map(b => ({...b, isOverflow: true}));
            const actualBlocks = [...actualBlocksMain, ...actualBlocksOverflow];

            const totalActualMins = actualBlocks.reduce((acc, b) => {
                if (b.isOverflow) return acc + Math.max(0, toMins(b.uiE.time));
                const sM = toMins(b.uiS.time), eM0 = toMins(b.uiE.time);
                return acc + Math.max(0, (eM0 <= sM ? 1440 : eM0) - sM);
            }, 0);

            const isToday = mapPstDate === getPSTDayFromEpoch(Date.now());
            const userIds = [...new Set([...planBlocks, ...actualBlocks].map(b => b.userId))];
            const rowMap = {};
            userIds.forEach((uid, i) => { rowMap[uid] = i; });
            const mapHeight = Math.max(1, userIds.length) * 28 + 20;
            const uShort = t.common.unitShort;
            const fmtDur = (mins) => { const dh=Math.floor(mins/60),dm=mins%60; return dh>0?`${dh}${uShort}${dm>0?` ${dm}m`:''}`:dm+'m'; };

            const renderBlock = (b, idx) => {
                const rowOffset = rowMap[b.userId] || 0;
                let sM, eM;
                if (b.isOverflow) {
                    sM = 0;
                    eM = toMins(b.uiE.time);
                    if (eM <= 0) return null;
                } else {
                    sM = toMins(b.uiS.time);
                    eM = toMins(b.uiE.time);
                    if (eM < sM) eM = 1440; // cross-midnight: clip at end of this day
                    if (eM <= sM) return null;
                }
                const origSM = toMins(b.uiS.time), origEM = toMins(b.uiE.time);
                const totalDurMins = origEM < origSM ? 1440 - origSM + origEM : origEM - origSM;
                const startPct = sM / 1440 * 100;
                const widthPct = Math.max(0.5, (eM - sM) / 1440 * 100);
                const color = getUserColor(b.userId) || '#94a3b8';
                const name = getUserName(b.userId);
                const tipSide = startPct > 55 ? 'right-0' : 'left-0';
                const topPx = b.isPlan ? rowOffset * 28 + 2 : rowOffset * 28 + 15;
                const crossesNext = !b.isOverflow && eM === 1440 && origEM < origSM;
                return (
                    <div key={`${b.isPlan?'pl':'ac'}-${b.id}-${idx}`}
                        className="absolute group cursor-pointer hover:z-30"
                        style={{ left: `${startPct}%`, width: `${widthPct}%`, top: `${topPx}px`, height: '12px' }}>
                        {b.isPlan
                            ? <div className={`w-full h-full rounded-sm border-2 ${b.isOverflow?'opacity-60':''}`} style={{ borderColor: color, backgroundColor: `${color}20`, borderStyle: b.isOverflow?'dashed':'solid' }}></div>
                            : <div className={`w-full h-full rounded-sm shadow-sm ${b.isOverflow?'opacity-60':''}`} style={{ backgroundColor: color, opacity: b.isOverflow ? 0.5 : 0.85 }}></div>
                        }
                        <div className={`hidden group-hover:flex absolute bottom-full mb-1 ${tipSide} bg-slate-800 text-white text-[9px] p-1.5 rounded-lg shadow-xl z-50 whitespace-nowrap flex-col gap-0.5 border border-slate-700`}>
                            <span className="font-bold flex items-center gap-1.5 flex-wrap">
                                <div className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{backgroundColor:color}}></div>
                                {name}
                                {b.isOverflow && <span className="text-[8px] text-indigo-300 font-normal">{lang==='id'?'(lanjutan)':'(cont.)'}</span>}
                            </span>
                            <span className="text-slate-300 font-mono">
                                {b.uiS.time}–{b.uiE.time} PT
                                <span className="text-slate-400 ml-1">({fmtDur(totalDurMins)})</span>
                            </span>
                            {crossesNext && <span className="text-amber-400 text-[8px]">→ {lang==='id'?'berlanjut ke hari berikutnya':'continues to next day'}</span>}
                            {b.isOverflow && <span className="text-amber-400 text-[8px]">← {lang==='id'?'dimulai hari sebelumnya':'started previous day'}</span>}
                            {b.isPlan
                                ? <span className="text-slate-400 text-[8px] flex items-center gap-1"><i className="far fa-calendar"></i>{lang==='id'?'Dijadwalkan':'Scheduled'}</span>
                                : <span className="flex flex-col gap-0.5">
                                    <span className="text-sky-300 text-[8px] font-bold flex items-center gap-1"><i className="fas fa-check-square"></i>{lang==='id'?'Sudah dilaporkan':'Reported'}</span>
                                    <span className={`text-[8px] flex items-center gap-1 ${b.status==='paid'?'text-green-400':'text-orange-300'}`}>
                                        <i className={b.status==='paid'?'fas fa-circle-check':'fas fa-clock'}></i>
                                        {b.status==='paid' ? (lang==='id'?'Sudah dibayar':'Paid') : (lang==='id'?'Belum dibayar':'Unpaid')}
                                    </span>
                                  </span>
                            }
                        </div>
                    </div>
                );
            };

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-4">
                    <div className="bg-gradient-to-r from-teal-600 to-cyan-700 px-4 py-3">
                        <div className="flex items-center justify-between">
                            <div>
                                <h3 className="text-white font-bold text-sm flex items-center gap-2">
                                    <i className="fas fa-chart-gantt"></i>
                                    {lang === 'id' ? 'Peta Jadwal Harian' : 'Daily Schedule Map'}
                                </h3>
                                <p className="text-teal-200 text-[10px] mt-0.5">
                                    {lang === 'id' ? 'Atas = Jadwal · Bawah = Laporan' : 'Top = Scheduled · Bottom = Reported'}
                                </p>
                            </div>
                            <div className="flex items-center gap-1 bg-white/10 rounded-xl p-1">
                                <button onClick={() => shiftDay(-1)} className="w-7 h-7 flex items-center justify-center text-white hover:bg-white/20 rounded-lg transition text-xs"><i className="fas fa-chevron-left"></i></button>
                                <span className="text-white text-[10px] font-bold min-w-[72px] text-center">
                                    {isToday ? (lang==='id'?'Hari Ini':'Today') : (() => {
                                        const [y,m,d] = mapPstDate.split('-').map(Number);
                                        return new Date(y,m-1,d).toLocaleDateString(lang==='id'?'id-ID':'en-US',{day:'numeric',month:'short'});
                                    })()}
                                </span>
                                <button onClick={() => shiftDay(1)} className="w-7 h-7 flex items-center justify-center text-white hover:bg-white/20 rounded-lg transition text-xs"><i className="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        {/* PT timezone notice */}
                        <div className="mt-2 flex items-center gap-1.5 bg-white/10 rounded-lg px-2.5 py-1.5">
                            <i className="fas fa-clock text-teal-200 text-[9px]"></i>
                            <span className="text-teal-100 text-[9px] leading-snug">
                                {lang === 'id'
                                    ? 'Hari kerja dihitung berdasarkan PT (Pacific Time) — 00:00–23:59 PT — terlepas dari zona waktu tampilan yang dipilih.'
                                    : 'Work day boundaries use PT (Pacific Time) — 00:00–23:59 PT — regardless of the display timezone selected.'}
                            </span>
                        </div>
                    </div>

                    <div className="flex divide-x divide-slate-100 bg-slate-50 border-b border-slate-100">
                        <div className="flex-1 px-3 py-2 text-center">
                            <p className="text-[9px] font-bold text-slate-400 uppercase">{lang==='id'?'Rencana':'Planned'}</p>
                            <p className="text-sm font-black text-slate-700">{planBlocks.length}</p>
                        </div>
                        <div className="flex-1 px-3 py-2 text-center">
                            <p className="text-[9px] font-bold text-slate-400 uppercase">{lang==='id'?'Aktual':'Actual'}</p>
                            <p className="text-sm font-black text-teal-600">{actualBlocks.length}</p>
                        </div>
                        <div className="flex-1 px-3 py-2 text-center">
                            <p className="text-[9px] font-bold text-slate-400 uppercase">{lang==='id'?'Jam Aktual':'Actual Hrs'}</p>
                            <p className="text-sm font-black text-cyan-600">{(totalActualMins/60).toFixed(1)}{t.common.unitShort}</p>
                        </div>
                    </div>

                    <div className="p-3">
                        <div className="relative w-full h-4 mb-1 flex justify-between">
                            {[0,4,8,12,16,20,24].map(h => (
                                <div key={h} className="w-0 relative">
                                    <span className={`absolute text-[7px] text-slate-400 font-bold ${h===0?'left-0':h===24?'right-0':'-translate-x-1/2'}`}>{String(h).padStart(2,'0')}</span>
                                </div>
                            ))}
                        </div>
                        <div className="relative w-full bg-slate-50 border border-slate-200 rounded-lg overflow-visible" style={{height: `${mapHeight}px`}}>
                            {[0,4,8,12,16,20,24].map(h => (
                                <div key={h} className="absolute top-0 bottom-0 border-l border-slate-200 border-dashed w-0" style={{left:`${h/24*100}%`}}></div>
                            ))}
                            {userIds.map((uid, rowIdx) => (
                                <div key={uid} className="absolute left-0 flex items-center gap-1 z-20 pointer-events-none" style={{top:`${rowIdx*28+2}px`}}>
                                    <div className="w-1 h-5 rounded-r opacity-70" style={{backgroundColor: getUserColor(uid)||'#94a3b8'}}></div>
                                    <span className="text-[7px] font-bold text-slate-400">{(getUserName(uid)||'').substring(0,7)}</span>
                                </div>
                            ))}
                            {planBlocks.map((b, i) => renderBlock(b, i))}
                            {actualBlocks.map((b, i) => renderBlock(b, i))}
                            {isToday && (() => {
                                const nowPst = new Date(Date.now() + TZ_CONFIG['PST'].offsetUTC * 3600000);
                                const nowMins = nowPst.getUTCHours() * 60 + nowPst.getUTCMinutes();
                                const nowHHMM = `${String(nowPst.getUTCHours()).padStart(2,'0')}:${String(nowPst.getUTCMinutes()).padStart(2,'0')}`;
                                // Also show selected timezone time
                                const nowLocal = new Date(Date.now() + TZ_CONFIG[timezone].offsetUTC * 3600000);
                                const localHHMM = `${String(nowLocal.getUTCHours()).padStart(2,'0')}:${String(nowLocal.getUTCMinutes()).padStart(2,'0')}`;
                                const localTzShort = TZ_CONFIG[timezone].label.split(' ')[0];
                                const isSameTz = timezone === 'PST';
                                const leftPct = nowMins / 1440 * 100;
                                return (
                                    <>
                                        {/* The line itself */}
                                        <div className="absolute top-0 bottom-0 w-0.5 bg-red-400 z-20 pointer-events-none now-line" style={{left:`${leftPct}%`}}>
                                            <div className="absolute -top-1 w-2.5 h-2.5 rounded-full bg-red-400 now-dot" style={{left:'50%',transform:'translateX(-50%)'}}></div>
                                        </div>
                                        {/* Hover trigger + label — inside chart bounds */}
                                        <div className="absolute top-0 z-30 group" style={{left:`${leftPct}%`, width:'1px', height:'100%', cursor:'default'}}>
                                            <div className={`hidden group-hover:flex absolute top-0 ${leftPct > 75 ? 'right-0' : 'left-1'} bg-slate-900/95 backdrop-blur-sm text-white text-[9px] font-bold rounded-xl shadow-xl whitespace-nowrap flex-col overflow-hidden border border-white/10`}>
                                                {/* PT row */}
                                                <div className="flex items-center gap-1.5 px-2.5 py-1.5 border-b border-white/10">
                                                    <i className="fas fa-circle text-[5px] text-red-400"></i>
                                                    <span className="text-red-300 text-[8px] font-semibold">PT</span>
                                                    <span className="text-white font-mono">{nowHHMM}</span>
                                                    <span className="text-slate-400 text-[8px]">{lang==='id'?'Sekarang':'Now'}</span>
                                                </div>
                                                {/* Selected timezone row — only if different from PT */}
                                                {!isSameTz && (
                                                    <div className="flex items-center gap-1.5 px-2.5 py-1.5">
                                                        <i className="fas fa-circle text-[5px] text-cyan-400"></i>
                                                        <span className="text-cyan-300 text-[8px] font-semibold">{localTzShort}</span>
                                                        <span className="text-slate-200 font-mono">{localHHMM}</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </>
                                );
                            })()}
                            {planBlocks.length === 0 && actualBlocks.length === 0 && (
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <p className="text-[10px] text-slate-400 italic">{lang==='id'?'Tidak ada data untuk hari ini.':'No data for this day.'}</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ReportManager = ({ saveTimesheet, timesheetForm, setTimesheetForm, loading, timesheets, schedules, users, getUserName, getUserColor, currentUser, deleteTimesheet, editTimesheetId, setEditTimesheetId, editTimesheet, hasPaymentInfo, onOpenProfile, isAdmin, lang, t, formatCurrency, timezone, showNotify, sysSettings, onSelectAccount }) => {
            if (!currentUser) {
                return (
                    <div className="space-y-4 slide-up">
                        <button onClick={onSelectAccount}
                            className="w-full bg-gradient-to-br from-blue-50 to-indigo-50 border-2 border-dashed border-blue-200 hover:border-blue-400 hover:from-blue-100 hover:to-indigo-100 p-10 rounded-2xl text-center transition-all duration-200 active:scale-[0.98] group">
                            <div className="flex flex-col items-center gap-3">
                                <div className="w-16 h-16 bg-blue-100 group-hover:bg-blue-200 rounded-full flex items-center justify-center transition-colors">
                                    <i className="fas fa-user-lock text-blue-400 group-hover:text-blue-600 text-2xl transition-colors"></i>
                                </div>
                                <div>
                                    <h3 className="font-bold text-blue-800 text-lg">{t.timesheet.accessRestricted}</h3>
                                    <p className="text-sm text-blue-500 mt-1">{t.timesheet.selectUser}</p>
                                </div>
                                <span className="mt-1 flex items-center gap-2 text-[11px] font-bold text-blue-600 bg-blue-100 group-hover:bg-blue-200 px-3 py-1.5 rounded-full transition-colors">
                                    <i className="fas fa-arrow-up text-[9px]"></i>
                                    {lang === 'id' ? 'Ketuk tombol akun di kanan atas' : 'Tap the account button top-right'}
                                </span>
                            </div>
                        </button>
                    </div>
                );
            }

            if (!hasPaymentInfo) {
                return (
                    <div className="space-y-4 slide-up">
                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-xl shadow-sm">
                            <div className="flex items-center gap-3 mb-2">
                                <i className="fas fa-exclamation-triangle text-yellow-500 text-xl"></i>
                                <h3 className="font-bold text-yellow-700">{t.timesheet.payInfo}</h3>
                            </div>
                            <button onClick={onOpenProfile} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition shadow-md active:scale-95">
                                {t.timesheet.fillPayInfo}
                            </button>
                        </div>
                    </div>
                );
            }

            const [showHistory, setShowHistory] = React.useState(false); 
            const filteredTimesheets = timesheets
                .filter(t => showHistory ? t.status === 'paid' : t.status === 'pending')
                .sort((a,b) => {
                    const timeA = `${a.date}T${a.startTime}`;
                    const timeB = `${b.date}T${b.startTime}`;
                    return timeB.localeCompare(timeA); 
                });

            const getDisplayAmount = (item) => {
                const baseVal = parseFloat(item.paymentUSD) || 0;
                if (lang === 'id') return baseVal * (RATES.id / RATES.en);
                return baseVal;
            };

            const calculateDurationMins = () => {
                if (!timesheetForm.date || !timesheetForm.startTime || !timesheetForm.endTime) return 0;
                const startEpoch = getEpochFromWIB(timesheetForm.date, timesheetForm.startTime);
                let endEpoch = getEpochFromWIB(timesheetForm.endDate || timesheetForm.date, timesheetForm.endTime);
                if (endEpoch < startEpoch) endEpoch += 86400000;
                return Math.max(0, Math.round((endEpoch - startEpoch) / 60000));
            };
            
            const currentDur = calculateDurationMins();
            const [filterMine, setFilterMine] = React.useState(false);
            const isFormDirty = timesheetForm.scheduleId !== '' || timesheetForm.date !== '' || timesheetForm.startTime !== '' || timesheetForm.endDate !== '' || timesheetForm.endTime !== '';

            // Team actual quota bar data
            const todayPst = getPSTDayFromEpoch(Date.now());
            // teamScheduledMins: total scheduled hours for today (correct denominator for "unreported" %)
            const teamScheduledMins = schedules.reduce((acc, s) => {
                if (getPSTDay(s.startDate || s.date, s.startTime) !== todayPst) return acc;
                const sE = getEpochFromWIB(s.startDate || s.date, s.startTime);
                let eE = getEpochFromWIB(s.endDate || s.date, s.endTime);
                if (!s.endDate && eE <= sE) eE += 86400000;
                return acc + Math.floor((eE - sE) / 60000);
            }, 0);
            const teamQuotaMins = (sysSettings?.dailyQuotaHours || 10) * 60;
            const teamActualMins = timesheets.reduce((acc, ts) => getPSTDay(ts.date, ts.startTime) === todayPst ? acc + parseInt(ts.duration || 0) : acc, 0);
            // Compare actual vs scheduled (not quota) — this is the meaningful "reported vs planned" ratio
            const teamDenominator = teamScheduledMins > 0 ? teamScheduledMins : teamQuotaMins;
            const teamActualPct = Math.min(100, teamDenominator > 0 ? teamActualMins / teamDenominator * 100 : 0);
            const teamUnreportedMins = Math.max(0, teamScheduledMins - teamActualMins);
            const teamActualIsCritical = teamScheduledMins > 0 ? teamActualMins >= teamScheduledMins * 0.9 : teamActualMins >= teamQuotaMins * 0.9;

            return (
                <div className="space-y-4 slide-up">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editTimesheetId ? 'border-orange-500' : 'border-green-500'}`}>
                        <div className="flex justify-between items-start mb-4">
                            <h3 className="font-bold text-slate-700 flex items-center">
                                {editTimesheetId ? t.timesheet.editTitle : t.timesheet.title}
                                <InfoTooltip text={t.tooltips.reportInfo} />
                            </h3>
                            <div className="flex items-center gap-2">
                                {editTimesheetId ? (
                                    <button type="button" title={t.common.cancel} onClick={() => {setEditTimesheetId(null); setTimesheetForm({scheduleId:'', date:'', startTime:'', endDate:'', endTime:''})}} className="text-[10px] font-bold text-red-500 bg-red-50 border border-red-100 px-2.5 py-1 rounded-lg hover:bg-red-100 transition shadow-sm uppercase flex items-center gap-1.5">
                                        <i className="fas fa-times"></i> {t.common.cancel}
                                    </button>
                                ) : isFormDirty ? (
                                    <button type="button" title={t.common.clear} onClick={() => {setTimesheetForm({scheduleId:'', date:'', startTime:'', endDate:'', endTime:''})}} className="text-[10px] font-bold text-slate-500 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg hover:bg-slate-100 transition shadow-sm uppercase flex items-center gap-1.5">
                                        <i className="fas fa-undo"></i> {t.common.clear}
                                    </button>
                                ) : null}
                            </div>
                        </div>

                        {/* Team Daily Actual Quota bar — mirrors the style from Schedule tab */}
                        <div className={`rounded-xl p-3 border mb-4 transition-all duration-300 ${teamActualIsCritical ? 'bg-green-50 border-green-200' : 'bg-slate-50 border-slate-200'}`}>
                            <div className="flex justify-between items-center mb-2">
                                <div className="flex items-center gap-1.5">
                                    <i className={`fas fa-check-circle text-xs ${teamActualIsCritical ? 'text-green-600' : 'text-green-500'}`}></i>
                                    <span className={`text-[10px] font-bold uppercase tracking-wide flex items-center gap-1.5 ${teamActualIsCritical ? 'text-green-700' : 'text-slate-600'}`}>
                                        {lang === 'id' ? 'Aktual Tim Harian' : 'Daily Team Actual'}
                                        <span className="bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded font-mono text-[8px] normal-case tracking-normal border border-slate-300/50 shadow-sm">{formatDate(todayPst, lang)} PT</span>
                                    </span>
                                </div>
                                <div className="text-[10px] font-medium text-slate-500">
                                    {lang === 'id' ? 'Dilaporkan' : 'Reported'}: <span className="font-bold text-slate-700">{(teamActualMins/60).toFixed(1)}{t.common.unitShort}</span>
                                    {teamScheduledMins > 0 && <span> / <span className="font-bold text-slate-700">{(teamScheduledMins/60).toFixed(1)}{t.common.unitShort}</span> {lang==='id'?'dijadwalkan':'sched.'}</span>}
                                </div>
                            </div>
                            <div className="w-full bg-slate-200/60 rounded-full h-1.5 overflow-hidden">
                                <div className={`h-1.5 rounded-full transition-all duration-700 ease-out ${teamActualIsCritical ? 'bg-green-500' : 'bg-green-400'}`} style={{ width: `${teamActualPct}%` }}></div>
                            </div>
                            <div className="mt-1.5 text-right">
                                <span className={`text-[9px] font-bold uppercase ${teamActualIsCritical ? 'text-green-600' : 'text-slate-400'}`}>
                                    {teamActualPct >= 100
                                        ? (lang === 'id' ? '✓ Semua Jadwal Terlaporkan!' : '✓ All Schedules Reported!')
                                        : teamScheduledMins > 0
                                            ? `${(100 - teamActualPct).toFixed(0)}% ${lang === 'id' ? 'jadwal belum terlaporkan' : 'of schedules unreported'}`
                                            : (lang === 'id' ? 'Belum ada jadwal hari ini' : 'No schedules today')}
                                </span>
                            </div>
                        </div>
                        
                        <form onSubmit={(e) => saveTimesheet(e)} className="space-y-3" noValidate>
                            <div className="mb-3">
                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-1.5">
                                    <i className="fas fa-calendar-check text-blue-500 text-sm"></i> {t.timesheet.selectSchedule}
                                </label>
                                <div className="relative">
                                    <select 
                                        className="w-full pl-3 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all appearance-none cursor-pointer shadow-sm" 
                                        value={timesheetForm.scheduleId || ''} 
                                        onChange={e => { 
                                            const sid = e.target.value; 
                                            if (!sid) { 
                                                setTimesheetForm({...timesheetForm, scheduleId: '', date: '', startTime: '', endDate: '', endTime: ''}); 
                                                return; 
                                            } 
                                            const s = schedules.find(x => x.id === sid); 
                                            if (s) { 
                                                const uiStart = getDisplayTime(s.startTime, s.startDate || s.date, timezone); 
                                                const uiEnd = getDisplayTime(s.endTime, s.endDate || s.date, timezone); 
                                                setTimesheetForm({...timesheetForm, scheduleId: sid, date: uiStart.date, startTime: uiStart.time, endDate: uiEnd.date, endTime: uiEnd.time}); 
                                            } 
                                        }} 
                                        required
                                    >
                                        <option value="" disabled>-- {t.timesheet.selectSchedule} --</option>
                                        {schedules.filter(s => {
                                            if (String(s.userId) !== String(currentUser)) return false;
                                            const startEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                                            let endEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                                            if (!s.endDate && endEpoch <= startEpoch) endEpoch += 86400000;
                                            
                                            let usedTs = timesheets.find(ts => String(ts.userId) === String(currentUser) && ts.scheduleId && String(ts.scheduleId) === String(s.id));
                                            
                                            if (!usedTs) {
                                                const sPstDay = getPSTDay(s.startDate || s.date, s.startTime);
                                                const isDayPaid = timesheets.some(ts => String(ts.userId) === String(currentUser) && ts.status === 'paid' && getPSTDay(ts.date, ts.startTime) === sPstDay);
                                                if (isDayPaid) return false;
                                                usedTs = timesheets.find(ts => {
                                                    if (String(ts.userId) !== String(currentUser)) return false;
                                                    if (ts.scheduleId && String(ts.scheduleId) !== String(s.id)) return false; 
                                                    const tsStartEpoch = getEpochFromWIB(ts.date, ts.startTime);
                                                    let tsEndEpoch = tsStartEpoch;
                                                    if (ts.endTime) { 
                                                        tsEndEpoch = getEpochFromWIB(ts.endDate || ts.date, ts.endTime); 
                                                        if (tsEndEpoch <= tsStartEpoch) tsEndEpoch += 86400000; 
                                                    } else if (ts.duration) { 
                                                        tsEndEpoch = tsStartEpoch + (ts.duration * 60000); 
                                                    }
                                                    return (tsStartEpoch <= endEpoch && tsEndEpoch >= startEpoch) || Math.abs(tsStartEpoch - startEpoch) <= 10800000;
                                                });
                                            }
                                            
                                            if (usedTs) return editTimesheetId === usedTs.id;
                                            if (endEpoch < Date.now() - (30 * 86400000)) return false;
                                            return true;
                                        }).sort((a,b) => getEpochFromWIB(b.startDate || b.date, b.startTime) - getEpochFromWIB(a.startDate || a.date, a.startTime)).slice(0, 15).map(s => {
                                            const sTime = getDisplayTime(s.startTime, s.startDate || s.date, timezone);
                                            const eTime = getDisplayTime(s.endTime, s.endDate || s.date, timezone);
                                            return <option key={s.id} value={s.id}>{formatDate(sTime.date, lang)} • {sTime.time} - {eTime.time}</option>;
                                        })}

                            <div className="space-y-3 mb-4 mt-2">

                                        <input type="time" required title={t.common.selectTime} className="w-2/5 p-2.5 bg-white border border-slate-200 rounded-lg text-xs font-medium outline-none focus:border-green-400 focus:ring-1 focus:ring-green-400 transition-all text-slate-700" value={timesheetForm.startTime} onChange={e => setTimesheetForm({...timesheetForm, startTime: e.target.value})} />
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-1.5">
                                        <i className="fas fa-stop-circle text-red-500 text-sm"></i> {t.timesheet.actualEnd}
                                    </label>
                                    <div className="flex gap-2">
                                        <input type="date" required title={t.common.selectDate} className="w-3/5 p-2.5 bg-white border border-slate-200 rounded-lg text-xs font-medium outline-none focus:border-red-400 focus:ring-1 focus:ring-red-400 transition-all text-slate-700" value={timesheetForm.endDate || timesheetForm.date} onChange={e => setTimesheetForm({...timesheetForm, endDate: e.target.value})} />
                                        <input type="time" required title={t.common.selectTime} className="w-2/5 p-2.5 bg-white border border-slate-200 rounded-lg text-xs font-medium outline-none focus:border-red-400 focus:ring-1 focus:ring-red-400 transition-all text-slate-700" value={timesheetForm.endTime || ''} onChange={e => setTimesheetForm({...timesheetForm, endTime: e.target.value})} />
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex justify-between items-center text-xs bg-green-50 text-green-700 p-2 rounded-lg">
                                <span>{t.common.est}: {currentDur}{t.common.unitMin}</span>
                                <span className="font-bold">{formatCurrency((currentDur/60)*RATES[lang], lang)}</span>
                            </div>
                            <button disabled={loading || currentDur === 0} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed press ${editTimesheetId ? 'bg-orange-600 hover:bg-orange-700' : 'bg-green-600 hover:bg-green-700 btn-primary'}`}>
                                {loading ? <Spinner/> : (editTimesheetId ? t.common.save : t.timesheet.submit)}
                            </button>
                        </form>
                    </div>
                    
                    <div className="pb-20">
                        <ActualScheduleMap
                            schedules={schedules}
                            timesheets={timesheets}
                            users={users}
                            getUserName={getUserName}
                            getUserColor={getUserColor}
                            lang={lang}
                            t={t}
                            timezone={timezone}
                        />

                        <div className="flex justify-between items-center mb-2">
                            <div>
                                <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide">{showHistory ? t.timesheet.history : t.timesheet.pending}</h3>
                                {!showHistory && (
                                    <p className="text-[9px] text-slate-400 mt-0.5">
                                        {lang === 'id' ? 'Laporan yang belum dibayar oleh admin' : 'Work reports not yet paid by admin'}
                                    </p>
                                )}
                            </div>
                            <button onClick={() => setShowHistory(!showHistory)} className="text-xs text-blue-500 hover:underline">{showHistory ? t.timesheet.historyHide : t.timesheet.historyAll}</button>
                        </div>

                        {/* Pay period info — only shown in pending view */}
                        {!showHistory && (() => {
                            const pp = getPayPeriodInfo();
                            const fmtShort = (dateStr) => {
                                if (!dateStr) return '';
                                const [,m,d] = dateStr.split('-');
                                const months = lang === 'id'
                                    ? ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des']
                                    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                                return `${parseInt(d)} ${months[parseInt(m)-1]}`;
                            };
                            return (
                                <div className="mb-3">
                                    {/* Payday today banner — subtle celebration */}
                                    {pp.isPaydayToday && (
                                        <div className="flex items-center gap-2 bg-gradient-to-r from-green-50 to-emerald-50 border border-green-200/80 rounded-xl px-3 py-2 mb-2 slide-down">
                                            <span className="text-base leading-none">🎉</span>
                                            <div>
                                                <p className="text-[10px] font-bold text-green-700">
                                                    {lang === 'id' ? 'Hari ini hari pembayaran!' : 'Today is payday!'}
                                                </p>
                                                <p className="text-[9px] text-green-600/80">
                                                    {lang === 'id' ? `Periode: ${fmtShort(pp.todayPeriodStart)} – ${fmtShort(pp.todayPeriodEnd)}` : `Period: ${fmtShort(pp.todayPeriodStart)} – ${fmtShort(pp.todayPeriodEnd)}`}
                                                </p>
                                            </div>
                                        </div>
