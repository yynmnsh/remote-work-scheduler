            const handleAdminLogin = (pwd) => { if (pwd === ADMIN_PASSWORD) { setCurrentUser(ADMIN_ID); localStorage.setItem('remote_user_id', ADMIN_ID); setShowAdminLogin(false); showNotify("Login Admin Berhasil"); } else { showNotify("Password Salah!", "error"); } };

            const saveSchedule = async (e) => {
                e.preventDefault(); if (!currentUser) return showNotify(t.timesheet.selectUser, "error");
                
                const startStr = `${scheduleForm.startDate}T${scheduleForm.startTime}`;
                const endStr = `${scheduleForm.endDate}T${scheduleForm.endTime}`;
                if (endStr <= startStr) {
                    return showNotify(lang === 'id' ? "Waktu selesai harus lebih akhir dari mulai!" : "End time must be after start time!", "error");
                }

                const dbStart = getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone);
                const dbEnd = getDbTime(scheduleForm.endTime, scheduleForm.endDate, timezone);
                setLoading(true);
                try {
                    const payload = { userId: currentUser, startDate: dbStart.date, startTime: dbStart.time, endDate: dbEnd.date, endTime: dbEnd.time, updatedAt: new Date().toISOString() };
                    if (editScheduleId) { await window.fs.updateDoc(window.fs.doc(window.db, 'schedules', editScheduleId), payload); } else { await window.fs.addDoc(window.fs.collection(window.db, 'schedules'), payload); }
                    showNotify(t.schedule.success); setScheduleForm({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' }); setEditScheduleId(null);
                } catch(err) { showNotify(err.message, "error"); } finally { setLoading(false); }
            };
            const deleteSchedule = (id) => { triggerConfirm(t.common.delete + "?", async () => { await window.fs.deleteDoc(window.fs.doc(window.db, 'schedules', id)); }); };
            const editSchedule = (item) => { 
                const uiStart = getDisplayTime(item.startTime, item.startDate || item.date, timezone);
                const uiEnd = getDisplayTime(item.endTime, item.endDate || item.date, timezone);
                setScheduleForm({startDate: uiStart.date, startTime: uiStart.time, endDate: uiEnd.date, endTime: uiEnd.time}); 
                setEditScheduleId(item.id); window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const saveTimesheet = async (e) => {
                e.preventDefault(); if (!currentUser) return showNotify("Select User", "error");
                setLoading(true);
                try {
                    const dur = parseInt(timesheetForm.duration);
                    const idr = Math.round((dur/60) * RATES.id);
                    const usd = ((dur/60) * RATES.en).toFixed(2); 
                    const dbTime = getDbTime(timesheetForm.startTime, timesheetForm.date, timezone);
                    const payload = { userId: currentUser, date: dbTime.date, startTime: dbTime.time, duration: dur, paymentUSD: usd, paymentIDR: idr, status: 'pending', updatedAt: new Date().toISOString() };
                    if (editTimesheetId) { await window.fs.updateDoc(window.fs.doc(window.db, 'timesheets', editTimesheetId), payload); } else { payload.createdAt = new Date().toISOString(); await window.fs.addDoc(window.fs.collection(window.db, 'timesheets'), payload); }
                    showNotify("Saved!"); setTimesheetForm({ date: '', startTime: '', duration: '' }); setEditTimesheetId(null);
                } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); }
            };
            const deleteTimesheet = (id) => { triggerConfirm(t.common.delete + "?", async () => { await window.fs.deleteDoc(window.fs.doc(window.db, 'timesheets', id)); }); };
            const editTimesheet = (item) => { 
                const uiTime = getDisplayTime(item.startTime, item.date, timezone);
                setTimesheetForm({date: uiTime.date, startTime: uiTime.time, duration: item.duration}); 
                setEditTimesheetId(item.id); window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const isAdmin = String(currentUser) === ADMIN_ID;
            const activeUser = users.find(u => String(u.id) === String(currentUser));
            const hasPaymentInfo = activeUser && activeUser.bankName && activeUser.accountNumber;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
                    {notify && <Notification msg={notify.msg} type={notify.type} onClose={() => setNotify(null)} />}
                    {showProfileModal && <ProfileModal user={users.find(u => String(u.id) === String(currentUser))} onClose={() => setShowProfileModal(false)} onSave={saveUserProfile} loading={loading} lang={lang} t={t} />}
                    {showUserModal && <UserModal user={editingUser} onClose={() => {setShowUserModal(false); setEditingUser(null);}} onSave={handleSaveUser} loading={loading} t={t} />}
                    {showAdminLogin && <AdminLoginModal onClose={() => setShowAdminLogin(false)} onLogin={handleAdminLogin} loading={loading} t={t} />}
                    {confirmModal.show && <ConfirmationModal isOpen={confirmModal.show} message={confirmModal.message} onConfirm={executeConfirm} onCancel={() => setConfirmModal({ ...confirmModal, show: false })} t={t} />}

                    <header className="bg-white sticky top-0 z-20 shadow-sm border-b border-slate-100">
                        {/* Top Row: Brand & User */}
                        <div className="px-4 pt-3 pb-2 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                                    <i className="fas fa-layer-group text-sm"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg text-slate-800 leading-tight tracking-tight">Scheduler</h1>
                                    <p className="text-[10px] text-slate-400 font-medium tracking-wide">REMOTE WORK</p>
                                </div>
                            </div>
                            
                            <div className="relative group">
                                <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-full pl-1 pr-3 py-1 shadow-sm group-hover:border-blue-300 transition-all">
                                    {(() => {
                                        const activeU = users.find(u => String(u.id) === String(currentUser));
                                        return (
                                            <>
                                                <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold shadow-sm" 
                                                     style={{backgroundColor: activeU ? activeU.color : '#94a3b8'}}>
                                                    {activeU ? activeU.name.substring(0,1) : <i className="fas fa-user"></i>}
                                                </div>
                                                <span className="text-xs font-semibold text-slate-600 max-w-[80px] truncate">
                                                    {activeU ? activeU.name : 'Select...'}
                                                </span>
                                                <i className="fas fa-chevron-down text-[10px] text-slate-400"></i>
                                            </>
                                        )
                                    })()}
                                </div>
                                <select 
                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                    value={currentUser || ''} 
                                    onChange={handleUserChange}
                                >
                                    <option value="">Select User...</option>
                                    {users.filter(u => !u.hidden).map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                </select>
                            </div>
                        </div>
                        
                        {/* Controls Row */}
                        <div className="px-4 pb-3 flex gap-2">
                             <button 
                                onClick={() => setLang(l => l === 'id' ? 'en' : 'id')} 
                                className="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition-all active:scale-95"
                             >
                                <div className="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center text-[8px] font-bold text-slate-600">
                                    {lang === 'id' ? 'ID' : 'EN'}
                                </div>
                                <span className="text-[10px] font-semibold text-slate-600">
                                    {lang === 'id' ? 'Bahasa Indonesia' : 'English'}
                                </span>
                             </button>

                             <div className="relative flex-1">
                                <div className="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none">
                                    <i className="far fa-clock text-slate-400 text-xs"></i>
                                </div>
                                <select 
                                    className="appearance-none w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg pl-8 pr-8 py-1.5 text-[10px] font-semibold text-slate-600 outline-none focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer"
                                    value={timezone} 
                                    onChange={e => setTimezone(e.target.value)}
                                >
                                    {Object.keys(TZ_CONFIG).map(k => <option key={k} value={k}>{TZ_CONFIG[k].label}</option>)}
                                </select>
                                <div className="absolute inset-y-0 right-0 flex items-center px-2.5 pointer-events-none">
                                    <i className="fas fa-chevron-down text-[10px] text-slate-400"></i>
                                </div>
                             </div>
                        </div>

                        {/* Reminder Alert - Clean & Subtle */}
                        <div className="bg-amber-50 border-y border-amber-100 px-4 py-2 flex items-center gap-2 animate-fadeIn">
                            <i className="fas fa-exclamation-circle text-amber-500 text-xs flex-shrink-0"></i>
                            <p className="text-[10px] text-amber-700 font-medium leading-tight">
                                {t.common.reminder}
                            </p>
                        </div>
                    </header>

                    <main className="flex-1 p-4">
                        {loading && !users.length ? <div className="flex flex-col items-center justify-center h-64 text-slate-400 animate-pulse"><i className="fas fa-database text-4xl mb-3"></i><p>{t.common.loading}</p></div> : (
                            <>
                                {view === 'dashboard' && <DashboardView currentUser={currentUser} getUserName={getUserName} timesheets={timesheets} schedules={schedules} users={users} getUserColor={getUserColor} onEditProfile={() => { if(!currentUser) return showNotify(t.timesheet.selectUser, "error"); setShowProfileModal(true); }} setView={setView} t={t} formatCurrency={formatCurrency} lang={lang} timezone={timezone} />}
                                {view === 'schedule' && <ScheduleManager editScheduleId={editScheduleId} setEditScheduleId={setEditScheduleId} scheduleForm={scheduleForm} setScheduleForm={setScheduleForm} saveSchedule={saveSchedule} loading={loading} schedules={schedules} currentUser={currentUser} getUserColor={getUserColor} getUserName={getUserName} deleteSchedule={deleteSchedule} editSchedule={editSchedule} isAdmin={isAdmin} lang={lang} t={t} timezone={timezone} />}
                                {view === 'timesheet' && <ReportManager saveTimesheet={saveTimesheet} timesheetForm={timesheetForm} setTimesheetForm={setTimesheetForm} loading={loading} timesheets={timesheets} getUserName={getUserName} currentUser={currentUser} deleteTimesheet={deleteTimesheet} editTimesheetId={editTimesheetId} setEditTimesheetId={setEditTimesheetId} editTimesheet={editTimesheet} hasPaymentInfo={hasPaymentInfo} onOpenProfile={() => setShowProfileModal(true)} isAdmin={isAdmin} lang={lang} t={t} formatCurrency={formatCurrency} timezone={timezone} />}
                                {view === 'analytics' && <AnalyticsView timesheets={timesheets} schedules={schedules} users={users} currentUser={currentUser} isAdmin={isAdmin} loading={loading} lang={lang} t={t} formatCurrency={formatCurrency} timezone={timezone} />}
                                {view === 'admin' && isAdmin && <AdminPanel timesheets={timesheets} users={users} schedules={schedules} loading={loading} setLoading={setLoading} showNotify={showNotify} t={t} lang={lang} formatCurrency={formatCurrency} onAddUser={() => { setEditingUser(null); setShowUserModal(true); }} onEditUser={(u) => { setEditingUser(u); setShowUserModal(true); }} onDeleteUser={handleDeleteUser} onConfirmAction={triggerConfirm} />}
                            </>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 z-30 max-w-md mx-auto">
                        <div className={`grid ${isAdmin ? 'grid-cols-5' : 'grid-cols-4'} gap-1 px-2`}>
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'dashboard' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-home text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.home}</span></button>
                            <button onClick={() => setView('schedule')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'schedule' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-calendar-alt text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.schedule}</span></button>
                            <button onClick={() => setView('timesheet')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'timesheet' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-file-invoice-dollar text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.timesheet}</span></button>
                            <button onClick={() => setView('analytics')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'analytics' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-chart-pie text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.analytics}</span></button>
                            {isAdmin && <button onClick={() => setView('admin')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'admin' ? 'text-purple-600 bg-purple-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-user-shield text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.admin}</span></button>}
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
