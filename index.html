        };

        // --- HELPERS ---
        const formatDate = (dateString, lang = 'id') => {
            if (!dateString) return '';
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            return new Date(dateString).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', options);
        };
        
        const formatFullDate = (dateString, lang = 'id') => {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' });
        };

        const formatTimeInZone = (dateObj, timeZone) => {
            return dateObj.toLocaleTimeString('en-US', { timeZone, hour12: false, hour: '2-digit', minute: '2-digit' });
        };

        // Convert DB Time (WIB) -> UI Time (Selected Timezone)
        // Accepts: DB Time String (WIB), Date String, Target Timezone Code (WIB/AEDT/PST)
        const getDisplayTime = (timeStr, dateStr, tzCode) => {
            if (!timeStr || !dateStr) return { date: dateStr, time: timeStr };
            
            // Construct ISO string with WIB offset (+07:00) - This is the Single Source of Truth
            const isoStr = `${dateStr}T${timeStr}:00+07:00`;
            const d = new Date(isoStr);

            const targetZone = TZ_CONFIG[tzCode].iana;
            
            // Format to parts in target timezone
            const formatterDate = new Intl.DateTimeFormat('en-CA', { timeZone: targetZone, year: 'numeric', month: '2-digit', day: '2-digit' });
            const formatterTime = new Intl.DateTimeFormat('en-GB', { timeZone: targetZone, hour: '2-digit', minute: '2-digit', hour12: false });
            
            const newDateStr = formatterDate.format(d); // YYYY-MM-DD
            const newTimeStr = formatterTime.format(d); // HH:mm
            
            return { date: newDateStr, time: newTimeStr, originalObj: d };
        };

        // Convert UI Time (Selected Timezone) -> DB Time (WIB)
        // We calculate this by creating a date in target zone and shifting it back to WIB (+07)
        const getDbTime = (timeStr, dateStr, tzCode) => {
            if (!timeStr || !dateStr) return { date: dateStr, time: timeStr };
            if (tzCode === 'WIB') return { date: dateStr, time: timeStr };
            
            const offset = TZ_CONFIG[tzCode].offsetHours;
            const d = new Date(`${dateStr}T${timeStr}`);
            
            // Reverse the offset to get back to WIB
            // Example: AEDT is +4h from WIB. Input is 10:00 AEDT. DB should be 06:00 WIB. 
            // 10 - 4 = 6. So we subtract the offset.
            d.setHours(d.getHours() - offset); 
            
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            
            return { date: `${y}-${m}-${day}`, time: `${h}:${min}` };
        };

        // CORE LOGIC: Determines which "Work Day" a log belongs to
        // Takes WIB Date & Time strings, and the target Timezone Code
        const getOpDay = (dateStr, timeStr, tzCode) => {
            if (!dateStr || !timeStr) return null;
            
            // First, get the time in the target timezone
            const display = getDisplayTime(timeStr, dateStr, tzCode);
            const dt = new Date(`${display.date}T${display.time}`);
            const hour = dt.getHours();
            
            // Standard cutoff for "shifts" is usually 4 AM in the local context
            const cutoff = 4; 
            
            if (hour < cutoff) dt.setDate(dt.getDate() - 1);
            
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const formatCurrency = (amount, lang = 'id') => {
            const num = parseFloat(amount) || 0;
            if (lang === 'id') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        };

        // --- UI COMPONENTS ---

        const Notification = ({ msg, type, onClose }) => (

        const ProfileModal = ({ user, onClose, onSave, loading, lang, t }) => {
            const [bankName, setBankName] = React.useState(user?.bankName || '');
            const [accNumber, setAccNumber] = React.useState(user?.accountNumber || '');
            const handleSubmit = (e) => { e.preventDefault(); onSave({ bankName, accountNumber: accNumber }); };
            return (

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.profile.bankLabel}</label><input type="text" className="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" value={bankName} onChange={e => setBankName(e.target.value)} required /></div>
                            <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.profile.accLabel}</label><input type="text" className="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" value={accNumber} onChange={e => setAccNumber(e.target.value)} required /></div>
                            <div className="flex gap-2 mt-6"><button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg transition">{t.common.cancel}</button><button type="submit" disabled={loading} className="flex-1 py-2 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700 transition">{loading ? <Spinner/> : t.common.save}</button></div>

        };

        const UserModal = ({ user, onClose, onSave, loading, t }) => {
            const [form, setForm] = React.useState(user || { name: '', color: '#3b82f6', hidden: false });
            return (
                 <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">

                        <form onSubmit={(e) => { e.preventDefault(); onSave(form); }} className="space-y-4">

                            <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.admin.color}</label><input type="color" className="w-full h-10 p-1 border rounded-lg" value={form.color} onChange={e => setForm({...form, color: e.target.value})} /></div>
                            <div className="flex items-center gap-2 mt-2 p-2 bg-slate-50 rounded-lg border border-slate-100"><input type="checkbox" id="hideUser" checked={form.hidden || false} onChange={e => setForm({...form, hidden: e.target.checked})} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer" /><label htmlFor="hideUser" className="text-sm text-slate-700 font-medium cursor-pointer flex-1">{t.admin.hideUser} <span className={form.hidden ? "text-red-500 text-xs ml-1" : "text-green-500 text-xs ml-1"}>({form.hidden ? t.admin.inactive : t.admin.active})</span></label></div>
                            <div className="flex gap-2 mt-6"><button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg">{t.common.cancel}</button><button type="submit" disabled={loading} className="flex-1 py-2 bg-purple-600 text-white font-medium text-sm rounded-lg hover:bg-purple-700">{loading ? <Spinner/> : t.common.save}</button></div>

        const AdminLoginModal = ({ onClose, onLogin, loading, t }) => {

                            <div className="flex gap-2 mt-6"><button type="button" onClick={onClose} className="flex-1 py-2 text-slate-500 font-medium text-sm hover:bg-slate-100 rounded-lg">{t.common.cancel}</button><button type="submit" disabled={loading} className="flex-1 py-2 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700">Login</button></div>

                    </div>
                </div>
            );
        };

        const AnalyticsView = ({ timesheets, schedules, users, currentUser, isAdmin, loading, lang, t, formatCurrency, timezone }) => {
            const [tab, setTab] = React.useState('team'); 
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            // Team Data
            const thisMonthSheets = timesheets.filter(t => { const d = new Date(t.date); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; });
            const totalMinutesTeam = thisMonthSheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            const rate = RATES[lang];
            const totalEarnedTeam = (totalMinutesTeam / 60) * rate;

            const userStats = {};
            thisMonthSheets.forEach(t => { if(!userStats[t.userId]) userStats[t.userId] = { minutes: 0 }; userStats[t.userId].minutes += parseInt(t.duration || 0); });
            const leaderboard = Object.keys(userStats).map(uid => ({ uid, ...userStats[uid], name: users.find(u => String(u.id) === String(uid))?.name || 'Unknown', color: users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1' })).sort((a,b) => b.minutes - a.minutes).slice(0, 5); 

            // Personal Data Logic - Dynamic based on Timezone
            const getLast7Days = () => {
                const dates = [];
                for(let i=0; i<7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    // This is rough local date, precise matching happens in grouping
                    const y = d.getFullYear();
                    const m = String(d.getMonth()+1).padStart(2,'0');
                    const day = String(d.getDate()).padStart(2,'0');
                    dates.push(`${y}-${m}-${day}`);
                }
                return dates;
            };
            const rangeDays = getLast7Days();
            
            // 1. Last 7 Days Performance
            const my7DaysSheets = timesheets.filter(t => {
                if (String(t.userId) !== String(currentUser)) return false;
                const opDay = getOpDay(t.date, t.startTime, timezone);
                return rangeDays.includes(opDay);
            });
            const my7DaysMinutes = my7DaysSheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            const my7DaysEarnings = (my7DaysMinutes / 60) * rate;

            // 2. Pending Balance
            const myPendingSheets = timesheets.filter(t => String(t.userId) === String(currentUser) && t.status === 'pending');
            const myPendingMinutes = myPendingSheets.reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
            const myPendingEarnings = (myPendingMinutes / 60) * RATES[lang];

            // 3. Paid History
            const myPaidSheets = timesheets.filter(t => String(t.userId) === String(currentUser) && t.status === 'paid');
            const paidGroups = {};
            myPaidSheets.forEach(t => {
                const dateKey = t.paidAt ? t.paidAt.split('T')[0] : 'Unknown';
                if(!paidGroups[dateKey]) paidGroups[dateKey] = { totalMinutes: 0, dates: [] };
                paidGroups[dateKey].totalMinutes += parseInt(t.duration || 0);
                paidGroups[dateKey].dates.push(t.date);
            });
            const sortedPaidHistory = Object.keys(paidGroups).sort((a,b) => new Date(b) - new Date(a));

            // --- 4. DISCIPLINE LOGIC: Strict Timezone Conversion ---
            const targetZone = TZ_CONFIG[timezone].iana;

            const disciplineData = rangeDays.map(localDateStr => {
                // Schedules
                const dailySchedules = schedules.filter(s => {
                    if (String(s.userId) !== String(currentUser)) return false;
                    const converted = getDisplayTime(s.startTime, s.startDate || s.date, timezone);
                    // Match OpDay of Converted Time
                    const opDay = getOpDay(converted.date, converted.time, timezone);
                    return opDay === localDateStr;
                }).map(s => {
                    const startConv = getDisplayTime(s.startTime, s.startDate || s.date, timezone);
                    const endConv = getDisplayTime(s.endTime, s.endDate || s.date, timezone);
                    
                    return {
                        id: s.id,
                        start: startConv.time,
                        end: endConv.time,
                        // Use original time object for precise diff calculation
                        origStart: startConv.originalObj,
                        planMins: (()=>{
                            const d1 = new Date(`2000-01-01T${s.startTime}`);
                            let d2 = new Date(`2000-01-01T${s.endTime}`);
                            if(d2 < d1) d2.setDate(d2.getDate() + 1);
                            return (d2 - d1) / 60000;
                        })(),
                        actualMins: 0,
                        matched: []
                    };
                });

                // Timesheets
                const dailySheets = timesheets.filter(t => {
                    if (String(t.userId) !== String(currentUser)) return false;
                    // Strict: Get Log time in selected TZ, then check its OpDay
                    const converted = getDisplayTime(t.startTime, t.date, timezone);
                    const opDay = getOpDay(converted.date, converted.time, timezone);
                    return opDay === localDateStr;
                });

                const unplanned = [];

                dailySheets.forEach(t => {
                    const tConv = getDisplayTime(t.startTime, t.date, timezone);
                    let bestMatch = null;
                    let minDiff = Infinity;

                    dailySchedules.forEach(s => {
                        // Compare Original Time Objects (Both are derived from WIB Source via getDisplayTime)
                        let diff = Math.abs((s.origStart - tConv.originalObj) / 60000);
                        if (diff < 180) { // 3 Hour Tolerance
                            if (diff < minDiff) {
                                minDiff = diff;
                                bestMatch = s;
                            }
                        }
                    });

                    if (bestMatch) {
                        bestMatch.actualMins += parseInt(t.duration || 0);
                        bestMatch.matched.push(t);
                    } else {
                        unplanned.push({ ...t, displayTime: tConv.time });
                    }
                });

                return { date: localDateStr, schedules: dailySchedules, unplanned };
            });

            // Team Activity Logic
            const dailyActivityTeam = rangeDays.map(dateStr => {
                const mins = timesheets.filter(t => t.date === dateStr).reduce((acc, t) => acc + parseInt(t.duration || 0), 0);
                return { date: dateStr, minutes: mins };
            });
            const maxDailyMins = Math.max(...dailyActivityTeam.map(d => d.minutes), 60);
            const totalActivityHours = dailyActivityTeam.reduce((acc, d) => acc + d.minutes, 0) / 60;

            return (
                <div className="space-y-4 fade-in pb-24">
                    {/* Header Controls */}
                    <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 items-center">
                        <div className="flex-1 flex bg-slate-50 p-1 rounded-lg">
                            <button onClick={() => setTab('team')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'team' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-indigo-500'}`}>{t.analytics.team}</button>
                            <button onClick={() => setTab('personal')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${tab === 'personal' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-blue-500'}`}>{t.analytics.personal}</button>
                        </div>
                    </div>

                    {tab === 'personal' && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white p-4 rounded-xl border-l-4 border-blue-500 shadow-sm">
                                    <h3 className="text-[10px] text-slate-400 uppercase font-bold mb-1">{t.analytics.myStats}</h3>
                                    <p className="text-2xl font-bold text-slate-700">{(my7DaysMinutes/60).toFixed(1)} <span className="text-sm font-normal text-slate-400">{t.common.unitShort}</span></p>
                                    <p className="text-xs text-blue-600 font-medium mt-1">{formatCurrency(my7DaysEarnings, lang)}</p>
                                </div>
                                <div className="bg-white p-4 rounded-xl border-l-4 border-orange-400 shadow-sm">
                                    <h3 className="text-[10px] text-slate-400 uppercase font-bold mb-1">{t.analytics.pendingBalance}</h3>
                                    <p className="text-xl font-bold text-orange-600 mt-1">{formatCurrency(myPendingEarnings, lang)}</p>
                                    <p className="text-[10px] text-slate-400 mt-1">{(myPendingMinutes/60).toFixed(1)} {t.common.unitHour} {t.analytics.totalUnpaid}</p>
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <div className="mb-4">
                                    <div className="flex justify-between items-center mb-1">
                                        <h3 className="font-bold text-slate-700 flex items-center gap-2"><i className="fas fa-chart-bar text-blue-500"></i> {t.analytics.discipline}</h3>
                                        <span className="text-[9px] bg-slate-100 text-slate-500 px-2 py-1 rounded border border-slate-200">{TZ_CONFIG[timezone].label}</span>
                                    </div>
                                    <p className="text-[9px] text-slate-400 italic">{t.analytics.legendTip}</p>
                                </div>
                                <div className="space-y-6">
                                    {disciplineData.map((d, idx) => {
                                        if (d.schedules.length === 0 && d.unplanned.length === 0) return null; 
                                        const dateLabel = formatDate(d.date, lang);
                                        return (
                                            <div key={idx} className="border-l-2 border-slate-200 pl-3">
                                                <p className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">{dateLabel}</p>
                                                
                                                {/* Scheduled Slots */}
                                                <div className="space-y-3">
                                                    {d.schedules.map(s => {
                                                        const sStart = s.start;
                                                        const sEnd = s.end;
                                                        
                                                        // Status Logic
                                                        let status = t.analytics.statusOnTrack;
                                                        let statusColor = "bg-green-100 text-green-700";
                                                        let barColor = "bg-green-500";
                                                        
                                                        const diff = s.actualMins - s.planMins;
                                                        if (s.actualMins === 0) { status = t.analytics.statusMissed; statusColor = "bg-slate-100 text-slate-500"; barColor = "bg-slate-300"; }
                                                        else if (diff < -15) { status = t.analytics.statusUnder; statusColor = "bg-yellow-100 text-yellow-700"; barColor = "bg-yellow-500"; }
                                                        else if (diff > 30) { status = t.analytics.statusOver; statusColor = "bg-red-100 text-red-700"; barColor = "bg-red-500"; }

                                                        const percent = Math.min(100, (s.actualMins / s.planMins) * 100) || 0;

                                                        return (
                                                            <div key={s.id} className="relative">
                                                                <div className="flex justify-between items-center text-xs mb-1">
                                                                    <span className="font-medium text-slate-700">{sStart} - {sEnd} <span className="text-[10px] text-slate-400">({(s.planMins/60).toFixed(1)}h)</span></span>
                                                                    <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${statusColor}`}>{status}</span>
                                                                </div>
                                                                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden w-full relative">
                                                                    <div className={`h-full rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                                                </div>
                                                                {s.actualMins > 0 && <p className="text-[9px] text-right text-slate-400 mt-0.5">{t.analytics.labelAct}: {(s.actualMins/60).toFixed(1)}{t.common.unitShort}</p>}
                                                            </div>
                                                        );
                                                    })}

                                                    {/* Unplanned */}
                                                    {d.unplanned.length > 0 && (
                                                        <div className="mt-2">
                                                            <div className="flex justify-between items-center text-xs mb-1">
                                                                <span className="font-medium text-indigo-600 italic">{t.analytics.statusUnplanned}</span>
                                                                <span className="text-[9px] px-1.5 py-0.5 rounded font-bold bg-indigo-100 text-indigo-700">{t.analytics.tagAdhoc}</span>
                                                            </div>
                                                            {d.unplanned.map((u, i) => {
                                                                return (
                                                                    <div key={i} className="flex justify-between text-[10px] text-slate-500 pl-2 border-l-2 border-indigo-200 mb-1">
                                                                        <span>{u.displayTime}</span>
                                                                        <span>{u.duration}m</span>
                                                                    </div>
                                                                )
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><i className="fas fa-history text-green-600"></i> {t.analytics.paymentHistory}</h3>
                                {sortedPaidHistory.length === 0 ? <p className="text-center text-xs text-slate-400 py-4">No payment history.</p> : (
                                    <div className="space-y-4">
                                        {sortedPaidHistory.map(dateKey => {
                                            const group = paidGroups[dateKey];
                                            const totalAmount = (group.totalMinutes/60) * RATES[lang];
                                            group.dates.sort();
                                            const startDate = formatFullDate(group.dates[0], lang);
                                            const endDate = formatFullDate(group.dates[group.dates.length - 1], lang);
                                            const dateRange = startDate === endDate ? startDate : `${startDate} - ${endDate}`;
                                            const paidDate = formatFullDate(dateKey, lang);

                                            return (
                                                <div key={dateKey} className="border-b border-slate-50 last:border-0 pb-4 last:pb-0">
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <p className="text-sm font-bold text-slate-800">{dateRange}</p>
                                                            <p className="text-[10px] text-slate-400 mt-0.5">{t.analytics.paidOn}: {paidDate}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="block text-base font-bold text-green-600">{formatCurrency(totalAmount, lang)}</span>
                                                            <span className="text-[10px] text-slate-400">{(group.totalMinutes/60).toFixed(1)} {t.common.unitHour}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {tab === 'team' && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="bg-gradient-to-br from-indigo-700 to-purple-800 rounded-2xl p-5 text-white shadow-lg">
                                <h3 className="text-xs text-indigo-200 uppercase tracking-widest font-bold mb-4">{t.analytics.teamOverview}</h3>
                                <div className="flex justify-between items-end">
                                    <div><p className="text-4xl font-bold">{(totalMinutesTeam/60).toFixed(0)}<span className="text-lg font-normal text-indigo-300">{t.common.unitShort}</span></p><p className="text-xs text-indigo-200 mt-1">{t.analytics.prodHours}</p></div>
                                    <div className="text-right"><p className="text-lg font-bold">{formatCurrency(totalEarnedTeam, lang)}</p><p className="text-xs text-indigo-200">{t.analytics.burnRate}</p></div>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-700 text-sm">{t.analytics.teamActivity}</h3><span className="text-[10px] text-slate-400 bg-slate-50 px-2 py-1 rounded">{t.analytics.totalHours}: {totalActivityHours.toFixed(1)} {t.common.unitShort}</span></div>
                                <div className="flex justify-between h-32 gap-1 items-end">
                                    {dailyActivityTeam.reverse().map((d, idx) => {
                                        const h = Math.max((d.minutes / maxDailyMins) * 100, d.minutes > 0 ? 5 : 0);
                                        const dateObj = new Date(d.date);
                                        const dayName = dateObj.toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', {weekday:'narrow'});
                                        const dateNum = dateObj.getDate();
                                        const hours = (d.minutes/60).toFixed(1);
                                        return (
                                            <div key={idx} className="flex-1 flex flex-col items-center group h-full justify-end relative cursor-pointer">
                                                <div className="w-full bg-slate-50 rounded-t-sm relative hover:bg-indigo-50 transition-all flex flex-col justify-end h-full">
                                                    <div className={`w-full rounded-t-sm bar-fill ${d.minutes > 0 ? 'bg-indigo-500' : 'bg-transparent'}`} style={{height: `${h}%`}}></div>
                                                </div>
                                                {d.minutes > 0 && (
                                                    <div className="tooltip absolute bottom-10 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-50 pointer-events-none">
                                                        {d.date}<br/><b>{hours} {t.common.unitHour}</b>
                                                    </div>
                                                )}
                                                <div className="mt-1 text-center h-6"><span className="text-[8px] text-slate-400 block leading-tight">{dayName}</span><span className="text-[8px] text-slate-500 font-bold block leading-tight">{dateNum}</span></div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><i className="fas fa-trophy text-yellow-500"></i> {t.analytics.topContrib}</h3>
                                <div className="space-y-3">
                                    {leaderboard.map((u, idx) => (
                                        <div key={u.uid} className="flex items-center justify-between border-b border-slate-50 last:border-0 pb-2 last:pb-0">
                                            <div className="flex items-center gap-3"><div className={`w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold ${idx === 0 ? 'ring-2 ring-yellow-400' : ''}`} style={{backgroundColor: u.color}}>{idx + 1}</div><span className="text-sm font-medium text-slate-700">{u.name}</span></div>
                                            <div className="text-right"><span className="text-sm font-bold text-indigo-600">{(u.minutes/60).toFixed(1)}h</span></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DashboardView = ({ currentUser, getUserName, timesheets, schedules, users, getUserColor, onEditProfile, setView, t, formatCurrency, lang, timezone }) => {
            const myPending = timesheets.filter(t => String(t.userId) === String(currentUser) && t.status === 'pending');
            const totalMins = myPending.reduce((acc, curr) => acc + (curr.duration || 0), 0);
            const estEarned = (totalMins / 60) * RATES[lang];

            let periodText = t.dashboard.noSchedule;
            if (myPending.length > 0) {
                const sortedDates = myPending.map(t => new Date(t.date)).sort((a,b) => a-b);
                const start = sortedDates[0];
                const end = sortedDates[sortedDates.length - 1];
                const loc = lang === 'id' ? 'id-ID' : 'en-US';
                periodText = `${start.getDate()} ${start.toLocaleString(loc, { month: 'short' })} - ${end.getDate()} ${end.toLocaleString(loc, { month: 'short' })}`;
            }
            
            // Upcoming Schedules Filter Logic: 
            // Must compare Schedule Time (in selected TZ) vs Current Time (in selected TZ)
            const upcomingSchedules = schedules
                .filter(s => {
                    const now = new Date();
                    // Get current time in target timezone
                    const targetZone = TZ_CONFIG[timezone].iana;
                    const nowInTzStr = now.toLocaleString("en-US", {timeZone: targetZone});
                    const nowInTz = new Date(nowInTzStr);
                    
                    // Get schedule time in target timezone
                    const sDisplay = getDisplayTime(s.startTime, s.startDate || s.date, timezone);
                    const sStart = new Date(`${sDisplay.date}T${sDisplay.time}`);
                    
                    return sStart > nowInTz;
                })
                .sort((a,b) => {
                    const timeA = `${a.startDate || a.date}T${a.startTime}`;
                    const timeB = `${b.startDate || b.date}T${b.startTime}`;
                    return timeA.localeCompare(timeB); // SORTING FIX: Nearest first (Oldest -> Newest among upcoming)
                })
                .slice(0, 5);
            
            const now = new Date();
            const tzIana = TZ_CONFIG[timezone].iana;
            const currentTimeDisplay = now.toLocaleTimeString('en-US', { timeZone: tzIana, hour12: false, hour: '2-digit', minute: '2-digit' });
            
            // Check active workers based on current UTC time vs Schedule UTC time
            // Simplified: Convert everything to WIB/UTC+7 for comparison logic since DB is WIB
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const currentWIB = new Date(utc + (3600000 * 7)); 

            const activeWorkers = schedules.filter(s => {
                const startDateStr = s.startDate || s.date;
                const endDateStr = s.endDate || s.date;
                const sStart = new Date(`${startDateStr}T${s.startTime}`); 
                let sEnd = new Date(`${endDateStr}T${s.endTime}`);
                if (!s.endDate && sEnd < sStart) sEnd.setDate(sEnd.getDate() + 1); // Legacy
                return currentWIB >= sStart && currentWIB <= sEnd;
            }).map(s => {
                const u = users.find(u => String(u.id) === String(s.userId));
                return { name: u?.name || 'Unknown', endTime: s.endTime, endDate: s.endDate || s.date, color: u?.color, hidden: u?.hidden };
            }).filter(u => !u.hidden);

            return (
                <div className="space-y-4 fade-in">
                    <div className="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                        <div className="relative z-10 flex justify-between items-start">
                            <div>
                                <h2 className="text-xl font-bold flex items-center gap-2">{t.dashboard.hello}, {currentUser ? getUserName(currentUser) : 'Tim'}!</h2>
                                <p className="text-blue-200 text-xs mt-0.5">Remote Work Scheduler</p>
                            </div>
                            <button onClick={onEditProfile} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition backdrop-blur-sm" title="Atur Rekening"><i className="fas fa-cog text-white text-sm"></i></button>
                        </div>
                        <div className="relative z-10 mt-6 bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 flex justify-between items-center">
                            <div><p className="text-[10px] text-blue-200 uppercase tracking-widest mb-1">{t.dashboard.estEarned}</p><p className="text-2xl font-bold">{formatCurrency(estEarned, lang)}</p><p className="text-[10px] text-blue-100 mt-1 flex items-center gap-1"><i className="far fa-clock"></i> {periodText}</p></div>
                            <div className="text-right"><span className="block text-2xl font-bold">{(totalMins/60).toFixed(1)}</span><span className="text-xs text-blue-200">{t.dashboard.hours}</span></div>
                        </div>
                        <i className="fas fa-coins absolute -right-6 -bottom-8 text-9xl text-white opacity-5"></i>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-green-100">
                        <div className="flex justify-between items-start mb-3">
                            <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide flex items-center gap-2">
                                <span className="relative flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>
                                {t.dashboard.workingNow}
                            </h3>
                            <span className="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 font-mono">{currentTimeDisplay} {TZ_CONFIG[timezone].label}</span>
                        </div>
                        {activeWorkers.length > 0 ? (
                            <div className="flex flex-wrap gap-2">
                                {activeWorkers.map((w, idx) => (
                                    <div key={idx} className="bg-slate-50 border border-slate-200 rounded-full px-3 py-1 flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full" style={{backgroundColor: w.color}}></div>
                                        <span className="text-sm font-bold text-slate-700">{w.name}</span>
                                        <span className="text-xs text-slate-400">until {getDisplayTime(w.endTime, w.endDate, timezone).time}</span>
                                    </div>
                                ))}
                            </div>
                        ) : ( <p className="text-sm text-slate-400 italic">{t.dashboard.noActive}</p> )}
                    </div>
                     <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center text-sm uppercase tracking-wide"><i className="fas fa-calendar-alt text-blue-500 mr-2"></i> {t.dashboard.upcoming}</h3>
                        <div className="space-y-3">
                            {upcomingSchedules.map(s => {
                                const showDate = s.startDate || s.date;
                                const dateObj = getDisplayTime(s.startTime, showDate, timezone); // get converted Date
                                const displayDate = formatDate(dateObj.date, lang);
                                
                                const startDisplay = getDisplayTime(s.startTime, showDate, timezone).time;
                                const endDisplay = getDisplayTime(s.endTime, s.endDate || showDate, timezone).time;
                                
                                return (
                                    <div key={s.id} className="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" style={{backgroundColor: getUserColor(s.userId)}}>{getUserName(s.userId).substring(0,2).toUpperCase()}</div>
                                        <div className="ml-3 flex-1">
                                            <div className="flex justify-between"><span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span><span className="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-500">{displayDate}</span></div>
                                            <div className="text-xs text-slate-500 mt-1">{startDisplay} - {endDisplay} <span className="text-[8px] bg-slate-200 px-1 rounded">{TZ_CONFIG[timezone].label}</span></div>
                                        </div>
                                    </div>
                                );
                            })}
                            {upcomingSchedules.length === 0 && <p className="text-center text-slate-400 text-xs py-4">{t.dashboard.noSchedule}</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const ScheduleManager = ({ editScheduleId, setEditScheduleId, scheduleForm, setScheduleForm, saveSchedule, loading, schedules, currentUser, getUserColor, getUserName, deleteSchedule, editSchedule, isAdmin, lang, t, timezone }) => {
            const [showHistory, setShowHistory] = React.useState(false);
            const [filterMine, setFilterMine] = React.useState(false);
            const [sortOrder, setSortOrder] = React.useState('desc'); // Default to newest first
            
            const MAX_MINUTES = 600; 
            const dailyUsedMinutes = React.useMemo(() => {
                const dbTime = getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone);
                const currentOpDayDB = getOpDay(scheduleForm.startDate, dbTime.time, 'WIB'); // FIXED: Use fixed 'WIB' context for quotas
                if (!currentOpDayDB) return 0;
                
                return schedules
                    .filter(s => {
                        if (editScheduleId && s.id === editScheduleId) return false;
                        const otherStartD = s.startDate || s.date;
                        const otherOpDay = getOpDay(otherStartD, s.startTime, 'WIB'); // FIXED: Consistent comparison
                        return otherOpDay === currentOpDayDB;
                    })
                    .reduce((acc, s) => {
                         const startD = s.startDate || s.date;
                         const endD = s.endDate || s.date; 
                         const d1 = new Date(`${startD}T${s.startTime}`);
                         let d2 = new Date(`${endD}T${s.endTime}`);
                         if (!s.endDate && d2 < d1) d2.setDate(d2.getDate() + 1);
                         return acc + Math.floor((d2 - d1)/60000);
                    }, 0);
            }, [schedules, scheduleForm, editScheduleId, timezone]);

            const remainingMinutes = Math.max(0, MAX_MINUTES - dailyUsedMinutes);
            const usedPercentage = Math.min(100, (dailyUsedMinutes / MAX_MINUTES) * 100);
            const isCritical = remainingMinutes < 60;

            const filteredSchedules = React.useMemo(() => {
                let filtered = [...schedules];
                if (!showHistory) {
                    const now = new Date();
                    // Simplified history filter: just check raw dates, ideally should convert to target TZ
                    const y = now.getFullYear();
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const d = String(now.getDate()).padStart(2, '0');
                    const todayStr = `${y}-${m}-${d}`;
                    // Keep it simple for history filter, otherwise complex
                    filtered = filtered.filter(s => (s.startDate || s.date) >= todayStr); 
                }
                if (filterMine) filtered = filtered.filter(s => String(s.userId) === String(currentUser));
                
                filtered.sort((a,b) => {
                    const timeA = `${a.startDate || a.date}T${a.startTime}`;
                    const timeB = `${b.startDate || b.date}T${b.startTime}`;
                    return sortOrder === 'asc' ? timeA.localeCompare(timeB) : timeB.localeCompare(timeA);
                });
                return filtered;
            }, [schedules, showHistory, filterMine, sortOrder, currentUser]);

            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editScheduleId ? 'border-orange-500' : 'border-blue-500'}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-700">{editScheduleId ? t.schedule.edit : t.schedule.booking}</h3>
                            {editScheduleId && <button onClick={() => {setEditScheduleId(null); setScheduleForm({startDate:'', startTime:'15:00', endDate: '', endTime:'16:00'})}} className="text-xs text-red-500">{t.common.cancel}</button>}
                        </div>
                        {scheduleForm.startDate && scheduleForm.startTime && (
                            <div className={`rounded-xl p-4 mb-5 border transition-all duration-300 ${isCritical && remainingMinutes < MAX_MINUTES ? 'bg-red-50 border-red-100' : 'bg-blue-50 border-blue-100'}`}>
                                <div className="flex justify-between items-end mb-2">
                                    <div><p className={`text-[10px] font-bold uppercase tracking-wider ${isCritical ? 'text-red-600' : 'text-blue-600'}`}><i className="fas fa-users mr-1"></i> {t.schedule.teamQuota}</p><p className="text-xs text-slate-600 mt-1">{t.schedule.used}: <span className="font-bold text-slate-800">{(dailyUsedMinutes/60).toFixed(1)}</span> h</p></div>
                                    <div className="text-right"><span className={`text-2xl font-bold ${isCritical ? 'text-red-600' : 'text-blue-600'}`}>{(remainingMinutes/60).toFixed(1)}</span><span className="text-[10px] text-slate-500 ml-1 font-medium uppercase">{t.schedule.remaining}</span></div>
                                </div>
                                <div className="w-full bg-white/50 rounded-full h-2.5 overflow-hidden border border-slate-100"><div className={`h-2.5 rounded-full transition-all duration-700 ease-out ${isCritical ? 'bg-red-500' : 'bg-blue-600'}`} style={{ width: `${usedPercentage}%` }}></div></div>
                            </div>
                        )}
                        <form onSubmit={saveSchedule} className="space-y-3">
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">{t.common.start} ({TZ_CONFIG[timezone].label})</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><input type="date" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.startDate} onChange={e => {if(!scheduleForm.endDate) setScheduleForm({...scheduleForm, startDate: e.target.value, endDate: e.target.value});else setScheduleForm({...scheduleForm, startDate: e.target.value});}} /></div>
                                    <div><input type="time" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.startTime} onChange={e => setScheduleForm({...scheduleForm, startTime: e.target.value})} /></div>
                                </div>
                            </div>
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">{t.common.end} ({TZ_CONFIG[timezone].label})</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><input type="date" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.endDate} onChange={e => setScheduleForm({...scheduleForm, endDate: e.target.value})} /></div>
                                    <div><input type="time" required className="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500" value={scheduleForm.endTime} onChange={e => setScheduleForm({...scheduleForm, endTime: e.target.value})} /></div>
                                </div>
                            </div>
                            <button disabled={loading || (remainingMinutes <= 0 && !editScheduleId)} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${editScheduleId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-blue-600 hover:bg-blue-700'}`}>{loading ? <Spinner/> : (editScheduleId ? t.common.save : (remainingMinutes <= 0 ? t.schedule.full : t.schedule.booking))}</button>
                        </form>
                    </div>
                    <div className="space-y-3 pb-20">
                        <div className="flex flex-col gap-2 mb-3 bg-white p-3 rounded-xl border border-slate-100">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide">{showHistory ? t.schedule.allSchedules : t.schedule.upcomingSchedules}</h3>
                                <div className="flex gap-1"><button onClick={() => setSortOrder(prev => prev === 'asc' ? 'desc' : 'asc')} className="p-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition"><i className={`fas fa-sort-amount-${sortOrder === 'asc' ? 'down-alt' : 'up'} text-xs`}></i></button></div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowHistory(!showHistory)} className={`flex-1 text-[10px] py-1.5 rounded border transition font-medium ${showHistory ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>{showHistory ? t.schedule.showUpcoming : t.schedule.showAll}</button>
                                <button onClick={() => setFilterMine(!filterMine)} className={`flex-1 text-[10px] py-1.5 rounded border transition font-medium ${filterMine ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>{filterMine ? t.schedule.onlyMe : t.schedule.allUsers}</button>
                            </div>
                        </div>
                        {filteredSchedules.map(s => {
                            const isMine = String(s.userId) === String(currentUser);
                            const dbStartDate = s.startDate || s.date;
                            const dbEndDate = s.endDate || s.date;
                            const startObj = getDisplayTime(s.startTime, dbStartDate, timezone);
                            const endObj = getDisplayTime(s.endTime, dbEndDate, timezone);
                            const dateDisp = formatDate(startObj.date, lang);

                            return (
                                <div key={s.id} className={`p-4 rounded-xl border flex justify-between items-center ${isMine ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-2 h-10 rounded-full" style={{backgroundColor: getUserColor(s.userId)}}></div>
                                        <div>
                                            <div className="flex items-center gap-2"><span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>{isMine && <span className="text-[10px] bg-blue-100 text-blue-600 px-1.5 rounded font-bold">YOU</span>}</div>
                                            <div className="text-xs text-slate-500 mt-1">{dateDisp} • {startObj.time} - {endObj.time} <span className="text-[8px] bg-slate-200 px-1 rounded">{TZ_CONFIG[timezone].label}</span></div>
                                        </div>
                                    </div>
                                    {isMine && (
                                        <div className="flex gap-2">
                                            <button onClick={() => editSchedule(s)} className="w-8 h-8 rounded-full bg-white border border-blue-100 text-blue-500 hover:bg-blue-50 flex items-center justify-center transition"><i className="fas fa-pen text-xs"></i></button>
                                            <button onClick={() => deleteSchedule(s.id)} className="w-8 h-8 rounded-full bg-white border border-red-100 text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i className="fas fa-trash text-xs"></i></button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        
        const ReportManager = ({ saveTimesheet, timesheetForm, setTimesheetForm, loading, timesheets, getUserName, currentUser, deleteTimesheet, editTimesheetId, setEditTimesheetId, editTimesheet, hasPaymentInfo, onOpenProfile, isAdmin, lang, t, formatCurrency, timezone }) => {
            if (!currentUser) return <div className="space-y-4 fade-in"><div className="bg-blue-50 border-l-4 border-blue-400 p-8 rounded-xl shadow-sm text-center"><div className="flex flex-col items-center gap-3 mb-3"><div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center"><i className="fas fa-user-lock text-blue-500 text-2xl"></i></div><h3 className="font-bold text-blue-800 text-lg">Access Restricted</h3></div><p className="text-sm text-blue-600 mb-6 max-w-xs mx-auto">{t.timesheet.selectUser}</p></div></div>;
            if (!hasPaymentInfo) return <div className="space-y-4 fade-in"><div className="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-xl shadow-sm"><div className="flex items-center gap-3 mb-2"><i className="fas fa-exclamation-triangle text-yellow-500 text-xl"></i><h3 className="font-bold text-yellow-700">{t.timesheet.payInfo}</h3></div><button onClick={onOpenProfile} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition shadow-md active:scale-95">{t.timesheet.fillPayInfo}</button></div></div>;

            const [showHistory, setShowHistory] = React.useState(false); 
            // SORTING FIX: Strict string comparison on "Date+Time"
            const filteredTimesheets = timesheets
                .filter(t => showHistory ? t.status === 'paid' : t.status === 'pending')
                .sort((a,b) => {
                    const timeA = `${a.date}T${a.startTime}`;
                    const timeB = `${b.date}T${b.startTime}`;
                    return timeB.localeCompare(timeA); // Newest First
                });

            const getDisplayAmount = (item) => {
                const baseVal = parseFloat(item.paymentUSD) || 0;
                if (lang === 'id') return baseVal * USD_TO_IDR;
                return baseVal;
            };

            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editTimesheetId ? 'border-orange-500' : 'border-green-500'}`}>
                        <h3 className="font-bold text-slate-700 mb-4">{editTimesheetId ? t.timesheet.editTitle : t.timesheet.title}</h3>
                        <form onSubmit={saveTimesheet} className="space-y-3">
                            <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.common.date} ({TZ_CONFIG[timezone].label})</label><input type="date" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none" value={timesheetForm.date} onChange={e => setTimesheetForm({...timesheetForm, date: e.target.value})} /></div>
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.common.start} ({TZ_CONFIG[timezone].label})</label><input type="time" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none" value={timesheetForm.startTime} onChange={e => setTimesheetForm({...timesheetForm, startTime: e.target.value})} /></div>
                                <div><label className="block text-xs font-semibold text-slate-500 uppercase mb-1">{t.common.duration}</label><input type="number" placeholder="Mins" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none" value={timesheetForm.duration} onChange={e => setTimesheetForm({...timesheetForm, duration: e.target.value})} /></div>
                            </div>
                            <div className="flex justify-between items-center text-xs bg-green-50 text-green-700 p-2 rounded-lg"><span>Est:</span><span className="font-bold">{timesheetForm.duration ? formatCurrency((timesheetForm.duration/60)*RATES[lang], lang) : '0'}</span></div>
                            <button disabled={loading} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 ${editTimesheetId ? 'bg-orange-600 hover:bg-orange-700' : 'bg-green-600 hover:bg-green-700'}`}>{loading ? <Spinner/> : (editTimesheetId ? t.common.save : t.timesheet.submit)}</button>
                        </form>
                    </div>
                    <div className="pb-20">
                        <div className="flex justify-between items-center mb-2"><h3 className="font-bold text-slate-700 text-xs uppercase tracking-wide">{showHistory ? t.timesheet.history : t.timesheet.pending}</h3><button onClick={() => setShowHistory(!showHistory)} className="text-xs text-blue-500 hover:underline">{showHistory ? t.timesheet.historyHide : t.timesheet.historyAll}</button></div>
                        {filteredTimesheets.map(item => {
                            const displayObj = getDisplayTime(item.startTime, item.date, timezone);
                            const displayDate = formatDate(displayObj.date, lang);
                            return (
                                <div key={item.id} className="relative mb-3 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                    <div className="flex justify-between items-start"><div><p className="font-bold text-slate-700 text-sm">{getUserName(item.userId)}</p><p className="text-xs text-slate-400 mt-0.5">{displayDate} • {displayObj.time} ({TZ_CONFIG[timezone].label})</p></div><div className="text-right"><p className="font-bold text-green-600 text-sm">{formatCurrency(getDisplayAmount(item), lang)}</p><p className="text-xs text-slate-400">{item.duration}m</p></div></div>
                                    <div className="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center"><span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${item.status === 'paid' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>{item.status === 'paid' ? t.timesheet.paid : t.timesheet.pending}</span>{String(item.userId) === String(currentUser) && item.status !== 'paid' && (<div className="flex gap-2"><button onClick={() => editTimesheet(item)} className="text-xs text-blue-500"><i className="fas fa-pen"></i></button><button onClick={() => deleteTimesheet(item.id)} className="text-xs text-red-500"><i className="fas fa-trash"></i></button></div>)}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ timesheets, users, schedules, loading, setLoading, showNotify, t, lang, formatCurrency, onAddUser, onEditUser, onDeleteUser, onConfirmAction }) => {
             const [viewMode, setViewMode] = React.useState('pending');
            const getAmount = (item) => { const baseVal = parseFloat(item.paymentUSD) || 0; return lang === 'id' ? baseVal * USD_TO_IDR : baseVal; }
            const pendingSheets = timesheets.filter(t => t.status === 'pending');
            const totalPending = pendingSheets.reduce((sum, t) => sum + getAmount(t), 0);
            
            const paidSheets = timesheets.filter(t => t.status === 'paid');
            const totalAllTimePaid = paidSheets.reduce((sum, t) => sum + getAmount(t), 0);
            
            const paidHistory = {};
            const weeklyStats = {}; // Global weekly stats
            const userTotalPaid = {}; // Total per user
            const userWeeklyPaid = {}; // Weekly per user

            paidSheets.forEach(t => { 
                const amount = getAmount(t);
                const d = t.paidAt ? t.paidAt.split('T')[0] : 'Unknown'; 
                if(!paidHistory[d]) paidHistory[d] = []; 
                paidHistory[d].push(t);
                
                // Weekly Logic
                const paidDateObj = new Date(d);
                const firstDayOfYear = new Date(paidDateObj.getFullYear(), 0, 1);
                const pastDaysOfYear = (paidDateObj - firstDayOfYear) / 86400000;
                const weekNum = Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
                const weekKey = `${paidDateObj.getFullYear()}-W${weekNum}`;
                
                // Global Weekly
                if (!weeklyStats[weekKey]) weeklyStats[weekKey] = 0;
                weeklyStats[weekKey] += amount;

                // Per User Total
                if (!userTotalPaid[t.userId]) userTotalPaid[t.userId] = 0;
                userTotalPaid[t.userId] += amount;

                // Per User Weekly
                if (!userWeeklyPaid[weekKey]) userWeeklyPaid[weekKey] = {};
                if (!userWeeklyPaid[weekKey][t.userId]) userWeeklyPaid[weekKey][t.userId] = 0;
                userWeeklyPaid[weekKey][t.userId] += amount;
            });
            
            const sortedHistory = Object.keys(paidHistory).sort((a,b) => new Date(b) - new Date(a));
            const sortedWeeks = Object.keys(weeklyStats).sort().reverse(); // Newest week first

            const handleMarkPaid = async (sheetIds) => { onConfirmAction(t.timesheet.confirmPaid, async () => { setLoading(true); try { const batch = window.fs.writeBatch(window.db); sheetIds.forEach(id => { const docRef = window.fs.doc(window.db, "timesheets", id); batch.update(docRef, { status: 'paid', paidAt: new Date().toISOString() }); }); await batch.commit(); showNotify("Marked as Paid!"); } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); } }); };
            
            return (
                <div className="space-y-4 fade-in pb-20">
                     <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 overflow-x-auto">
                        <button onClick={() => setViewMode('pending')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'pending' ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>{t.admin.pendingBill}</button>
                        <button onClick={() => setViewMode('history')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'history' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>{t.admin.payHistory}</button>
                        <button onClick={() => setViewMode('users')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'users' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>{t.admin.manageUsers}</button>
                    </div>
                    
                    {viewMode === 'pending' && ( 
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-purple-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg">
                                <h2 className="text-xl font-bold mb-1">{t.admin.pendingBill}</h2>
                                <p className="text-3xl font-bold">{formatCurrency(totalPending, lang)}</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                {pendingSheets.length === 0 ? <p className="text-center text-slate-400 text-sm py-4">No pending bills.</p> : (
                                    <div className="space-y-4">
                                        {Object.values(pendingSheets.reduce((acc, curr) => { 
                                            if(!acc[curr.userId]) acc[curr.userId] = { userId: curr.userId, total: 0, sheets: [] }; 
                                            acc[curr.userId].total += getAmount(curr); 
                                            acc[curr.userId].sheets.push(curr.id); 
                                            return acc; 
                                        }, {})).map(grp => { 
                                            const u = users.find(u => String(u.id) === String(grp.userId)); 
                                            return (
                                                <div key={grp.userId} className="border border-slate-100 rounded-xl p-4">
                                                    <div className="flex justify-between mb-2">
                                                        <div><p className="font-bold">{u?.name}</p><p className="text-xs text-slate-500">{u?.bankName} - {u?.accountNumber}</p></div>
                                                        <p className="font-bold text-green-600">{formatCurrency(grp.total, lang)}</p>
                                                    </div>
                                                    <button onClick={() => handleMarkPaid(grp.sheets)} className="w-full bg-green-600 text-white text-sm font-medium py-2 rounded-lg">{t.admin.markPaid}</button>
                                                </div>
                                            ); 
                                        })}
                                    </div>
                                )}
                            </div>
                        </div> 
                    )}

                    {viewMode === 'history' && ( 
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-green-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg">
                                <h2 className="text-xl font-bold mb-1">Total Terbayar</h2>
                                <p className="text-3xl font-bold">{formatCurrency(totalAllTimePaid, lang)}</p>
                            </div>
                            
                            {/* Total Per User Breakdown */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-700 text-sm mb-3">Total per User (All Time)</h3>
                                <div className="space-y-2">
                                    {Object.keys(userTotalPaid).map(uid => {
                                        const u = users.find(user => String(user.id) === String(uid));
                                        return (
                                            <div key={uid} className="flex justify-between text-sm pb-2 border-b border-slate-50 last:border-0 last:pb-0">
                                                <span>{u?.name || 'Unknown'}</span>
                                                <span className="font-bold text-green-600">{formatCurrency(userTotalPaid[uid], lang)}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Weekly Breakdown Global & User */}
                            <div className="space-y-3">
                                {sortedWeeks.slice(0, 4).map(week => (
                                    <div key={week} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                        <div className="flex justify-between items-center mb-2 border-b border-slate-100 pb-2">
                                            <p className="text-xs uppercase text-slate-500 font-bold">{week}</p>
                                            <p className="text-sm font-bold text-slate-800">{formatCurrency(weeklyStats[week], lang)}</p>
                                        </div>
                                        {/* User breakdown for this week */}
                                        <div className="space-y-1">
                                            {userWeeklyPaid[week] && Object.keys(userWeeklyPaid[week]).map(uid => {
                                                const u = users.find(user => String(user.id) === String(uid));
                                                return (
                                                    <div key={uid} className="flex justify-between text-xs text-slate-500">
                                                        <span>- {u?.name}</span>
                                                        <span>{formatCurrency(userWeeklyPaid[week][uid], lang)}</span>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-6">
                                {sortedHistory.map(d => (
                                    <div key={d}>
                                        <h4 className="text-xs font-bold text-slate-500 uppercase border-b pb-1 mb-2">{d}</h4>
                                        {paidHistory[d].map(item => { 
                                            const u = users.find(u => String(u.id) === String(item.userId)); 
                                            return (
                                                <div key={item.id} className="flex justify-between text-sm py-1">
                                                    <span>{u?.name}</span>
                                                    <span className="font-mono">{formatCurrency(getAmount(item), lang)}</span>
                                                </div> 
                                            )
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div> 
                    )}
                    
                    {viewMode === 'users' && ( <div className="space-y-4"><div className="flex justify-between items-center"><h3 className="font-bold text-slate-700">{t.admin.userList}</h3><button onClick={onAddUser} className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">{t.admin.addUser}</button></div><div className="bg-white rounded-xl border border-slate-200 divide-y">{users.map(u => (<div key={u.id} className={`p-3 flex items-center justify-between ${u.hidden ? 'opacity-60 bg-slate-50' : ''}`}><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style={{backgroundColor: u.color}}>{u.name.substring(0,2)}</div><div><p className="font-bold text-sm text-slate-700 flex items-center gap-2">{u.name}{u.hidden && <span className="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded uppercase tracking-wider">{t.admin.inactive}</span>}</p><p className="text-xs text-slate-400">{u.bankName || '-'}</p></div></div><div className="flex gap-2"><button onClick={() => onEditUser(u)} className="text-blue-500 text-xs"><i className="fas fa-pen"></i></button><button onClick={() => onDeleteUser(u.id)} className="text-red-500 text-xs"><i className="fas fa-trash"></i></button></div></div>))}</div></div> )}
                </div>
            );
        };

        function App() {
            const [view, setView] = React.useState('dashboard');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [users, setUsers] = React.useState([]);
            const [schedules, setSchedules] = React.useState([]);
            const [timesheets, setTimesheets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [notify, setNotify] = React.useState(null);
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showUserModal, setShowUserModal] = React.useState(false);
            const [showAdminLogin, setShowAdminLogin] = React.useState(false);
            const [editingUser, setEditingUser] = React.useState(null);
            const [lang, setLang] = React.useState('id'); 
            const [timezone, setTimezone] = React.useState('WIB'); // Global Timezone State
            const t = TRANSLATIONS[lang];
            const [scheduleForm, setScheduleForm] = React.useState({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' });
            const [editScheduleId, setEditScheduleId] = React.useState(null);
            const [timesheetForm, setTimesheetForm] = React.useState({ date: '', startTime: '', duration: '' });
            const [editTimesheetId, setEditTimesheetId] = React.useState(null);
            const [confirmModal, setConfirmModal] = React.useState({ show: false, message: '', action: null });

            React.useEffect(() => {
                const initData = async () => {
                    if (!window.db) return;
                    window.fs.onSnapshot(window.fs.collection(window.db, 'users'), (snapshot) => {
                        const fetchedUsers = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                        if(fetchedUsers.length === 0) { setUsers(INITIAL_USERS); INITIAL_USERS.forEach(async (u) => await window.fs.setDoc(window.fs.doc(window.db, 'users', u.id), u)); } else { setUsers(fetchedUsers); }
                    });
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'schedules')), (snapshot) => { setSchedules(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}))); });
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'timesheets')), (snapshot) => { setTimesheets(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}))); });
                    const savedId = localStorage.getItem('remote_user_id'); if (savedId) setCurrentUser(savedId);
                };
                setTimeout(initData, 500);
            }, []);

            const showNotify = (msg, type = 'success') => { setNotify({ msg, type }); setTimeout(() => setNotify(null), 3000); };
            const getUserName = (uid) => users.find(u => String(u.id) === String(uid))?.name || 'Unknown';
            const getUserColor = (uid) => users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';
            const dynamicFormatCurrency = (val) => { const num = parseFloat(val) || 0; if (lang === 'id') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num); return new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' }).format(num); };
            const triggerConfirm = (message, action) => { setConfirmModal({ show: true, message, action }); };
            const executeConfirm = () => { if (confirmModal.action) confirmModal.action(); setConfirmModal({ ...confirmModal, show: false, action: null }); };
            
            const saveUserProfile = async (data) => { if(!currentUser) return; setLoading(true); try { await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), data); showNotify(t.profile.saved); setShowProfileModal(false); } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); } };
            const handleSaveUser = async (userData) => { setLoading(true); try { if (editingUser) { await window.fs.updateDoc(window.fs.doc(window.db, 'users', editingUser.id), userData); showNotify("User Updated"); } else { const newId = Date.now().toString(); await window.fs.setDoc(window.fs.doc(window.db, 'users', newId), { ...userData, id: newId }); showNotify("User Added"); } setShowUserModal(false); setEditingUser(null); } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); } };
            const handleDeleteUser = (uid) => { triggerConfirm("Delete user?", async () => { try { await window.fs.deleteDoc(window.fs.doc(window.db, 'users', uid)); showNotify("User Deleted"); } catch(e) { showNotify("Error", "error"); } }); };
            const handleUserChange = (e) => { const selectedId = e.target.value; if (!selectedId) { setCurrentUser(null); localStorage.removeItem('remote_user_id'); return; } if (selectedId === ADMIN_ID) { setShowAdminLogin(true); } else { setCurrentUser(selectedId); localStorage.setItem('remote_user_id', selectedId); } };
