<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteWork Scheduler</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC-5NB0IjJff_-yXSBqSqZLJihx6kHvj2g",
            authDomain: "remotework-db.firebaseapp.com",
            projectId: "remotework-db",
            storageBucket: "remotework-db.firebasestorage.app",
            messagingSenderId: "890725023216",
            appId: "1:890725023216:web:30b10e5e4180825eb47135",
            measurementId: "G-QYCS4M4KJ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.fs = { collection, addDoc, getDocs, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, setDoc };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#475569', success: '#22c55e', danger: '#ef4444', warning: '#f59e0b' },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONSTANTS ---
        const HOURLY_RATE_USD = 17;
        const EXCHANGE_RATE = 16770;
        
        // UPDATED: Initial Seed Data (10 Users)
        const INITIAL_USERS = [
            { id: '1', name: 'Habib', color: '#3b82f6' },
            { id: '2', name: 'Yusuf', color: '#ef4444' },
            { id: '3', name: 'Fathim', color: '#10b981' },
            { id: '4', name: 'Azmi', color: '#8b5cf6' },
            { id: '5', name: 'Nurul', color: '#f59e0b' },
            { id: '6', name: 'Ika', color: '#ec4899' },
            { id: '7', name: 'Yuni', color: '#22c55e' },
            { id: '8', name: 'Nida', color: '#0ea5e9' },
            { id: '9', name: 'Yayan', color: '#a855f7' },
            { id: '10', name: 'Halim', color: '#64748b' }
        ];

        // --- UTILITIES ---
        const formatCurrency = (amount, currency = 'USD') => {
            const num = parseFloat(amount) || 0;
            if (currency === 'IDR') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        };

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        };

        const getShiftMinutes = (timeStr) => {
            if(!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            let minutes = h * 60 + m;
            if (h < 15) minutes += 1440; 
            return minutes - 900; 
        };

        // --- UI COMPONENTS ---
        const Spinner = () => <i className="fas fa-circle-notch fa-spin text-white"></i>;

        const Notification = ({ msg, type, onClose }) => (
            <div className={`fixed top-4 right-4 left-4 md:left-auto z-50 p-4 rounded-lg shadow-xl text-white flex justify-between items-center fade-in ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`}>
                <span className="text-sm font-medium">{msg}</span>
                <button onClick={onClose}><i className="fas fa-times opacity-70 hover:opacity-100"></i></button>
            </div>
        );

        // --- SUB-VIEWS (DEFINED OUTSIDE APP TO PREVENT RE-RENDER LAG) ---

        const DashboardView = ({ currentUser, getUserName, timesheets, schedules, getUserColor }) => {
            const myPending = timesheets.filter(t => String(t.userId) === String(currentUser) && t.status === 'pending');
            const estEarned = myPending.reduce((acc, curr) => acc + (curr.paymentIDR || 0), 0);
            const totalMins = myPending.reduce((acc, curr) => acc + (curr.duration || 0), 0);

            // UPDATED LOGIC: Filter & Sort for Dashboard (Upcoming 5)
            const now = new Date();
            const upcomingSchedules = schedules
                .filter(s => {
                    // Buat object tanggal selesai shift
                    // Kita anggap shift selesai di hari yang sama atau besoknya.
                    // Sederhananya: Tampilkan jadwal yang tanggalnya >= hari ini.
                    // Lebih presisi: Gabungkan Date + EndTime.
                    const sEnd = new Date(`${s.date}T${s.endTime}`);
                    // Jika jam selesai < jam mulai, berarti shift lintas hari (besok)
                    // Tapi untuk simplifikasi dashboard, kita filter yang tanggalnya >= tanggal hari ini
                    // Atau: jadwal yang belum lewat (End Time > Now)
                    
                    // Logic aman: Filter yang tanggalnya hari ini atau masa depan
                    const sDate = new Date(s.date);
                    // Reset jam now ke 00:00 untuk perbandingan tanggal murni
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    
                    return sDate >= today; 
                })
                // Urutkan lagi dari yang terdekat (Ascending)
                .sort((a,b) => {
                    const dateA = new Date(`${a.date}T${a.startTime}`);
                    const dateB = new Date(`${b.date}T${b.startTime}`);
                    return dateA - dateB;
                })
                .slice(0, 5);

            return (
                <div className="space-y-4 fade-in">
                    <div className="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-2xl font-bold">Halo, {currentUser ? getUserName(currentUser) : 'Tim'}! 👋</h2>
                            <p className="text-blue-200 text-sm">Remote Work Scheduler</p>
                            <div className="grid grid-cols-2 gap-4 mt-6">
                                <div className="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
                                    <p className="text-xs text-blue-200 uppercase tracking-wider">Estimasi Gaji</p>
                                    <p className="text-lg font-bold mt-1">{formatCurrency(estEarned, 'IDR')}</p>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
                                    <p className="text-xs text-blue-200 uppercase tracking-wider">Jam Kerja</p>
                                    <p className="text-lg font-bold mt-1">{(totalMins/60).toFixed(1)} Jam</p>
                                </div>
                            </div>
                        </div>
                        <i className="fas fa-robot absolute -right-6 -bottom-6 text-9xl text-white opacity-5"></i>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-calendar-day text-blue-500 mr-2"></i> Jadwal Terkini (5 Terdekat)
                        </h3>
                        <div className="space-y-3">
                            {upcomingSchedules.map(s => (
                                <div key={s.id} className="flex items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                    <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm" style={{backgroundColor: getUserColor(s.userId)}}>
                                        {getUserName(s.userId).substring(0,2).toUpperCase()}
                                    </div>
                                    <div className="ml-3 flex-1">
                                        <div className="flex justify-between">
                                            <span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>
                                            <span className="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-500">{formatDate(s.date)}</span>
                                        </div>
                                        <div className="text-xs text-slate-500 mt-1">
                                            {s.startTime} - {s.endTime}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {upcomingSchedules.length === 0 && <p className="text-center text-slate-400 text-sm py-4">Belum ada jadwal mendekat.</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const ScheduleManager = ({ editScheduleId, setEditScheduleId, scheduleForm, setScheduleForm, saveSchedule, loading, schedules, currentUser, getUserColor, getUserName, deleteSchedule, editSchedule }) => {
            return (
                <div className="space-y-4 fade-in">
                    <div className={`bg-white p-5 rounded-2xl shadow-sm border-l-4 ${editScheduleId ? 'border-orange-500' : 'border-blue-500'}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-700">
                                {editScheduleId ? 'Edit Jadwal' : 'Booking Jadwal'}
                            </h3>
                            {editScheduleId && <button onClick={() => {setEditScheduleId(null); setScheduleForm({date:'', startTime:'15:00', endTime:'16:00'})}} className="text-xs text-red-500">Batal</button>}
                        </div>
                        <form onSubmit={saveSchedule} className="space-y-3">
                            <div>
                                <label className="text-xs font-semibold text-slate-500 uppercase">Tanggal</label>
                                <input type="date" required className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={scheduleForm.date} onChange={e => setScheduleForm({...scheduleForm, date: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 uppercase">Mulai</label>
                                    <input type="time" required className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                        value={scheduleForm.startTime} onChange={e => setScheduleForm({...scheduleForm, startTime: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 uppercase">Selesai</label>
                                    <input type="time" required className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                        value={scheduleForm.endTime} onChange={e => setScheduleForm({...scheduleForm, endTime: e.target.value})} />
                                </div>
                            </div>
                            <button disabled={loading} className={`w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-md transition-all active:scale-95 ${editScheduleId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {loading ? <Spinner/> : (editScheduleId ? 'Update Perubahan' : 'Booking Slot')}
                            </button>
                        </form>
                    </div>

                    <div className="space-y-3 pb-20">
                        <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide">Daftar Jadwal (Ascending)</h3>
                        {schedules.map(s => {
                            const isMine = String(s.userId) === String(currentUser);
                            return (
                                <div key={s.id} className={`p-4 rounded-xl border flex justify-between items-center ${isMine ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-2 h-10 rounded-full" style={{backgroundColor: getUserColor(s.userId)}}></div>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-slate-700 text-sm">{getUserName(s.userId)}</span>
                                                {isMine && <span className="text-[10px] bg-blue-100 text-blue-600 px-1.5 rounded font-bold">YOU</span>}
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1">
                                                {formatDate(s.date)} • {s.startTime} - {s.endTime}
                                            </div>
                                        </div>
                                    </div>
                                    {isMine && (
                                        <div className="flex gap-2">
                                            <button onClick={() => editSchedule(s)} className="w-8 h-8 rounded-full bg-white border border-blue-100 text-blue-500 hover:bg-blue-50 flex items-center justify-center transition"><i className="fas fa-pen text-xs"></i></button>
                                            <button onClick={() => deleteSchedule(s.id)} className="w-8 h-8 rounded-full bg-white border border-red-100 text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i className="fas fa-trash text-xs"></i></button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const ReportManager = ({ saveTimesheet, timesheetForm, setTimesheetForm, loading, timesheets, getUserName, currentUser, deleteTimesheet }) => {
            return (
                <div className="space-y-4 fade-in">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-green-500">
                        <h3 className="font-bold text-slate-700 mb-4">Input Laporan Kerja</h3>
                        <form onSubmit={saveTimesheet} className="space-y-3">
                            <input type="date" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                value={timesheetForm.date} onChange={e => setTimesheetForm({...timesheetForm, date: e.target.value})} />
                            <div className="grid grid-cols-2 gap-3">
                                <input type="time" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                    value={timesheetForm.startTime} onChange={e => setTimesheetForm({...timesheetForm, startTime: e.target.value})} />
                                <input type="number" placeholder="Durasi (Menit)" required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                    value={timesheetForm.duration} onChange={e => setTimesheetForm({...timesheetForm, duration: e.target.value})} />
                            </div>
                            <div className="flex justify-between items-center text-xs bg-green-50 text-green-700 p-2 rounded-lg">
                                <span>Estimasi:</span>
                                <span className="font-bold">{timesheetForm.duration ? formatCurrency((timesheetForm.duration/60)*HOURLY_RATE_USD*EXCHANGE_RATE, 'IDR') : 'Rp 0'}</span>
                            </div>
                            <button disabled={loading} className="w-full py-2.5 rounded-lg bg-green-600 hover:bg-green-700 text-white font-medium text-sm shadow-md transition-all active:scale-95">
                                {loading ? <Spinner/> : 'Kirim Laporan'}
                            </button>
                        </form>
                    </div>

                    <div className="pb-20">
                        {timesheets.map(t => (
                            <div key={t.id} className="relative mb-3 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="font-bold text-slate-700 text-sm">{getUserName(t.userId)}</p>
                                        <p className="text-xs text-slate-400 mt-0.5">{formatDate(t.date)} • {t.startTime}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="font-bold text-green-600 text-sm">{formatCurrency(t.paymentIDR, 'IDR')}</p>
                                        <p className="text-xs text-slate-400">{t.duration} Menit</p>
                                    </div>
                                </div>
                                <div className="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center">
                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${t.status === 'paid' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>
                                        {t.status === 'paid' ? 'LUNAS' : 'PENDING'}
                                    </span>
                                    {String(t.userId) === String(currentUser) && t.status !== 'paid' && (
                                        <button onClick={() => deleteTimesheet(t.id)} className="text-xs text-red-500 hover:text-red-700 flex items-center gap-1">
                                            <i className="fas fa-trash"></i> Hapus
                                        </button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            // STATES
            const [view, setView] = React.useState('dashboard');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [users, setUsers] = React.useState([]);
            const [schedules, setSchedules] = React.useState([]);
            const [timesheets, setTimesheets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [notify, setNotify] = React.useState(null);

            // FORM STATES
            const [scheduleForm, setScheduleForm] = React.useState({ date: '', startTime: '15:00', endTime: '16:00' });
            const [editScheduleId, setEditScheduleId] = React.useState(null);
            const [timesheetForm, setTimesheetForm] = React.useState({ date: '', startTime: '', duration: '' });

            // FIREBASE INIT
            React.useEffect(() => {
                const initData = async () => {
                    if (!window.db) return;
                    
                    // Users Sync
                    const userCol = window.fs.collection(window.db, 'users');
                    const userSnap = await window.fs.getDocs(userCol);
                    if (userSnap.empty) {
                        INITIAL_USERS.forEach(async (u) => await window.fs.setDoc(window.fs.doc(window.db, 'users', u.id), u));
                        setUsers(INITIAL_USERS);
                    } else {
                         window.fs.onSnapshot(userCol, (snapshot) => {
                            setUsers(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})));
                        });
                    }

                    // Schedules Sync - UPDATED SORTING ASCENDING (Earliest to Latest)
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'schedules')), (snapshot) => {
                        setSchedules(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})).sort((a,b) => {
                            // Sort by Date then Time (Ascending)
                            const dateA = new Date(`${a.date}T${a.startTime}`);
                            const dateB = new Date(`${b.date}T${b.startTime}`);
                            return dateA - dateB;
                        }));
                    });

                    // Timesheets Sync
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'timesheets')), (snapshot) => {
                        setTimesheets(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})).sort((a,b) => new Date(b.date) - new Date(a.date)));
                    });

                    // Load User
                    const savedId = localStorage.getItem('remote_user_id');
                    if (savedId) setCurrentUser(savedId);
                };
                setTimeout(initData, 500);
            }, []);

            // COMMON HANDLERS
            const showNotify = (msg, type = 'success') => {
                setNotify({ msg, type });
                setTimeout(() => setNotify(null), 3000);
            };

            const getUserName = (uid) => users.find(u => String(u.id) === String(uid))?.name || 'Unknown';
            const getUserColor = (uid) => users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';

            // SCHEDULE HANDLERS
            const saveSchedule = async (e) => {
                e.preventDefault();
                if (!currentUser) return showNotify("Pilih akun Anda!", "error");
                setLoading(true);
                try {
                    const startMin = getShiftMinutes(scheduleForm.startTime);
                    const endMin = getShiftMinutes(scheduleForm.endTime);
                    const duration = endMin - startMin;

                    if (duration <= 0) throw new Error("Jam selesai harus setelah mulai!");
                    if (duration > 480) throw new Error("Maksimal 8 jam!");

                    const hasConflict = schedules.find(s => {
                        if (editScheduleId && s.id === editScheduleId) return false;
                        if (s.date !== scheduleForm.date) return false;
                        const sStart = getShiftMinutes(s.startTime);
                        const sEnd = getShiftMinutes(s.endTime);
                        return (startMin < sEnd && endMin > sStart);
                    });

                    if (hasConflict) throw new Error(`Bentrok dengan ${getUserName(hasConflict.userId)}!`);

                    const payload = {
                        userId: currentUser,
                        date: scheduleForm.date,
                        startTime: scheduleForm.startTime,
                        endTime: scheduleForm.endTime,
                        updatedAt: new Date().toISOString()
                    };

                    if (editScheduleId) {
                        await window.fs.updateDoc(window.fs.doc(window.db, 'schedules', editScheduleId), payload);
                        showNotify("Update berhasil!");
                    } else {
                        await window.fs.addDoc(window.fs.collection(window.db, 'schedules'), payload);
                        showNotify("Jadwal dibuat!");
                    }
                    setScheduleForm({ date: '', startTime: '15:00', endTime: '16:00' });
                    setEditScheduleId(null);
                } catch (err) {
                    showNotify(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            const deleteSchedule = async (id) => {
                if (!confirm("Hapus?")) return;
                try { await window.fs.deleteDoc(window.fs.doc(window.db, 'schedules', id)); showNotify("Dihapus"); } 
                catch (e) { showNotify("Gagal", "error"); }
            };

            const editSchedule = (item) => {
                setScheduleForm({ date: item.date, startTime: item.startTime, endTime: item.endTime });
                setEditScheduleId(item.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showNotify("Edit Mode", "warning");
            };

            // TIMESHEET HANDLERS
            const saveTimesheet = async (e) => {
                e.preventDefault();
                if (!currentUser) return showNotify("Pilih akun!", "error");
                setLoading(true);
                try {
                    const dur = parseInt(timesheetForm.duration);
                    const usd = (dur / 60) * HOURLY_RATE_USD;
                    const idr = Math.round(usd * EXCHANGE_RATE);
                    const payload = {
                        userId: currentUser,
                        date: timesheetForm.date,
                        startTime: timesheetForm.startTime,
                        duration: dur,
                        paymentUSD: usd.toFixed(2),
                        paymentIDR: idr,
                        status: 'pending',
                        createdAt: new Date().toISOString()
                    };
                    await window.fs.addDoc(window.fs.collection(window.db, 'timesheets'), payload);
                    showNotify("Tersimpan!");
                    setTimesheetForm({ date: '', startTime: '', duration: '' });
                } catch (e) { showNotify("Gagal", "error"); }
                finally { setLoading(false); }
            };

            const deleteTimesheet = async (id) => {
                if (!confirm("Hapus?")) return;
                try { await window.fs.deleteDoc(window.fs.doc(window.db, 'timesheets', id)); showNotify("Dihapus"); }
                catch (e) { showNotify("Gagal", "error"); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col">
                    {notify && <Notification msg={notify.msg} type={notify.type} onClose={() => setNotify(null)} />}
                    
                    <header className="bg-white sticky top-0 z-20 px-4 py-3 shadow-sm border-b border-slate-100 flex justify-between items-center">
                        <h1 className="font-bold text-lg text-blue-700 flex items-center gap-2">
                            <i className="fas fa-layer-group"></i> Outlier<span className="text-slate-700">Team</span>
                        </h1>
                        <div className="flex items-center gap-2">
                            <i className="fas fa-user-circle text-slate-300 text-xl"></i>
                            <select className="text-xs bg-slate-50 border border-slate-200 rounded-md p-1.5 outline-none focus:ring-1 focus:ring-blue-500"
                                value={currentUser || ''} onChange={e => { setCurrentUser(e.target.value); localStorage.setItem('remote_user_id', e.target.value); }}>
                                <option value="">Pilih Akun...</option>
                                {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>
                        </div>
                    </header>

                    <main className="flex-1 p-4">
                        {loading && !users.length ? (
                            <div className="flex flex-col items-center justify-center h-64 text-slate-400 animate-pulse">
                                <i className="fas fa-database text-4xl mb-3"></i>
                                <p className="text-sm">Menghubungkan Database...</p>
                            </div>
                        ) : (
                            <>
                                {view === 'dashboard' && <DashboardView currentUser={currentUser} getUserName={getUserName} timesheets={timesheets} schedules={schedules} getUserColor={getUserColor} />}
                                {view === 'schedule' && <ScheduleManager editScheduleId={editScheduleId} setEditScheduleId={setEditScheduleId} scheduleForm={scheduleForm} setScheduleForm={setScheduleForm} saveSchedule={saveSchedule} loading={loading} schedules={schedules} currentUser={currentUser} getUserColor={getUserColor} getUserName={getUserName} deleteSchedule={deleteSchedule} editSchedule={editSchedule} />}
                                {view === 'timesheet' && <ReportManager saveTimesheet={saveTimesheet} timesheetForm={timesheetForm} setTimesheetForm={setTimesheetForm} loading={loading} timesheets={timesheets} getUserName={getUserName} currentUser={currentUser} deleteTimesheet={deleteTimesheet} />}
                            </>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 z-30 max-w-md mx-auto">
                        <div className="grid grid-cols-3 gap-1 px-2">
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'dashboard' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <i className="fas fa-home text-lg mb-1"></i> <span className="text-[10px] font-medium">Home</span>
                            </button>
                            <button onClick={() => setView('schedule')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'schedule' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <i className="fas fa-calendar-alt text-lg mb-1"></i> <span className="text-[10px] font-medium">Jadwal</span>
                            </button>
                            <button onClick={() => setView('timesheet')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'timesheet' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <i className="fas fa-file-invoice-dollar text-lg mb-1"></i> <span className="text-[10px] font-medium">Laporan</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
