                                                    <div>
                                                        <p className="font-bold text-sm text-slate-700 flex items-center gap-2">
                                                            {u.name}
                                                            {uIsMainAdmin && <span className="text-[9px] bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded uppercase tracking-wider">Admin</span>}
                                                            {!uIsMainAdmin && uPerms.length > 0 && <span className="text-[9px] bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded uppercase tracking-wider">{lang==='id'?'Semi-Admin':'Semi-Admin'}</span>}
                                                            {u.hidden && <span className="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded uppercase tracking-wider">{t.admin.inactive}</span>}
                                                        </p>
                                                        <p className="text-xs text-slate-400">{u.bankName || '-'}</p>
                                                    </div>
                                                </div>
                                                {isAdmin && (
                                                    <div className="flex gap-2">
                                                        <button onClick={() => onEditUser(u)} title={t.common.edit} className="text-blue-500 text-xs"><i className="fas fa-pen"></i></button>
                                                        <button onClick={() => onDeleteUser(u.id)} title={t.common.delete} className="text-red-500 text-xs"><i className="fas fa-trash"></i></button>
                                                    </div>
                                                )}
                                            </div>
                                            {/* Permissions — only main admin can edit, shown for non-main-admin users */}
                                            {isAdmin && !uIsMainAdmin && (
                                                <div className="mt-2.5 ml-11">
                                                    <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
                                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-1.5">
                                                            <i className="fas fa-shield-alt text-slate-300"></i>
                                                            {t.admin.semiAdminPerms}
                                                        </p>
                                                        <div className="grid grid-cols-2 gap-1.5">
                                                            {[
                                                                { key: 'billing',  icon: 'fa-file-invoice-dollar', label: t.admin.permBilling  },
                                                                { key: 'log',      icon: 'fa-history',             label: t.admin.permLog      },
                                                                { key: 'users',    icon: 'fa-users',               label: t.admin.permUsers    },
                                                                { key: 'settings', icon: 'fa-cog',                 label: t.admin.permSettings },
                                                                { key: 'export',   icon: 'fa-download',            label: t.admin.permExport   },
                                                            ].map(({ key, icon, label }) => {
                                                                const active = uPerms.includes(key);
                                                                return (
                                                                    <button key={key}
                                                                        onClick={async () => {
                                                                            const newPerms = active ? uPerms.filter(p => p !== key) : [...uPerms, key];
                                                                            try { await window.fs.updateDoc(window.fs.doc(window.db, 'users', u.id), { permissions: newPerms }); }
                                                                            catch(e) { showNotify(t.common.error, 'error'); }
                                                                        }}
                                                                        className={`flex items-center gap-2 px-2.5 py-2 rounded-lg text-left transition-all press ${active ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-500 border border-slate-200 hover:border-blue-300 hover:text-blue-600'}`}>
                                                                        <i className={`fas ${icon} text-[10px] flex-shrink-0`}></i>
                                                                        <span className="text-[10px] font-bold leading-tight">{label}</span>
                                                                        {active && <i className="fas fa-check text-[8px] ml-auto text-blue-200 flex-shrink-0"></i>}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div> 
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = React.useState('dashboard');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [users, setUsers] = React.useState([]);
            const [schedules, setSchedules] = React.useState([]);
            const [timesheets, setTimesheets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [notify, setNotify] = React.useState(null);
            const [sysSettings, setSysSettings] = React.useState({ dailyQuotaHours: 10 });
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showUserModal, setShowUserModal] = React.useState(false);
            const [passwordModal, setPasswordModal] = React.useState({ show: false, mode: 'login', userId: null });
            const [editingUser, setEditingUser] = React.useState(null);
            
            const [lang, setLang] = React.useState('en'); 
            const [timezone, setTimezone] = React.useState('AEDT'); 
            const t = TRANSLATIONS[lang];
            
            const [scheduleForm, setScheduleForm] = React.useState({ startDate: '', startTime: '14:00', endDate: '', endTime: '15:00' });
            const [editScheduleId, setEditScheduleId] = React.useState(null);
            const [timesheetForm, setTimesheetForm] = React.useState({ scheduleId: '', date: '', startTime: '', endDate: '', endTime: '' });
            const [editTimesheetId, setEditTimesheetId] = React.useState(null);
            const [confirmModal, setConfirmModal] = React.useState({ show: false, message: '', action: null });
            const [timesheetConfirm, setTimesheetConfirm] = React.useState({ show: false, action: null });
            const [bookingConfirm, setBookingConfirm] = React.useState({ show: false, action: null });
            const [appReceiptModal, setAppReceiptModal] = React.useState(null); // { batch, batchKey }
            const userSelectRef = React.useRef(null);
            const [showUserPicker, setShowUserPicker] = React.useState(false);
            // Global user sort — affects Admin User List AND Select Account
            const [userSortPrimary,   setUserSortPrimary]   = React.useState('active'); // 'active'|'inactive'|'none'
            const [userSortSecondary, setUserSortSecondary] = React.useState('az');     // 'az'|'za'|'none'
            const sortedUsers = React.useMemo(() => [...users].sort((a,b) => {
                if (userSortPrimary === 'active')   { const d=(a.hidden?1:0)-(b.hidden?1:0); if(d!==0) return d; }
                if (userSortPrimary === 'inactive') { const d=(b.hidden?1:0)-(a.hidden?1:0); if(d!==0) return d; }
                if (userSortSecondary === 'az') return a.name.localeCompare(b.name);
                if (userSortSecondary === 'za') return b.name.localeCompare(a.name);
                return 0;
            }), [users, userSortPrimary, userSortSecondary]);
            const [activityLog, setActivityLog] = React.useState([]);
            // logActivity: writes to Firestore activityLog collection (persists across devices)
            // Strategy: keep max 150 entries, delete oldest when over limit — cheap on Firestore
            const logActivity = React.useCallback(async (action, detail, userId) => {
                if (!window.db) return;
                try {
                    await window.fs.addDoc(window.fs.collection(window.db, 'activityLog'), {
                        ts: new Date().toISOString(),
                        action, detail, userId
                    });
                    // Async cleanup: if over 150, trim oldest (fire-and-forget, no orderBy needed)
                    window.fs.getDocs(window.fs.collection(window.db, 'activityLog')).then(snap => {
                        if (snap.docs.length > 150) {
                            const sorted = snap.docs.slice().sort((a,b) => a.data().ts.localeCompare(b.data().ts));
                            const toDelete = sorted.slice(0, snap.docs.length - 150);
                            const batch = window.fs.writeBatch(window.db);
                            toDelete.forEach(d => batch.delete(window.fs.doc(window.db, 'activityLog', d.id)));
                            batch.commit().catch(()=>{});
                        }
                    }).catch(()=>{});
                } catch(e) {
                    console.warn('Activity log write failed:', e);
                }
            }, []);

            React.useEffect(() => {
                const initData = async () => {
                    if (!window.db) return;

                    window.fs.onSnapshot(window.fs.collection(window.db, 'users'), (snapshot) => {
                        const fetchedUsers = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                        if(fetchedUsers.length === 0) { 
                            setUsers(INITIAL_USERS); 
                            INITIAL_USERS.forEach(async (u) => {
                                try {
                                    await window.fs.setDoc(window.fs.doc(window.db, 'users', u.id), u);
                                } catch(e) {}
                            }); 
                        } else { 
                            setUsers(fetchedUsers); 
                        }
                    }, (err) => console.error("Users error:", err.message));
                    
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'schedules')), (snapshot) => { 
                        setSchedules(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}))); 
                    }, (err) => console.error(err));
                    
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'timesheets')), (snapshot) => { 
                        setTimesheets(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}))); 
                    }, (err) => console.error(err));
                    
                    window.fs.onSnapshot(window.fs.doc(window.db, 'settings', 'global'), (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            setSysSettings(data);
                            if (data.baseHourlyRateUSD !== undefined) RATES.en = data.baseHourlyRateUSD;
                            if (data.baseHourlyRateUSD !== undefined && data.usdToIdr !== undefined) RATES.id = data.baseHourlyRateUSD * data.usdToIdr;
                            if (data.offsetWIB  !== undefined) TZ_CONFIG['WIB'].offsetUTC  = data.offsetWIB;
                            if (data.offsetWITA !== undefined) TZ_CONFIG['WITA'].offsetUTC = data.offsetWITA;
                            if (data.offsetAEDT !== undefined) TZ_CONFIG['AEDT'].offsetUTC = data.offsetAEDT;
                            if (data.offsetPST  !== undefined) TZ_CONFIG['PST'].offsetUTC  = data.offsetPST;
                        } else {
                            window.fs.setDoc(window.fs.doc(window.db, 'settings', 'global'), { 
                                dailyQuotaHours: 10, baseHourlyRateUSD: 15, usdToIdr: 16000, 
                                offsetWIB: 7, offsetWITA: 8, offsetAEDT: 11, offsetPST: -8 
                            }).catch(e => {});
                        }
                    }, (err) => console.error(err));

                    // activityLog: read ALL (no orderBy — avoids Firestore composite index requirement),
                    // sort newest-first in JS, show latest 100
                    window.fs.onSnapshot(
                        window.fs.collection(window.db, 'activityLog'),
                        (snapshot) => {
                            const entries = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                            entries.sort((a, b) => b.ts.localeCompare(a.ts));
                            setActivityLog(entries.slice(0, 100));
                        },
                        (err) => console.warn('activityLog listener error:', err)
                    );
                };
                
                // Implementasi Opsi 2: Ambil Karcis Anonymous sebelum menarik data
                if (window.fa && window.auth) {
                    window.fa.signInAnonymously(window.auth).then(() => {
                        initData();
                    }).catch(err => {
                        console.error("Anonymous auth failed (might be preview environment):", err);
                        // Fallback ke initData meskipun gagal, berjaga-jaga jika rules masih terbuka
                        initData();
                    });
                } else {
                    initData();
                }
                
            }, []);

            const showNotify = (msg, type = 'success', duration = 3000) => { setNotify({ msg, type }); if (duration > 0) setTimeout(() => setNotify(null), duration); };
            const getUserName = (uid) => users.find(u => String(u.id) === String(uid))?.name || t.common.unknown;
            const getUserColor = (uid) => users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';
            const triggerConfirm = (message, action) => { setConfirmModal({ show: true, message, action }); };
            const executeConfirm = () => { if (confirmModal.action) confirmModal.action(); setConfirmModal({ show: false, message: '', action: null }); };
            
            const saveUserProfile = async (data) => { 
                if(!currentUser) return; 
                setLoading(true); 
                try { 
                    await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), data); 
                    showNotify(t.common.saved); 
                    setShowProfileModal(false); 
                } catch(e) { 
                    showNotify(t.common.error, "error"); 
                } finally { 
                    setLoading(false); 
                } 
            };
            
            const handleSaveUser = async (userData) => { 
                setLoading(true); 
                try { 
                    if (editingUser) {
                        await window.fs.updateDoc(window.fs.doc(window.db, 'users', editingUser.id), userData);
                    } else {
                        const newId = Date.now().toString();
                        await window.fs.setDoc(window.fs.doc(window.db, 'users', newId), { ...userData, id: newId });
                    }
                    showNotify(editingUser ? t.admin.userUpdated : t.admin.userAdded); 
                    setShowUserModal(false); 
                    setEditingUser(null); 
                } catch(e) { 
                    showNotify(t.common.error, "error"); 
                } finally { 
                    setLoading(false); 
                } 
            };
            
            const handleDeleteUser = (uid) => { 
                triggerConfirm(t.admin.deleteUserConfirm, async () => { 
                    try { 
                        await window.fs.deleteDoc(window.fs.doc(window.db, 'users', uid)); 
                        showNotify(t.admin.userDeleted); 
                    } catch(e) { 
                        showNotify(t.common.error, "error"); 
                    } 
                }); 
            };
            
            const updateSysSettings = async (newSettings) => { 
                setLoading(true); 
                try { 
                    await window.fs.setDoc(window.fs.doc(window.db, 'settings', 'global'), newSettings, { merge: true }); 
                    showNotify(t.common.saved); 
                } catch(e) { 
                    showNotify(t.common.error, "error"); 
                } finally { 
                    setLoading(false); 
                } 
            };

            const handleLogout = () => {
                setCurrentUser(null);
                showNotify(t.common.logoutSuccess);
            };

            const handleUserChange = (e) => { 
                const selectedId = e.target.value; 
                if (!selectedId) { setCurrentUser(null); return; } 
                
                const selectedUser = users.find(u => String(u.id) === String(selectedId));
                if (!selectedUser) return;
                
                if (!selectedUser.password) { 
                    setPasswordModal({ show: true, mode: 'create', userId: selectedId }); 
                } else { 
                    setPasswordModal({ show: true, mode: 'login', userId: selectedId }); 
                }
            };

            const handlePasswordSubmit = async (password) => {
                const { mode, userId } = passwordModal;
                const targetId = userId || currentUser;
                const user = users.find(u => String(u.id) === String(targetId));
                
                setLoading(true);
                try {
                    const hashed = await hashPassword(password);
                    
                    if (mode === 'create') {
                        await window.fs.updateDoc(window.fs.doc(window.db, 'users', targetId), { password: hashed });
                        setCurrentUser(targetId);
                        setPasswordModal({ show: false, mode: 'login', userId: null });
                        showNotify(t.auth.successCreate, 'success');
                    } else if (mode === 'login') {
                        if (user && (user.password === password || user.password === hashed)) {
                            // Upgrade plain text silently if it matches exactly
                            if (user.password === password) {
                                await window.fs.updateDoc(window.fs.doc(window.db, 'users', targetId), { password: hashed });
                            }
                            setCurrentUser(targetId); 
                            setPasswordModal({ show: false, mode: 'login', userId: null }); 
                            showNotify(t.auth.successLogin); 
                        } else {
                            showNotify(t.auth.errorPass, "error"); 
                        }
                    } else if (mode === 'change') {
                        if (user && (user.password === password || user.password === hashed)) {
                             showNotify(t.auth.errorSame, "error"); 
                             return; 
                        }
                        setPasswordModal(prev => ({ ...prev, show: false }));
                        triggerConfirm(t.auth.confirmChange, async () => { 
                            setLoading(true); 
                            try { 
                                await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), { password: hashed }); 
                                showNotify(t.auth.successChange, 'success'); 
                            } catch(e) { 
                                showNotify(t.auth.errorUpdatePass, "error"); 
                            } finally { 
                                setLoading(false); 
                            } 
                        });
                    }
                } catch(err) {
                    showNotify(t.common.error, "error");
                    console.error("Pass Submit Error:", err);
                } finally {
                    setLoading(false); 
                }
            };

            const saveSchedule = async (e) => {
                e.preventDefault(); 
                if (!currentUser) return showNotify(t.timesheet.selectUser, "error");
                if (!scheduleForm.startDate || !scheduleForm.startTime || !scheduleForm.endDate || !scheduleForm.endTime) return showNotify(t.common.requiredField, "error");

                // Hard block: compute quota from App-scope state to avoid ReferenceError
                if (!editScheduleId) {
                    const maxMinsLocal = (sysSettings?.dailyQuotaHours || 10) * 60;
                    const targetPstLocal = getPSTDayFromEpoch(
                        getEpochFromWIB(
                            getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone).date,
                            getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone).time
                        )
                    );
                    const usedMinsLocal = schedules.reduce((acc, s) => {
                        if (getPSTDay(s.startDate || s.date, s.startTime) !== targetPstLocal) return acc;
                        const sE = getEpochFromWIB(s.startDate || s.date, s.startTime);
                        let eE = getEpochFromWIB(s.endDate || s.date, s.endTime);
                        if (!s.endDate && eE <= sE) eE += 86400000;
                        return acc + Math.floor((eE - sE) / 60000);
                    }, 0);
                    if (usedMinsLocal >= maxMinsLocal) {
                        return showNotify(
                            lang === 'id'
                                ? `Kuota harian sudah penuh (${(usedMinsLocal/60).toFixed(1)}${t.common.unitShort}/${sysSettings?.dailyQuotaHours||10}${t.common.unitShort}). Booking baru tidak diizinkan.`
                                : `Daily quota is full (${(usedMinsLocal/60).toFixed(1)}${t.common.unitShort}/${sysSettings?.dailyQuotaHours||10}${t.common.unitShort}). No new bookings allowed.`,
                            "error", 5000
                        );
                    }
                }
                
                const startStr = `${scheduleForm.startDate}T${scheduleForm.startTime}`;
                const endStr = `${scheduleForm.endDate}T${scheduleForm.endTime}`;
                if (endStr <= startStr) return showNotify(t.timesheet.timeError, "error"); 

                const dbStart = getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone);
                const dbEnd = getDbTime(scheduleForm.endTime, scheduleForm.endDate, timezone);
                const newStartEpoch = getEpochFromWIB(dbStart.date, dbStart.time);
                const newEndEpoch = getEpochFromWIB(dbEnd.date, dbEnd.time);

                const currentEpochNow = Date.now();
                const dNowComp = new Date(currentEpochNow + TZ_CONFIG[timezone].offsetUTC * 3600000);
                const currentTimeTzStr = `${dNowComp.getUTCFullYear()}-${String(dNowComp.getUTCMonth() + 1).padStart(2, '0')}-${String(dNowComp.getUTCDate()).padStart(2, '0')}T${String(dNowComp.getUTCHours()).padStart(2, '0')}:${String(dNowComp.getUTCMinutes()).padStart(2, '0')}`;
                
                if (!editScheduleId && startStr < currentTimeTzStr) {
                    if ((new Date(currentTimeTzStr) - new Date(startStr)) > 60000) return showNotify(t.schedule.pastError, "error");
                }

                let conflictUser = null;
                const isConflict = schedules.some(s => {
                    if (editScheduleId && s.id === editScheduleId) return false;
                    const existStartEpoch = getEpochFromWIB(s.startDate || s.date, s.startTime);
                    let existEndEpoch = getEpochFromWIB(s.endDate || s.date, s.endTime);
                    if (!s.endDate && existEndEpoch <= existStartEpoch) existEndEpoch += 86400000;
                    if (newStartEpoch < existEndEpoch && newEndEpoch > existStartEpoch) { conflictUser = getUserName(s.userId); return true; }
                    return false;
                });

                if (isConflict) return showNotify(`${t.schedule.conflict} ${conflictUser}!`, "error");

                // Hard quota block per PT day — applies to both new and edit
                {
                    const newPstDay = getPSTDayFromEpoch(newStartEpoch);
                    const existingMinsOnDay = schedules.reduce((acc, s) => {
                        // Exclude the schedule being edited from the existing total
                        if (editScheduleId && s.id === editScheduleId) return acc;
                        if (getPSTDay(s.startDate || s.date, s.startTime) !== newPstDay) return acc;
                        const sE = getEpochFromWIB(s.startDate || s.date, s.startTime);
                        let eE = getEpochFromWIB(s.endDate || s.date, s.endTime);
                        if (!s.endDate && eE <= sE) eE += 86400000;
                        return acc + Math.floor((eE - sE) / 60000);
                    }, 0);
                    const newDurMins = Math.floor((newEndEpoch - newStartEpoch) / 60000);
                    const maxMins = (sysSettings?.dailyQuotaHours || 10) * 60;
                    if (existingMinsOnDay + newDurMins > maxMins) {
                        const over = existingMinsOnDay + newDurMins - maxMins;
                        return showNotify(
                            lang === 'id'
                                ? `Kuota harian PT terlampaui! Sisa ${maxMins - existingMinsOnDay} menit, jadwal ini ${newDurMins} menit (lebih ${over} menit).`
                                : `Daily PT quota exceeded! ${maxMins - existingMinsOnDay} min remaining, this schedule is ${newDurMins} min (over by ${over} min).`,
                            "error", 5000
                        );
                    }
                }

                setBookingConfirm({ show: true, action: async () => {
                    setBookingConfirm({ show: false, action: null });
                    setLoading(true);
                    try {
                        // ── FRESH READ from Firestore immediately before write ──
                        const freshSnap = await window.fs.getDocs(window.fs.collection(window.db, 'schedules'));
                        const freshSchedules = freshSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                        let freshConflictUser = null;
                        const hasFreshConflict = freshSchedules.some(s => {
                            if (editScheduleId && s.id === editScheduleId) return false;
                            const eS = getEpochFromWIB(s.startDate || s.date, s.startTime);
                            let eE = getEpochFromWIB(s.endDate || s.date, s.endTime);
                            if (!s.endDate && eE <= eS) eE += 86400000;
                            if (newStartEpoch < eE && newEndEpoch > eS) { freshConflictUser = getUserName(s.userId); return true; }
                            return false;
                        });
                        if (hasFreshConflict) { setLoading(false); return showNotify(`${t.schedule.conflict} ${freshConflictUser}!`, "error"); }

                        const freshPstDay = getPSTDayFromEpoch(newStartEpoch);
                        const freshExistingMins = freshSchedules.reduce((acc, s) => {
                            if (editScheduleId && s.id === editScheduleId) return acc;
                            if (getPSTDay(s.startDate || s.date, s.startTime) !== freshPstDay) return acc;
                            const sE = getEpochFromWIB(s.startDate || s.date, s.startTime);
                            let eE = getEpochFromWIB(s.endDate || s.date, s.endTime);
                            if (!s.endDate && eE <= sE) eE += 86400000;
                            return acc + Math.floor((eE - sE) / 60000);
                        }, 0);
                        const freshNewDurMins = Math.floor((newEndEpoch - newStartEpoch) / 60000);
                        const freshMaxMins = (sysSettings?.dailyQuotaHours || 10) * 60;
                        if (freshExistingMins + freshNewDurMins > freshMaxMins) {
                            const freshOver = freshExistingMins + freshNewDurMins - freshMaxMins;
                            const freshRemaining = freshMaxMins - freshExistingMins;
                            setLoading(false);
                            return showNotify(lang === 'id'
                                ? `Kuota penuh! Sisa ${freshRemaining < 0 ? 0 : freshRemaining} menit, jadwal ini ${freshNewDurMins} menit (lebih ${freshOver} menit).`
                                : `Quota full! ${freshRemaining < 0 ? 0 : freshRemaining} min left, this schedule is ${freshNewDurMins} min (over by ${freshOver} min).`,
                                "error", 6000);
                        }

                        const payload = { userId: currentUser, startDate: dbStart.date, startTime: dbStart.time, endDate: dbEnd.date, endTime: dbEnd.time, updatedAt: new Date().toISOString() };
                        if (editScheduleId) {
                            await window.fs.updateDoc(window.fs.doc(window.db, 'schedules', editScheduleId), payload);
                            logActivity('schedule_edit', `${dbStart.date} ${dbStart.time}–${dbEnd.time}`, currentUser);
                        } else {
                            await window.fs.addDoc(window.fs.collection(window.db, 'schedules'), payload);
                            logActivity('schedule_create', `${dbStart.date} ${dbStart.time}–${dbEnd.time}`, currentUser);
                        }
                        showNotify(editScheduleId ? t.schedule.update : t.schedule.success);
                        setScheduleForm({ startDate: '', startTime: '14:00', endDate: '', endTime: '15:00' });
                        setEditScheduleId(null);
                    } catch(err) { showNotify(err.message || t.common.error, "error"); } finally { setLoading(false); }
                }});
            };

            const deleteSchedule = (id) => { 
                if (timesheets.some(ts => ts.scheduleId === id)) return showNotify(t.schedule.deleteLinkedError, "error", 5000);
                const s = schedules.find(x => x.id === id);
                triggerConfirm(t.common.delete + "?", async () => {
                    await window.fs.deleteDoc(window.fs.doc(window.db, 'schedules', id));
                    if (s) logActivity('schedule_delete', `${s.startDate || s.date} ${s.startTime}–${s.endTime}`, s.userId);
                }); 
            };

            const editSchedule = (item) => { 
                const uiStart = getDisplayTime(item.startTime, item.startDate || item.date, timezone);
                const uiEnd = getDisplayTime(item.endTime, item.endDate || item.date, timezone);
                setScheduleForm({startDate: uiStart.date, startTime: uiStart.time, endDate: uiEnd.date, endTime: uiEnd.time}); setEditScheduleId(item.id); window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const saveTimesheet = async (e) => {
                e.preventDefault(); 
                if (!currentUser) return showNotify(t.timesheet.selectUser, "error");
                if (!timesheetForm.scheduleId || !timesheetForm.date || !timesheetForm.startTime || !timesheetForm.endDate || !timesheetForm.endTime) return showNotify(t.common.requiredField, "error");

                const startStr = `${timesheetForm.date}T${timesheetForm.startTime}`;
                const endStr = `${timesheetForm.endDate || timesheetForm.date}T${timesheetForm.endTime}`;
                if (endStr <= startStr) return showNotify(t.timesheet.timeError, "error"); 

                if (timesheetForm.scheduleId) {
                    if (timesheets.some(ts => String(ts.userId) === String(currentUser) && ts.scheduleId && String(ts.scheduleId) === String(timesheetForm.scheduleId) && ts.id !== editTimesheetId)) return showNotify(t.timesheet.duplicateError, "error");
                    const selectedSchedule = schedules.find(s => String(s.id) === String(timesheetForm.scheduleId));
                    if (selectedSchedule) {
                        const schedStartEpoch = getEpochFromWIB(selectedSchedule.startDate || selectedSchedule.date, selectedSchedule.startTime);
                        let schedEndEpoch = getEpochFromWIB(selectedSchedule.endDate || selectedSchedule.date, selectedSchedule.endTime);
                        if (schedEndEpoch <= schedStartEpoch) schedEndEpoch += 86400000; 
                        if (Date.now() < (schedEndEpoch - 120000)) return showNotify(t.timesheet.earlySubmitError, "error");
                    }
                }

                const dbStart = getDbTime(timesheetForm.startTime, timesheetForm.date, timezone);
                const dbEnd = getDbTime(timesheetForm.endTime, timesheetForm.endDate || timesheetForm.date, timezone);
                const newStartEpoch = getEpochFromWIB(dbStart.date, dbStart.time);
                let newEndEpoch = getEpochFromWIB(dbEnd.date, dbEnd.time);
                if (newEndEpoch <= newStartEpoch) newEndEpoch += 86400000;

                const isOverlap = timesheets.some(ts => {
                    if (String(ts.userId) !== String(currentUser)) return false;
                    if (editTimesheetId && ts.id === editTimesheetId) return false;
                    const existStartEpoch = getEpochFromWIB(ts.date, ts.startTime);
                    let existEndEpoch;
                    if (ts.endTime) { existEndEpoch = getEpochFromWIB(ts.endDate || ts.date, ts.endTime); if (existEndEpoch <= existStartEpoch) existEndEpoch += 86400000; } else if (ts.duration) { existEndEpoch = existStartEpoch + (ts.duration * 60000); } else return false;
                    return (newStartEpoch < existEndEpoch && newEndEpoch > existStartEpoch);
                });

                if (isOverlap) return showNotify(t.timesheet.overlapError, "error");

                // For timesheet submit, use the styled TimesheetConfirmModal
                setTimesheetConfirm({ show: true, action: async () => {
                    setTimesheetConfirm({ show: false, action: null });
                    setLoading(true);
                    try {
                        const d1 = new Date(`${dbStart.date}T${dbStart.time}:00Z`);
                        let d2 = new Date(`${dbEnd.date}T${dbEnd.time}:00Z`);
                        if (d2 < d1) d2.setUTCDate(d2.getUTCDate() + 1);
                        const dur = Math.max(0, Math.round((d2 - d1) / 60000));
                        if (dur <= 0) { setLoading(false); return showNotify(t.timesheet.timeError, "error"); }

                        const userRateUSD = (sysSettings?.userRates?.[String(currentUser)] && Number(sysSettings.userRates[String(currentUser)]) > 0)
                            ? Number(sysSettings.userRates[String(currentUser)])
                            : RATES.en;
                        const exchangeRate = RATES.en > 0 ? RATES.id / RATES.en : 16000;
                        const idr = Math.round((dur/60) * userRateUSD * exchangeRate);
                        const usd = ((dur/60) * userRateUSD).toFixed(2); 
                        
                        const payload = { userId: currentUser, scheduleId: timesheetForm.scheduleId || '', date: dbStart.date, startTime: dbStart.time, endDate: dbEnd.date, endTime: dbEnd.time, duration: dur, paymentUSD: usd, paymentIDR: idr, status: 'pending', updatedAt: new Date().toISOString() };
                        if (editTimesheetId) {
                            await window.fs.updateDoc(window.fs.doc(window.db, 'timesheets', editTimesheetId), payload);
                            logActivity('timesheet_edit', `${dbStart.date} ${dbStart.time}–${dbEnd.time} (${dur}m)`, currentUser);
                        } else {
                            payload.createdAt = new Date().toISOString();
                            await window.fs.addDoc(window.fs.collection(window.db, 'timesheets'), payload);
                            logActivity('timesheet_create', `${dbStart.date} ${dbStart.time}–${dbEnd.time} (${dur}m)`, currentUser);
                        }
                        showNotify(t.common.saved); setTimesheetForm({ scheduleId: '', date: '', startTime: '', endDate: '', endTime: '' }); setEditTimesheetId(null);
                    } catch(e) { showNotify(t.common.error, "error"); } finally { setLoading(false); }
                }});
            };
            
            const deleteTimesheet = (id) => {
                const ts = timesheets.find(x => x.id === id);
                triggerConfirm(t.common.delete + "?", async () => {
                    await window.fs.deleteDoc(window.fs.doc(window.db, 'timesheets', id));
                    if (ts) logActivity('timesheet_delete', `${ts.date} ${ts.startTime} (${ts.duration}m)`, ts.userId);
                });
            };
            
            const editTimesheet = (item) => { 
                const uiStart = getDisplayTime(item.startTime, item.date, timezone);
                let finalEndDate = item.endDate || item.date;
                let finalEndTime = item.endTime;

                if (!finalEndTime && item.duration) {
                     const startEpoch = getEpochFromWIB(item.date, item.startTime);
                     const endEpoch = startEpoch + (item.duration * 60000);
                     // Use offsetUTC-based display conversion (consistent with getDisplayTime)
                     const endObj = new Date(endEpoch + TZ_CONFIG[timezone].offsetUTC * 3600000);
                     finalEndDate = `${endObj.getUTCFullYear()}-${String(endObj.getUTCMonth()+1).padStart(2,'0')}-${String(endObj.getUTCDate()).padStart(2,'0')}`;
                     finalEndTime = `${String(endObj.getUTCHours()).padStart(2,'0')}:${String(endObj.getUTCMinutes()).padStart(2,'0')}`;
                } else if (finalEndTime) {
                     const uiEnd = getDisplayTime(finalEndTime, finalEndDate, timezone);
                     finalEndDate = uiEnd.date;
                     finalEndTime = uiEnd.time;
                }

                setTimesheetForm({ scheduleId: item.scheduleId || '', date: uiStart.date, startTime: uiStart.time, endDate: finalEndDate, endTime: finalEndTime || '' }); 
                setEditTimesheetId(item.id); window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const isAdmin = String(currentUser) === ADMIN_ID;
            const activeUser = users.find(u => String(u.id) === String(currentUser));
            // Semi-admin: user has at least one permission granted by ADMIN
            const userPerms = isAdmin ? ['billing','log','users','settings','export'] : (activeUser?.permissions || []);
            const canAdmin = isAdmin || userPerms.length > 0;
            const hasPerm = (perm) => isAdmin || userPerms.includes(perm);
            const hasPaymentInfo = activeUser && activeUser.bankName && activeUser.accountNumber;

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col font-sans text-slate-800" style={{background:'transparent'}}>
                    {notify && (
                        <Notification 
                            msg={notify.msg} 
                            type={notify.type} 
                            onClose={() => setNotify(null)} 
                        />
                    )}
                    
                    {showProfileModal && (
                        <ProfileModal 
                            user={activeUser} 
                            onClose={() => setShowProfileModal(false)} 
                            onSave={saveUserProfile} 
                            loading={loading} 
                            lang={lang} 
                            t={t} 
                            onChangePassword={() => { setShowProfileModal(false); setPasswordModal({show: true, mode: 'change', userId: currentUser}); }} 
                            showNotify={showNotify} 
                        />
                    )}
                    
                    {showUserModal && (
                        <UserModal 
                            user={editingUser} 
                            onClose={() => {setShowUserModal(false); setEditingUser(null);}} 
                            onSave={handleSaveUser} 
                            loading={loading} 
                            t={t} 
                            showNotify={showNotify} 
                        />
                    )}
                    
                    {passwordModal.show && (
                        <PasswordModal 
                            mode={passwordModal.mode} 
                            userName={users.find(u => String(u.id) === String(passwordModal.userId))?.name} 
                            onSubmit={handlePasswordSubmit} 
                            onClose={() => setPasswordModal({ ...passwordModal, show: false })} 
                            loading={loading} 
                            t={t} 
                            showNotify={showNotify} 
                        />
                    )}
                    
                    {bookingConfirm.show && (
                        <BookScheduleConfirmModal
                            lang={lang} t={t}
                            onConfirm={() => bookingConfirm.action && bookingConfirm.action()}
                            onCancel={() => setBookingConfirm({ show: false, action: null })}
                        />
                    )}

                    {timesheetConfirm.show && (
                        <TimesheetConfirmModal
                            lang={lang}
                            t={t}
                            onConfirm={() => timesheetConfirm.action && timesheetConfirm.action()}
                            onCancel={() => setTimesheetConfirm({ show: false, action: null })}
                        />
                    )}

                    {/* App-level receipt modal — must be here, NOT inside AdminPanel/AnalyticsView,
                        because those have transform animations that break position:fixed */}
                    {appReceiptModal && (
                        <ReceiptModal
                            batch={appReceiptModal.batch}
                            batchKey={appReceiptModal.batchKey}
                            users={users}
                            lang={lang}
                            t={t}
                            formatCurrency={formatCurrency}
                            timezone={timezone}
                            onClose={() => setAppReceiptModal(null)}
                        />
                    )}

                    {confirmModal.show && (
                        <ConfirmationModal 
                            isOpen={confirmModal.show} 
                            message={confirmModal.message} 
                            onConfirm={executeConfirm} 
                            onCancel={() => setConfirmModal({ ...confirmModal, show: false })} 
                            t={t} 
                        />
                    )}

                    {showUserPicker && (
                        <QuickUserPickerModal
                            users={sortedUsers}
                            lang={lang}
                            t={t}
                            onClose={() => setShowUserPicker(false)}
                            onPick={(userId) => {
                                setShowUserPicker(false);
                                // Simulate handleUserChange
                                const selectedUser = users.find(u => String(u.id) === String(userId));
                                if (!selectedUser) return;
                                if (!selectedUser.password) {
                                    setPasswordModal({ show: true, mode: 'create', userId });
                                } else {
                                    setPasswordModal({ show: true, mode: 'login', userId });
                                }
                            }}
                        />
                    )}

                    <header className={`glass-strong sticky top-0 z-[60] border-b border-white/70 shadow-sm transition-opacity duration-200 ${passwordModal.show ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                        <div className="px-4 pt-3 pb-2 flex justify-between items-center">
                            {/* Logo */}
                            <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 bg-gradient-to-br from-blue-600 via-blue-500 to-indigo-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                    <i className="fas fa-layer-group text-sm"></i>
                                </div>
                                <div>
                                    <h1 className="font-black text-base text-slate-800 leading-none tracking-tight">Scheduler</h1>
                                    <p className="text-[9px] text-slate-400 font-bold tracking-widest uppercase mt-0.5">Remote Work</p>
                                </div>
                            </div>

                            {/* Right side: logout + user picker */}
                            <div className="flex items-center gap-2">
                                {currentUser && (
                                    <button onClick={handleLogout}
                                        className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-red-100 bg-red-50/70 text-red-500 hover:bg-red-100 hover:border-red-200 transition-all duration-200 active:scale-95 text-[11px] font-bold">
                                        <i className="fas fa-sign-out-alt text-xs"></i>
                                        <span>{t.common.logout}</span>
                                    </button>
                                )}
                                <div className="relative group">
                                    <div className="flex items-center gap-2 glass border border-white/90 hover:border-blue-200/80 rounded-full pl-1 pr-3 py-1 shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer" title={t.tooltips.userSelect}>
                                        <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold ring-2 ring-white shadow-sm" style={{backgroundColor: activeUser ? activeUser.color : '#94a3b8'}}>
                                            {activeUser ? activeUser.name.substring(0,1).toUpperCase() : <i className="fas fa-user text-[9px]"></i>}
                                        </div>
                                        <span className="text-xs font-semibold text-slate-600 max-w-[72px] truncate">
                                            {activeUser ? activeUser.name : t.timesheet.selectUser}
                                        </span>
                                        <i className="fas fa-chevron-down text-[9px] text-slate-400 group-hover:text-blue-400 transition-colors"></i>
                                        <select ref={userSelectRef} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" value={currentUser || passwordModal.userId || ''} onChange={handleUserChange}>
                                            <option value="" disabled>{t.timesheet.selectUser}</option>
                                            {users.filter(u => !u.hidden).map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Lang + TZ bar */}
                        <div className="px-4 pb-3">
                            <div className="flex gap-2 mt-1">
                                <button onClick={() => setLang(l => l === 'id' ? 'en' : 'id')} title={t.tooltips.langToggle}
                                    className="flex items-center gap-1.5 px-2.5 py-1.5 glass border border-white/80 hover:border-blue-200 rounded-xl transition-all duration-200 active:scale-95 shadow-sm">
                                    <div className="w-4 h-4 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-[7px] font-black text-white shadow-sm">
                                        {lang === 'id' ? 'ID' : 'EN'}
                                    </div>
                                    <span className="text-[10px] font-semibold text-slate-600">{lang === 'id' ? 'Bahasa Indonesia' : 'English'}</span>
                                </button>
                                <div className="relative flex-1">
                                    <div className="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none">
                                        <i className="far fa-clock text-slate-400 text-xs"></i>
                                    </div>
                                    <select className="appearance-none w-full glass border border-white/80 hover:border-blue-200 rounded-xl pl-8 pr-8 py-1.5 text-[10px] font-semibold text-slate-600 outline-none transition-all duration-200 cursor-pointer shadow-sm" value={timezone} title={t.tooltips.tzToggle} onChange={e => setTimezone(e.target.value)}>
                                        {Object.keys(TZ_CONFIG).map(k => <option key={k} value={k}>{TZ_CONFIG[k].label}</option>)}
                                    </select>
                                    <div className="absolute inset-y-0 right-0 flex items-center px-2.5 pointer-events-none">
                                        <i className="fas fa-chevron-down text-[9px] text-slate-400"></i>
                                    </div>
                                </div>
                                <div className="flex items-center justify-center glass border border-white/80 px-2.5 rounded-xl shadow-sm">
                                    <InfoTooltip text={t.tooltips.tzInfo} align="right" />
                                </div>
                            </div>
                        </div>

                        {/* Reminder banner */}
                        <div className="bg-gradient-to-r from-amber-50 to-orange-50/60 border-t border-amber-100 px-4 py-2 flex items-center gap-2.5">
                                <span className="relative flex-shrink-0">
                                    <span className="w-2 h-2 bg-amber-400 rounded-full block"></span>
                                    <span className="absolute inset-0 w-2 h-2 bg-amber-400 rounded-full animate-ping opacity-60"></span>
                                </span>
                            <p className="text-[10px] text-amber-700 font-semibold leading-tight tracking-wide">{t.common.reminder}</p>
                        </div>
                    </header>

                    <main className="flex-1 p-4">
                        {loading && !users.length ? (
                            <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                                <i className="fas fa-circle-notch fa-spin text-4xl mb-3"></i>
                                <p>{t.common.loading}</p>
                            </div>
                        ) : (
                            <>
                                {view === 'dashboard' && (
                                    <DashboardView 
                                        currentUser={currentUser} 
                                        getUserName={getUserName} 
                                        timesheets={timesheets} 
                                        schedules={schedules} 
                                        users={users} 
                                        getUserColor={getUserColor} 
                                        onEditProfile={() => { if(!currentUser) return showNotify(t.timesheet.selectUser, "error"); setShowProfileModal(true); }} 
                                        setView={setView} 
                                        t={t} 
                                        formatCurrency={formatCurrency} 
                                        lang={lang} 
                                        timezone={timezone} 
                                    />
                                )}
                                {view === 'schedule' && (
                                    <ScheduleManager 
                                        editScheduleId={editScheduleId} 
                                        setEditScheduleId={setEditScheduleId} 
                                        scheduleForm={scheduleForm} 
                                        setScheduleForm={setScheduleForm} 
                                        saveSchedule={saveSchedule} 
                                        loading={loading} 
                                        schedules={schedules} 
                                        currentUser={currentUser} 
                                        getUserColor={getUserColor} 
                                        getUserName={getUserName} 
                                        deleteSchedule={deleteSchedule} 
                                        editSchedule={editSchedule} 
                                        isAdmin={isAdmin} 
                                        lang={lang} 
                                        t={t} 
                                        timezone={timezone} 
                                        sysSettings={sysSettings} 
                                        showNotify={showNotify} 
                                    />
                                )}
                                {view === 'timesheet' && (
                                    <ReportManager 
                                        saveTimesheet={saveTimesheet} 
                                        timesheetForm={timesheetForm} 
                                        setTimesheetForm={setTimesheetForm} 
                                        loading={loading} 
                                        timesheets={timesheets} 
                                        schedules={schedules}
                                        users={users}
                                        getUserName={getUserName}
                                        getUserColor={getUserColor}
                                        currentUser={currentUser} 
                                        deleteTimesheet={deleteTimesheet} 
                                        editTimesheetId={editTimesheetId} 
                                        setEditTimesheetId={setEditTimesheetId} 
                                        editTimesheet={editTimesheet} 
                                        hasPaymentInfo={hasPaymentInfo} 
                                        onOpenProfile={() => setShowProfileModal(true)} 
                                        isAdmin={isAdmin} 
                                        lang={lang} 
                                        t={t} 
                                        formatCurrency={formatCurrency} 
                                        timezone={timezone} 
                                        showNotify={showNotify}
                                        sysSettings={sysSettings} 
                                        onSelectAccount={() => setShowUserPicker(true)}
                                    />
                                )}
                                {view === 'analytics' && (
                                    <AnalyticsView 
                                        timesheets={timesheets} 
                                        schedules={schedules} 
                                        users={users} 
                                        currentUser={currentUser} 
                                        isAdmin={isAdmin} 
                                        loading={loading} 
                                        lang={lang} 
                                        t={t} 
                                        formatCurrency={formatCurrency} 
                                        timezone={timezone}
                                        onSelectAccount={() => setShowUserPicker(true)}
                                        onOpenReceipt={(batch, batchKey) => setAppReceiptModal({ batch, batchKey })}
                                    />
                                )}
                                {view === 'admin' && canAdmin && (
                                    <AdminPanel 
                                        timesheets={timesheets} 
                                        users={users} 
                                        schedules={schedules} 
                                        loading={loading} 
                                        setLoading={setLoading} 
                                        showNotify={showNotify} 
                                        t={t} 
                                        lang={lang} 
                                        formatCurrency={formatCurrency} 
                                        onAddUser={() => { setEditingUser(null); setShowUserModal(true); }} 
                                        onEditUser={(u) => { setEditingUser(u); setShowUserModal(true); }} 
                                        onDeleteUser={handleDeleteUser} 
                                        onConfirmAction={triggerConfirm} 
                                        sysSettings={sysSettings} 
                                        updateSettings={updateSysSettings} 
                                        getUserColor={getUserColor} 
                                        timezone={timezone}
                                        logActivity={logActivity}
                                        activityLog={activityLog}
                                        isAdmin={isAdmin}
                                        hasPerm={hasPerm}
                                        onOpenReceipt={(batch, batchKey) => setAppReceiptModal({ batch, batchKey })}
                                        userSortPrimary={userSortPrimary}
                                        userSortSecondary={userSortSecondary}
                                        setUserSortPrimary={setUserSortPrimary}
                                        setUserSortSecondary={setUserSortSecondary}
                                        sortedUsers={sortedUsers}
                                    />
                                )}
                            </>
                        )}
                    </main>

                    <nav className={`fixed bottom-0 left-0 right-0 glass-strong border-t border-white/80 shadow-lg z-[60] max-w-md mx-auto transition-opacity duration-200 ${passwordModal.show ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                        <div className={`grid ${canAdmin ? 'grid-cols-5' : 'grid-cols-4'} px-1 py-1`}>
                            {[
                                {id:'dashboard', icon:'fa-home',              label:t.nav.home,      active:'text-blue-600 bg-blue-50/80'},
                                {id:'schedule',  icon:'fa-calendar-alt',      label:t.nav.schedule,  active:'text-blue-600 bg-blue-50/80'},
                                {id:'timesheet', icon:'fa-file-invoice-dollar',label:t.nav.timesheet,active:'text-green-600 bg-green-50/80'},
                                {id:'analytics', icon:'fa-chart-pie',         label:t.nav.analytics, active:'text-indigo-600 bg-indigo-50/80'},
                                ...(canAdmin ? [{id:'admin', icon: isAdmin ? 'fa-user-shield' : 'fa-shield-alt', label:t.nav.admin, active:'text-purple-600 bg-purple-50/80'}] : [])
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setView(tab.id)}
                                    className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all duration-200 active:scale-90 press ${view === tab.id ? tab.active + ' nav-active-dot' : 'text-slate-400 hover:text-slate-600 hover:bg-white/60'}`}>
                                    <i className={`fas ${tab.icon} text-[18px] transition-transform duration-200 ${view === tab.id ? 'scale-110' : ''}`}></i>
                                    <span className="text-[9px] font-bold mt-0.5 tracking-tight">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
