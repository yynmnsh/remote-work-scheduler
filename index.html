                                    {/* Next payday chip — clean minimal two-column */}
                                    <div className="flex items-center gap-0 bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                        <div className="flex-1 px-3 py-2.5 border-r border-slate-100">
                                            <p className="text-[9px] text-slate-400 font-semibold uppercase tracking-wide">{lang==='id'?'Periode Berjalan':'Current Period'}</p>
                                            <p className="text-sm font-black text-slate-800 mt-0.5 leading-none">{fmtShort(pp.currentPeriodStart)} <span className="text-slate-400 font-normal">–</span> {fmtShort(pp.currentPeriodEnd)}</p>
                                            <p className="text-[9px] text-slate-400 mt-0.5">{lang==='id'?'Zona waktu PT':'PT timezone'}</p>
                                        </div>
                                        <div className="px-3 py-2.5 text-center flex-shrink-0">
                                            <p className="text-[9px] text-indigo-400 font-semibold uppercase tracking-wide">{lang==='id'?'Dibayar':'Payday'}</p>
                                            <p className="text-sm font-black text-indigo-700 mt-0.5 leading-none">{fmtShort(pp.upcomingPayday)}</p>
                                            <p className="text-[9px] text-indigo-400 mt-0.5">{lang==='id'?'Rabu':'Wednesday'}</p>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                        
                        <div className="flex gap-2 mb-4 bg-white p-2 rounded-xl border border-slate-100 shadow-sm">
                            <button onClick={() => setFilterMine(false)} className={`flex-1 text-[10px] py-1.5 rounded transition font-medium ${!filterMine ? 'bg-slate-700 text-white' : 'text-slate-500 hover:bg-slate-50'}`}>{t.schedule.allUsers}</button>
                            <button onClick={() => setFilterMine(true)} className={`flex-1 text-[10px] py-1.5 rounded transition font-medium ${filterMine ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-50'}`}>{t.schedule.onlyMe}</button>
                        </div>

                        {filteredTimesheets.filter(item => filterMine ? String(item.userId) === String(currentUser) : true).map(item => {
                            const displayObj = getDisplayTime(item.startTime, item.date, timezone);
                            const displayDate = formatDate(displayObj.date, lang);
                            return (
                                <div key={item.id} className="relative mb-3 bg-white p-4 rounded-xl shadow-sm border border-slate-100 card-hover fade-in">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <p className="font-bold text-slate-700 text-sm">{getUserName(item.userId)}</p>
                                            <p className="text-xs text-slate-400 mt-0.5">{displayDate} • {displayObj.time} - {item.endTime ? getDisplayTime(item.endTime, item.endDate || item.date, timezone).time : '...'} <span className="text-[8px] bg-slate-200 px-1 rounded">{TZ_CONFIG[timezone].label}</span></p>
                                        </div>
                                        <div className="text-right">
                                            <p className="font-bold text-green-600 text-sm">{formatCurrency(getDisplayAmount(item), lang)}</p>
                                            {(() => {
                                                const mins = parseInt(item.duration) || 0;
                                                const h = Math.floor(mins / 60), m = mins % 60;
                                                const label = h > 0 ? `${h}${t.common.unitShort}${m > 0 ? ` ${m}m` : ''}` : `${m}m`;
                                                return <p className="text-xs text-slate-400">{label}</p>;
                                            })()}
                                        </div>
                                    </div>
                                    <div className="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center">
                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide bounce-in ${item.status === 'paid' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>{item.status === 'paid' ? t.timesheet.paid : t.timesheet.pending}</span>
                                        {String(item.userId) === String(currentUser) && item.status !== 'paid' && (
                                            <div className="flex gap-2">
                                                <button onClick={() => editTimesheet(item)} title={t.common.edit} className="text-xs text-blue-500"><i className="fas fa-pen"></i></button>
                                                <button onClick={() => deleteTimesheet(item.id)} title={t.common.delete} className="text-xs text-red-500"><i className="fas fa-trash"></i></button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                        {filteredTimesheets.filter(item => filterMine ? String(item.userId) === String(currentUser) : true).length === 0 && (
                            <div className="text-center p-6 bg-slate-50 rounded-xl border border-slate-100 border-dashed">
                                <p className="text-xs font-medium text-slate-400">{t.timesheet.noData}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ timesheets, users, schedules, loading, setLoading, showNotify, t, lang, formatCurrency, getUserColor, timezone, sysSettings, updateSettings, onAddUser, onEditUser, onDeleteUser, onConfirmAction, logActivity, activityLog = [], isAdmin = false, hasPerm = () => true, onOpenReceipt, userSortPrimary = 'active', userSortSecondary = 'az', setUserSortPrimary = ()=>{}, setUserSortSecondary = ()=>{}, sortedUsers = [] }) => {
             const [viewMode, setViewMode] = React.useState('pending');
             const [settingsForm, setSettingsForm] = React.useState({ dailyQuotaHours: 10, baseHourlyRateUSD: 15, usdToIdr: 16000, offsetWIB: 7, offsetWITA: 8, offsetAEDT: 11, offsetPST: -8 });
             const [selectedSheets, setSelectedSheets] = React.useState({});
             const [transferAmounts, setTransferAmounts] = React.useState({});
             const [expandedUsers, setExpandedUsers] = React.useState({});
             
             React.useEffect(() => { 
                 const userRateEntries = {};
                 if (sysSettings?.userRates) {
                     Object.entries(sysSettings.userRates).forEach(([uid, rate]) => {
                         userRateEntries['ur_' + uid] = String(rate);
                     });
                 }
                 setSettingsForm({ 
                     dailyQuotaHours: sysSettings?.dailyQuotaHours || 10, 
                     baseHourlyRateUSD: sysSettings?.baseHourlyRateUSD || 15, 
                     usdToIdr: sysSettings?.usdToIdr || 16000, 
                     offsetWIB: sysSettings?.offsetWIB !== undefined ? sysSettings.offsetWIB : 7, 
                     offsetWITA: sysSettings?.offsetWITA !== undefined ? sysSettings.offsetWITA : 8,
                     offsetAEDT: sysSettings?.offsetAEDT !== undefined ? sysSettings.offsetAEDT : 11, 
                     offsetPST: sysSettings?.offsetPST !== undefined ? sysSettings.offsetPST : -8,
                     ...userRateEntries
                 }); 
             }, [sysSettings]);

            const getAmount = (item) => { 
                const baseVal = parseFloat(item.paymentUSD) || 0; 
                return lang === 'id' ? baseVal * (RATES.id / RATES.en) : baseVal; 
            };
            
            const pendingSheets = timesheets.filter(t => t.status === 'pending');
            const totalPending = pendingSheets.reduce((sum, t) => sum + getAmount(t), 0);
            const totalPendingMins = pendingSheets.reduce((sum, t) => sum + parseInt(t.duration || 0), 0);
            
            const paidSheets = timesheets.filter(t => t.status === 'paid');
            const totalAllTimePaid = paidSheets.reduce((sum, t) => sum + getAmount(t), 0);
            const totalAllTimePaidMins = paidSheets.reduce((sum, t) => sum + parseInt(t.duration || 0), 0);
            
            // ── Payment Batches: grouped by paidAt date (when admin clicked Mark Paid) ──
            const paymentBatches = {}; // key = paidAt date string YYYY-MM-DD
            const userTotalPaid = {};
            const userTotalMins = {};

            paidSheets.forEach(ts => {
                const amount = getAmount(ts);
                const duration = parseInt(ts.duration || 0);

                // Use paidAt date as batch key; fall back to work date if missing
                const batchKey = ts.paidAt ? ts.paidAt.substring(0, 10) : (getPSTDay(ts.date, ts.startTime) || ts.date);

                if (!paymentBatches[batchKey]) paymentBatches[batchKey] = { sheets: [], total: 0, totalMins: 0 };
                paymentBatches[batchKey].sheets.push(ts);
                paymentBatches[batchKey].total += amount;
                paymentBatches[batchKey].totalMins += duration;

                if (!userTotalPaid[ts.userId]) { userTotalPaid[ts.userId] = 0; userTotalMins[ts.userId] = 0; }
                userTotalPaid[ts.userId] += amount;
                userTotalMins[ts.userId] += duration;
            });

            // Sort batches newest-first; compute work-date range per batch
            const sortedBatches = Object.keys(paymentBatches).sort((a, b) => new Date(b) - new Date(a));
            sortedBatches.forEach(key => {
                const batch = paymentBatches[key];
                const workDates = batch.sheets.map(s => getPSTDay(s.date, s.startTime) || s.date).sort();
                batch.workDateMin = workDates[0];
                batch.workDateMax = workDates[workDates.length - 1];
                // Per-user totals within batch
                batch.byUser = {};
                batch.sheets.forEach(s => {
                    if (!batch.byUser[s.userId]) batch.byUser[s.userId] = { total: 0, mins: 0, sheets: [] };
                    batch.byUser[s.userId].total += getAmount(s);
                    batch.byUser[s.userId].mins += parseInt(s.duration || 0);
                    batch.byUser[s.userId].sheets.push(s);
                });
            });
            
            const handleMarkPaid = async (sheetIds) => { 
                onConfirmAction(t.timesheet.confirmPaid, async () => { 
                    setLoading(true); 
                    try { 
                        const batch = window.fs.writeBatch(window.db); 
                        sheetIds.forEach(id => { 
                            const docRef = window.fs.doc(window.db, "timesheets", id); 
                            batch.update(docRef, { status: 'paid', paidAt: new Date().toISOString() }); 
                        }); 
                        await batch.commit();
                        const names = [...new Set(sheetIds.map(id => { const ts = timesheets.find(x=>x.id===id); return ts ? users.find(u=>String(u.id)===String(ts.userId))?.name || ts.userId : id; }))].join(', ');
                        logActivity?.('payment_marked_paid', `${sheetIds.length} timesheet — ${names}`, 'admin');
                        showNotify(t.admin.markedPaid); 
                    } catch(e) { 
                        showNotify(t.common.error, "error"); 
                    } finally { 
                        setLoading(false); 
                    } 
                }); 
            };

            const handleMarkUnpaid = async (sheetId) => {
                const msg = lang === 'id' ? 'Kembalikan timesheet ini ke Pending?' : 'Move this timesheet back to Pending?';
                onConfirmAction(msg, async () => {
                    setLoading(true);
                    try {
                        const batch = window.fs.writeBatch(window.db);
                        const docRef = window.fs.doc(window.db, "timesheets", sheetId);
                        batch.update(docRef, { status: 'pending', paidAt: null });
                        await batch.commit();
                        const ts = timesheets.find(x=>x.id===sheetId);
                        const uname = ts ? users.find(u=>String(u.id)===String(ts.userId))?.name || ts.userId : sheetId;
                        logActivity?.('payment_reverted', `${uname} — ${ts?.date || ''}`, 'admin');
                        showNotify(t.admin.revertPending);
                    } catch(e) {
                        showNotify(t.common.error, "error");
                    } finally {
                        setLoading(false);
                    }
                });
            };
            
            return (
                <div className="space-y-4 fade-in pb-20 stagger tab-content">
                    
                     <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-1 overflow-x-auto">
                        {hasPerm('billing') && <button onClick={() => setViewMode('pending')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'pending' ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>{t.admin.pendingBill}</button>}
                        {hasPerm('billing') && <button onClick={() => setViewMode('history')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 flex items-center justify-center gap-1 ${viewMode === 'history' ? 'bg-green-600 text-white' : 'text-slate-500'}`}><i className="fas fa-receipt text-[9px]"></i><span>{t.admin.payHistory}</span></button>}
                        {hasPerm('users')   && <button onClick={() => setViewMode('users')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'users' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>{t.admin.manageUsers}</button>}
                        {hasPerm('log')     && <button onClick={() => setViewMode('log')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 flex items-center justify-center gap-1 ${viewMode === 'log' ? 'bg-amber-500 text-white' : 'text-slate-500'}`}><i className="fas fa-history text-[10px]"></i><span className="hidden xs:inline">{t.admin.activityLog}</span><span className="xs:hidden">Log</span></button>}
                        {hasPerm('export')  && <button onClick={() => setViewMode('export')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 flex items-center justify-center gap-1 ${viewMode === 'export' ? 'bg-teal-600 text-white' : 'text-slate-500'}`}><i className="fas fa-download text-[10px]"></i><span className="hidden xs:inline">{t.admin.exportData}</span><span className="xs:hidden">CSV</span></button>}
                        {hasPerm('settings') && <button onClick={() => setViewMode('settings')} className={`py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-3 ${viewMode === 'settings' ? 'bg-slate-700 text-white' : 'text-slate-500'}`}><i className="fas fa-cog"></i></button>}
                    </div>
                    
                    {viewMode === 'pending' && (() => {
                        const pendingByUser = Object.values(pendingSheets.reduce((acc, curr) => {
                            if (!acc[curr.userId]) acc[curr.userId] = { userId: curr.userId, total: 0, totalMins: 0, sheets: [] };
                            acc[curr.userId].total += getAmount(curr);
                            acc[curr.userId].totalMins += parseInt(curr.duration || 0);
                            acc[curr.userId].sheets.push(curr);
                            return acc;
                        }, {}));

                        // Compute global selection stats
                        const allSelectedSheets = pendingSheets.filter(s => {
                            const sel = selectedSheets[s.userId];
                            return sel && sel.has(s.id);
                        });
                        const globalSelectedTotal = allSelectedSheets.reduce((sum, s) => sum + getAmount(s), 0);
                        const globalSelectedMins = allSelectedSheets.reduce((sum, s) => sum + parseInt(s.duration || 0), 0);
                        const globalRemainingTotal = totalPending - globalSelectedTotal;
                        const globalRemainingMins = totalPendingMins - globalSelectedMins;

                        // Transfer amount: single global field
                        const globalTransferVal = transferAmounts['__global__'] !== undefined
                            ? transferAmounts['__global__']
                            : globalSelectedTotal > 0 ? globalSelectedTotal.toFixed(2) : '';

                        const toggleSheet = (userId, sheetId) => {
                            setSelectedSheets(prev => {
                                const userSel = new Set(prev[userId] || []);
                                if (userSel.has(sheetId)) userSel.delete(sheetId); else userSel.add(sheetId);
                                return { ...prev, [userId]: userSel };
                            });
                            // Reset global transfer amount when selection changes
                            setTransferAmounts(ta => {
                                const updated = { ...ta };
                                delete updated['__global__'];
                                return updated;
                            });
                        };

                        const toggleAllUser = (userId, sheets) => {
                            setSelectedSheets(prev => {
                                const userSel = prev[userId] || new Set();
                                const allSelected = sheets.every(s => userSel.has(s.id));
                                return { ...prev, [userId]: allSelected ? new Set() : new Set(sheets.map(s => s.id)) };
                            });
                            setTransferAmounts(ta => { const u = {...ta}; delete u['__global__']; return u; });
                        };

                        const handleMarkAllSelected = () => {
                            const ids = allSelectedSheets.map(s => s.id);
                            if (ids.length === 0) { showNotify(t.admin.selectTimesheets, 'error'); return; }
                            handleMarkPaid(ids);
                            // Reset selection after marking
                            setSelectedSheets({});
                            setTransferAmounts({});
                        };

                        const hasAnySelection = allSelectedSheets.length > 0;

                        return (
                        <div className="space-y-3">

                            {/* ── UNIFIED SUMMARY CARD ── */}
                            <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl overflow-hidden shadow-xl">
                                {/* Top: two counters */}
                                <div className="grid grid-cols-2 divide-x divide-white/10">
                                    <div className="p-4">
                                        <p className="text-[10px] font-bold text-green-300 uppercase tracking-widest mb-1 flex items-center gap-1">
                                            <i className="fas fa-check-circle"></i>
                                            {t.admin.readyToPay}
                                        </p>
                                        <p className={`text-xl font-black transition-all ${hasAnySelection ? 'text-green-300' : 'text-slate-500'}`}>
                                            {formatCurrency(globalSelectedTotal, lang)}
                                        </p>
                                        <p className="text-[10px] text-slate-400 mt-0.5">
                                            {allSelectedSheets.length} timesheet · {(globalSelectedMins/60).toFixed(1)}{t.common.unitShort}
                                        </p>
                                    </div>
                                    <div className="p-4">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1">
                                            <i className="fas fa-clock"></i>
                                            {t.admin.stillPending}
                                        </p>
                                        <p className="text-xl font-black text-slate-300">
                                            {formatCurrency(globalRemainingTotal, lang)}
                                        </p>
                                        <p className="text-[10px] text-slate-500 mt-0.5">
                                            {pendingSheets.length - allSelectedSheets.length} timesheet · {(globalRemainingMins/60).toFixed(1)}{t.common.unitShort}
                                        </p>
                                    </div>
                                </div>

                                {/* Transfer amount + Mark Paid button — only when something is selected */}
                                {hasAnySelection && (
                                    <div className="px-4 pb-4 space-y-3 border-t border-white/10 pt-3">
                                        <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 flex items-center gap-1.5">
                                                <i className="fas fa-paper-plane text-green-400"></i>
                                                {t.admin.transferAmount}
                                                <span className="text-[9px] font-normal text-slate-500 normal-case tracking-normal">
                                                    {lang === 'id' ? '(kosong = otomatis pakai estimasi)' : '(leave blank to use estimated total)'}
                                                </span>
                                            </label>
                                            <div className="flex gap-2 items-center">
                                                <div className="relative flex-1">
                                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-bold">{lang === 'id' ? 'Rp' : '$'}</span>
                                                    <input
                                                        type="number" min="0" step="0.01"
                                                        className="w-full pl-8 pr-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-sm font-bold text-white placeholder-slate-500 focus:border-green-400 outline-none transition-colors"
                                                        value={globalTransferVal}
                                                        onChange={e => setTransferAmounts(ta => ({ ...ta, '__global__': e.target.value }))}
                                                        placeholder={globalSelectedTotal.toFixed(2)}
                                                    />
                                                </div>
                                                <button onClick={() => setTransferAmounts(ta => { const u={...ta}; delete u['__global__']; return u; })} className="text-[10px] text-slate-400 hover:text-white font-bold px-2 py-2 rounded-lg hover:bg-white/10 border border-white/10 transition-colors">
                                                    <i className="fas fa-sync-alt"></i>
                                                </button>
                                            </div>
                                            {globalTransferVal && parseFloat(globalTransferVal) !== globalSelectedTotal && (
                                                <p className="text-[10px] text-amber-400 mt-1 flex items-center gap-1"><i className="fas fa-exclamation-triangle"></i>{lang === 'id' ? `Berbeda dari estimasi (${formatCurrency(globalSelectedTotal, lang)})` : `Differs from estimate (${formatCurrency(globalSelectedTotal, lang)})`}</p>
                                            )}
                                        </div>
                                        <button onClick={handleMarkAllSelected} disabled={loading}
                                            className="w-full bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-400 hover:to-emerald-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-900/40 flex items-center justify-center gap-2 active:scale-95 transition-all disabled:opacity-50">
                                            {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <i className="fas fa-check-circle"></i>}
                                            {t.admin.markPaid}
                                            <span className="bg-white/20 px-2 py-0.5 rounded-lg text-[11px]">{allSelectedSheets.length} timesheet</span>
                                            {(globalTransferVal || globalSelectedTotal > 0) && (
                                                <span className="bg-white/20 px-2 py-0.5 rounded-lg text-[11px]">
                                                    {lang === 'id' ? 'Rp' : '$'}{parseFloat(globalTransferVal || globalSelectedTotal).toLocaleString()}
                                                </span>
                                            )}
                                        </button>
                                    </div>
                                )}

                                {!hasAnySelection && pendingSheets.length > 0 && (
                                    <div className="px-4 pb-4 pt-1">
                                        <p className="text-center text-[11px] text-slate-500 italic">
                                            <i className="fas fa-hand-point-down mr-1 text-slate-600"></i>
                                            {lang === 'id' ? 'Centang timesheet di bawah untuk memilih yang ingin dibayar' : 'Check timesheets below to select which to pay'}
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* ── PER-USER TIMESHEET LISTS ── */}
                            {pendingSheets.length === 0 ? (
                                <div className="bg-white p-10 rounded-2xl text-center border border-dashed border-slate-200">
                                    <i className="fas fa-check-circle text-3xl text-slate-200 mb-3 block"></i>
                                    <p className="text-slate-400 text-sm font-medium">{t.admin.noPendingBills}</p>
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {pendingByUser.map(grp => {
                                        const u = users.find(u => String(u.id) === String(grp.userId));
                                        const uColor = getUserColor(grp.userId) || '#cbd5e1';
                                        const uColorLight = uColor + '18';
                                        const userSel = selectedSheets[grp.userId] || new Set();
                                        const allSelected = grp.sheets.every(s => userSel.has(s.id));
                                        const someSelected = grp.sheets.some(s => userSel.has(s.id));
                                        const selectedCount = [...userSel].filter(id => grp.sheets.some(s => s.id === id)).length;
                                        const selectedAmt = grp.sheets.filter(s => userSel.has(s.id)).reduce((sum,s) => sum + getAmount(s), 0);
                                        const isExpanded = expandedUsers[grp.userId] !== false;
                                        return (
                                            <div key={grp.userId} className="rounded-2xl overflow-hidden shadow-sm" style={{border: `1.5px solid ${someSelected ? uColor+'55' : '#e2e8f0'}`}}>

                                                {/* ── USER HEADER ── */}
                                                <div className="flex items-center gap-3 px-3 py-3" style={{backgroundColor: someSelected ? uColorLight : '#f8fafc'}}>
                                                    {/* Big tap-target select-all */}
                                                    <div onClick={() => toggleAllUser(grp.userId, grp.sheets)}
                                                        className="flex-shrink-0 cursor-pointer p-1 -ml-1 rounded-xl transition-all active:scale-90"
                                                        style={{color: allSelected || someSelected ? uColor : '#cbd5e1'}}>
                                                        <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all`}
                                                            style={{
                                                                borderColor: allSelected || someSelected ? uColor : '#cbd5e1',
                                                                backgroundColor: allSelected ? uColor : someSelected ? uColor+'22' : 'white'
                                                            }}>
                                                            {allSelected && <i className="fas fa-check text-white text-[10px]"></i>}
                                                            {someSelected && !allSelected && <i className="fas fa-minus text-[10px]" style={{color: uColor}}></i>}
                                                        </div>
                                                    </div>

                                                    {/* Avatar */}
                                                    <div className="w-9 h-9 rounded-xl flex items-center justify-center text-white font-black text-xs flex-shrink-0 shadow-sm" style={{backgroundColor: uColor}}>
                                                        {u?.name ? u.name.substring(0,2).toUpperCase() : '?'}
                                                    </div>

                                                    {/* Name + bank */}
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <p className="font-black text-slate-800 text-sm leading-tight">{u?.name || t.common.unknown}</p>
                                                            {someSelected && (
                                                                <span className="text-[9px] font-bold px-2 py-0.5 rounded-full" style={{backgroundColor: uColor+'22', color: uColor}}>
                                                                    {selectedCount}/{grp.sheets.length} · {formatCurrency(selectedAmt, lang)}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <p className="text-[10px] text-slate-400 truncate mt-0.5">
                                                            <i className="fas fa-university mr-1"></i>{u?.bankName || '-'} {u?.accountNumber ? '··' + u.accountNumber.slice(-4) : ''}
                                                        </p>
                                                    </div>

                                                    {/* Total + chevron */}
                                                    <div className="text-right flex-shrink-0 flex items-center gap-2">
                                                        <div>
                                                            <p className="font-black text-sm" style={{color: someSelected ? uColor : '#475569'}}>{formatCurrency(grp.total, lang)}</p>
                                                            <p className="text-[10px] text-slate-400">{grp.sheets.length} item · {(grp.totalMins/60).toFixed(1)}{t.common.unitShort}</p>
                                                        </div>
                                                        <button onClick={() => setExpandedUsers(prev => ({...prev, [grp.userId]: !isExpanded}))}
                                                            className="w-7 h-7 rounded-lg flex items-center justify-center transition-all hover:bg-slate-100 flex-shrink-0"
                                                            style={{color: isExpanded ? uColor : '#94a3b8'}}>
                                                            <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px]`}></i>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* ── TIMESHEET ROWS ── */}
                                                {isExpanded && (
                                                    <div className="bg-white">
                                                        {grp.sheets.sort((a,b) => new Date(b.date) - new Date(a.date)).map((sheet, sheetIdx) => {
                                                            const isChecked = userSel.has(sheet.id);
                                                            const sheetAmount = getAmount(sheet);
                                                            const uiStart = getDisplayTime(sheet.startTime, sheet.date, timezone);
                                                            const uiEnd = sheet.endTime ? getDisplayTime(sheet.endTime, sheet.endDate || sheet.date, timezone) : null;
                                                            const sheetMins = parseInt(sheet.duration || 0);
                                                            const isLast = sheetIdx === grp.sheets.length - 1;
                                                            return (
                                                                <div key={sheet.id} onClick={() => toggleSheet(grp.userId, sheet.id)}
                                                                    className={`flex items-center gap-3 px-3 py-3 cursor-pointer transition-all select-none ${!isLast ? 'border-b border-slate-50' : ''}`}
                                                                    style={{backgroundColor: isChecked ? uColor+'0d' : 'transparent'}}>

                                                                    {/* Checkbox */}
                                                                    <div className="flex-shrink-0 w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all"
                                                                        style={{
                                                                            borderColor: isChecked ? uColor : '#d1d5db',
                                                                            backgroundColor: isChecked ? uColor : 'white'
                                                                        }}>
                                                                        {isChecked && <i className="fas fa-check text-white text-[9px]"></i>}
                                                                    </div>

                                                                    {/* Color accent bar */}
                                                                    <div className="w-1 h-8 rounded-full flex-shrink-0 transition-all"
                                                                        style={{backgroundColor: isChecked ? uColor : '#e2e8f0'}}></div>

                                                                    {/* Date & time */}
                                                                    <div className="flex-1 min-w-0">
                                                                        <p className={`text-xs font-bold leading-tight ${isChecked ? 'text-slate-800' : 'text-slate-600'}`}>{formatDate(sheet.date, lang)}</p>
                                                                        <p className="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1.5">
                                                                            <span className="font-mono">{uiStart.time}{uiEnd ? '–'+uiEnd.time : ''}</span>
                                                                            <span className="w-px h-2.5 bg-slate-200"></span>
                                                                            <span>{(sheetMins/60).toFixed(1)}{t.common.unitShort}</span>
                                                                            
                                                                        </p>
                                                                    </div>

                                                                    {/* Amount — big and prominent */}
                                                                    <p className="text-sm font-black flex-shrink-0 transition-all" style={{color: isChecked ? uColor : '#94a3b8'}}>{formatCurrency(sheetAmount, lang)}</p>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                        );
                    })()}

                    {viewMode === 'history' && ( 
                        <div className="space-y-3">
                            {/* ── All-time total header ── */}
                            <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-xl">
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">{t.admin.totalPaidTitle}</p>
                                <p className="text-3xl font-black">{formatCurrency(totalAllTimePaid, lang)}</p>
                                <p className="text-sm text-slate-400 mt-0.5">{(totalAllTimePaidMins/60).toFixed(1)}{t.common.unitShort} · {paidSheets.length} timesheet</p>
                            </div>

                            {/* ── Per-user all-time leaderboard ── */}
                            {Object.keys(userTotalPaid).length > 0 && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-4 py-2.5 border-b border-slate-100 flex items-center gap-2">
                                        <i className="fas fa-trophy text-yellow-400 text-xs"></i>
                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">{t.admin.sectionAllTime}</span>
                                    </div>
                                    <div className="divide-y divide-slate-50">
                                        {Object.keys(userTotalPaid).sort((a,b) => userTotalPaid[b] - userTotalPaid[a]).map((uid, rank) => {
                                            const u = users.find(user => String(user.id) === String(uid));
                                            const uColor = getUserColor(uid) || '#cbd5e1';
                                            const pct = totalAllTimePaid > 0 ? (userTotalPaid[uid] / totalAllTimePaid * 100) : 0;
                                            return (
                                                <div key={uid} className="px-4 py-3">
                                                    <div className="flex items-center gap-3 mb-1.5">
                                                        <span className="text-[10px] font-black text-slate-300 w-4 text-center flex-shrink-0">#{rank+1}</span>
                                                        <div className="w-7 h-7 rounded-lg flex items-center justify-center text-white font-black text-[10px] flex-shrink-0" style={{backgroundColor: uColor}}>
                                                            {u?.name ? u.name.substring(0,2).toUpperCase() : '?'}
                                                        </div>
                                                        <span className="font-bold text-slate-700 text-sm flex-1">{u?.name || t.common.unknown}</span>
                                                        <span className="font-black text-slate-800 text-sm">{formatCurrency(userTotalPaid[uid], lang)}</span>
                                                        <span className="text-[10px] text-slate-400 w-12 text-right">{(userTotalMins[uid]/60).toFixed(1)}{t.common.unitShort}</span>
                                                    </div>
                                                    <div className="ml-7 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                        <div className="h-full rounded-full transition-all" style={{width:`${pct}%`, backgroundColor: uColor}}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* ── Payment Batches ── */}
                            {sortedBatches.length > 0 && (
                                <div className="space-y-2">
                                    <div className="flex items-center gap-2 px-1">
                                        <i className="fas fa-layer-group text-emerald-400 text-xs"></i>
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                            {lang === 'id' ? 'Riwayat Pembayaran' : 'Payment History'}
                                        </span>
                                        <span className="text-[9px] text-slate-300 ml-1">
                                            {lang === 'id' ? '(dikelompokkan per tanggal bayar)' : '(grouped by payment date)'}
                                        </span>
                                    </div>
                                    {sortedBatches.map(batchKey => {
                                        const batch = paymentBatches[batchKey];
                                        const isBatchExpanded = expandedUsers['batch_' + batchKey] === true; // collapsed by default
                                        const batchDate = (() => {
                                            const [y,m,d] = batchKey.split('-').map(Number);
                                            return new Date(y,m-1,d).toLocaleDateString(lang==='id'?'id-ID':'en-US', {day:'numeric', month:'long', year:'numeric'});
                                        })();
                                        const workRange = batch.workDateMin === batch.workDateMax
                                            ? formatDate(batch.workDateMin, lang)
                                            : `${formatDate(batch.workDateMin, lang)} – ${formatDate(batch.workDateMax, lang)}`;
                                        const batchUserCount = Object.keys(batch.byUser).length;
                                        return (
                                            <div key={batchKey} className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden card-hover">
                                                {/* Batch header — click expands detail */}
                                                <div onClick={() => setExpandedUsers(prev => ({...prev, ['batch_'+batchKey]: !isBatchExpanded}))}
                                                    className="flex items-start gap-3 px-4 py-3 cursor-pointer hover:bg-slate-50 transition-colors">
                                                    <div className="w-9 h-9 rounded-xl bg-emerald-100 flex-shrink-0 flex flex-col items-center justify-center leading-none mt-0.5">
                                                        <span className="text-[8px] font-bold text-emerald-500 uppercase">
                                                            {new Date(batchKey+'T00:00:00').toLocaleDateString(lang==='id'?'id-ID':'en-US',{month:'short'})}
                                                        </span>
                                                        <span className="text-sm font-black text-emerald-700 leading-tight">
                                                            {batchKey.substring(8)}
                                                        </span>
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <p className="text-xs font-black text-slate-700 leading-tight">
                                                            {lang==='id'?'Dibayar':'Paid'} {batchDate}
                                                        </p>
                                                        <p className="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1 flex-wrap">
                                                            <i className="fas fa-briefcase text-[8px]"></i>
                                                            <span>{lang==='id'?'Pekerjaan:':'Work:'} {workRange}</span>
                                                            <span className="w-px h-2.5 bg-slate-200 mx-0.5"></span>
                                                            <span>{batchUserCount} {lang==='id'?'orang':'person'}</span>
                                                            <span className="w-px h-2.5 bg-slate-200 mx-0.5"></span>
                                                            <span>{batch.sheets.length} timesheet</span>
                                                            <span className="w-px h-2.5 bg-slate-200 mx-0.5"></span>
                                                            <span>{(batch.totalMins/60).toFixed(1)}{t.common.unitShort}</span>
                                                        </p>
                                                    </div>
                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                        <p className="font-black text-emerald-600 text-base">{formatCurrency(batch.total, lang)}</p>
                                                        <i className={`fas fa-chevron-${isBatchExpanded?'up':'down'} text-slate-300 text-xs`}></i>
                                                    </div>
                                                </div>
                                                {/* Receipt footer bar — always visible, clean */}
                                                <button
                                                    onClick={e => { e.stopPropagation(); onOpenReceipt(batch, batchKey); }}
                                                    className="w-full flex items-center justify-center gap-2 py-2 bg-slate-50 hover:bg-emerald-50 border-t border-slate-100 text-[10px] font-bold text-slate-400 hover:text-emerald-600 transition-all press">
                                                    <i className="fas fa-receipt text-[9px]"></i>
                                                    {lang==='id'?'Lihat Tanda Terima':'View Receipt'}
                                                </button>

                                                {/* Batch detail: per-user accordion */}
                                                {isBatchExpanded && (
                                                    <div className="border-t border-slate-50">
                                                        {Object.keys(batch.byUser)
                                                            .sort((a,b) => batch.byUser[b].total - batch.byUser[a].total)
                                                            .map(uid => {
                                                                const uData = batch.byUser[uid];
                                                                const u = users.find(user => String(user.id) === String(uid));
                                                                const uColor = getUserColor(uid) || '#cbd5e1';
                                                                const uKey = 'user_' + batchKey + '_' + uid;
                                                                const isUserExpanded = expandedUsers[uKey] === true; // collapsed by default
                                                                return (
                                                                    <div key={uid} className="border-b border-slate-50 last:border-0">
                                                                        {/* User row — clickable to expand timesheets */}
                                                                        <div onClick={() => setExpandedUsers(prev => ({...prev, [uKey]: !isUserExpanded}))}
                                                                            className="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50 transition-colors"
                                                                            style={{backgroundColor: isUserExpanded ? uColor+'08' : undefined}}>
                                                                            <div className="w-7 h-7 rounded-xl flex items-center justify-center text-white font-black text-[10px] flex-shrink-0" style={{backgroundColor: uColor}}>
                                                                                {u?.name ? u.name.substring(0,2).toUpperCase() : '?'}
                                                                            </div>
                                                                            <div className="flex-1 min-w-0">
                                                                                <span className="text-xs font-bold text-slate-700">{u?.name || t.common.unknown}</span>
                                                                                <p className="text-[9px] text-slate-400 mt-0.5">
                                                                                    {uData.sheets.length} timesheet · {(uData.mins/60).toFixed(1)}{t.common.unitShort}
                                                                                </p>
                                                                            </div>
                                                                            <span className="text-xs font-black flex-shrink-0" style={{color: uColor}}>{formatCurrency(uData.total, lang)}</span>
                                                                            <i className={`fas fa-chevron-${isUserExpanded?'up':'down'} text-slate-300 text-[9px] flex-shrink-0`}></i>
                                                                        </div>
                                                                        {/* Timesheet rows — sorted descending (newest first) */}
                                                                        {isUserExpanded && (
                                                                            <div className="bg-slate-50/50">
                                                                                {uData.sheets
                                                                                    .slice()
                                                                                    .sort((a,b) => new Date(b.date+' '+(b.startTime||'00:00')) - new Date(a.date+' '+(a.startTime||'00:00')))
                                                                                    .map(item => {
                                                                                    const uiStart = getDisplayTime(item.startTime, item.date, timezone);
                                                                                    let endStr = '...';
                                                                                    if (item.endTime) {
                                                                                        endStr = getDisplayTime(item.endTime, item.endDate || item.date, timezone).time;
                                                                                    } else if (item.duration) {
                                                                                        const eEpoch = getEpochFromWIB(item.date, item.startTime) + item.duration * 60000;
                                                                                        const dObj = new Date(eEpoch + TZ_CONFIG[timezone].offsetUTC * 3600000);
                                                                                        endStr = `${String(dObj.getUTCHours()).padStart(2,'0')}:${String(dObj.getUTCMinutes()).padStart(2,'0')}`;
                                                                                    }
                                                                                    const workDay = getPSTDay(item.date, item.startTime) || item.date;
                                                                                    return (
                                                                                        <div key={item.id} className="flex items-center gap-3 px-4 py-2.5 group hover:bg-white transition-colors border-t border-slate-100">
                                                                                            <div className="w-1 h-8 rounded-full flex-shrink-0" style={{backgroundColor: uColor+'55'}}></div>
                                                                                            <div className="flex-1 min-w-0">
                                                                                                <p className="text-[10px] font-bold text-slate-600">{formatDate(workDay, lang)}</p>
                                                                                                <p className="text-[9px] text-slate-400 flex items-center gap-1 mt-0.5">
                                                                                                    <span className="font-mono">{uiStart.time}–{endStr}</span>
                                                                                                    <span className="opacity-40">·</span>
                                                                                                    <span>{(() => { const mins=parseInt(item.duration||0); const dh=Math.floor(mins/60),dm=mins%60; return dh>0?`${dh}${t.common.unitShort}${dm>0?` ${dm}m`:''}`:dm+'m'; })()}</span>
                                                                                                    <span className="bg-slate-200 text-slate-400 px-1 rounded text-[8px]">{TZ_CONFIG[timezone].label}</span>
                                                                                                    
                                                                                                </p>
                                                                                            </div>
                                                                                            <div className="flex items-center gap-2 flex-shrink-0">
                                                                                                <p className="text-xs font-black text-emerald-600">{formatCurrency(getAmount(item), lang)}</p>
                                                                                                <button onClick={(e) => { e.stopPropagation(); handleMarkUnpaid(item.id); }}
                                                                                                    className="opacity-0 group-hover:opacity-100 transition-opacity w-7 h-7 rounded-lg border border-slate-200 hover:border-orange-300 hover:bg-orange-50 flex items-center justify-center text-slate-300 hover:text-orange-500 flex-shrink-0"
                                                                                                    title={lang==='id'?'Kembalikan ke Pending':'Move back to Pending'}>
                                                                                                    <i className="fas fa-undo text-[9px]"></i>
                                                                                                </button>
                                                                                            </div>
                                                                                        </div>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                );
                                                            })
                                                        }
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {paidSheets.length === 0 && (
                                <div className="bg-white p-10 rounded-2xl text-center border border-dashed border-slate-200">
                                    <i className="fas fa-history text-3xl text-slate-200 mb-3 block"></i>
                                    <p className="text-slate-400 text-sm">{t.admin.noPayHistory}</p>
                                </div>
                            )}

                            {/* ── Receipt Browser — embedded in history tab ── */}
                            {paidSheets.length > 0 && (
                                <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-1.5">
                                        <i className="fas fa-receipt text-emerald-400"></i>
                                        {t.admin.receiptsByPeriod}
                                    </p>
                                    <ReceiptsView
                                        timesheets={timesheets}
                                        users={users}
                                        lang={lang}
                                        t={t}
                                        formatCurrency={formatCurrency}
                                        timezone={timezone}
                                        onOpenReceipt={onOpenReceipt}
                                        compact={false}
                                    />
                                </div>
                            )}
                        </div> 
                    )}

                    {/* ── ACTIVITY LOG ── */}
                    {viewMode === 'log' && (
                        <div className="space-y-3 slide-up">
                            <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                                <div className="bg-gradient-to-r from-amber-500 to-orange-500 px-4 py-3 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <i className="fas fa-history text-white text-sm"></i>
                                        <span className="text-white font-bold text-sm">{t.admin.activityLog}</span>
                                    </div>

                                                timesheet_edit:        { icon: 'fa-pen',             color: 'text-amber-500',  label: lang==='id'?'Edit Laporan':'Edit Timesheet' },

                                                            }

                                                            // Pattern: YYYY-MM-DD HH:MM–HH:MM (optional (Xm))
                                                            const mFull = entry.detail.match(/^(\d{4}-\d{2}-\d{2})\s(\d{2}:\d{2})–(\d{2}:\d{2})(\s\(\d+m\))?/);
                                                            // Pattern: YYYY-MM-DD HH:MM (Xm)
                                                            const mSingle = !mFull && entry.detail.match(/^(\d{4}-\d{2}-\d{2})\s(\d{2}:\d{2})(\s\(\d+m\))?/);
                                                            let converted = entry.detail;
                                                            if (mFull) {
                                                                const s = getDisplayTime(mFull[2], mFull[1], timezone);

                                                                converted = `${s.date} ${s.time}–${e.time}${mFull[4]||''}`;

                                                                const s = getDisplayTime(mSingle[2], mSingle[1], timezone);
                                                                converted = `${s.date} ${s.time}${mSingle[3]||''}`;

                                                            return (
                                                                <p className="text-[10px] text-slate-400 font-mono mt-0.5 truncate">
                                                                    {converted}
                                                                    <span className="ml-1 text-[8px] bg-slate-100 text-slate-400 px-1 py-0.5 rounded font-sans not-italic">{tzShort}</span>

                            URL.revokeObjectURL(url);
                        };

                            const header = lang==='id'
                                ? ['ID','User','Tanggal Mulai','Waktu Mulai (WIB)','Tanggal Selesai','Waktu Selesai (WIB)','Diperbarui']

                            dl(`schedules_${new Date().toISOString().slice(0,10)}.csv`, [header,...rows]);
                        };
                        const exportTimesheets = () => {
                            const header = lang==='id'
                                ? ['ID','User','Tanggal','Mulai (WIB)','Selesai (WIB)','Durasi (mnt)','USD','IDR','Status','Dibayar Pada','Dibuat']
                                : ['ID','User','Date','Start (WIB)','End (WIB)','Duration (min)','USD','IDR','Status','Paid At','Created'];
                            const rows = timesheets.map(ts => [ts.id, users.find(u=>String(u.id)===String(ts.userId))?.name||ts.userId, ts.date, ts.startTime, ts.endTime||'', ts.duration||0, ts.paymentUSD||0, ts.paymentIDR||0, ts.status, ts.paidAt||'', ts.createdAt||'']);
                            dl(`timesheets_${new Date().toISOString().slice(0,10)}.csv`, [header,...rows]);
                        };
                        const exportAll = () => {
                            const header = lang==='id'
                                ? ['Tipe','ID','User','Tanggal','Mulai (WIB)','Selesai (WIB)','Durasi (mnt)','USD','IDR','Status','Extra']
                                : ['Type','ID','User','Date','Start (WIB)','End (WIB)','Duration (min)','USD','IDR','Status','Extra'];
                            const sRows = schedules.map(s => ['schedule',s.id,users.find(u=>String(u.id)===String(s.userId))?.name||s.userId,s.startDate||s.date,s.startTime,s.endTime,''  ,'','','',s.updatedAt||'']);
                            const tRows = timesheets.map(ts=> ['timesheet',ts.id,users.find(u=>String(u.id)===String(ts.userId))?.name||ts.userId,ts.date,ts.startTime,ts.endTime||'',ts.duration||0,ts.paymentUSD||0,ts.paymentIDR||0,ts.status,ts.paidAt||'']);
                            dl(`all_data_${new Date().toISOString().slice(0,10)}.csv`, [header,...sRows,...tRows]);

                            <div className="space-y-4 slide-up">
                                <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

                                                </button>

                                        <p className="text-[10px] text-slate-300 text-center pt-1">{lang==='id'?'File menggunakan encoding UTF-8 dengan BOM untuk mendukung karakter Indonesia.':'Files use UTF-8 with BOM for proper character encoding.'}</p>

                                </div>

                                <div className="card p-5 border border-slate-200">

                                    <div className="space-y-3">
                                        {[
                                            { key:'offsetWIB',  label: t.admin.tzWIB,  tzCode:'WIB'  },

                                            // Live preview using draft values (before save)
                                            const draftPt  = settingsForm.offsetPST;
                                            const draftLocal = settingsForm[key];
                                            const diff = draftLocal - draftPt;
                                            const startH = ((diff % 24) + 24) % 24;

                                            const pad = n => String(n).padStart(2,'0');

                    {viewMode === 'users' && (

                                        className={`text-[10px] font-bold px-2 py-0.5 rounded-full border transition-all press ${userSortPrimary===opt.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-200 hover:border-blue-400'}`}>
                                        {opt.label}

                                <span className="text-slate-300 self-center">·</span>

                                    <button key={opt.id} onClick={() => setUserSortSecondary(opt.id)}
                                        className={`text-[10px] font-bold px-2 py-0.5 rounded-full border transition-all press ${userSortSecondary===opt.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200 hover:border-indigo-400'}`}>

                            </div>
                            <div className="bg-white rounded-xl border border-slate-200 divide-y">
                                {sortedUsers.map(u => {
                                    const uIsMainAdmin = String(u.id) === ADMIN_ID;

                                    const allPerms = ['billing','log','users','settings','export'];
                                    const permLabels = {
                                        billing: t.admin.permBilling,
                                        log:     t.admin.permLog,
                                        users:   t.admin.permUsers,
                                        settings:t.admin.permSettings,
                                        export:  t.admin.permExport,
                                    };
                                    return (
                                        <div key={u.id} className={`p-3 ${u.hidden ? 'opacity-60 bg-slate-50' : ''}`}>
                                            <div className="flex items-center justify-between">

                                                    <div className="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0" style={{backgroundColor: u.color}}>
                                                        {u.name.substring(0,2)}
