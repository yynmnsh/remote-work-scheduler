             const [viewMode, setViewMode] = React.useState('pending');
            const getAmount = (item) => { const baseVal = parseFloat(item.paymentUSD) || 0; return lang === 'id' ? baseVal * USD_TO_IDR : baseVal; }
            const pendingSheets = timesheets.filter(t => t.status === 'pending');
            const totalPending = pendingSheets.reduce((sum, t) => sum + getAmount(t), 0);
            const totalPendingMins = pendingSheets.reduce((sum, t) => sum + parseInt(t.duration || 0), 0);
            
            const paidSheets = timesheets.filter(t => t.status === 'paid');
            const totalAllTimePaid = paidSheets.reduce((sum, t) => sum + getAmount(t), 0);
            const totalAllTimePaidMins = paidSheets.reduce((sum, t) => sum + parseInt(t.duration || 0), 0);
            
            const paidHistory = {};
            const weeklyStats = {}; 
            const weeklyMins = {}; 
            const userTotalPaid = {}; 
            const userTotalMins = {}; 
            const userWeeklyPaid = {}; 
            const userWeeklyMins = {}; 

            paidSheets.forEach(t => { 
                const amount = getAmount(t);
                const duration = parseInt(t.duration || 0);
                const d = t.paidAt ? t.paidAt.split('T')[0] : 'Unknown'; 
                if(!paidHistory[d]) paidHistory[d] = []; 
                paidHistory[d].push(t);
                
                const paidDateObj = new Date(d);
                const firstDayOfYear = new Date(paidDateObj.getFullYear(), 0, 1);
                const pastDaysOfYear = (paidDateObj - firstDayOfYear) / 86400000;
                const weekNum = Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
                const weekKey = `${paidDateObj.getFullYear()}-W${weekNum}`;
                
                if (!weeklyStats[weekKey]) {
                    weeklyStats[weekKey] = 0;
                    weeklyMins[weekKey] = 0;
                }
                weeklyStats[weekKey] += amount;
                weeklyMins[weekKey] += duration;

                if (!userTotalPaid[t.userId]) {
                    userTotalPaid[t.userId] = 0;
                    userTotalMins[t.userId] = 0;
                }
                userTotalPaid[t.userId] += amount;
                userTotalMins[t.userId] += duration;

                if (!userWeeklyPaid[weekKey]) {
                    userWeeklyPaid[weekKey] = {};
                    userWeeklyMins[weekKey] = {};
                }
                if (!userWeeklyPaid[weekKey][t.userId]) {
                    userWeeklyPaid[weekKey][t.userId] = 0;
                    userWeeklyMins[weekKey][t.userId] = 0;
                }
                userWeeklyPaid[weekKey][t.userId] += amount;
                userWeeklyMins[weekKey][t.userId] += duration;
            });
            
            const sortedHistory = Object.keys(paidHistory).sort((a,b) => new Date(b) - new Date(a));
            const sortedWeeks = Object.keys(weeklyStats).sort().reverse(); 

            const handleMarkPaid = async (sheetIds) => { onConfirmAction(t.timesheet.confirmPaid, async () => { setLoading(true); try { const batch = window.fs.writeBatch(window.db); sheetIds.forEach(id => { const docRef = window.fs.doc(window.db, "timesheets", id); batch.update(docRef, { status: 'paid', paidAt: new Date().toISOString() }); }); await batch.commit(); showNotify("Marked as Paid!"); } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); } }); };
            
            return (
                <div className="space-y-4 fade-in pb-20">
                     <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 overflow-x-auto">
                        <button onClick={() => setViewMode('pending')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'pending' ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>{t.admin.pendingBill}</button>
                        <button onClick={() => setViewMode('history')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'history' ? 'bg-green-600 text-white' : 'text-slate-500'}`}>{t.admin.payHistory}</button>
                        <button onClick={() => setViewMode('users')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${viewMode === 'users' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>{t.admin.manageUsers}</button>
                    </div>
                    
                    {viewMode === 'pending' && ( 
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-purple-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg">
                                <h2 className="text-xl font-bold mb-1">{t.admin.pendingBill}</h2>
                                <div className="flex items-end gap-2">
                                    <p className="text-3xl font-bold">{formatCurrency(totalPending, lang)}</p>
                                    <p className="text-sm text-purple-200 mb-1 font-medium">({(totalPendingMins/60).toFixed(1)}{t.common.unitShort})</p>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                {pendingSheets.length === 0 ? <p className="text-center text-slate-400 text-sm py-4">{t.admin.noPendingBills}</p> : (
                                    <div className="space-y-4">
                                        {Object.values(pendingSheets.reduce((acc, curr) => { 
                                            if(!acc[curr.userId]) acc[curr.userId] = { userId: curr.userId, total: 0, totalMins: 0, sheets: [] }; 
                                            acc[curr.userId].total += getAmount(curr); 
                                            acc[curr.userId].totalMins += parseInt(curr.duration || 0);
                                            acc[curr.userId].sheets.push(curr.id); 
                                            return acc; 
                                        }, {})).map(grp => { 
                                            const u = users.find(u => String(u.id) === String(grp.userId)); 
                                            return (
                                                <div key={grp.userId} className="border border-slate-100 rounded-xl p-4">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <div><p className="font-bold text-slate-800">{u?.name}</p><p className="text-xs text-slate-500">{u?.bankName} - {u?.accountNumber}</p></div>
                                                        <div className="text-right">
                                                            <p className="font-bold text-green-600 text-lg">{formatCurrency(grp.total, lang)}</p>
                                                            <p className="text-[10px] font-medium text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded inline-block mt-0.5">{(grp.totalMins/60).toFixed(1)} {t.common.unitHour}</p>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleMarkPaid(grp.sheets)} className="w-full bg-green-600 hover:bg-green-700 transition-colors text-white text-sm font-bold py-2.5 rounded-lg">{t.admin.markPaid}</button>
                                                </div>
                                            ); 
                                        })}
                                    </div>
                                )}
                            </div>
                        </div> 
                    )}

                    {viewMode === 'history' && ( 
                        <div className="space-y-4">
                            <div className="bg-gradient-to-r from-green-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg">
                                <h2 className="text-xl font-bold mb-1">{t.admin.totalPaidTitle}</h2>
                                <div className="flex items-end gap-2">
                                    <p className="text-3xl font-bold">{formatCurrency(totalAllTimePaid, lang)}</p>
                                    <p className="text-sm text-green-200 mb-1 font-medium">({(totalAllTimePaidMins/60).toFixed(1)}{t.common.unitShort})</p>
                                </div>
                            </div>
                            
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-700 text-sm mb-3">{t.admin.totalPerUserAllTime}</h3>
                                <div className="space-y-2">
                                    {Object.keys(userTotalPaid).map(uid => {
                                        const u = users.find(user => String(user.id) === String(uid));
                                        return (
                                            <div key={uid} className="flex justify-between items-center text-sm pb-2 border-b border-slate-50 last:border-0 last:pb-0">
                                                <span className="font-medium text-slate-700">{u?.name || 'Unknown'}</span>
                                                <div className="text-right">
                                                    <span className="block font-bold text-green-600">{formatCurrency(userTotalPaid[uid], lang)}</span>
                                                    <span className="text-[10px] text-slate-400">{(userTotalMins[uid]/60).toFixed(1)} {t.common.unitHour}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="space-y-3">
                                {sortedWeeks.slice(0, 4).map(week => (
                                    <div key={week} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <div className="flex justify-between items-center mb-2 border-b border-slate-100 pb-3">
                                            <p className="text-xs uppercase text-slate-500 font-bold">{week}</p>
                                            <div className="text-right">
                                                <p className="text-sm font-bold text-slate-800">{formatCurrency(weeklyStats[week], lang)}</p>
                                                <p className="text-[10px] text-slate-400">{(weeklyMins[week]/60).toFixed(1)} {t.common.unitHour}</p>
                                            </div>
                                        </div>
                                        <div className="space-y-2 pt-1">
                                            {userWeeklyPaid[week] && Object.keys(userWeeklyPaid[week]).map(uid => {
                                                const u = users.find(user => String(user.id) === String(uid));
                                                return (
                                                    <div key={uid} className="flex justify-between items-center text-xs text-slate-500">
                                                        <span>- {u?.name}</span>
                                                        <div className="text-right flex items-center gap-2">
                                                            <span className="text-[9px] font-medium text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded">{(userWeeklyMins[week][uid]/60).toFixed(1)} {t.common.unitShort}</span>
                                                            <span className="font-semibold text-slate-600 min-w-[70px]">{formatCurrency(userWeeklyPaid[week][uid], lang)}</span>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-6">
                                {sortedHistory.map(d => (
                                    <div key={d}>
                                        <h4 className="text-xs font-bold text-slate-500 uppercase border-b pb-1 mb-2">{d}</h4>
                                        {paidHistory[d].map(item => { 
                                            const u = users.find(u => String(u.id) === String(item.userId)); 
                                            return (
                                                <div key={item.id} className="flex justify-between items-center text-sm py-1.5">
                                                    <span className="font-medium text-slate-700">{u?.name}</span>
                                                    <div className="text-right">
                                                        <span className="font-mono font-medium block">{formatCurrency(getAmount(item), lang)}</span>
                                                        <span className="text-[9px] text-slate-400">{(item.duration/60).toFixed(1)}h</span>
                                                    </div>
                                                </div> 
                                            )
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div> 
                    )}
                    
                    {viewMode === 'users' && ( <div className="space-y-4"><div className="flex justify-between items-center"><h3 className="font-bold text-slate-700">{t.admin.userList}</h3><button onClick={onAddUser} className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">{t.admin.addUser}</button></div><div className="bg-white rounded-xl border border-slate-200 divide-y">{users.map(u => (<div key={u.id} className={`p-3 flex items-center justify-between ${u.hidden ? 'opacity-60 bg-slate-50' : ''}`}><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style={{backgroundColor: u.color}}>{u.name.substring(0,2)}</div><div><p className="font-bold text-sm text-slate-700 flex items-center gap-2">{u.name}{u.hidden && <span className="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded uppercase tracking-wider">{t.admin.inactive}</span>}</p><p className="text-xs text-slate-400">{u.bankName || '-'}</p></div></div><div className="flex gap-2"><button onClick={() => onEditUser(u)} className="text-blue-500 text-xs"><i className="fas fa-pen"></i></button><button onClick={() => onDeleteUser(u.id)} className="text-red-500 text-xs"><i className="fas fa-trash"></i></button></div></div>))}</div></div> )}
                </div>
            );
        };

        function App() {
            const [view, setView] = React.useState('dashboard');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [users, setUsers] = React.useState([]);
            const [schedules, setSchedules] = React.useState([]);
            const [timesheets, setTimesheets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [notify, setNotify] = React.useState(null);
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showUserModal, setShowUserModal] = React.useState(false);
            const [passwordModal, setPasswordModal] = React.useState({ show: false, mode: 'login', userId: null });
            
            const [editingUser, setEditingUser] = React.useState(null);
            const [lang, setLang] = React.useState('id'); 
            const [timezone, setTimezone] = React.useState('WIB'); 
            const t = TRANSLATIONS[lang];
            const [scheduleForm, setScheduleForm] = React.useState({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' });
            const [editScheduleId, setEditScheduleId] = React.useState(null);
            const [timesheetForm, setTimesheetForm] = React.useState({ date: '', startTime: '', duration: '' });
            const [editTimesheetId, setEditTimesheetId] = React.useState(null);
            const [confirmModal, setConfirmModal] = React.useState({ show: false, message: '', action: null });

            React.useEffect(() => {
                const initData = async () => {
                    if (!window.db) return;
                    window.fs.onSnapshot(window.fs.collection(window.db, 'users'), (snapshot) => {
                        const fetchedUsers = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                        if(fetchedUsers.length === 0) { setUsers(INITIAL_USERS); INITIAL_USERS.forEach(async (u) => await window.fs.setDoc(window.fs.doc(window.db, 'users', u.id), u)); } else { setUsers(fetchedUsers); }
                    });
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'schedules')), (snapshot) => { setSchedules(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}))); });
                    window.fs.onSnapshot(window.fs.query(window.fs.collection(window.db, 'timesheets')), (snapshot) => { setTimesheets(snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}))); });
                };
                setTimeout(initData, 500);
            }, []);

            const showNotify = (msg, type = 'success', duration = 3000) => { 
                setNotify({ msg, type }); 
                if (duration > 0) setTimeout(() => setNotify(null), duration); 
            };
            
            const getUserName = (uid) => users.find(u => String(u.id) === String(uid))?.name || 'Unknown';
            const getUserColor = (uid) => users.find(u => String(u.id) === String(uid))?.color || '#cbd5e1';
            const dynamicFormatCurrency = (val) => { const num = parseFloat(val) || 0; if (lang === 'id') return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num); return new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' }).format(num); };
            const triggerConfirm = (message, action) => { setConfirmModal({ show: true, message, action }); };
            const executeConfirm = () => { if (confirmModal.action) confirmModal.action(); setConfirmModal({ ...confirmModal, show: false, action: null }); };
            
            const saveUserProfile = async (data) => { if(!currentUser) return; setLoading(true); try { await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), data); showNotify(t.profile.saved); setShowProfileModal(false); } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); } };
            const handleSaveUser = async (userData) => { setLoading(true); try { if (editingUser) { await window.fs.updateDoc(window.fs.doc(window.db, 'users', editingUser.id), userData); showNotify("User Updated"); } else { const newId = Date.now().toString(); await window.fs.setDoc(window.fs.doc(window.db, 'users', newId), { ...userData, id: newId }); showNotify("User Added"); } setShowUserModal(false); setEditingUser(null); } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); } };
            const handleDeleteUser = (uid) => { triggerConfirm("Delete user?", async () => { try { await window.fs.deleteDoc(window.fs.doc(window.db, 'users', uid)); showNotify("User Deleted"); } catch(e) { showNotify("Error", "error"); } }); };
            
            const handleUserChange = (e) => { 
                const selectedId = e.target.value; 
                if (!selectedId) { 
                    setCurrentUser(null); 
                    return; 
                } 
                const selectedUser = users.find(u => String(u.id) === String(selectedId));
                if (!selectedUser) return;

                if (!selectedUser.password) {
                    setPasswordModal({ show: true, mode: 'create', userId: selectedId });
                } else {
                    setPasswordModal({ show: true, mode: 'login', userId: selectedId });
                }
            };

            const handlePasswordSubmit = async (password) => {
                const { mode, userId } = passwordModal;
                const user = users.find(u => String(u.id) === String(userId));
                
                if (mode === 'create') {
                    setLoading(true);
                    try {
                        await window.fs.updateDoc(window.fs.doc(window.db, 'users', userId), { password: password });
                        setCurrentUser(userId);
                        setPasswordModal({ show: false, mode: 'login', userId: null });
                        showNotify(t.auth.successCreate, 'success', 15000); // 15 seconds duration
                    } catch(e) { showNotify("Error saving password", "error"); } finally { setLoading(false); }
                } else if (mode === 'login') {
                    if (user && user.password === password) {
                        setCurrentUser(userId);
                        setPasswordModal({ show: false, mode: 'login', userId: null });
                        showNotify(t.auth.loginTitle + " Success");
                    } else { showNotify(t.auth.errorPass, "error"); }
                } else if (mode === 'change') {
                     if (user.password === password) { showNotify(t.auth.errorSame, "error"); return; }
                     
                     // Close modal first before confirming
                     setPasswordModal(prev => ({ ...prev, show: false }));
                     
                     triggerConfirm(t.auth.confirmChange, async () => {
                        setLoading(true);
                        try {
                            await window.fs.updateDoc(window.fs.doc(window.db, 'users', currentUser), { password: password });
                            showNotify(t.auth.successChange, 'success', 15000); // 15 seconds duration
                        } catch(e) { showNotify("Error updating password", "error"); } finally { setLoading(false); }
                     });
                }
            };

            const saveSchedule = async (e) => {
                e.preventDefault(); if (!currentUser) return showNotify(t.timesheet.selectUser, "error");
                const startStr = `${scheduleForm.startDate}T${scheduleForm.startTime}`;
                const endStr = `${scheduleForm.endDate}T${scheduleForm.endTime}`;
                if (endStr <= startStr) { return showNotify(lang === 'id' ? "Waktu selesai harus lebih akhir dari mulai!" : "End time must be after start time!", "error"); }

                triggerConfirm(t.schedule.confirmBooking, async () => {
                    const dbStart = getDbTime(scheduleForm.startTime, scheduleForm.startDate, timezone);
                    const dbEnd = getDbTime(scheduleForm.endTime, scheduleForm.endDate, timezone);
                    setLoading(true);
                    try {
                        const payload = { userId: currentUser, startDate: dbStart.date, startTime: dbStart.time, endDate: dbEnd.date, endTime: dbEnd.time, updatedAt: new Date().toISOString() };
                        if (editScheduleId) { await window.fs.updateDoc(window.fs.doc(window.db, 'schedules', editScheduleId), payload); } else { await window.fs.addDoc(window.fs.collection(window.db, 'schedules'), payload); }
                        showNotify(t.schedule.success); setScheduleForm({ startDate: '', startTime: '15:00', endDate: '', endTime: '16:00' }); setEditScheduleId(null);
                    } catch(err) { showNotify(err.message, "error"); } finally { setLoading(false); }
                });
            };
            const deleteSchedule = (id) => { triggerConfirm(t.common.delete + "?", async () => { await window.fs.deleteDoc(window.fs.doc(window.db, 'schedules', id)); }); };
            const editSchedule = (item) => { 
                const uiStart = getDisplayTime(item.startTime, item.startDate || item.date, timezone);
                const uiEnd = getDisplayTime(item.endTime, item.endDate || item.date, timezone);
                setScheduleForm({startDate: uiStart.date, startTime: uiStart.time, endDate: uiEnd.date, endTime: uiEnd.time}); 
                setEditScheduleId(item.id); window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const saveTimesheet = async (e) => {
                e.preventDefault(); if (!currentUser) return showNotify("Select User", "error");
                triggerConfirm(t.timesheet.confirmSubmit, async () => {
                    setLoading(true);
                    try {
                        const dur = parseInt(timesheetForm.duration);
                        const idr = Math.round((dur/60) * RATES.id);
                        const usd = ((dur/60) * RATES.en).toFixed(2); 
                        const dbTime = getDbTime(timesheetForm.startTime, timesheetForm.date, timezone);
                        const payload = { userId: currentUser, date: dbTime.date, startTime: dbTime.time, duration: dur, paymentUSD: usd, paymentIDR: idr, status: 'pending', updatedAt: new Date().toISOString() };
                        if (editTimesheetId) { await window.fs.updateDoc(window.fs.doc(window.db, 'timesheets', editTimesheetId), payload); } else { payload.createdAt = new Date().toISOString(); await window.fs.addDoc(window.fs.collection(window.db, 'timesheets'), payload); }
                        showNotify("Saved!"); setTimesheetForm({ date: '', startTime: '', duration: '' }); setEditTimesheetId(null);
                    } catch(e) { showNotify("Error", "error"); } finally { setLoading(false); }
                });
            };
            const deleteTimesheet = (id) => { triggerConfirm(t.common.delete + "?", async () => { await window.fs.deleteDoc(window.fs.doc(window.db, 'timesheets', id)); }); };
            const editTimesheet = (item) => { 
                const uiTime = getDisplayTime(item.startTime, item.date, timezone);
                setTimesheetForm({date: uiTime.date, startTime: uiTime.time, duration: item.duration}); 
                setEditTimesheetId(item.id); window.scrollTo({top:0,behavior:'smooth'}); 
            };

            const isAdmin = String(currentUser) === ADMIN_ID;
            const activeUser = users.find(u => String(u.id) === String(currentUser));
            const hasPaymentInfo = activeUser && activeUser.bankName && activeUser.accountNumber;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
                    {notify && <Notification msg={notify.msg} type={notify.type} onClose={() => setNotify(null)} />}
                    {showProfileModal && <ProfileModal user={users.find(u => String(u.id) === String(currentUser))} onClose={() => setShowProfileModal(false)} onSave={saveUserProfile} loading={loading} lang={lang} t={t} onChangePassword={() => { setShowProfileModal(false); setPasswordModal({show: true, mode: 'change', userId: currentUser}); }} />}
                    {showUserModal && <UserModal user={editingUser} onClose={() => {setShowUserModal(false); setEditingUser(null);}} onSave={handleSaveUser} loading={loading} t={t} />}
                    {passwordModal.show && <PasswordModal mode={passwordModal.mode} onSubmit={handlePasswordSubmit} onClose={() => setPasswordModal({ ...passwordModal, show: false })} loading={loading} t={t} />}
                    {confirmModal.show && <ConfirmationModal isOpen={confirmModal.show} message={confirmModal.message} onConfirm={executeConfirm} onCancel={() => setConfirmModal({ ...confirmModal, show: false })} t={t} />}

                    <header className="bg-white sticky top-0 z-20 shadow-sm border-b border-slate-100">
                        <div className="px-4 pt-3 pb-2 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                                    <i className="fas fa-layer-group text-sm"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg text-slate-800 leading-tight tracking-tight">Scheduler</h1>
                                    <p className="text-[10px] text-slate-400 font-medium tracking-wide">REMOTE WORK</p>
                                </div>
                            </div>
                            
                            <div className="relative group">
                                <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-full pl-1 pr-3 py-1 shadow-sm group-hover:border-blue-300 transition-all">
                                    {(() => {
                                        const activeU = users.find(u => String(u.id) === String(currentUser));
                                        return (
                                            <>
                                                <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold shadow-sm" 
                                                     style={{backgroundColor: activeU ? activeU.color : '#94a3b8'}}>
                                                    {activeU ? activeU.name.substring(0,1) : <i className="fas fa-user"></i>}
                                                </div>
                                                <span className="text-xs font-semibold text-slate-600 max-w-[80px] truncate">
                                                    {activeU ? activeU.name : t.timesheet.selectUser}
                                                </span>
                                                <i className="fas fa-chevron-down text-[10px] text-slate-400"></i>
                                            </>
                                        )
                                    })()}
                                </div>
                                <select 
                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                    value={currentUser || ''} 
                                    onChange={handleUserChange}
                                >
                                    <option value="">{t.timesheet.selectUser}</option>
                                    {users.filter(u => !u.hidden).map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                </select>
                            </div>
                        </div>
                        
                        <div className="px-4 pb-3 flex gap-2">
                             <button 
                                onClick={() => setLang(l => l === 'id' ? 'en' : 'id')} 
                                className="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition-all active:scale-95"
                             >
                                <div className="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center text-[8px] font-bold text-slate-600">
                                    {lang === 'id' ? 'ID' : 'EN'}
                                </div>
                                <span className="text-[10px] font-semibold text-slate-600">
                                    {lang === 'id' ? 'Bahasa Indonesia' : 'English'}
                                </span>
                             </button>

                             <div className="relative flex-1">
                                <div className="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none">
                                    <i className="far fa-clock text-slate-400 text-xs"></i>
                                </div>
                                <select 
                                    className="appearance-none w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg pl-8 pr-8 py-1.5 text-[10px] font-semibold text-slate-600 outline-none focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer"
                                    value={timezone} 
                                    onChange={e => setTimezone(e.target.value)}
                                >
                                    {Object.keys(TZ_CONFIG).map(k => <option key={k} value={k}>{TZ_CONFIG[k].label}</option>)}
                                </select>
                                <div className="absolute inset-y-0 right-0 flex items-center px-2.5 pointer-events-none">
                                    <i className="fas fa-chevron-down text-[10px] text-slate-400"></i>
                                </div>
                             </div>
                        </div>

                        <div className="bg-amber-50 border-y border-amber-100 px-4 py-2 flex items-center gap-2 animate-fadeIn">
                            <i className="fas fa-exclamation-circle text-amber-500 text-xs flex-shrink-0"></i>
                            <p className="text-[10px] text-amber-700 font-medium leading-tight">
                                {t.common.reminder}
                            </p>
                        </div>
                    </header>

                    <main className="flex-1 p-4">
                        {loading && !users.length ? <div className="flex flex-col items-center justify-center h-64 text-slate-400 animate-pulse"><i className="fas fa-database text-4xl mb-3"></i><p>{t.common.loading}</p></div> : (
                            <>
                                {view === 'dashboard' && <DashboardView currentUser={currentUser} getUserName={getUserName} timesheets={timesheets} schedules={schedules} users={users} getUserColor={getUserColor} onEditProfile={() => { if(!currentUser) return showNotify(t.timesheet.selectUser, "error"); setShowProfileModal(true); }} setView={setView} t={t} formatCurrency={formatCurrency} lang={lang} timezone={timezone} />}
                                {view === 'schedule' && <ScheduleManager editScheduleId={editScheduleId} setEditScheduleId={setEditScheduleId} scheduleForm={scheduleForm} setScheduleForm={setScheduleForm} saveSchedule={saveSchedule} loading={loading} schedules={schedules} currentUser={currentUser} getUserColor={getUserColor} getUserName={getUserName} deleteSchedule={deleteSchedule} editSchedule={editSchedule} isAdmin={isAdmin} lang={lang} t={t} timezone={timezone} />}
                                {view === 'timesheet' && <ReportManager saveTimesheet={saveTimesheet} timesheetForm={timesheetForm} setTimesheetForm={setTimesheetForm} loading={loading} timesheets={timesheets} getUserName={getUserName} currentUser={currentUser} deleteTimesheet={deleteTimesheet} editTimesheetId={editTimesheetId} setEditTimesheetId={setEditTimesheetId} editTimesheet={editTimesheet} hasPaymentInfo={hasPaymentInfo} onOpenProfile={() => setShowProfileModal(true)} isAdmin={isAdmin} lang={lang} t={t} formatCurrency={formatCurrency} timezone={timezone} />}
                                {view === 'analytics' && <AnalyticsView timesheets={timesheets} schedules={schedules} users={users} currentUser={currentUser} isAdmin={isAdmin} loading={loading} lang={lang} t={t} formatCurrency={formatCurrency} timezone={timezone} />}
                                {view === 'admin' && isAdmin && <AdminPanel timesheets={timesheets} users={users} schedules={schedules} loading={loading} setLoading={setLoading} showNotify={showNotify} t={t} lang={lang} formatCurrency={formatCurrency} onAddUser={() => { setEditingUser(null); setShowUserModal(true); }} onEditUser={(u) => { setEditingUser(u); setShowUserModal(true); }} onDeleteUser={handleDeleteUser} onConfirmAction={triggerConfirm} />}
                            </>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 z-30 max-w-md mx-auto">
                        <div className={`grid ${isAdmin ? 'grid-cols-5' : 'grid-cols-4'} gap-1 px-2`}>
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'dashboard' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-home text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.home}</span></button>
                            <button onClick={() => setView('schedule')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'schedule' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-calendar-alt text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.schedule}</span></button>
                            <button onClick={() => setView('timesheet')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'timesheet' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-file-invoice-dollar text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.timesheet}</span></button>
                            <button onClick={() => setView('analytics')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'analytics' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-chart-pie text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.analytics}</span></button>
                            {isAdmin && <button onClick={() => setView('admin')} className={`flex flex-col items-center p-2 rounded-xl transition ${view === 'admin' ? 'text-purple-600 bg-purple-50' : 'text-slate-400 hover:bg-slate-50'}`}><i className="fas fa-user-shield text-lg mb-1"></i> <span className="text-[10px] font-medium">{t.nav.admin}</span></button>}
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
