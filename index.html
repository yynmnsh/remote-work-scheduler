                                ${sortedPaidHistory.length === 0 ? `<p class="text-center text-xs text-slate-400 py-6 italic bg-slate-50 rounded-lg">${t.analytics.noPayHistory}</p>` : `
                                    <div class="space-y-3">
                                        ${sortedPaidHistory.map((dateKey, index) => {
                                            const group = paidGroups[dateKey];
                                            const uniqueDates = [...new Set(group.dates)].sort();
                                            const reportDateRange = uniqueDates[0] === uniqueDates[uniqueDates.length - 1] ? formatFullDate(uniqueDates[0], appState.lang) : `${formatFullDate(uniqueDates[0], appState.lang)} - ${formatFullDate(uniqueDates[uniqueDates.length - 1], appState.lang)}`;
                                            return `
                                                <div class="group flex justify-between items-center p-3 bg-slate-50 hover:bg-emerald-50 rounded-xl transition-all border border-transparent hover:border-emerald-100 animate-slide-up" style="animation-delay: ${index * 0.1}s">
                                                    <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-emerald-600 shadow-sm group-hover:scale-110 transition-transform"><i class="fas fa-check text-xs"></i></div><div><p class="text-xs font-bold text-slate-700 group-hover:text-emerald-800 transition-colors">${reportDateRange}</p><p class="text-[10px] text-slate-400 mt-0.5 group-hover:text-emerald-600/70">${t.analytics.paidOn}: ${formatFullDate(dateKey, appState.lang)}</p></div></div>
                                                    <div class="text-right"><span class="block text-sm font-bold text-slate-800 group-hover:text-emerald-700">${formatCurrency((group.totalMinutes/60) * RATES[appState.lang], appState.lang)}</span><span class="text-[9px] font-medium text-slate-400 bg-white px-1.5 py-0.5 rounded shadow-sm">${(group.totalMinutes/60).toFixed(1)}${t.common.unitShort}</span></div>
                                                </div>`;
                                        }).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                ` : ''}

                ${appState.analyticsTab === 'team' ? `
                    <div class="space-y-4 animate-fadeIn">
                         <div class="bg-gradient-to-br from-indigo-700 to-purple-800 rounded-2xl p-5 text-white shadow-lg hover:shadow-xl transition-shadow">
                            <h3 class="text-xs text-indigo-200 uppercase tracking-widest font-bold mb-4">${t.analytics.teamOverview}</h3>
                            <div class="flex justify-between items-end">
                                <div><p class="text-4xl font-bold">${(totalMinutesTeam/60).toFixed(0)}<span class="text-lg font-normal text-indigo-300">${t.common.unitShort}</span></p><p class="text-xs text-indigo-200 mt-1">${t.analytics.prodHours}</p></div>
                                <div class="text-right"><p class="text-lg font-bold">${formatCurrency(totalEarnedTeam, appState.lang)}</p><p class="text-xs text-indigo-200">${t.analytics.burnRate}</p></div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative">
                            <div class="flex justify-between items-center mb-4">
                                <div><h3 class="font-bold text-slate-700 text-sm">${t.analytics.teamActivity}</h3><p class="text-[9px] text-slate-400 mt-0.5">* ${t.analytics.logicPacific}</p></div>
                                <span class="text-[10px] text-slate-400 bg-slate-50 px-2 py-1 rounded">${t.analytics.totalHours}: ${totalActivityHours.toFixed(1)}${t.common.unitShort}</span>
                            </div>
                            <div class="flex justify-between h-32 gap-1 items-end">
                                ${dailyActivityTeam.reverse().map((d) => {
                                    const barHeight = `${Math.max((d.minutes / maxDailyMins) * 100, d.minutes > 0 ? 5 : 0)}%`;
                                    return `
                                        <div class="flex-1 flex flex-col items-center group h-full justify-end relative cursor-pointer">
                                            <div class="w-full bg-slate-50 rounded-t-sm relative hover:bg-indigo-50 transition-all flex flex-col justify-end h-full"><div class="w-full rounded-t-sm bar-fill ${d.minutes > 0 ? 'bg-indigo-500' : 'bg-transparent'}" style="height: ${barHeight}"></div></div>
                                            ${d.minutes > 0 ? `<div class="tooltip absolute bottom-10 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-50 pointer-events-none">${d.date}<br/><b>${(d.minutes/60).toFixed(1)}${t.common.unitHour}</b></div>` : ''}
                                            <div class="mt-1 text-center h-6"><span class="text-[8px] text-slate-400 block leading-tight">${new Date(d.date).toLocaleDateString(appState.lang === 'id' ? 'id-ID' : 'en-US', {weekday:'narrow'})}</span><span class="text-[8px] text-slate-500 font-bold block leading-tight">${new Date(d.date).getDate()}</span></div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-trophy text-yellow-500"></i> ${t.analytics.topContrib}</h3>
                            <div class="space-y-3">
                                ${leaderboard.map((u, idx) => `
                                    <div class="flex items-center justify-between border-b border-slate-50 last:border-0 pb-2 last:pb-0 hover:bg-slate-50 p-2 rounded-lg transition-colors">
                                        <div class="flex items-center gap-3"><div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold ${idx === 0 ? 'ring-2 ring-yellow-400' : ''}" style="background-color: ${u.color}">${idx + 1}</div><span class="text-sm font-medium text-slate-700">${u.name}</span></div>
                                        <div class="text-right"><span class="text-sm font-bold text-indigo-600">${(u.minutes/60).toFixed(1)}h</span></div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                ` : ''}
            </div>`;
        }

        function renderAdmin(t) {
            const getAmount = (item) => { const baseVal = parseFloat(item.paymentUSD) || 0; return appState.lang === 'id' ? baseVal * (RATES.id / RATES.en) : baseVal; };
            const pendingSheets = appState.timesheets.filter(ts => ts.status === 'pending');
            const totalPending = pendingSheets.reduce((sum, ts) => sum + getAmount(ts), 0);
            const totalPendingMins = pendingSheets.reduce((sum, ts) => sum + parseInt(ts.duration || 0), 0);
            const paidSheets = appState.timesheets.filter(ts => ts.status === 'paid');
            const totalAllTimePaid = paidSheets.reduce((sum, ts) => sum + getAmount(ts), 0);
            const totalAllTimePaidMins = paidSheets.reduce((sum, ts) => sum + parseInt(ts.duration || 0), 0);
            
            const paidHistory = {};
            const weeklyStats = {}; const weeklyMins = {}; 
            const userTotalPaid = {}; const userTotalMins = {}; 
            const userWeeklyPaid = {}; const userWeeklyMins = {};
            const weeklyDateRanges = {}; 

            paidSheets.forEach(ts => { 
                const amount = getAmount(ts);
                const duration = parseInt(ts.duration || 0);
                const d = getPSTDay(ts.date, ts.startTime) || ts.date; 
                if(!paidHistory[d]) paidHistory[d] = []; 
                paidHistory[d].push(ts);
                const [y, m, day] = d.split('-').map(Number);
                const paidDateObj = new Date(y, m - 1, day);
                const firstDayOfYear = new Date(y, 0, 1);
                const pastDaysOfYear = (paidDateObj - firstDayOfYear) / 86400000;
                const weekNum = Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
                const weekKey = `${y}-W${String(weekNum).padStart(2, '0')}`;

                if (!weeklyDateRanges[weekKey]) {
                    const wStart = new Date(y, 0, 1 + (weekNum - 1) * 7 - firstDayOfYear.getDay());
                    const wEnd = new Date(wStart);
                    wEnd.setDate(wStart.getDate() + 6);
                    weeklyDateRanges[weekKey] = `${wStart.getDate()} ${wStart.toLocaleDateString(appState.lang === 'id' ? 'id-ID' : 'en-US', { month: 'short' })} - ${wEnd.getDate()} ${wEnd.toLocaleDateString(appState.lang === 'id' ? 'id-ID' : 'en-US', { month: 'short' })}`;
                }
                
                if (!weeklyStats[weekKey]) { weeklyStats[weekKey] = 0; weeklyMins[weekKey] = 0; }
                weeklyStats[weekKey] += amount; weeklyMins[weekKey] += duration;
                if (!userTotalPaid[ts.userId]) { userTotalPaid[ts.userId] = 0; userTotalMins[ts.userId] = 0; }
                userTotalPaid[ts.userId] += amount; userTotalMins[ts.userId] += duration;
                if (!userWeeklyPaid[weekKey]) { userWeeklyPaid[weekKey] = {}; userWeeklyMins[weekKey] = {}; }
                if (!userWeeklyPaid[weekKey][ts.userId]) { userWeeklyPaid[weekKey][ts.userId] = 0; userWeeklyMins[weekKey][ts.userId] = 0; }
                userWeeklyPaid[weekKey][ts.userId] += amount; userWeeklyMins[weekKey][ts.userId] += duration;
            });
            const sortedHistory = Object.keys(paidHistory).sort((a,b) => new Date(b) - new Date(a));
            const sortedWeeks = Object.keys(weeklyStats).sort().reverse(); 

            let viewHtml = '';
            
            if(appState.adminView === 'pending') {
                viewHtml = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-purple-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg">
                        <h2 class="text-xl font-bold mb-1">${t.admin.pendingBill}</h2>
                        <div class="flex items-end gap-2"><p class="text-3xl font-bold">${formatCurrency(totalPending, appState.lang)}</p><p class="text-sm text-purple-200 mb-1 font-medium">(${(totalPendingMins/60).toFixed(1)}${t.common.unitShort})</p></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        ${pendingSheets.length === 0 ? `<p class="text-center text-slate-400 text-sm py-4">${t.admin.noPendingBills}</p>` : `
                            <div class="space-y-4">
                                ${Object.values(pendingSheets.reduce((acc, curr) => { 
                                    if(!acc[curr.userId]) acc[curr.userId] = { userId: curr.userId, total: 0, totalMins: 0, sheets: [] }; 
                                    acc[curr.userId].total += getAmount(curr); acc[curr.userId].totalMins += parseInt(curr.duration || 0); acc[curr.userId].sheets.push(curr.id); 
                                    return acc; 
                                }, {})).map(grp => { 
                                    const u = appState.users.find(x => String(x.id) === String(grp.userId));
                                    return `
                                        <div class="border border-slate-100 rounded-xl p-4">
                                            <div class="flex justify-between items-center mb-3">
                                                <div><p class="font-bold text-slate-800">${u?.name}</p><p class="text-xs text-slate-500">${u?.bankName || '-'} - ${u?.accountNumber || '-'}</p></div>
                                                <div class="text-right"><p class="font-bold text-green-600 text-lg">${formatCurrency(grp.total, appState.lang)}</p><p class="text-[10px] font-medium text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded inline-block mt-0.5">${(grp.totalMins/60).toFixed(1)} ${t.common.unitHour}</p></div>
                                            </div>
                                            <button onclick="actions.markPaid(${JSON.stringify(grp.sheets).replace(/"/g, '&quot;')})" class="w-full bg-green-600 hover:bg-green-700 transition-colors text-white text-sm font-bold py-2.5 rounded-lg">${t.admin.markPaid}</button>
                                        </div>
                                    `; 
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>`;
            } else if(appState.adminView === 'history') {
                viewHtml = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-green-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg">
                        <h2 class="text-xl font-bold mb-1">${t.admin.totalPaidTitle}</h2>
                        <div class="flex items-end gap-2"><p class="text-3xl font-bold">${formatCurrency(totalAllTimePaid, appState.lang)}</p><p class="text-sm text-green-200 mb-1 font-medium">(${(totalAllTimePaidMins/60).toFixed(1)}${t.common.unitShort})</p></div>
                    </div>
                    <div class="flex items-center gap-3 mb-4 mt-8"><div class="h-px bg-slate-200 flex-1"></div><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"><i class="fas fa-trophy mr-1 text-yellow-500"></i> ${t.admin.sectionAllTime}</span><div class="h-px bg-slate-200 flex-1"></div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div class="space-y-2">
                            ${Object.keys(userTotalPaid).sort((a,b) => userTotalPaid[b] - userTotalPaid[a]).map(uid => {
                                const u = appState.users.find(x => String(x.id) === String(uid));
                                return `
                                    <div class="group flex justify-between items-center p-2 hover:bg-slate-50 rounded-xl transition-colors border border-transparent hover:border-slate-100">
                                        <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm group-hover:scale-110 transition-transform" style="background-color: ${getUserColor(uid)}">${u?.name ? u.name.substring(0,2).toUpperCase() : '?'}</div><span class="font-bold text-slate-700 text-sm group-hover:text-slate-900 transition-colors">${u?.name || t.common.unknown}</span></div>
                                        <div class="text-right"><span class="block font-bold text-green-600 group-hover:scale-105 transition-transform origin-right">${formatCurrency(userTotalPaid[uid], appState.lang)}</span><span class="text-[10px] text-slate-400 bg-white border border-slate-100 px-1.5 py-0.5 rounded mt-1 inline-block shadow-sm">${(userTotalMins[uid]/60).toFixed(1)}${t.common.unitShort}</span></div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    <div class="flex items-center gap-3 mt-10 mb-4"><div class="h-px bg-slate-200 flex-1"></div><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"><i class="fas fa-calendar-week mr-1 text-blue-500"></i> ${t.admin.sectionWeekly}</span><div class="h-px bg-slate-200 flex-1"></div></div>
                    <div class="space-y-4">
                        ${sortedWeeks.slice(0, 4).map(week => `
                            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow animate-slide-up">
                                <div class="bg-slate-50 flex justify-between items-center p-3 border-b border-slate-100">
                                    <div><p class="text-xs uppercase text-slate-700 font-bold">${week}</p><p class="text-[9px] text-slate-500 mt-0.5 flex items-center gap-1"><i class="far fa-calendar-alt"></i> ${weeklyDateRanges[week]}</p></div>
                                    <div class="text-right bg-white px-2 py-1 rounded-lg border border-slate-100 shadow-sm"><p class="text-sm font-black text-slate-800">${formatCurrency(weeklyStats[week], appState.lang)}</p><p class="text-[9px] text-slate-400 font-medium">${(weeklyMins[week]/60).toFixed(1)}${t.common.unitShort}</p></div>
                                </div>
                                <div class="p-3 space-y-2">
                                    ${Object.keys(userWeeklyPaid[week]||{}).sort((a,b) => userWeeklyPaid[week][b] - userWeeklyPaid[week][a]).map(uid => {
                                        const u = appState.users.find(x => String(x.id) === String(uid));
                                        return `<div class="flex justify-between items-center text-xs group p-1.5 hover:bg-slate-50 rounded-lg transition-colors border border-transparent hover:border-slate-100"><div class="flex items-center gap-2"><div class="w-5 h-5 rounded-full flex items-center justify-center text-white font-bold text-[8px] shadow-sm group-hover:scale-110 transition-transform" style="background-color: ${getUserColor(uid)}">${u?.name ? u.name.substring(0,1).toUpperCase() : '?'}</div><span class="font-semibold text-slate-600 group-hover:text-slate-800 transition-colors">${u?.name || t.common.unknown}</span></div><div class="text-right flex items-center gap-3"><span class="text-[9px] font-medium text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-100 shadow-sm">${(userWeeklyMins[week][uid]/60).toFixed(1)}${t.common.unitShort}</span><span class="font-bold text-slate-700 min-w-[70px] group-hover:text-green-600 transition-colors">${formatCurrency(userWeeklyPaid[week][uid], appState.lang)}</span></div></div>`;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            } else if(appState.adminView === 'users') {
                viewHtml = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center"><h3 class="font-bold text-slate-700 flex items-center">${t.admin.userList}</h3><button onclick="actions.openUserModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">${t.admin.addUser}</button></div>
                    <div class="bg-white rounded-xl border border-slate-200 divide-y">
                        ${appState.users.map(u => `
                            <div class="p-3 flex items-center justify-between ${u.hidden ? 'opacity-60 bg-slate-50' : ''}">
                                <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style="background-color: ${u.color}">${u.name.substring(0,2)}</div><div><p class="font-bold text-sm text-slate-700 flex items-center gap-2">${u.name}${u.hidden ? `<span class="text-[9px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded uppercase tracking-wider">${t.admin.inactive}</span>` : ''}</p><p class="text-xs text-slate-400">${u.bankName || '-'}</p></div></div>
                                <div class="flex gap-2"><button onclick='actions.openUserModal(${JSON.stringify(u).replace(/'/g, "&#39;")})' title="${t.common.edit}" class="text-blue-500 text-xs"><i class="fas fa-pen"></i></button><button onclick="actions.deleteUser('${u.id}')" title="${t.common.delete}" class="text-red-500 text-xs"><i class="fas fa-trash"></i></button></div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            } else if(appState.adminView === 'settings') {
                const sForm = appState.tempForms.adminSettings;
                viewHtml = `
                <div class="space-y-4 fade-in">
                    <div class="grid grid-cols-1 gap-4">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <h4 class="font-bold text-xs text-slate-700 uppercase mb-4 flex items-center"><i class="fas fa-money-bill-wave text-green-500 mr-2"></i>${t.admin.currencySettings}</h4>
                            <div class="space-y-3">
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${t.admin.rateUSD}</label><input type="number" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500 font-bold" value="${sForm.baseHourlyRateUSD}" onchange="appState.tempForms.adminSettings.baseHourlyRateUSD = Number(this.value)" /></div>
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${t.admin.rateIDR}</label><input type="number" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500 font-bold" value="${sForm.usdToIdr}" onchange="appState.tempForms.adminSettings.usdToIdr = Number(this.value)" /></div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <h4 class="font-bold text-xs text-slate-700 uppercase mb-4 flex items-center"><i class="fas fa-globe text-blue-500 mr-2"></i>${t.admin.tzSettings}</h4>
                            <div class="space-y-3">
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${t.admin.tzWIB}</label><input type="number" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500 font-bold" value="${sForm.offsetWIB}" onchange="appState.tempForms.adminSettings.offsetWIB = Number(this.value)" /></div>
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${t.admin.tzAEDT}</label><input type="number" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500 font-bold" value="${sForm.offsetAEDT}" onchange="appState.tempForms.adminSettings.offsetAEDT = Number(this.value)" /></div>
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${t.admin.tzPST}</label><input type="number" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500 font-bold" value="${sForm.offsetPST}" onchange="appState.tempForms.adminSettings.offsetPST = Number(this.value)" /></div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <h4 class="font-bold text-xs text-slate-700 uppercase mb-4 flex items-center"><i class="fas fa-briefcase text-purple-500 mr-2"></i>${t.admin.workSettings}</h4>
                            <div class="space-y-3">
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${t.admin.dailyQuota}</label><input type="number" step="0.1" min="0" max="24" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500 font-bold" value="${sForm.dailyQuotaHours}" onchange="appState.tempForms.adminSettings.dailyQuotaHours = Number(this.value)" /><p class="text-[10px] text-slate-400 mt-1">${t.admin.quotaHelper}</p></div>
                            </div>
                        </div>
                        <button onclick="actions.saveSettings()" ${appState.loading ? 'disabled' : ''} class="w-full bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition shadow-sm disabled:opacity-50">${appState.loading ? '<i class="fas fa-circle-notch fa-spin text-white"></i>' : t.common.save}</button>
                    </div>
                </div>`;
            }

            return `
            <div class="space-y-4 fade-in pb-20">
                <div class="bg-white p-2 rounded-xl shadow-sm border border-slate-100 flex gap-2 overflow-x-auto">
                    <button onclick="updateState({adminView: 'pending'})" class="flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${appState.adminView === 'pending' ? 'bg-purple-600 text-white' : 'text-slate-500'}">${t.admin.pendingBill}</button>
                    <button onclick="updateState({adminView: 'history'})" class="flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${appState.adminView === 'history' ? 'bg-green-600 text-white' : 'text-slate-500'}">${t.admin.payHistory}</button>
                    <button onclick="updateState({adminView: 'users'})" class="flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${appState.adminView === 'users' ? 'bg-blue-600 text-white' : 'text-slate-500'}">${t.admin.manageUsers}</button>
                    <button onclick="updateState({adminView: 'settings'})" class="flex-1 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap px-2 ${appState.adminView === 'settings' ? 'bg-slate-700 text-white' : 'text-slate-500'}"><i class="fas fa-cog"></i></button>
                </div>
                ${viewHtml}
            </div>`;
        }
    </script>
</body>
</html>
